<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudMart | Admin Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-brand">
      <div class="brand-mark large">CM</div>
      <h1>CloudMart</h1>
      <p>Operations Management</p>
    </div>

    <div class="login-card">
      <p class="eyebrow">SECURE ACCESS</p>
      <h2>Admin Dashboard</h2>
      <p class="login-description">Sign in with your administrator token to continue.</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <label for="token">Admin Token</label>
        <input id="token" name="token" type="password" placeholder="Enter admin token" required autofocus>
        <button type="submit" class="login-button">Sign In</button>
      </form>

      <p class="security-note">Authorized CloudMart administrators only.</p>
    </div>
  </div>
</body>
</html>
