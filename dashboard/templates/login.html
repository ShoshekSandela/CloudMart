<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CloudMart | Admin Sign In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">C</div>
      <div>
        <strong>CloudMart</strong>
        <span>Operations Console</span>
      </div>
    </div>

    <div class="login-heading">
      <span class="eyebrow">SECURE ADMINISTRATION</span>
      <h1>Sign in to continue</h1>
      <p>Use your administrator token to access the CloudMart operations dashboard.</p>
    </div>

    {% if error %}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <label for="token">Administrator token</label>
      <input
        id="token"
        name="token"
        type="password"
        placeholder="Enter administrator token"
        autocomplete="current-password"
        required
        autofocus
      >
      <button type="submit">Sign in</button>
    </form>

    <div class="login-footer">
      <span class="secure-dot"></span>
      Authorized CloudMart administrators only
    </div>
  </div>
</body>
</html>
