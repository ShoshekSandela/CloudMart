name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambdas/**"
      - "lambdas/product/requirements.txt"
      - "database/schema.sql"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ vars.CLOUDMART_ENVIRONMENT }}

jobs:

  # =========================================================
  # NETWORK STACK
  # =========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is ready."
              ;;
            *)
              echo "ERROR: Network stack is not ready."
              exit 1
              ;;
          esac


  # =========================================================
  # DATA STACK
  # =========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Environment Configuration
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ENVIRONMENT:-}" ]; then
            echo "ERROR: GitHub repository variable CLOUDMART_ENVIRONMENT is missing."
            exit 1
          fi

          echo "CloudMart Environment: $ENVIRONMENT"

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Migrate Existing Database SSM Parameters
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking existing database SSM parameters before CloudFormation deployment..."

          STACK_EXISTS="false"
          STACK_STATUS="$(aws cloudformation describe-stacks             --stack-name cloudmart-data-${ENVIRONMENT}             --region "$AWS_REGION"             --query "Stacks[0].StackStatus"             --output text 2>/dev/null || true)"

          if [ -n "$STACK_STATUS" ] && [ "$STACK_STATUS" != "None" ]; then
            STACK_EXISTS="true"
            echo "Existing data stack status: $STACK_STATUS"
          else
            echo "Data stack does not currently exist."
          fi

          # CloudFormation cannot adopt an SSM parameter that was created
          # manually with the same name. On the first migration, remove only
          # the three non-sensitive parameters that data-stack.yaml will own.
          #
          # Once CloudFormation owns these resources, they are left untouched.
          DB_SSM_PREFIX="/cloudmart/${ENVIRONMENT}/database"

          for PARAMETER_NAME in \
            "${DB_SSM_PREFIX}/host" \
            "${DB_SSM_PREFIX}/port" \
            "${DB_SSM_PREFIX}/name"
          do
            SHOULD_DELETE="false"

            if [ "$STACK_EXISTS" = "false" ]; then
              SHOULD_DELETE="true"
            else
              RESOURCE_ID="$(aws cloudformation describe-stack-resources                 --stack-name cloudmart-data-${ENVIRONMENT}                 --region "$AWS_REGION"                 --query "StackResources[?PhysicalResourceId=='$PARAMETER_NAME'].LogicalResourceId | [0]"                 --output text 2>/dev/null || true)"

              if [ -z "$RESOURCE_ID" ] || [ "$RESOURCE_ID" = "None" ]; then
                SHOULD_DELETE="true"
              fi
            fi

            if [ "$SHOULD_DELETE" = "true" ]; then
              if aws ssm get-parameter                 --name "$PARAMETER_NAME"                 --region "$AWS_REGION"                 >/dev/null 2>&1; then

                echo "Removing pre-existing manually managed parameter: $PARAMETER_NAME"

                aws ssm delete-parameter                   --name "$PARAMETER_NAME"                   --region "$AWS_REGION"
              else
                echo "Parameter does not exist: $PARAMETER_NAME"
              fi
            else
              echo "CloudFormation already owns: $PARAMETER_NAME"
            fi
          done

          echo "Database SSM parameter migration check completed."

      - name: Deploy Data Stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking database credentials..."

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          echo "Database credentials are available."

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBInstanceClass=db.t3.micro \
              DBName=cloudmart \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              ExistingReportBucketName="cloudmart-${ENVIRONMENT}-reports" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Data Stack
        run: |
          set -euo pipefail

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Data stack is ready."
              ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac

      # =====================================================
      # CREATE DATABASE SECURE SSM PARAMETERS
      # =====================================================
      #
      # DB host, port, and name are managed by data-stack.yaml.
      # CloudFormation cannot create SecureString parameters, so only
      # username/password are created here from GitHub Secrets.
      #

      - name: Create or Update Secure Database SSM Parameters
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD secret is missing."
            exit 1
          fi

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/database/username" \
            --type "SecureString" \
            --value "$DB_USERNAME" \
            --overwrite \
            --region "$AWS_REGION"

          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/database/password" \
            --type "SecureString" \
            --value "$DB_PASSWORD" \
            --overwrite \
            --region "$AWS_REGION"

          echo "Secure database SSM parameters created/updated."

      # =====================================================
      # VERIFY DATABASE SSM PARAMETERS
      # =====================================================

      - name: Verify Database SSM Parameters
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying database SSM parameters..."

          DB_SSM_PREFIX="/cloudmart/${ENVIRONMENT}/database"

          for PARAMETER_NAME in \
            "${DB_SSM_PREFIX}/host" \
            "${DB_SSM_PREFIX}/port" \
            "${DB_SSM_PREFIX}/name" \
            "${DB_SSM_PREFIX}/username" \
            "${DB_SSM_PREFIX}/password"
          do
            aws ssm get-parameter \
              --name "$PARAMETER_NAME" \
              --region "$AWS_REGION" \
              --query "Parameter.Name" \
              --output text
          done

          USERNAME_TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/database/username" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)

          if [ "$USERNAME_TYPE" != "SecureString" ]; then
            echo "ERROR: Database username is not SecureString."
            exit 1
          fi

          PASSWORD_TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/database/password" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)

          if [ "$PASSWORD_TYPE" != "SecureString" ]; then
            echo "ERROR: Database password is not SecureString."
            exit 1
          fi

          echo "Database SSM parameter verification passed."


  # =========================================================
  #
  # DB host, port, and name are now managed by data-stack.yaml.
  # CloudFormation cannot create SecureString SSM parameters, so the
  # username/password SecureString parameters remain here and are sourced
  # only from GitHub Secrets.
  #

      - name: Create or Update Secure Database SSM Parameters
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD secret is missing."
            exit 1
          fi

          aws ssm put-parameter             --name "/cloudmart/${ENVIRONMENT}/database/username"             --type "SecureString"             --value "$DB_USERNAME"             --overwrite             --region "$AWS_REGION"

          aws ssm put-parameter             --name "/cloudmart/${ENVIRONMENT}/database/password"             --type "SecureString"             --value "$DB_PASSWORD"             --overwrite             --region "$AWS_REGION"

          echo "Secure database SSM parameters created/updated."

      # =====================================================
      # VERIFY DATABASE SSM PARAMETERS
      # =====================================================

      - name: Verify Database SSM Parameters
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying database SSM parameters..."

          aws ssm get-parameter             --name "/cloudmart/${ENVIRONMENT}/database/host"             --region "$AWS_REGION"             --query "Parameter.Name"             --output text

          aws ssm get-parameter             --name "/cloudmart/${ENVIRONMENT}/database/port"             --region "$AWS_REGION"             --query "Parameter.Name"             --output text

          aws ssm get-parameter             --name "/cloudmart/${ENVIRONMENT}/database/name"             --region "$AWS_REGION"             --query "Parameter.Name"             --output text

          USERNAME_TYPE=$(aws ssm get-parameter             --name "/cloudmart/${ENVIRONMENT}/database/username"             --region "$AWS_REGION"             --query "Parameter.Type"             --output text)

          if [ "$USERNAME_TYPE" != "SecureString" ]; then
            echo "ERROR: Database username is not SecureString."
            exit 1
          fi

          PASSWORD_TYPE=$(aws ssm get-parameter             --name "/cloudmart/${ENVIRONMENT}/database/password"             --region "$AWS_REGION"             --query "Parameter.Type"             --output text)

          if [ "$PASSWORD_TYPE" != "SecureString" ]; then
            echo "ERROR: Database password is not SecureString."
            exit 1
          fi

          echo "Database SSM parameter verification passed."


  # =========================================================
  # IAM STACK
  # =========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Existing IAM Stack
        id: iam_status
        continue-on-error: true
        shell: bash
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "IAM Stack Status: $STATUS"

      - name: Delete IAM Stack in ROLLBACK_COMPLETE
        if: steps.iam_status.outputs.status == 'ROLLBACK_COMPLETE'
        shell: bash
        run: |

          echo "IAM stack is in ROLLBACK_COMPLETE."
          echo "Deleting failed IAM stack..."

          aws cloudformation delete-stack \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION"

          aws cloudformation wait stack-delete-complete \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION"

          echo "IAM stack deleted."

      - name: Deploy IAM Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is ready."
              ;;
            *)
              echo "ERROR: IAM stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # IAM FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show IAM Stack Failure Events
        if: failure()
        run: |

          echo "IAM STACK STATUS"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "IAM STACK FAILURE EVENTS"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # =========================================================
  # APPLICATION STACK
  # =========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      # =====================================================
      # SETUP SAM
      # =====================================================

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2


      # =====================================================
      # AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        run: |

          echo "AWS Region: $AWS_REGION"

          aws sts get-caller-identity


      # =====================================================
      # VERIFY PREVIOUS STACKS
      # =====================================================

      - name: Verify Network Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: Network stack is not ready."
              exit 1
              ;;
          esac


      - name: Verify Data Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac


      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: IAM stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # NOTIFICATION EMAIL
      # =====================================================

      - name: Verify Notification Emails
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}

        shell: bash
        run: |

          if [ -z "$ADMIN_EMAIL" ]; then
            echo "ERROR: CLOUDMART_ADMIN_EMAIL is missing."
            exit 1
          fi

          if [ -z "$CUSTOMER_EMAIL" ]; then
            echo "ERROR: CLOUDMART_CUSTOMER_EMAIL is missing."
            exit 1
          fi

          echo "ADMIN and CUSTOMER emails are available."


      # =====================================================
      # GET NETWORK OUTPUTS
      # =====================================================

      - name: Get Network Outputs
        shell: bash
        run: |

          echo "Getting Network stack outputs..."

          PRIVATE_SUBNET_1=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          echo "Private Subnet 1: $PRIVATE_SUBNET_1"
          echo "Private Subnet 2: $PRIVATE_SUBNET_2"
          echo "Lambda Security Group: $LAMBDA_SECURITY_GROUP"

          if [ -z "$PRIVATE_SUBNET_1" ] || [ "$PRIVATE_SUBNET_1" = "None" ]; then
            echo "ERROR: PrivateSubnet1Id output is missing."
            exit 1
          fi

          if [ -z "$PRIVATE_SUBNET_2" ] || [ "$PRIVATE_SUBNET_2" = "None" ]; then
            echo "ERROR: PrivateSubnet2Id output is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP" ] || [ "$LAMBDA_SECURITY_GROUP" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId output is missing."
            exit 1
          fi

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_1},${PRIVATE_SUBNET_2}" >> "$GITHUB_ENV"

          echo "LAMBDA_SECURITY_GROUP_ID=$LAMBDA_SECURITY_GROUP" >> "$GITHUB_ENV"

          echo "Network outputs loaded successfully."


      # =====================================================
      # GET IAM LAMBDA ROLE ARNS
      # =====================================================

      - name: Get Lambda IAM Role ARNs
        shell: bash
        run: |
          set -euo pipefail

          echo "Getting Lambda IAM role ARNs..."

          get_role_arn() {
            local role_name="$1"
            aws iam get-role               --role-name "$role_name"               --query 'Role.Arn'               --output text
          }

          AUTHORIZE_ROLE="cloudmart-${ENVIRONMENT}-lambda-authorizer-role"
          PRODUCT_ROLE="cloudmart-${ENVIRONMENT}-lambda-product-role"
          ORDER_ROLE="cloudmart-${ENVIRONMENT}-lambda-order-role"
          REPORT_ROLE="cloudmart-${ENVIRONMENT}-lambda-report-role"

          AUTHORIZER_ROLE_ARN="$(get_role_arn "$AUTHORIZE_ROLE")"
          PRODUCT_ROLE_ARN="$(get_role_arn "$PRODUCT_ROLE")"
          ORDER_ROLE_ARN="$(get_role_arn "$ORDER_ROLE")"
          REPORT_ROLE_ARN="$(get_role_arn "$REPORT_ROLE")"

          echo "Authorizer Role: $AUTHORIZER_ROLE_ARN"
          echo "Product Role: $PRODUCT_ROLE_ARN"
          echo "Order Role: $ORDER_ROLE_ARN"
          echo "Report Role: $REPORT_ROLE_ARN"

          for role_arn in             "$AUTHORIZER_ROLE_ARN"             "$PRODUCT_ROLE_ARN"             "$ORDER_ROLE_ARN"             "$REPORT_ROLE_ARN"
          do
            if [ -z "$role_arn" ] || [ "$role_arn" = "None" ]; then
              echo "ERROR: A required Lambda IAM role ARN is missing."
              exit 1
            fi
          done

          {
            echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE_ARN"
            echo "PRODUCT_ROLE_ARN=$PRODUCT_ROLE_ARN"
            echo "ORDER_ROLE_ARN=$ORDER_ROLE_ARN"
            echo "REPORT_ROLE_ARN=$REPORT_ROLE_ARN"
          } >> "$GITHUB_ENV"

      - name: Get Data Stack Outputs
        shell: bash
        run: |

          echo "Getting Data stack outputs..."

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          echo "Report Bucket: $REPORT_BUCKET"
          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"

          if [ -z "$REPORT_BUCKET" ] || [ "$REPORT_BUCKET" = "None" ]; then
            echo "ERROR: ReportBucketName output is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DBEndpoint output is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DBPort output is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DBName output is missing."
            exit 1
          fi

          echo "REPORT_BUCKET_NAME=$REPORT_BUCKET" >> "$GITHUB_ENV"

          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"

          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"

          echo "Data outputs loaded successfully."


      # =====================================================
      # VERIFY REQUIRED APPLICATION VALUES
      # =====================================================

      - name: Verify Application Configuration
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}

        shell: bash
        run: |

          if [ -z "$PRIVATE_SUBNET_IDS" ]; then
            echo "ERROR: PRIVATE_SUBNET_IDS is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP_ID" ]; then
            echo "ERROR: LAMBDA_SECURITY_GROUP_ID is missing."
            exit 1
          fi

          if [ -z "$AUTHORIZER_ROLE_ARN" ]; then
            echo "ERROR: AUTHORIZER_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE_ARN" ]; then
            echo "ERROR: PRODUCT_ROLE_ARN is missing."
            exit 1
          fi


          if [ -z "$ORDER_ROLE_ARN" ]; then
            echo "ERROR: ORDER_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE_ARN" ]; then
            echo "ERROR: REPORT_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$REPORT_BUCKET_NAME" ]; then
            echo "ERROR: REPORT_BUCKET_NAME is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ]; then
            echo "ERROR: DB_HOST is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ]; then
            echo "ERROR: DB_PORT is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ]; then
            echo "ERROR: DB_NAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$ADMIN_EMAIL" ]; then
            echo "ERROR: CLOUDMART_ADMIN_EMAIL is missing."
            exit 1
          fi

          if [ -z "$CUSTOMER_EMAIL" ]; then
            echo "ERROR: CLOUDMART_CUSTOMER_EMAIL is missing."
            exit 1
          fi

          echo "All Application Stack values are available."


      # =====================================================
      # VALIDATE APPLICATION STACK
      # =====================================================

      - name: Validate Application Stack
        run: |

          sam validate \
            --template-file cloudformation/application-stack.yaml

          echo "Application template validation completed."


      # =====================================================
      # SAM BUILD
      # =====================================================

      - name: Verify Lambda source code
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Lambda source files..."

          if [ ! -f "lambdas/authorizer/index.py" ]; then
            echo "ERROR: lambdas/authorizer/index.py is missing."
            exit 1
          fi

          if [ ! -f "lambdas/product/index.py" ]; then
            echo "ERROR: lambdas/product/index.py is missing."
            exit 1
          fi

          if [ ! -f "lambdas/order/index.py" ]; then
            echo "ERROR: lambdas/order/index.py is missing."
            exit 1
          fi

          # The Order Lambda is the source of truth for customer/order
          # data used by OrderPlaced and the SNS notification flow.
          # Verify that the repository contains the expected implementation
          # before SAM builds the application.
          if ! grep -q "def validate_request" lambdas/order/index.py; then
            echo "ERROR: Order Lambda validate_request() is missing."
            exit 1
          fi

          if ! grep -q "def create_order" lambdas/order/index.py; then
            echo "ERROR: Order Lambda create_order() is missing."
            exit 1
          fi

          if ! grep -q "OrderPlaced" lambdas/order/index.py; then
            echo "ERROR: Order Lambda OrderPlaced event implementation is missing."
            exit 1
          fi

          # Verify the request-validation function itself does not require
          # customer_email. The Order Lambda gets the customer email from
          # the RDS customers table using customer_id.
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("lambdas/order/index.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          validate = next(
              (node for node in tree.body
               if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
               and node.name == "validate_request"),
              None,
          )

          if validate is None:
              raise SystemExit("ERROR: validate_request() was not found.")

          validate_source = ast.get_source_segment(source, validate) or ""

          if "customer_email" in validate_source:
              raise SystemExit(
                  "ERROR: validate_request() still contains customer_email validation."
              )

          if "customer_id" not in validate_source:
              raise SystemExit(
                  "ERROR: validate_request() does not validate customer_id."
              )

          if "items" not in validate_source:
              raise SystemExit(
                  "ERROR: validate_request() does not validate items."
              )

          print("Order request validation is correct.")
          PY

          if [ ! -f "lambdas/product/requirements.txt" ]; then
            echo "ERROR: lambdas/product/requirements.txt is missing."
            exit 1
          fi


          echo "Product Lambda requirements.txt:"
          cat lambdas/product/requirements.txt

          if ! grep -qi '^PyMySQL==' lambdas/product/requirements.txt; then
            echo "ERROR: PyMySQL is not pinned in lambdas/product/requirements.txt."
            exit 1
          fi

          echo "All required Lambda source files are present."

      - name: Prepare Product Lambda schema
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "database/schema.sql" ]; then
            echo "ERROR: database/schema.sql is missing."
            exit 1
          fi

          cp database/schema.sql lambdas/product/schema.sql

          echo "schema.sql copied into Product Lambda build context."

      - name: Build Lambda application
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting SAM build..."

          rm -rf .aws-sam

          sam build \
            --template-file cloudformation/application-stack.yaml \
            --build-dir .aws-sam/build

          echo "SAM build completed successfully."

          echo "Checking Product Lambda build output..."

          if [ ! -d ".aws-sam/build/ProductFunction" ]; then
            echo "ERROR: ProductFunction was not created by SAM build."
            exit 1
          fi

          if [ ! -d ".aws-sam/build/ProductFunction/pymysql" ]; then
            echo "ERROR: PyMySQL was not included in ProductFunction."
            echo "The Lambda cannot be deployed safely."
            exit 1
          fi

          echo "PyMySQL is included in the Product Lambda build."

          if [ ! -f ".aws-sam/build/ProductFunction/schema.sql" ]; then
            echo "ERROR: schema.sql was not included in ProductFunction."
            exit 1
          fi

          echo "schema.sql is included in the Product Lambda build."

          echo "Checking Order Lambda build output..."

          if [ ! -d ".aws-sam/build/OrderFunction" ]; then
            echo "ERROR: OrderFunction was not created by SAM build."
            exit 1
          fi

          if [ ! -f ".aws-sam/build/OrderFunction/index.py" ]; then
            echo "ERROR: OrderFunction index.py is missing from SAM build."
            exit 1
          fi

          # Make sure SAM copied the current repository Order Lambda source.
          if ! cmp -s "lambdas/order/index.py" ".aws-sam/build/OrderFunction/index.py"; then
            echo "ERROR: SAM build OrderFunction/index.py does not match the repository source."
            exit 1
          fi

          echo "Order Lambda source is present and matches the repository."

      - name: Verify SAM build output
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE=".aws-sam/build/template.yaml"

          echo "Checking generated SAM template..."

          if [ ! -f "$TEMPLATE" ]; then
            echo "ERROR: SAM build template was not generated."
            exit 1
          fi

          echo "Generated template found."

          echo "Checking generated template contains low-stock rule configuration..."

          if ! grep -q "LowStockEventRule" "$TEMPLATE"; then
            echo "ERROR: LowStockEventRule reference is missing from generated SAM template."
            grep -n "LowStock" "$TEMPLATE" || true
            exit 1
          fi

          if ! grep -q "cloudmart.product" "$TEMPLATE"; then
            echo "ERROR: cloudmart.product source is missing from generated template."
            exit 1
          fi

          if ! grep -q "Inventory Changed" "$TEMPLATE"; then
            echo "ERROR: Inventory Changed detail-type is missing from generated template."
            exit 1
          fi

          if ! grep -q "low_stock" "$TEMPLATE"; then
            echo "ERROR: low_stock condition is missing from generated template."
            exit 1
          fi

          if ! grep -Eq -- "- true|true" "$TEMPLATE"; then
            echo "ERROR: low_stock=true condition is missing from generated template."
            exit 1
          fi

          echo "Low-stock rule configuration exists."

          echo "Checking LowStockRuleArn output..."

          if ! grep -Eq '^[[:space:]]*LowStockRuleArn:' "$TEMPLATE"; then
            echo "ERROR: LowStockRuleArn output is missing."
            exit 1
          fi

          echo "LowStockRuleArn output exists."

          echo "Checking obsolete InventoryEventFunction references..."

          if grep -q "InventoryEventFunction" "$TEMPLATE"; then
            echo "ERROR: Obsolete InventoryEventFunction is still present in generated template."
            exit 1
          fi

          echo "No obsolete InventoryEventFunction found."

          echo "Validating generated template..."

          sam validate \
            --template-file "$TEMPLATE"

          echo "Generated SAM template verification passed."

      # =====================================================
      # SAM DEPLOY APPLICATION STACK
      # =====================================================

      - name: Deploy Application Stack
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        shell: bash
        run: |

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --force-upload \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              OrderLambdaRoleArn="$ORDER_ROLE_ARN" \
              PrivateSubnetIds="$PRIVATE_SUBNET_IDS" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductLambdaRoleArn="$PRODUCT_ROLE_ARN" \
              AuthorizerCacheTTL=300 \
              TokenParameterName="/cloudmart/${ENVIRONMENT}/auth/token" \
              DBHostParameterName="/cloudmart/${ENVIRONMENT}/database/host" \
              DBPortParameterName="/cloudmart/${ENVIRONMENT}/database/port" \
              DBNameParameterName="/cloudmart/${ENVIRONMENT}/database/name" \
              DBUsernameParameterName="/cloudmart/${ENVIRONMENT}/database/username" \
              DBPasswordParameterName="/cloudmart/${ENVIRONMENT}/database/password" \
              NotificationEmail="$ADMIN_EMAIL" \
              CustomerEmail="$CUSTOMER_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}"

          echo "Application Stack deployment completed successfully."

      # =====================================================
      # INITIALIZE RANDOM ADMIN / CUSTOMER TOKENS
      # =====================================================

      - name: Initialize CloudMart ADMIN and CUSTOMER tokens
        shell: bash
        run: |
          set -euo pipefail

          echo "Initializing CloudMart authentication tokens..."

          aws lambda invoke             --function-name "cloudmart-${ENVIRONMENT}-authorizer"             --region "$AWS_REGION"             --cli-binary-format raw-in-base64-out             --payload '{"action":"initialize_tokens"}'             /tmp/auth-token-init.json

          cat /tmp/auth-token-init.json

          echo "ADMIN and CUSTOMER tokens initialized in /cloudmart/${ENVIRONMENT}/auth/token"


      # =====================================================
      # INITIALIZE CLOUDMART DATABASE SCHEMA
      # =====================================================
      #
      # RDS creates the MySQL server/database, but it does not execute
      # database/schema.sql. The Product Lambda contains the schema.sql
      # and exposes a CI/CD-only initialize_database action.
      #
      # This MUST run before customer synchronization because the Order
      # Lambda reads/writes the customers and orders tables.
      #

      - name: Initialize CloudMart database schema
        shell: bash
        run: |
          set -euo pipefail

          echo "Initializing CloudMart database schema..."

          aws lambda invoke             --function-name "cloudmart-${ENVIRONMENT}-product"             --region "$AWS_REGION"             --cli-binary-format raw-in-base64-out             --payload '{"action":"initialize_database"}'             /tmp/database-init.json

          cat /tmp/database-init.json

          if ! jq -e '.statusCode == 200' /tmp/database-init.json >/dev/null; then
            echo "ERROR: CloudMart database schema initialization failed."
            exit 1
          fi

          echo "CloudMart database schema initialized successfully."


      # =====================================================
      # SYNCHRONIZE CONFIGURED CUSTOMER EMAIL
      # =====================================================

      - name: Synchronize configured customer email
        shell: bash
        run: |
          set -euo pipefail

          echo "Synchronizing CUSTOMER_EMAIL into the customers and orders tables..."

          aws lambda invoke             --function-name "cloudmart-${ENVIRONMENT}-order"             --region "$AWS_REGION"             --cli-binary-format raw-in-base64-out             --payload '{"action":"sync_configured_customer"}'             /tmp/customer-sync.json

          cat /tmp/customer-sync.json

          if ! jq -e '.statusCode == 200' /tmp/customer-sync.json >/dev/null; then
            echo "ERROR: Configured customer synchronization failed."
            exit 1
          fi

          echo "Configured CUSTOMER_EMAIL synchronized successfully."


      # =====================================================
      # VERIFY GENERATED AUTH TOKEN PARAMETER
      # =====================================================

      - name: Verify Generated Auth Token Parameter
        shell: bash
        run: |
          set -euo pipefail

          PARAM_JSON="$(aws ssm get-parameter             --name "/cloudmart/${ENVIRONMENT}/auth/token"             --with-decryption             --region "$AWS_REGION"             --output json)"

          PARAM_TYPE="$(printf '%s' "$PARAM_JSON" | jq -r '.Parameter.Type')"
          PARAM_VALUE="$(printf '%s' "$PARAM_JSON" | jq -r '.Parameter.Value')"

          if [ "$PARAM_TYPE" != "SecureString" ]; then
            echo "ERROR: Auth token parameter is not SecureString."
            exit 1
          fi

          if ! printf '%s' "$PARAM_VALUE" | jq -e '.admin_token | type == "string" and length > 0' >/dev/null; then
            echo "ERROR: ADMIN token was not generated."
            exit 1
          fi

          if ! printf '%s' "$PARAM_VALUE" | jq -e '.customer_token | type == "string" and length > 0' >/dev/null; then
            echo "ERROR: CUSTOMER token was not generated."
            exit 1
          fi

          echo "Generated ADMIN token exists."
          echo "Generated CUSTOMER token exists."
          echo "SSM authentication configuration verification passed."



      # =====================================================
      # VERIFY LOW-STOCK TEMPLATE BEFORE STACK VERIFICATION
      # =====================================================

      - name: Verify Low-Stock EventBridge Template
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE="cloudformation/application-stack.yaml"

          echo "Checking low-stock EventBridge template..."

          if ! grep -qE '^\s+low_stock:' "$TEMPLATE"; then
            echo "ERROR: low_stock filter is missing from application template."
            exit 1
          fi

          if ! grep -qE '^\s+- true\s*$' "$TEMPLATE"; then
            echo "ERROR: application template must contain low_stock: true."
            exit 1
          fi

          if grep -qE 'exists:\s*true' "$TEMPLATE"; then
            echo "ERROR: application template still contains exists:true."
            exit 1
          fi

          echo "Low-stock EventBridge template is correct."

      # =====================================================
      # VERIFY APPLICATION STACK
      # =====================================================

      - name: Verify Application Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Application Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Application stack is ready."
              ;;
            *)
              echo "ERROR: Application stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # VERIFY AUTHORIZER LAMBDA
      # =====================================================

      - name: Verify Authorizer Lambda
        run: |

          AUTHORIZE_LAMBDA=$(aws lambda get-function \
            --function-name cloudmart-${ENVIRONMENT}-authorizer \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)

          echo "Authorizer Lambda: $AUTHORIZE_LAMBDA"

          if [ -z "$AUTHORIZE_LAMBDA" ] || [ "$AUTHORIZE_LAMBDA" = "None" ]; then
            echo "ERROR: Authorizer Lambda was not found."
            exit 1
          fi

          echo "Authorizer Lambda verified successfully."


      # =====================================================
      # VERIFY PRODUCT LAMBDA
      # =====================================================

      - name: Verify Product Lambda
        run: |

          PRODUCT_LAMBDA=$(aws lambda get-function \
            --function-name cloudmart-${ENVIRONMENT}-product \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)

          echo "Product Lambda: $PRODUCT_LAMBDA"

          if [ -z "$PRODUCT_LAMBDA" ] || [ "$PRODUCT_LAMBDA" = "None" ]; then
            echo "ERROR: Product Lambda was not found."
            exit 1
          fi

          echo "Product Lambda verified successfully."


      # =====================================================
      # VERIFY ORDER LIFECYCLE EVENTBRIDGE RULES
      # =====================================================

      - name: Verify Order Lifecycle EventBridge Rules
        shell: bash
        run: |
          set -euo pipefail

          EVENT_BUS="cloudmart-${ENVIRONMENT}-event-bus"

          declare -A EXPECTED_TYPES=(
            [cloudmart-${ENVIRONMENT}-order-placed]="OrderPlaced"
            [cloudmart-${ENVIRONMENT}-order-confirmed]="OrderConfirmed"
            [cloudmart-${ENVIRONMENT}-order-canceled]="OrderCanceled"
            [cloudmart-${ENVIRONMENT}-order-failed]="OrderFailed"
          )

          for RULE_NAME in "${!EXPECTED_TYPES[@]}"; do
            EXPECTED_TYPE="${EXPECTED_TYPES[$RULE_NAME]}"

            echo "Checking EventBridge rule: $RULE_NAME"

            RULE_JSON="$(aws events describe-rule \
              --name "$RULE_NAME" \
              --event-bus-name "$EVENT_BUS" \
              --region "$AWS_REGION" \
              --output json)"

            RULE_STATE="$(printf '%s' "$RULE_JSON" | jq -r '.State')"
            EVENT_PATTERN="$(printf '%s' "$RULE_JSON" | jq -r '.EventPattern')"
            RULE_SOURCE="$(printf '%s' "$EVENT_PATTERN" | jq -r '.source[0] // empty')"
            RULE_DETAIL_TYPE="$(printf '%s' "$EVENT_PATTERN" | jq -r '."detail-type"[0] // empty')"

            echo "State: $RULE_STATE"
            echo "Source: $RULE_SOURCE"
            echo "Detail type: $RULE_DETAIL_TYPE"

            if [ "$RULE_STATE" != "ENABLED" ]; then
              echo "ERROR: $RULE_NAME is not enabled."
              exit 1
            fi

            if [ "$RULE_SOURCE" != "cloudmart.order" ]; then
              echo "ERROR: $RULE_NAME has incorrect source: $RULE_SOURCE"
              exit 1
            fi

            if [ "$RULE_DETAIL_TYPE" != "$EXPECTED_TYPE" ]; then
              echo "ERROR: $RULE_NAME expected $EXPECTED_TYPE but found $RULE_DETAIL_TYPE"
              exit 1
            fi

            TARGET_COUNT="$(aws events list-targets-by-rule \
              --rule "$RULE_NAME" \
              --event-bus-name "$EVENT_BUS" \
              --region "$AWS_REGION" \
              --query 'length(Targets)' \
              --output text)"

            if ! [[ "$TARGET_COUNT" =~ ^[0-9]+$ ]] || [ "$TARGET_COUNT" -lt 1 ]; then
              echo "ERROR: $RULE_NAME has no target."
              exit 1
            fi

            echo "$RULE_NAME verified with $TARGET_COUNT target(s)."
          done

          echo "All four order lifecycle EventBridge rules are configured correctly."

      # =====================================================
      # VERIFY ORDER SNS EMAIL SUBSCRIPTION
      # =====================================================

      - name: Verify Order Notification SNS Subscription
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          if [ -z "${ADMIN_EMAIL:-}" ]; then
            echo "ERROR: CLOUDMART_ADMIN_EMAIL is missing."
            exit 1
          fi

          # Normalize accidental whitespace/escaped @ from GitHub variables.
          ADMIN_EMAIL="$(printf '%s' "$ADMIN_EMAIL" | tr -d '\r' | xargs)"
          ADMIN_EMAIL="${ADMIN_EMAIL//\\@/@}"

          TOPIC_ARN="$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='OrderNotificationTopicArn'].OutputValue | [0]"             --output text)"

          if [ -z "$TOPIC_ARN" ] || [ "$TOPIC_ARN" = "None" ]; then
            echo "ERROR: OrderNotificationTopicArn output is missing."
            exit 1
          fi

          echo "Order notification topic: $TOPIC_ARN"
          echo "Configured ADMIN email: $ADMIN_EMAIL"

          SUBSCRIPTIONS_JSON="$(aws sns list-subscriptions-by-topic             --topic-arn "$TOPIC_ARN"             --region "$AWS_REGION"             --output json)"

          echo "Current SNS subscriptions:"
          printf '%s' "$SUBSCRIPTIONS_JSON" | jq -r '
            .Subscriptions[] |
            "Protocol=\(.Protocol) Endpoint=\(.Endpoint) ARN=\(.SubscriptionArn)"
          '

          SUBSCRIPTION_ARN="$(
            printf '%s' "$SUBSCRIPTIONS_JSON" |
              jq -r --arg email "$ADMIN_EMAIL" '
                [.Subscriptions[]
                  | select(
                      (.Protocol // "" | ascii_downcase) == "email"
                      and ((.Endpoint // "" | ascii_downcase | gsub("^\\s+|\\s+$"; "")) == ($email | ascii_downcase))
                      and .SubscriptionArn != "Deleted"
                    )
                  | .SubscriptionArn][0] // empty
              '
          )"

          if [ -z "$SUBSCRIPTION_ARN" ] || [ "$SUBSCRIPTION_ARN" = "None" ]; then
            echo "ERROR: ADMIN SNS email subscription was not found."
            echo "Expected endpoint: $ADMIN_EMAIL"
            echo "The subscription must be created by CloudFormation."
            exit 1
          fi

          echo "ADMIN SNS subscription found: $SUBSCRIPTION_ARN"

          if [ "$SUBSCRIPTION_ARN" = "PendingConfirmation" ]; then
            echo "WARNING: ADMIN SNS subscription is PendingConfirmation."
            echo "Open the SNS confirmation email sent to $ADMIN_EMAIL."
            echo "Click Confirm subscription."
            echo "No manual SNS subscription will be created."
            exit 0
          fi

          if [[ "$SUBSCRIPTION_ARN" != arn:aws:sns:* ]]; then
            echo "ERROR: Unexpected SNS subscription value: $SUBSCRIPTION_ARN"
            exit 1
          fi

          PENDING_CONFIRMATION="$(aws sns get-subscription-attributes             --subscription-arn "$SUBSCRIPTION_ARN"             --region "$AWS_REGION"             --query 'Attributes.PendingConfirmation'             --output text)"

          if [ "$PENDING_CONFIRMATION" != "false" ]; then
            echo "WARNING: ADMIN SNS subscription is not confirmed yet."
            echo "The deployment will continue."
            exit 0
          fi

          echo "ADMIN order notification SNS subscription is CONFIRMED."

      # =====================================================
      # VERIFY CUSTOMER ORDER SNS EMAIL SUBSCRIPTION
      # =====================================================

      - name: Verify Customer Order Notification SNS Subscription
        env:
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          if [ -z "${CUSTOMER_EMAIL:-}" ]; then
            echo "ERROR: CLOUDMART_CUSTOMER_EMAIL is missing."
            exit 1
          fi

          # Normalize accidental whitespace/escaped @ from GitHub variables.
          CUSTOMER_EMAIL="$(printf '%s' "$CUSTOMER_EMAIL" | tr -d '\r' | xargs)"
          CUSTOMER_EMAIL="${CUSTOMER_EMAIL//\\@/@}"

          TOPIC_ARN="$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='CustomerOrderNotificationTopicArn'].OutputValue | [0]"             --output text)"

          if [ -z "$TOPIC_ARN" ] || [ "$TOPIC_ARN" = "None" ]; then
            echo "ERROR: CustomerOrderNotificationTopicArn output is missing."
            exit 1
          fi

          echo "Customer order notification topic: $TOPIC_ARN"
          echo "Configured CUSTOMER email: $CUSTOMER_EMAIL"

          SUBSCRIPTIONS_JSON="$(aws sns list-subscriptions-by-topic             --topic-arn "$TOPIC_ARN"             --region "$AWS_REGION"             --output json)"

          echo "Current SNS subscriptions:"
          printf '%s' "$SUBSCRIPTIONS_JSON" | jq -r '
            .Subscriptions[] |
            "Protocol=\(.Protocol) Endpoint=\(.Endpoint) ARN=\(.SubscriptionArn)"
          '

          SUBSCRIPTION_ARN="$(
            printf '%s' "$SUBSCRIPTIONS_JSON" |
              jq -r --arg email "$CUSTOMER_EMAIL" '
                [.Subscriptions[]
                  | select(
                      (.Protocol // "" | ascii_downcase) == "email"
                      and ((.Endpoint // "" | ascii_downcase | gsub("^\\s+|\\s+$"; "")) == ($email | ascii_downcase))
                      and .SubscriptionArn != "Deleted"
                    )
                  | .SubscriptionArn][0] // empty
              '
          )"

          if [ -z "$SUBSCRIPTION_ARN" ] || [ "$SUBSCRIPTION_ARN" = "None" ]; then
            echo "ERROR: CUSTOMER SNS email subscription was not found."
            echo "Expected endpoint: $CUSTOMER_EMAIL"
            echo "The subscription must be created by CloudFormation."
            exit 1
          fi

          echo "CUSTOMER SNS subscription found: $SUBSCRIPTION_ARN"

          if [ "$SUBSCRIPTION_ARN" = "PendingConfirmation" ]; then
            echo "WARNING: CUSTOMER SNS subscription is PendingConfirmation."
            echo "Open the SNS confirmation email sent to $CUSTOMER_EMAIL."
            echo "Click Confirm subscription."
            echo "No manual SNS subscription will be created."
            exit 0
          fi

          if [[ "$SUBSCRIPTION_ARN" != arn:aws:sns:* ]]; then
            echo "ERROR: Unexpected SNS subscription value: $SUBSCRIPTION_ARN"
            exit 1
          fi

          PENDING_CONFIRMATION="$(aws sns get-subscription-attributes             --subscription-arn "$SUBSCRIPTION_ARN"             --region "$AWS_REGION"             --query 'Attributes.PendingConfirmation'             --output text)"

          if [ "$PENDING_CONFIRMATION" != "false" ]; then
            echo "WARNING: CUSTOMER SNS subscription is not confirmed yet."
            echo "The deployment will continue."
            exit 0
          fi

          echo "CUSTOMER order notification SNS subscription is CONFIRMED."

      # =====================================================
      # VERIFY DEPLOYED ORDER LAMBDA SOURCE
      # =====================================================

      - name: Verify Deployed Order Lambda Source
        shell: bash
        run: |
          set -euo pipefail

          FUNCTION_NAME="cloudmart-${ENVIRONMENT}-order"
          SOURCE_FILE="lambdas/order/index.py"
          DEPLOYED_ZIP="/tmp/cloudmart-order-deployed.zip"
          DEPLOYED_DIR="/tmp/cloudmart-order-deployed"

          echo "Checking deployed Order Lambda..."

          FUNCTION_ARN="$(aws lambda get-function             --function-name "$FUNCTION_NAME"             --region "$AWS_REGION"             --query "Configuration.FunctionArn"             --output text)"

          if [ -z "$FUNCTION_ARN" ] || [ "$FUNCTION_ARN" = "None" ]; then
            echo "ERROR: Order Lambda was not found."
            exit 1
          fi

          echo "Order Lambda ARN: $FUNCTION_ARN"

          CODE_URL="$(aws lambda get-function             --function-name "$FUNCTION_NAME"             --region "$AWS_REGION"             --query "Code.Location"             --output text)"

          if [ -z "$CODE_URL" ] || [ "$CODE_URL" = "None" ]; then
            echo "ERROR: Order Lambda deployment package URL is missing."
            exit 1
          fi

          rm -rf "$DEPLOYED_DIR"
          rm -f "$DEPLOYED_ZIP"

          curl -fsSL "$CODE_URL" -o "$DEPLOYED_ZIP"
          mkdir -p "$DEPLOYED_DIR"
          unzip -q "$DEPLOYED_ZIP" -d "$DEPLOYED_DIR"

          if [ ! -f "$DEPLOYED_DIR/index.py" ]; then
            echo "ERROR: Deployed Order Lambda package does not contain index.py."
            exit 1
          fi

          SOURCE_HASH="$(sha256sum "$SOURCE_FILE" | awk '{print $1}')"
          DEPLOYED_HASH="$(sha256sum "$DEPLOYED_DIR/index.py" | awk '{print $1}')"

          echo "Repository Order Lambda SHA256: $SOURCE_HASH"
          echo "Deployed Order Lambda SHA256:   $DEPLOYED_HASH"

          if [ "$SOURCE_HASH" != "$DEPLOYED_HASH" ]; then
            echo "ERROR: Deployed Order Lambda code does not match repository source."
            echo "This prevents an old Order Lambda version from remaining active."
            exit 1
          fi

          python - "$DEPLOYED_DIR/index.py" <<'PY'
          import ast
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source)

          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          if "validate_request" not in functions:
              raise SystemExit(
                  "ERROR: validate_request() is missing from deployed Order Lambda."
              )

          if "create_order" not in functions:
              raise SystemExit(
                  "ERROR: create_order() is missing from deployed Order Lambda."
              )

          validate_source = ast.get_source_segment(
              source, functions["validate_request"]
          ) or ""

          if "customer_email" in validate_source:
              raise SystemExit(
                  "ERROR: Deployed validate_request() still contains customer_email validation."
              )

          print("Deployed Order Lambda validation is correct.")
          PY

          echo "Deployed Order Lambda source verification passed."

      # =====================================================
      # VERIFY ORDER LAMBDA CLOUDWATCH LOG GROUP
      # =====================================================

      - name: Verify Order Lambda CloudWatch Logs
        shell: bash
        run: |
          set -euo pipefail

          LOG_GROUP="/aws/lambda/cloudmart-${ENVIRONMENT}-order"

          COUNT="$(aws logs describe-log-groups \
            --log-group-name-prefix "$LOG_GROUP" \
            --region "$AWS_REGION" \
            --query "length(logGroups[?logGroupName=='$LOG_GROUP'])" \
            --output text)"

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: CloudWatch log group $LOG_GROUP was not found."
            exit 1
          fi

          echo "CloudWatch log group exists: $LOG_GROUP"

      # =====================================================
      # VERIFY EVENTBRIDGE INVENTORY CHANGE SNS TARGET
      # =====================================================

      - name: Verify Inventory Change EventBridge Rule
        shell: bash
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"
          RULE_NAME="cloudmart-${ENVIRONMENT}-low-stock"
          EVENT_BUS="cloudmart-${ENVIRONMENT}-event-bus"

          echo "Checking Inventory Change EventBridge rule..."

          RULE_JSON=$(aws events describe-rule \
            --name "$RULE_NAME" \
            --event-bus-name "$EVENT_BUS" \
            --region "$AWS_REGION" \
            --output json)

          RULE_STATE=$(printf '%s' "$RULE_JSON" | jq -r '.State')
          EVENT_PATTERN=$(printf '%s' "$RULE_JSON" | jq -r '.EventPattern')

          echo "Rule state: $RULE_STATE"
          echo "Event pattern: $EVENT_PATTERN"

          if [ "$RULE_STATE" != "ENABLED" ]; then
            echo "ERROR: Inventory Change EventBridge rule is not enabled."
            exit 1
          fi

          RULE_SOURCE=$(printf '%s' "$EVENT_PATTERN" | jq -r '.source[0] // empty')
          RULE_DETAIL_TYPE=$(printf '%s' "$EVENT_PATTERN" | jq -r '."detail-type"[0] // empty')
          LOW_STOCK_FILTER=$(printf '%s' "$EVENT_PATTERN" | jq -c '.detail.low_stock // empty')

          if [ "$RULE_SOURCE" != "cloudmart.product" ]; then
            echo "ERROR: Rule source is incorrect: $RULE_SOURCE"
            exit 1
          fi

          if [ "$RULE_DETAIL_TYPE" != "Inventory Changed" ]; then
            echo "ERROR: Rule detail-type is incorrect: $RULE_DETAIL_TYPE"
            exit 1
          fi

          if [ "$LOW_STOCK_FILTER" != '[true]' ]; then
            echo "ERROR: Low-stock EventBridge rule must filter low_stock=true."
            echo "Actual low_stock filter: $LOW_STOCK_FILTER"
            exit 1
          fi

          echo "EventBridge event pattern is correct."

          NORMAL_STOCK_EVENT="$(jq -nc '{
            version:"0",
            id:"00000000-0000-0000-0000-000000000001",
            source:"cloudmart.product",
            "detail-type":"Inventory Changed",
            account:"000000000000",
            time:"2026-01-01T00:00:00Z",
            region:"us-east-1",
            resources:[],
            detail:{low_stock:false,product_id:"CI-NORMAL-STOCK",product_name:"CI Normal Product",old_stock:11,new_stock:10,low_stock_threshold:5}
          }')"

          LOW_STOCK_EVENT="$(jq -nc '{
            version:"0",
            id:"00000000-0000-0000-0000-000000000002",
            source:"cloudmart.product",
            "detail-type":"Inventory Changed",
            account:"000000000000",
            time:"2026-01-01T00:00:00Z",
            region:"us-east-1",
            resources:[],
            detail:{low_stock:true,product_id:"CI-LOW-STOCK",product_name:"CI Low Stock Product",old_stock:4,new_stock:1,low_stock_threshold:5}
          }')"

          NORMAL_MATCH=$(aws events test-event-pattern \
            --event-pattern "$EVENT_PATTERN" \
            --event "$NORMAL_STOCK_EVENT" \
            --region "$AWS_REGION" \
            --query 'Result' \
            --output text)

          LOW_MATCH=$(aws events test-event-pattern \
            --event-pattern "$EVENT_PATTERN" \
            --event "$LOW_STOCK_EVENT" \
            --region "$AWS_REGION" \
            --query 'Result' \
            --output text)

          echo "Normal stock-change pattern match: $NORMAL_MATCH"
          echo "Low-stock pattern match: $LOW_MATCH"

          if [ "$NORMAL_MATCH" != "False" ]; then
            echo "ERROR: Normal stock event incorrectly matches the low-stock rule."
            exit 1
          fi

          if [ "$LOW_MATCH" != "True" ]; then
            echo "ERROR: Low-stock event does not match the low-stock rule."
            exit 1
          fi

          TARGET_JSON=$(aws events list-targets-by-rule \
            --rule "$RULE_NAME" \
            --event-bus-name "$EVENT_BUS" \
            --region "$AWS_REGION" \
            --output json)

          TARGET_COUNT=$(printf '%s' "$TARGET_JSON" | jq -r '.Targets | length')
          echo "Target count: $TARGET_COUNT"

          if ! [[ "$TARGET_COUNT" =~ ^[0-9]+$ ]] || [ "$TARGET_COUNT" -lt 1 ]; then
            echo "ERROR: EventBridge rule has no target."
            exit 1
          fi

          # CloudMart notification flow:
          # EventBridge -> SNS Publisher Lambda -> SNS topic.
          # Therefore the EventBridge target must be the SNS Publisher Lambda.
          EXPECTED_PUBLISHER_ARN=$(aws lambda get-function \
            --function-name "cloudmart-${ENVIRONMENT}-sns-publisher" \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)

          if [ -z "$EXPECTED_PUBLISHER_ARN" ] || [ "$EXPECTED_PUBLISHER_ARN" = "None" ]; then
            echo "ERROR: SNS Publisher Lambda was not found."
            exit 1
          fi

          EXPECTED_SNS_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LowStockTopicArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$EXPECTED_SNS_ARN" ] || [ "$EXPECTED_SNS_ARN" = "None" ]; then
            echo "ERROR: LowStockTopicArn CloudFormation output is missing."
            exit 1
          fi

          TARGET_ARN=$(printf '%s' "$TARGET_JSON" | jq -r --arg arn "$EXPECTED_PUBLISHER_ARN" '
            [.Targets[] | select(.Arn == $arn) | .Arn][0] // empty
          ')

          echo "Expected SNS Publisher Lambda ARN: $EXPECTED_PUBLISHER_ARN"
          echo "Expected SNS topic ARN: $EXPECTED_SNS_ARN"
          echo "Matching EventBridge target ARN: ${TARGET_ARN:-<not found>}"

          if [ "$TARGET_ARN" != "$EXPECTED_PUBLISHER_ARN" ]; then
            echo "ERROR: EventBridge rule does not target the SNS Publisher Lambda."
            echo "Expected Lambda target: $EXPECTED_PUBLISHER_ARN"
            echo "Actual targets:"
            printf '%s' "$TARGET_JSON" | jq -r '.Targets[] | .Arn'
            exit 1
          fi

          echo "EventBridge target correctly points to SNS Publisher Lambda."

          if [ -z "${ADMIN_EMAIL:-}" ]; then
            echo "ERROR: ADMIN_EMAIL is not configured."
            exit 1
          fi

          echo "Checking SNS email subscription..."
          echo "Expected notification email: $ADMIN_EMAIL"

          SUBSCRIPTIONS_JSON=$(aws sns list-subscriptions-by-topic \
            --topic-arn "$EXPECTED_SNS_ARN" \
            --region "$AWS_REGION" \
            --output json)

          EMAIL_SUBSCRIPTION_ARN=$(printf '%s' "$SUBSCRIPTIONS_JSON" | jq -r \
            --arg email "$ADMIN_EMAIL" '
              [.Subscriptions[]
                | select(
                    .Protocol == "email"
                    and .Endpoint == $email
                    and .SubscriptionArn != "Deleted"
                  )
                | .SubscriptionArn][0] // empty')

          if [ -z "$EMAIL_SUBSCRIPTION_ARN" ] || [ "$EMAIL_SUBSCRIPTION_ARN" = "None" ]; then
            echo "ERROR: Email subscription was not found for $ADMIN_EMAIL."
            exit 1
          fi

          echo "Email subscription ARN: $EMAIL_SUBSCRIPTION_ARN"

          if [ "$EMAIL_SUBSCRIPTION_ARN" = "PendingConfirmation" ]; then
            echo "WARNING: Low-stock SNS email subscription is PendingConfirmation."
            echo "AWS requires the recipient to confirm the SNS email."
            echo "The deployment will continue."
            exit 0
          fi

          if [[ "$EMAIL_SUBSCRIPTION_ARN" != arn:aws:sns:* ]]; then
            echo "ERROR: Invalid SNS subscription ARN returned."
            echo "Actual value: $EMAIL_SUBSCRIPTION_ARN"
            exit 1
          fi

          PENDING_CONFIRMATION=$(aws sns get-subscription-attributes \
            --subscription-arn "$EMAIL_SUBSCRIPTION_ARN" \
            --region "$AWS_REGION" \
            --query "Attributes.PendingConfirmation" \
            --output text)

          echo "PendingConfirmation: $PENDING_CONFIRMATION"

          if [ "$PENDING_CONFIRMATION" != "false" ]; then
            echo "WARNING: Low-stock SNS email subscription is not confirmed yet."
            echo "The deployment will continue."
            exit 0
          fi

          echo "SNS email subscription is confirmed."
          echo "Inventory Change EventBridge SNS rule verified successfully."


      # =====================================================
      # SHOW APPLICATION OUTPUTS
      # =====================================================

      - name: Show Application Outputs
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # =====================================================
      # APPLICATION FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show Application Stack Failure Events
        if: failure()
        run: |

          echo "APPLICATION STACK STATUS"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "APPLICATION STACK FAILURE EVENTS"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-${ENVIRONMENT} \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

  verify-eventbridge-sns:
    name: Verify EventBridge SNS Target
    needs: deploy-application
    runs-on: ubuntu-latest

    env:
      ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure SNS email subscription exists
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          if [ -z "${ADMIN_EMAIL:-}" ]; then
            echo "ERROR: ADMIN_EMAIL is not configured."
            exit 1
          fi

          TOPIC_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LowStockTopicArn'].OutputValue | [0]" \
            --output text)"

          if [ -z "$TOPIC_ARN" ] || [ "$TOPIC_ARN" = "None" ]; then
            echo "ERROR: LowStockTopicArn output is missing."
            exit 1
          fi

          echo "SNS topic: $TOPIC_ARN"
          echo "Configured email: $ADMIN_EMAIL"

          SUBSCRIPTIONS_JSON="$(aws sns list-subscriptions-by-topic \
            --topic-arn "$TOPIC_ARN" \
            --region "$AWS_REGION" \
            --output json)"

          EMAIL_SUBSCRIPTION_ARN="$(
            printf '%s' "$SUBSCRIPTIONS_JSON" |
              jq -r --arg email "$ADMIN_EMAIL" '
                [.Subscriptions[]
                  | select(
                      .Protocol == "email"
                      and .Endpoint == $email
                      and .SubscriptionArn != "Deleted"
                    )
                  | .SubscriptionArn][0] // empty
              '
          )"

          if [ -z "$EMAIL_SUBSCRIPTION_ARN" ] || [ "$EMAIL_SUBSCRIPTION_ARN" = "None" ]; then
            echo "ERROR: SNS email subscription is missing."
            echo "The application stack must create the email subscription."
            echo "Do not create it manually in Cloud Shell."
            exit 1
          fi

          echo "SNS email subscription: $EMAIL_SUBSCRIPTION_ARN"

          if [ "$EMAIL_SUBSCRIPTION_ARN" = "PendingConfirmation" ]; then
            echo "WARNING: Low-stock SNS email subscription is PendingConfirmation."
            echo "AWS requires the recipient to confirm the SNS email."
            echo "Verification will continue because confirmation is recipient-controlled."
            exit 0
          fi

          if [[ "$EMAIL_SUBSCRIPTION_ARN" != arn:aws:sns:* ]]; then
            echo "ERROR: Invalid SNS subscription ARN returned."
            echo "Actual value: $EMAIL_SUBSCRIPTION_ARN"
            exit 1
          fi

          PENDING_CONFIRMATION=$(aws sns get-subscription-attributes             --subscription-arn "$EMAIL_SUBSCRIPTION_ARN"             --region "$AWS_REGION"             --query "Attributes.PendingConfirmation"             --output text)

          echo "PendingConfirmation: $PENDING_CONFIRMATION"

          if [ "$PENDING_CONFIRMATION" != "false" ]; then
            echo "WARNING: Low-stock SNS email subscription is not confirmed yet."
            echo "Verification will continue."
            exit 0
          fi

          echo "Confirmed SNS email subscription exists: $EMAIL_SUBSCRIPTION_ARN"

      - name: Verify EventBridge inventory change SNS target
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"
          RULE_NAME="cloudmart-${ENVIRONMENT}-low-stock"
          EVENT_BUS="cloudmart-${ENVIRONMENT}-event-bus"

          echo "=========================================="
          echo "VERIFY EVENTBRIDGE -> SNS"
          echo "=========================================="

          echo "Checking CloudFormation stack..."

          STACK_STATUS="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)"

          echo "Application stack status: $STACK_STATUS"

          case "$STACK_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: Application stack is not ready."
              exit 1
              ;;
          esac

          EXPECTED_SNS_ARN="$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LowStockTopicArn'].OutputValue | [0]" \
            --output text)"

          if [ -z "$EXPECTED_SNS_ARN" ] || [ "$EXPECTED_SNS_ARN" = "None" ]; then
            echo "ERROR: LowStockTopicArn CloudFormation output is missing."
            exit 1
          fi

          echo "Expected SNS ARN: $EXPECTED_SNS_ARN"

          echo ""
          echo "Checking EventBridge rule..."

          RULE_JSON="$(aws events describe-rule \
            --name "$RULE_NAME" \
            --event-bus-name "$EVENT_BUS" \
            --region "$AWS_REGION" \
            --output json)"

          RULE_STATE="$(printf '%s' "$RULE_JSON" | jq -r '.State')"
          EVENT_PATTERN="$(printf '%s' "$RULE_JSON" | jq -r '.EventPattern')"

          echo "Rule state: $RULE_STATE"
          echo "Event pattern: $EVENT_PATTERN"

          if [ "$RULE_STATE" != "ENABLED" ]; then
            echo "ERROR: EventBridge rule is not ENABLED."
            exit 1
          fi

          if [[ "$EVENT_PATTERN" != *'"cloudmart.product"'* ]]; then
            echo "ERROR: EventBridge rule does not contain source cloudmart.product."
            exit 1
          fi

          if [[ "$EVENT_PATTERN" != *'"Inventory Changed"'* ]]; then
            echo "ERROR: EventBridge rule does not contain detail-type Inventory Changed."
            exit 1
          fi

          # This is the low-stock alert rule, so the event pattern
          # MUST contain the low_stock condition.
          if [[ "$EVENT_PATTERN" != *'"low_stock"'* ]]; then
            echo "ERROR: Low-stock EventBridge rule does not contain low_stock condition."
            exit 1
          fi

          echo "EventBridge event pattern is correct."

          echo ""
          echo "Testing normal inventory-change event..."

          NORMAL_EVENT="$(jq -nc '{
            version:"0",
            id:"00000000-0000-0000-0000-000000000001",
            source:"cloudmart.product",
            "detail-type":"Inventory Changed",
            account:"000000000000",
            time:"2026-01-01T00:00:00Z",
            region:"us-east-1",
            resources:[],
            detail:{
              low_stock:false,
              product_id:"CI-NORMAL-STOCK",
              quantity:10
            }
          }')"

          NORMAL_MATCH="$(aws events test-event-pattern \
            --event-pattern "$EVENT_PATTERN" \
            --event "$NORMAL_EVENT" \
            --region "$AWS_REGION" \
            --query "Result" \
            --output text)"

          echo "Normal event match: $NORMAL_MATCH"

          if [ "$NORMAL_MATCH" != "False" ]; then
            echo "ERROR: Normal inventory-change event incorrectly matches the low-stock rule."
            exit 1
          fi

          echo ""
          echo "Testing low-stock inventory-change event..."

          LOW_STOCK_EVENT="$(jq -nc '{
            version:"0",
            id:"00000000-0000-0000-0000-000000000002",
            source:"cloudmart.product",
            "detail-type":"Inventory Changed",
            account:"000000000000",
            time:"2026-01-01T00:00:00Z",
            region:"us-east-1",
            resources:[],
            detail:{
              low_stock:true,
              product_id:"CI-LOW-STOCK",
              quantity:3
            }
          }')"

          LOW_STOCK_MATCH="$(aws events test-event-pattern \
            --event-pattern "$EVENT_PATTERN" \
            --event "$LOW_STOCK_EVENT" \
            --region "$AWS_REGION" \
            --query "Result" \
            --output text)"

          echo "Low-stock event match: $LOW_STOCK_MATCH"

          if [ "$LOW_STOCK_MATCH" != "True" ]; then
            echo "ERROR: Low-stock inventory-change event does not match the rule."
            exit 1
          fi

          echo ""
          echo "Checking EventBridge target..."

          TARGET_COUNT="$(aws events list-targets-by-rule \
            --rule "$RULE_NAME" \
            --event-bus-name "$EVENT_BUS" \
            --region "$AWS_REGION" \
            --query "length(Targets)" \
            --output text)"

          echo "Target count: $TARGET_COUNT"

          if ! [[ "$TARGET_COUNT" =~ ^[0-9]+$ ]] || [ "$TARGET_COUNT" -lt 1 ]; then
            echo "ERROR: EventBridge rule has no target."
            exit 1
          fi

          TARGET_JSON="$(aws events list-targets-by-rule \
            --rule "$RULE_NAME" \
            --event-bus-name "$EVENT_BUS" \
            --region "$AWS_REGION" \
            --output json)"

          TARGET_COUNT="$(printf '%s' "$TARGET_JSON" | jq -r '.Targets | length')"
          echo "Target count: $TARGET_COUNT"

          if ! [[ "$TARGET_COUNT" =~ ^[0-9]+$ ]] || [ "$TARGET_COUNT" -lt 1 ]; then
            echo "ERROR: EventBridge rule has no target."
            exit 1
          fi

          # CloudMart notification flow:
          # EventBridge -> SNS Publisher Lambda -> SNS topic.
          EXPECTED_PUBLISHER_ARN="$(aws lambda get-function \
            --function-name "cloudmart-${ENVIRONMENT}-sns-publisher" \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)"

          if [ -z "$EXPECTED_PUBLISHER_ARN" ] || [ "$EXPECTED_PUBLISHER_ARN" = "None" ]; then
            echo "ERROR: SNS Publisher Lambda was not found."
            exit 1
          fi

          TARGET_ARN="$(printf '%s' "$TARGET_JSON" | jq -r --arg arn "$EXPECTED_PUBLISHER_ARN" '
            [.Targets[] | select(.Arn == $arn) | .Arn][0] // empty
          ')"

          echo "Expected SNS Publisher Lambda ARN: $EXPECTED_PUBLISHER_ARN"
          echo "Expected SNS topic ARN: $EXPECTED_SNS_ARN"
          echo "Matching EventBridge target ARN: ${TARGET_ARN:-<not found>}"

          if [ "$TARGET_ARN" != "$EXPECTED_PUBLISHER_ARN" ]; then
            echo "ERROR: EventBridge target does not point to the SNS Publisher Lambda."
            echo "Expected Lambda target: $EXPECTED_PUBLISHER_ARN"
            echo "Actual targets:"
            printf '%s' "$TARGET_JSON" | jq -r '.Targets[] | .Arn'
            exit 1
          fi

          echo "EventBridge target correctly points to SNS Publisher Lambda."

          echo ""
          echo "Checking SNS subscription..."

          SUBSCRIPTIONS_JSON="$(aws sns list-subscriptions-by-topic \
            --topic-arn "$EXPECTED_SNS_ARN" \
            --region "$AWS_REGION" \
            --output json)"

          ACTIVE_SUBSCRIPTION_COUNT="$(
            printf '%s' "$SUBSCRIPTIONS_JSON" |
              jq '[.Subscriptions[]
                | select(.SubscriptionArn != "Deleted")
              ] | length'
          )"

          echo "Active SNS subscription count: $ACTIVE_SUBSCRIPTION_COUNT"

          if [ "$ACTIVE_SUBSCRIPTION_COUNT" -lt 1 ]; then
            echo "ERROR: SNS topic has no active subscription."
            exit 1
          fi

          EMAIL_SUBSCRIPTION_FOUND="$(
            printf '%s' "$SUBSCRIPTIONS_JSON" |
              jq -r --arg email "$ADMIN_EMAIL" '
                [.Subscriptions[]
                  | select(.Protocol == "email")
                  | select(.Endpoint == $email)
                  | select(.SubscriptionArn != "Deleted")]
                | length
              '
