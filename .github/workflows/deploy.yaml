name: Deploy CloudMart Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - ".github/workflows/deploy.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # =========================================================
  # NETWORK STACK
  # =========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity and region
        run: |
          echo "AWS_REGION=$AWS_REGION"
          aws sts get-caller-identity
          aws configure get region || true

      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region us-east-1

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region us-east-1 \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region us-east-1

      - name: Show Network Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region us-east-1 \
            --query "Stacks[0].Outputs" \
            --output table


  # =========================================================
  # DATA STACK
  # =========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity and region
        run: |
          echo "AWS_REGION=$AWS_REGION"
          aws sts get-caller-identity
          aws configure get region || true

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region us-east-1 \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate Data CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region us-east-1

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region us-east-1 \
            --parameter-overrides \
              Environment=dev \
              DBInstanceClass=db.t3.micro \
              DBName=cloudmart \
              AllocatedStorage=20 \
              DBUsername="${{ secrets.CLOUDMART_DB_USERNAME }}" \
              DBPassword="${{ secrets.CLOUDMART_DB_PASSWORD }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region us-east-1

      - name: Show Data Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region us-east-1 \
            --query "Stacks[0].Outputs" \
            --output table

      - name: Show Data Stack Failure Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-data-dev \
            --region us-east-1 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table

  # =========================================================
  # IAM STACK
  # =========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity and region
        run: |
          echo "AWS_REGION=$AWS_REGION"
          aws sts get-caller-identity
          aws configure get region || true

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region us-east-1 \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate IAM CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region us-east-1

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region us-east-1 \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region us-east-1

      - name: Show IAM Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region us-east-1 \
            --query "Stacks[0].Outputs" \
            --output table

      - name: Show IAM Stack Failure Events
        if: failure()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name cloudmart-iam-dev \
            --region us-east-1 \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table