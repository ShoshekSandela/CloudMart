name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "database/schema.sql"
      - "dashboard/**"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT: ${{ vars.CLOUDMART_ENVIRONMENT || 'dev' }}

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-network-${ENVIRONMENT}"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "Network stack status: ${STATUS:-NOT_FOUND}"

          if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            echo "Network stack does not exist. Creating it with the existing GitHub Actions role."

            aws cloudformation deploy \
              --template-file cloudformation/network-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides Environment="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

            echo "Network stack created."
            exit 0
          fi

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is healthy."
              ;;
            UPDATE_ROLLBACK_COMPLETE)
              echo "Network stack is UPDATE_ROLLBACK_COMPLETE."
              echo "Preserving the existing Network stack to protect its exports."
              echo "No Network update will be attempted in this run."
              exit 0
              ;;
            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS|DELETE_IN_PROGRESS)
              echo "ERROR: Network stack is busy: $STATUS"
              exit 1
              ;;
            CREATE_FAILED|UPDATE_ROLLBACK_FAILED|DELETE_FAILED)
              echo "ERROR: Network stack is in failed state: $STATUS"
              exit 1
              ;;
            DELETE_COMPLETE)
              echo "Network stack is deleted. Recreating it."
              aws cloudformation deploy \
                --template-file cloudformation/network-stack.yaml \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --parameter-overrides Environment="$ENVIRONMENT" \
                --capabilities CAPABILITY_NAMED_IAM \
                --no-fail-on-empty-changeset
              ;;
            *)
              echo "ERROR: Unexpected Network stack state: $STATUS"
              exit 1
              ;;
          esac

          echo "Network stack deployment completed."

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Recover failed IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "IAM stack status: ${STACK_STATUS:-NOT_FOUND}"

          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || \
             [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Removing failed/incomplete IAM stack: $STACK_NAME"

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "IAM stack removed."
            STACK_STATUS=""
          fi

      - name: Deploy IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "IAM stack status: ${STACK_STATUS:-NOT_FOUND}"

          # No Bootstrap resources are created here.
          # The existing GitHub Actions OIDC role remains external to CloudMart.
          #
          # CREATE:
          #   Use a CREATE change set with --import-existing-resources so that
          #   pre-existing CloudMart IAM resources can be adopted.
          #
          # EXISTING STACK:
          #   Use "cloudformation deploy" for a normal update. This is important
          #   because create-change-set returns FAILED when there are no changes.
          #   --no-fail-on-empty-changeset makes an already-up-to-date IAM stack
          #   succeed instead of failing the GitHub Actions job.

          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            echo "IAM stack does not exist. Creating and adopting existing IAM resources."

            CHANGE_SET_NAME="cloudmart-iam-${ENVIRONMENT}-$(date +%s)"

            aws cloudformation create-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --change-set-type CREATE \
              --template-body file://cloudformation/iam-stack.yaml \
              --parameters \
                ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
                ParameterKey=GitHubActionsRoleName,ParameterValue="${AWS_ROLE_ARN##*/}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --import-existing-resources \
              --region "$AWS_REGION"

            aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation execute-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

          elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || \
               [ "$STACK_STATUS" = "UPDATE_COMPLETE" ]; then

            echo "IAM stack already exists. Performing normal CloudFormation update."

            aws cloudformation deploy \
              --template-file cloudformation/iam-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides \
                Environment="$ENVIRONMENT" \
                GitHubActionsRoleName="${AWS_ROLE_ARN##*/}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

          elif [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || \
               [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then

            echo "IAM stack is $STACK_STATUS. Removing the unfinished stack."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Recreating IAM stack with resource adoption."

            CHANGE_SET_NAME="cloudmart-iam-${ENVIRONMENT}-$(date +%s)"

            aws cloudformation create-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --change-set-type CREATE \
              --template-body file://cloudformation/iam-stack.yaml \
              --parameters \
                ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
                ParameterKey=GitHubActionsRoleName,ParameterValue="${AWS_ROLE_ARN##*/}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --import-existing-resources \
              --region "$AWS_REGION"

            aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation execute-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

          else
            echo "ERROR: IAM stack is in unsupported/busy state: $STACK_STATUS"
            exit 1
          fi

          IAM_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          case "$IAM_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is healthy: $IAM_STATUS"
              ;;
            *)
              echo "ERROR: IAM stack ended in unexpected state: $IAM_STATUS"
              exit 1
              ;;
          esac


  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy data stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_USERNAME" || { echo "CLOUDMART_DB_USERNAME is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "CLOUDMART_DB_PASSWORD is missing"; exit 1; }

          STACK_NAME="cloudmart-data-${ENVIRONMENT}"

          # A failed first deployment can leave an empty REVIEW_IN_PROGRESS
          # CloudFormation stack. Remove only that unfinished stack automatically.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Removing unfinished Data stack: $STACK_NAME"
            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Unfinished Data stack removed."
          fi

          # Authentication token lifecycle is owned exclusively by Token Manager.
          # Never delete or reset /cloudmart/${ENVIRONMENT}/auth/token during a
          # Data stack deployment.
          echo "Authentication token is managed exclusively by Token Manager; preserving it."

          # One-time migration: if the Data stack still owns the legacy
          # AuthTokenParameter resource, first apply Retain to the EXISTING
          # CloudFormation resource without changing any of its properties.
          #
          # This is important because the live parameter is SecureString,
          # while AWS::SSM::Parameter in CloudFormation supports only String
          # and StringList. The migration must therefore not try to update
          # the parameter itself; it only changes the CloudFormation
          # DeletionPolicy to Retain.
          LEGACY_AUTH_RESOURCE=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --logical-resource-id AuthTokenParameter \
            --region "$AWS_REGION" \
            --query 'StackResources[0].LogicalResourceId' \
            --output text 2>/dev/null || true)

          if [ "$LEGACY_AUTH_RESOURCE" = "AuthTokenParameter" ]; then
            echo "Legacy AuthTokenParameter is still owned by the Data stack."
            echo "Applying Retain to the existing resource without changing its properties."

            # CloudFormation may return the original template as either
            # JSON or YAML text. Handle both formats.
            aws cloudformation get-template \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --template-stage Original \
              --output json > /tmp/cloudmart-data-current.json

            python - <<'PY'
          import json
          import re
          from pathlib import Path

          outer = json.loads(Path("/tmp/cloudmart-data-current.json").read_text())
          template = outer["TemplateBody"]

          # If TemplateBody itself is JSON, modify it structurally.
          try:
              document = json.loads(template)
          except (TypeError, json.JSONDecodeError):
              document = None

          if isinstance(document, dict):
              resources = document.get("Resources", {})
              resource = resources.get("AuthTokenParameter")

              if not isinstance(resource, dict):
                  raise SystemExit(
                      "AuthTokenParameter was not found in the current Data stack template"
                  )

              # Change only CloudFormation deletion behavior. Do not change
              # the existing SSM parameter name, type, value, or properties.
              resource["DeletionPolicy"] = "Retain"
              resource["UpdateReplacePolicy"] = "Retain"

              Path("/tmp/cloudmart-data-retain.json").write_text(
                  json.dumps(document, separators=(",", ":"))
              )
          else:
              # Otherwise the original template is YAML. Add the policies
              # immediately below AuthTokenParameter, preserving the rest.
              source = str(template)

              match = re.search(
                  r"(?m)^(\s*)AuthTokenParameter:\s*$",
                  source,
              )
              if not match:
                  raise SystemExit(
                      "AuthTokenParameter was not found in the current Data stack template"
                  )

              indent = match.group(1)
              insert_at = match.end()

              # Avoid duplicate policy attributes on a retry.
              next_resource = re.search(
                  r"(?m)^\s*[A-Za-z0-9][A-Za-z0-9_-]*:\s*$",
                  source[insert_at:],
              )
              resource_end = (
                  insert_at + next_resource.start()
                  if next_resource
                  else len(source)
              )
              resource_block = source[match.start():resource_end]

              additions = []
              if not re.search(
                  r"(?m)^\s+DeletionPolicy:\s*Retain\s*$",
                  resource_block,
              ):
                  additions.append(f"{indent}  DeletionPolicy: Retain")
              if not re.search(
                  r"(?m)^\s+UpdateReplacePolicy:\s*Retain\s*$",
                  resource_block,
              ):
                  additions.append(f"{indent}  UpdateReplacePolicy: Retain")

              if additions:
                  source = (
                      source[:insert_at]
                      + "\n"
                      + "\n".join(additions)
                      + source[insert_at:]
                  )

              Path("/tmp/cloudmart-data-retain.yaml").write_text(source)
          PY

            if [ -f /tmp/cloudmart-data-retain.json ]; then
              RETAIN_TEMPLATE=/tmp/cloudmart-data-retain.json
            else
              RETAIN_TEMPLATE=/tmp/cloudmart-data-retain.yaml
            fi

            aws cloudformation deploy \
              --template-file "$RETAIN_TEMPLATE" \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides \
                Environment="$ENVIRONMENT" \
                DBName=cloudmart \
                DBInstanceClass=db.t3.micro \
                AllocatedStorage=20 \
                DBUsername="$DB_USERNAME" \
                DBPassword="$DB_PASSWORD" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

            echo "Retain policy applied. The next Data stack update will remove AuthTokenParameter from CloudFormation while preserving the SSM parameter."
          fi

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName=cloudmart \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare schema
        run: cp database/schema.sql lambdas/product/schema.sql
      - name: Validate application template
        run: sam validate --template-file cloudformation/application-stack.yaml
      - name: Clean previous SAM build
        run: rm -rf .aws-sam

      - name: Build application
        run: |
          set -euo pipefail
          sam build --template-file cloudformation/application-stack.yaml
      - name: Deploy application
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }


          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          # CloudFormation cannot update a stack while it is being deleted.
          # Wait for an in-progress deletion instead of starting another
          # deployment against the same stack.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          # A previous failed CREATE can leave the stack in REVIEW_IN_PROGRESS.
          # Remove that unfinished stack before starting SNS recovery.
          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Application stack is REVIEW_IN_PROGRESS: $STACK_NAME"
            echo "Deleting the unfinished stack..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Unfinished Application stack removed."
            STACK_STATUS=""
          fi

          if [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "Application stack is currently being deleted: $STACK_NAME"
            echo "Waiting for CloudFormation deletion to complete..."

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Application stack deletion completed."
            STACK_STATUS=""
          fi

          # A ROLLBACK_COMPLETE stack cannot be updated.
          # Delete only the failed application stack so it can be recreated.
          # SNS topics/subscriptions use Retain, so they are preserved and
          # automatically re-adopted below before the full SAM deployment.
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Application stack is ROLLBACK_COMPLETE: $STACK_NAME"
            echo "Deleting the failed stack..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Failed Application stack removed."
            STACK_STATUS=""
          fi

          # SAM updates the recovered stack or creates a new stack when no
          # previous CloudFormation stack exists.
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              AuthorizerCacheTTL=0 \
              NotificationEmail="$ADMIN_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}" \
              EC2InstanceType=t3.micro

           APP_STATUS=$(aws cloudformation describe-stacks \
             --stack-name "$STACK_NAME" \
             --region "$AWS_REGION" \
             --query 'Stacks[0].StackStatus' \
             --output text)

           case "$APP_STATUS" in
             CREATE_COMPLETE|UPDATE_COMPLETE)
               echo "Application stack is healthy: $APP_STATUS"
               ;;
             *)
               echo "ERROR: Application stack ended in unexpected state: $APP_STATUS"
               exit 1
               ;;
           esac

           echo "Verifying deployed API Gateway customer-registration method..."

           REST_API_ID=$(aws cloudformation describe-stacks              --stack-name "$STACK_NAME"              --region "$AWS_REGION"              --query 'Stacks[0].Outputs[?OutputKey==`RestApiId`].OutputValue'              --output text)

           CUSTOMERS_RESOURCE_ID=$(aws apigateway get-resources              --rest-api-id "$REST_API_ID"              --region "$AWS_REGION"              --query 'items[?path==`/customers`].id | [0]'              --output text)

           test -n "$CUSTOMERS_RESOURCE_ID" && test "$CUSTOMERS_RESOURCE_ID" != "None" || {
             echo "ERROR: /customers API Gateway resource was not found."
             exit 1
           }

           CUSTOMER_POST_AUTH_TYPE=$(aws apigateway get-method              --rest-api-id "$REST_API_ID"              --resource-id "$CUSTOMERS_RESOURCE_ID"              --http-method POST              --region "$AWS_REGION"              --query 'authorizationType'              --output text)

           echo "POST /customers authorization type: $CUSTOMER_POST_AUTH_TYPE"

           test "$CUSTOMER_POST_AUTH_TYPE" = "NONE" || {
             echo "ERROR: POST /customers is still protected by API Gateway."
             echo "Expected authorizationType=NONE but received: $CUSTOMER_POST_AUTH_TYPE"
             exit 1
           }

           echo "POST /customers is publicly accessible at API Gateway."

           echo "Verifying deployed Customer Lambda registration version..."

           CUSTOMER_FUNCTION_NAME="cloudmart-${ENVIRONMENT}-customer"
           CUSTOMER_HANDLER=$(aws lambda get-function-configuration              --function-name "$CUSTOMER_FUNCTION_NAME"              --region "$AWS_REGION"              --query 'Handler'              --output text)

           CUSTOMER_REGISTRATION_VERSION=$(aws lambda get-function-configuration              --function-name "$CUSTOMER_FUNCTION_NAME"              --region "$AWS_REGION"              --query 'Environment.Variables.CUSTOMER_REGISTRATION_VERSION'              --output text)

           echo "Customer Lambda handler: $CUSTOMER_HANDLER"
           echo "Customer registration version: $CUSTOMER_REGISTRATION_VERSION"

           test "$CUSTOMER_HANDLER" = "index.lambda_handler_v2" || {
             echo "ERROR: Customer Lambda is still using the old handler."
             exit 1
           }

           test "$CUSTOMER_REGISTRATION_VERSION" = "2" || {
             echo "ERROR: Customer Lambda registration version is not 2."
             exit 1
           }

           echo "Customer Lambda registration version is deployed."

           echo "Verifying SNS notification infrastructure..."
           ORDER_TOPIC_ARN=$(aws sns list-topics              --region "$AWS_REGION"              --query 'Topics[].TopicArn'              --output text | tr '\t' '\n' | grep -E ":cloudmart-${ENVIRONMENT}-order-notifications$" | head -n 1 || true)
           LOW_STOCK_TOPIC_ARN=$(aws sns list-topics              --region "$AWS_REGION"              --query 'Topics[].TopicArn'              --output text | tr '\t' '\n' | grep -E ":cloudmart-${ENVIRONMENT}-low-stock$" | head -n 1 || true)

           test -n "$ORDER_TOPIC_ARN" || { echo "ERROR: Customer order SNS topic was not created."; exit 1; }
           test -n "$LOW_STOCK_TOPIC_ARN" || { echo "ERROR: Low-stock SNS topic was not created."; exit 1; }

           echo "Customer order SNS topic: $ORDER_TOPIC_ARN"
           echo "Low-stock SNS topic: $LOW_STOCK_TOPIC_ARN"

           echo "Checking admin low-stock email subscription..."
           LOW_STOCK_SUBSCRIPTIONS=$(aws sns list-subscriptions-by-topic \
             --topic-arn "$LOW_STOCK_TOPIC_ARN" \
             --region "$AWS_REGION" \
             --output json)

           # SNS can return lifecycle values such as PendingConfirmation or
           # Deleted in SubscriptionArn. Only a real ARN may be passed to
           # GetSubscriptionAttributes.
           LOW_STOCK_SUB_ARN=$(echo "$LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             .Subscriptions[]?
             | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
             | .SubscriptionArn
             | select(startswith("arn:"))' | head -n 1)

           LOW_STOCK_PENDING_PRESENT=$(echo "$LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             any(.Subscriptions[]?; ((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase)) and .SubscriptionArn == "PendingConfirmation")')

           LOW_STOCK_DELETED_PRESENT=$(echo "$LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             any(.Subscriptions[]?; ((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase)) and .SubscriptionArn == "Deleted")')

           if [ -n "$LOW_STOCK_SUB_ARN" ]; then
             echo "Admin low-stock SNS subscription ARN: $LOW_STOCK_SUB_ARN"

             if LOW_STOCK_SUB_ATTRIBUTES=$(aws sns get-subscription-attributes \
               --subscription-arn "$LOW_STOCK_SUB_ARN" \
               --region "$AWS_REGION" \
               --output json 2>/tmp/low-stock-sub-error.log); then
               LOW_STOCK_PENDING=$(echo "$LOW_STOCK_SUB_ATTRIBUTES" | jq -r '.Attributes.PendingConfirmation // "false"')
               if [ "$LOW_STOCK_PENDING" = "true" ]; then
                 echo "WARNING: Admin low-stock SNS subscription is PendingConfirmation."
                 echo "The admin must click the SNS confirmation link before low-stock emails can be delivered."
               else
                 echo "Admin low-stock SNS subscription is confirmed."
               fi
             else
               echo "WARNING: Existing admin low-stock subscription ARN is no longer available."
               cat /tmp/low-stock-sub-error.log
               LOW_STOCK_SUB_ARN=""
             fi
           fi

           # Remove the obsolete singular topic created by an older version.
           # The current CloudFormation-managed topic is plural:
           # cloudmart-${ENVIRONMENT}-order-notifications.
           STALE_ORDER_TOPIC_ARN=$(aws sns list-topics              --region "$AWS_REGION"              --query 'Topics[].TopicArn'              --output text | tr '\t' '\n' | grep -E ":cloudmart-${ENVIRONMENT}-order-notification$" | head -n 1 || true)

           if [ -n "$STALE_ORDER_TOPIC_ARN" ]; then
             echo "Deleting stale SNS topic: $STALE_ORDER_TOPIC_ARN"
             aws sns delete-topic                --topic-arn "$STALE_ORDER_TOPIC_ARN"                --region "$AWS_REGION"
             echo "Stale singular order-notification topic deleted."
           else
             echo "No stale singular order-notification topic found."
           fi

           # Verify the obsolete singular topic is gone.
           STALE_ORDER_TOPIC_ARN=$(aws sns list-topics              --region "$AWS_REGION"              --query 'Topics[].TopicArn'              --output text | tr '\t' '\n' | grep -E ":cloudmart-${ENVIRONMENT}-order-notification$" | head -n 1 || true)

           test -z "$STALE_ORDER_TOPIC_ARN" || {
             echo "ERROR: stale singular order-notification topic still exists."
             exit 1
           }

           # Read-only verification. The email subscription itself is created by
           # CloudFormation from NotificationEmail. GitHub Actions does not call
           # sns:Subscribe, ConfirmSubscription, or Unsubscribe.
           FINAL_LOW_STOCK_SUBSCRIPTIONS=$(aws sns list-subscriptions-by-topic \
             --topic-arn "$LOW_STOCK_TOPIC_ARN" \
             --region "$AWS_REGION" \
             --output json)

           FINAL_LOW_STOCK_SUB_STATUS=$(echo "$FINAL_LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             .Subscriptions[]?
             | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
             | if .SubscriptionArn == "PendingConfirmation" then "PENDING"
               elif .SubscriptionArn == "Deleted" then "DELETED"
               elif (.SubscriptionArn // "" | startswith("arn:")) then "CONFIRMED"
               else "UNKNOWN" end' | head -n 1)

           case "$FINAL_LOW_STOCK_SUB_STATUS" in
             CONFIRMED)
               FINAL_LOW_STOCK_SUB_ARN=$(echo "$FINAL_LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
                 .Subscriptions[]?
                 | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
                 | .SubscriptionArn
                 | select(startswith("arn:"))' | head -n 1)
               echo "Confirmed low-stock SNS subscription: $FINAL_LOW_STOCK_SUB_ARN"
               ;;
             PENDING)
               echo "WARNING: CloudFormation created the low-stock email subscription and it is PendingConfirmation."
               echo "The recipient must confirm the SNS email before delivery can begin."
               ;;
             DELETED)
               echo "WARNING: The low-stock email subscription is Deleted."
               echo "CloudFormation owns this subscription; no manual subscription command is run by GitHub Actions."
               ;;
             *)
               echo "WARNING: No low-stock email subscription is currently visible."
               echo "CloudFormation is responsible for creating the subscription from NotificationEmail."
               ;;
           esac

           echo "SNS notification infrastructure check completed."

  initialize:
    name: Initialize CloudMart
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize database
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-product" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_database"}' \
            /tmp/db.json
          jq -e '.statusCode == 200' /tmp/db.json >/dev/null
          rm -f /tmp/db.json
          echo "Database initialization completed successfully."
      - name: Initialize authentication tokens
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-token-manager" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_tokens"}' \
            /tmp/auth.json
          jq -e '.statusCode == 200' /tmp/auth.json >/dev/null
          rm -f /tmp/auth.json
          echo "Authentication tokens initialized successfully."

      - name: Verify deployed API authentication
        run: |
          set -euo pipefail

          AUTH_PARAMETER="/cloudmart/${ENVIRONMENT}/auth/token"
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-application-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RestApiUrl`].OutputValue' \
            --output text)

          echo "Verifying POST /customers without an Authorization header..."

          CUSTOMER_PUBLIC_RESPONSE=/tmp/customer-public-response.json
          CUSTOMER_PUBLIC_HTTP_CODE=$(curl -sS -o "$CUSTOMER_PUBLIC_RESPONSE" -w '%{http_code}'             -X POST             -H "Content-Type: application/json"             --data '{}'             "$API_URL/customers")

          echo "POST /customers without Authorization returned HTTP $CUSTOMER_PUBLIC_HTTP_CODE"
          cat "$CUSTOMER_PUBLIC_RESPONSE"

          # {} is intentionally invalid, so no customer is created.
          # HTTP 400 proves the request reached Customer Lambda.
          # HTTP 403 means an old protected route is still deployed.
          if [ "$CUSTOMER_PUBLIC_HTTP_CODE" != "400" ]; then
            echo "ERROR: POST /customers public-registration check failed."
            echo "Expected HTTP 400 from Lambda validation, but received HTTP $CUSTOMER_PUBLIC_HTTP_CODE."
            exit 1
          fi

          echo "POST /customers public-registration smoke test passed."
          rm -f "$CUSTOMER_PUBLIC_RESPONSE"

          ADMIN_TOKEN=$(aws ssm get-parameter \
            --name "$AUTH_PARAMETER" \
            --region "$AWS_REGION" \
            --with-decryption \
            --query 'Parameter.Value' \
            --output text | jq -r '.admin_token')

          test -n "$ADMIN_TOKEN" && test "$ADMIN_TOKEN" != "null" || { echo "ERROR: admin_token is missing from $AUTH_PARAMETER"; exit 1; }

          RESPONSE_FILE=/tmp/products-response.json
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "$API_URL/products")

          echo "API authentication smoke-test HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: GET /products did not authenticate successfully."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "API authentication smoke test passed: GET /products returned HTTP 200."
          rm -f "$RESPONSE_FILE"

  deploy-monitoring:
    name: Deploy API Monitoring and EC2 Dashboard
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload dashboard source
        run: |
          set -euo pipefail

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-data-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`ReportBucketName`].OutputValue' \
            --output text)

          test -n "$REPORT_BUCKET" || { echo "Report bucket was not found."; exit 1; }

          aws s3 sync dashboard "s3://${REPORT_BUCKET}/dashboard-source/${GITHUB_SHA}" --delete
          echo "Dashboard source uploaded to s3://${REPORT_BUCKET}/dashboard-source/${GITHUB_SHA}"

      - name: Validate monitoring template
        run: sam validate --template-file cloudformation/API-Monitoring-EC2.yaml

      - name: Build monitoring stack
        run: sam build --template-file cloudformation/API-Monitoring-EC2.yaml

      - name: Deploy API-Monitoring-EC2 stack
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }

          STACK_NAME="API-Monitoring-EC2-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          # A previous monitoring deployment may still be rolling back.
          # Wait for CloudFormation to finish before deciding whether the
          # failed stack can be deleted and recreated.
          if [ "$STACK_STATUS" = "ROLLBACK_IN_PROGRESS" ] || \
             [ "$STACK_STATUS" = "UPDATE_ROLLBACK_IN_PROGRESS" ]; then
            echo "Monitoring stack is currently $STACK_STATUS. Waiting for rollback to finish."

            for i in {1..30}; do
              sleep 20

              STACK_STATUS=$(aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --query 'Stacks[0].StackStatus' \
                --output text 2>/dev/null || true)

              echo "Monitoring stack status: $STACK_STATUS"

              case "$STACK_STATUS" in
                ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS)
                  ;;
                *)
                  break
                  ;;
              esac
            done
          fi

          case "$STACK_STATUS" in
            ROLLBACK_COMPLETE|REVIEW_IN_PROGRESS|ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED|DELETE_FAILED)
              echo "Monitoring stack is in $STACK_STATUS. Removing the failed/incomplete stack."

              aws cloudformation delete-stack \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"

              STACK_STATUS=""
              ;;
          esac

          if [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"
            STACK_STATUS=""
          fi

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              NotificationEmail="$ADMIN_EMAIL" \
              EC2InstanceType=t3.micro \
              DashboardSourcePrefix="dashboard-source/${GITHUB_SHA}"

          MONITORING_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          case "$MONITORING_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Monitoring stack is healthy: $MONITORING_STATUS"
              ;;
            *)
              echo "ERROR: Monitoring stack ended in unexpected state: $MONITORING_STATUS"
              exit 1
              ;;
          esac

          echo "Dashboard URL:"
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`DashboardUrl`].OutputValue' \
            --output text

