name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "database/schema.sql"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ vars.CLOUDMART_ENVIRONMENT || 'dev' }}

jobs:
  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy IAM stack
        run: |
          set -euo pipefail
          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"
          ROLE_NAME="cloudmart-${ENVIRONMENT}-cloudformation-execution-role"
          CFN_ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query 'Role.Arn' --output text 2>/dev/null || true)

          DEPLOY_ARGS=(
            --template-file cloudformation/iam-stack.yaml
            --stack-name "$STACK_NAME"
            --region "$AWS_REGION"
            --parameter-overrides Environment="$ENVIRONMENT" GitHubRepository="ShoshekSandela/CloudMart"
            --capabilities CAPABILITY_NAMED_IAM
            --no-fail-on-empty-changeset
          )

          # The first run uses the bootstrap GitHub role; later runs use the code-managed execution role.
          if [ -n "$CFN_ROLE_ARN" ] && [ "$CFN_ROLE_ARN" != "None" ]; then
            DEPLOY_ARGS+=(--role-arn "$CFN_ROLE_ARN")
          fi

          aws cloudformation deploy "${DEPLOY_ARGS[@]}"

          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='GitHubActionsRoleArn'].OutputValue | [0]" \
            --output text

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy network stack
        run: |
          set -euo pipefail
          STACK_NAME="cloudmart-network-${ENVIRONMENT}"
          ROLE_NAME="cloudmart-${ENVIRONMENT}-cloudformation-execution-role"
          CFN_ROLE_ARN=$(aws iam get-role --role-name "$ROLE_NAME" --query 'Role.Arn' --output text 2>/dev/null || true)

          DEPLOY_ARGS=(
            --template-file cloudformation/network-stack.yaml
            --stack-name "$STACK_NAME"
            --region "$AWS_REGION"
            --parameter-overrides Environment="$ENVIRONMENT"
            --capabilities CAPABILITY_NAMED_IAM
            --no-fail-on-empty-changeset
          )

          # Use the CloudFormation execution role after IAM has created it; bootstrap uses the current role.
          if [ -n "$CFN_ROLE_ARN" ] && [ "$CFN_ROLE_ARN" != "None" ]; then
            DEPLOY_ARGS+=(--role-arn "$CFN_ROLE_ARN")
          fi

          aws cloudformation deploy "${DEPLOY_ARGS[@]}"

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy data stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_USERNAME" || { echo "CLOUDMART_DB_USERNAME is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "CLOUDMART_DB_PASSWORD is missing"; exit 1; }

          CFN_ROLE_ARN=$(aws iam get-role \
            --role-name "cloudmart-${ENVIRONMENT}-cloudformation-execution-role" \
            --query 'Role.Arn' --output text)

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "cloudmart-data-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_ROLE_ARN" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName=cloudmart \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              ExistingReportBucketName="" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs:
      - deploy-iam
      - deploy-data
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Prepare schema
        run: cp database/schema.sql lambdas/product/schema.sql
      - name: Validate application template
        run: sam validate --template-file cloudformation/application-stack.yaml
      - name: Build application
        run: sam build --template-file cloudformation/application-stack.yaml
      - name: Deploy application
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }
          test -n "$CUSTOMER_EMAIL" || { echo "CLOUDMART_CUSTOMER_EMAIL is missing"; exit 1; }

          CFN_ROLE_ARN=$(aws iam get-role \
            --role-name "cloudmart-${ENVIRONMENT}-cloudformation-execution-role" \
            --query 'Role.Arn' --output text)

          # SAM creates/uses its managed packaging bucket; CloudMart does not provision a separate artifact bucket.
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "cloudmart-application-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_ROLE_ARN" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              AuthorizerCacheTTL=0 \
              NotificationEmail="$ADMIN_EMAIL" \
              CustomerEmail="$CUSTOMER_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}" \
              EC2InstanceType=t3.micro

  initialize:
    name: Initialize CloudMart
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize database
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-product" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_database"}' \
            /tmp/db.json
          cat /tmp/db.json
          jq -e '.statusCode == 200' /tmp/db.json >/dev/null
      - name: Initialize authentication tokens
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-authorizer" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_tokens"}' \
            /tmp/auth.json
          cat /tmp/auth.json
          jq -e '.statusCode == 200' /tmp/auth.json >/dev/null
      - name: Synchronize configured customer
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-order" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"sync_configured_customer"}' \
            /tmp/customer.json
          cat /tmp/customer.json
          jq -e '.statusCode == 200' /tmp/customer.json >/dev/null
