name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambdas/**"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PROJECT_NAME: cloudmart

jobs:

  # ==========================================================
  # 1. NETWORK STACK
  # ==========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is ready."
              ;;
            *)
              echo "ERROR: Network stack failed."
              exit 1
              ;;
          esac


  # ==========================================================
  # 2. DATA STACK
  # ==========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Database Password
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        shell: bash
        run: |

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD secret is missing."
            exit 1
          fi

          if [ "${#DB_PASSWORD}" -lt 12 ]; then
            echo "ERROR: Database password must be at least 12 characters."
            exit 1
          fi

          if [ "${#DB_PASSWORD}" -gt 41 ]; then
            echo "ERROR: Database password must not exceed 41 characters."
            exit 1
          fi

          if printf '%s' "$DB_PASSWORD" | LC_ALL=C grep -q '[^ -~]'; then
            echo "ERROR: Database password contains non-ASCII characters."
            exit 1
          fi

          if printf '%s' "$DB_PASSWORD" | grep -qE '[/@" ]'; then
            echo 'ERROR: Database password contains an RDS-invalid character.'
            echo 'Do not use: / @ " or spaces.'
            exit 1
          fi

          echo "Database password format is valid."

      - name: Deploy Data Stack
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        shell: bash
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
              ExistingReportBucketName="cloudmart-dev-reports" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show Data Stack Failure Events
        if: failure()
        shell: bash
        run: |

          echo "=================================================="
          echo "DATA STACK STATUS"
          echo "=================================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "=================================================="
          echo "DATA STACK EVENTS"
          echo "=================================================="

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      - name: Verify Data Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Data stack is ready."
              ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac

      - name: Show Data Stack Outputs
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


  # ==========================================================
  # 3. IAM STACK
  # ==========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Check IAM Stack
        id: iam_status
        shell: bash
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "IAM Stack Status: $STATUS"

      - name: Delete Failed IAM Stack
        if: steps.iam_status.outputs.status == 'ROLLBACK_COMPLETE'
        run: |

          echo "Deleting IAM stack in ROLLBACK_COMPLETE."

          aws cloudformation delete-stack \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          aws cloudformation wait stack-delete-complete \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

      - name: Deploy IAM Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is ready."
              ;;
            *)
              echo "ERROR: IAM stack is not ready."
              exit 1
              ;;
          esac

      # ------------------------------------------------------
      # GET AUTHORizer ROLE ARN
      # ------------------------------------------------------

      - name: Get Lambda Authorizer Role ARN
        shell: bash
        run: |

          AUTHORIZER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$AUTHORIZER_ROLE" ] || [ "$AUTHORIZER_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing."
            echo "Check cloudformation/iam-stack.yaml."
            exit 1
          fi

          echo "Authorizer role ARN found."

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # CREATE SSM TOKEN
      # ------------------------------------------------------

      - name: Check Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}
        shell: bash
        run: |

          if [ -z "$AUTH_TOKEN" ]; then
            echo "ERROR: CLOUDMART_AUTH_TOKEN secret is missing."
            exit 1
          fi

          echo "Auth token is available."

      - name: Create or Update SSM Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}
        shell: bash
        run: |

          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --value "$AUTH_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"

          echo "SSM auth token created/updated."

      - name: Verify SSM Auth Token
        run: |

          TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/dev/auth/token" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)

          if [ "$TYPE" != "SecureString" ]; then
            echo "ERROR: SSM token is not SecureString."
            exit 1
          fi

          echo "SSM token is ready."

      - name: Show IAM Failure Events
        if: failure()
        shell: bash
        run: |

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # ==========================================================
  # 4. APPLICATION STACK
  # ==========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # GET IAM AUTHORizer ROLE
      # ------------------------------------------------------

      - name: Get Authorizer Role ARN
        shell: bash
        run: |

          AUTHORIZER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$AUTHORIZER_ROLE" ] || [ "$AUTHORIZER_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn not found."
            exit 1
          fi

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # API GATEWAY
      #
      # REQUIRED:
      # Set EXISTING_REST_API_ID as a GitHub Repository Variable
      # ------------------------------------------------------

      - name: Get Existing API Gateway ID
        shell: bash
        env:
          EXISTING_REST_API_ID: ${{ vars.EXISTING_REST_API_ID }}
        run: |

          if [ -z "$EXISTING_REST_API_ID" ]; then
            echo "ERROR: EXISTING_REST_API_ID is not configured."
            echo ""
            echo "Go to:"
            echo "GitHub Repository"
            echo " -> Settings"
            echo " -> Secrets and variables"
            echo " -> Actions"
            echo " -> Variables"
            echo ""
            echo "Create:"
            echo "Name: EXISTING_REST_API_ID"
            echo "Value: your API Gateway REST API ID"
            exit 1
          fi

          if ! printf '%s' "$EXISTING_REST_API_ID" | grep -Eq '^[A-Za-z0-9]+$'; then
            echo "ERROR: EXISTING_REST_API_ID contains invalid characters."
            exit 1
          fi

          echo "EXISTING_REST_API_ID=$EXISTING_REST_API_ID" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # VERIFY API EXISTS
      # ------------------------------------------------------

      - name: Verify API Gateway
        run: |

          aws apigateway get-rest-api \
            --rest-api-id "$EXISTING_REST_API_ID" \
            --region "$AWS_REGION" \
            --query "[id,name]" \
            --output table

          echo "API Gateway REST API verified."

      # ------------------------------------------------------
      # VERIFY SSM
      # ------------------------------------------------------

      - name: Verify SSM Auth Token
        run: |

          TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/dev/auth/token" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)

          if [ "$TYPE" != "SecureString" ]; then
            echo "ERROR: SSM auth token is not SecureString."
            exit 1
          fi

          echo "SSM token verified."

      # ------------------------------------------------------
      # VALIDATE APPLICATION
      # ------------------------------------------------------

      - name: Validate Application Stack
        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

          echo "Application template is valid."

      # ------------------------------------------------------
      # DEPLOY APPLICATION
      # ------------------------------------------------------

      - name: Deploy Application Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              ExistingRestApiId="$EXISTING_REST_API_ID" \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              AuthorizerCacheTTL="300" \
              TokenParameterName="/cloudmart/dev/auth/token" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ------------------------------------------------------
      # SHOW APPLICATION FAILURE
      # ------------------------------------------------------

      - name: Show Application Failure Events
        if: failure()
        shell: bash
        run: |

          echo "=================================================="
          echo "APPLICATION STACK STATUS"
          echo "=================================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "=================================================="
          echo "APPLICATION STACK EVENTS"
          echo "=================================================="

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

      # ------------------------------------------------------
      # VERIFY APPLICATION
      # ------------------------------------------------------

      - name: Verify Application Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Application Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Application stack is ready."
              ;;
            *)
              echo "ERROR: Application stack is not ready."
              exit 1
              ;;
          esac

      # ------------------------------------------------------
      # VERIFY AUTHORIZER LAMBDA
      # ------------------------------------------------------

      - name: Verify Authorizer Lambda
        run: |

          aws lambda get-function \
            --function-name cloudmart-dev-authorizer \
            --region "$AWS_REGION" \
            --query "Configuration.[FunctionName,FunctionArn,Runtime,State]" \
            --output table

          echo "Authorizer Lambda verified."

      # ------------------------------------------------------
      # SHOW APPLICATION OUTPUTS
      # ------------------------------------------------------

      - name: Show Application Outputs
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

          echo ""
          echo "=================================================="
          echo "CLOUDMART DEPLOYMENT COMPLETED"
          echo "=================================================="