name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # =========================================================
  # NETWORK STACK
  # =========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


  # =========================================================
  # DATA STACK
  # =========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Data Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              DBInstanceClass=db.t3.micro \
              DBName=cloudmart \
              AllocatedStorage=20 \
              DBUsername="${{ secrets.CLOUDMART_DB_USERNAME }}" \
              DBPassword="${{ secrets.CLOUDMART_DB_PASSWORD }}" \
              ExistingReportBucketName=cloudmart-dev-reports \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


  # =========================================================
  # IAM STACK
  # =========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Existing IAM Stack
        id: iam_status
        continue-on-error: true
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "IAM Stack Status: $STATUS"

      - name: Delete IAM Stack in ROLLBACK_COMPLETE
        if: steps.iam_status.outputs.status == 'ROLLBACK_COMPLETE'
        run: |
          aws cloudformation delete-stack \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          aws cloudformation wait stack-delete-complete \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      # =====================================================
      # SSM AUTH TOKEN
      # =====================================================

      - name: Verify Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}
        run: |
          if [ -z "$AUTH_TOKEN" ]; then
            echo "ERROR: CLOUDMART_AUTH_TOKEN is missing."
            exit 1
          fi

      - name: Create or Update SSM Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}
        run: |
          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --value "$AUTH_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"


  # =========================================================
  # APPLICATION STACK
  # =========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # =====================================================
      # VERIFY PREVIOUS STACKS
      # =====================================================

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Verify IAM Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      # =====================================================
      # VERIFY GITHUB VARIABLES
      # =====================================================

      - name: Verify Application Configuration
        env:
          ARTIFACT_BUCKET: ${{ vars.CLOUDMART_LAMBDA_ARTIFACT_BUCKET }}
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}
        run: |

          if [ -z "$ARTIFACT_BUCKET" ]; then
            echo "ERROR: CLOUDMART_LAMBDA_ARTIFACT_BUCKET is missing."
            exit 1
          fi

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          echo "Lambda artifact bucket is available."
          echo "Notification email is available."

      # =====================================================
      # VALIDATE APPLICATION STACK
      # =====================================================

      - name: Validate Application Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

      # =====================================================
      # GET NETWORK OUTPUTS
      # =====================================================

      - name: Get Network Outputs
        run: |

          PRIVATE_SUBNET_1=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-PrivateSubnet1Id'].Value" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-PrivateSubnet2Id'].Value" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-LambdaSecurityGroupId'].Value" \
            --output text)

          if [ -z "$PRIVATE_SUBNET_1" ] || [ -z "$PRIVATE_SUBNET_2" ]; then
            echo "ERROR: Private subnet exports were not found."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP" ]; then
            echo "ERROR: Lambda security group export was not found."
            exit 1
          fi

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_1},${PRIVATE_SUBNET_2}" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP}" >> "$GITHUB_ENV"

      # =====================================================
      # GET IAM ROLE OUTPUTS
      # =====================================================

      - name: Get IAM Role Outputs
        run: |

          AUTHORIZER_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-LambdaAuthorizerRoleArn'].Value" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-ProductLambdaRoleArn'].Value" \
            --output text)

          ORDER_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-OrderLambdaRoleArn'].Value" \
            --output text)

          REPORT_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-ReportLambdaRoleArn'].Value" \
            --output text)

          if [ -z "$AUTHORIZER_ROLE" ]; then
            echo "ERROR: Authorizer role export not found."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE" ]; then
            echo "ERROR: Product role export not found."
            exit 1
          fi

          if [ -z "$ORDER_ROLE" ]; then
            echo "ERROR: Order role export not found."
            exit 1
          fi

          if [ -z "$REPORT_ROLE" ]; then
            echo "ERROR: Report role export not found."
            exit 1
          fi

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE_ARN=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE_ARN=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE_ARN=$REPORT_ROLE" >> "$GITHUB_ENV"

      # =====================================================
      # GET REPORT BUCKET
      # =====================================================

      - name: Get Report Bucket
        run: |

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue" \
            --output text)

          if [ -z "$REPORT_BUCKET" ]; then
            echo "ERROR: ReportBucketName output was not found."
            exit 1
          fi

          echo "REPORT_BUCKET_NAME=$REPORT_BUCKET" >> "$GITHUB_ENV"

      # =====================================================
      # DEPLOY APPLICATION STACK
      # =====================================================

      - name: Deploy Application Stack
        env:
          ARTIFACT_BUCKET: ${{ vars.CLOUDMART_LAMBDA_ARTIFACT_BUCKET }}
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              LambdaArtifactBucket="$ARTIFACT_BUCKET" \
              AuthorizerCodeKey=dev/lambda/authorizer.zip \
              ProductCodeKey=dev/lambda/product.zip \
              OrderCodeKey=dev/lambda/order-api.zip \
              ReportCodeKey=dev/lambda/report.zip \
              PrivateSubnetIds="$PRIVATE_SUBNET_IDS" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              AuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductRoleArn="$PRODUCT_ROLE_ARN" \
              OrderRoleArn="$ORDER_ROLE_ARN" \
              ReportRoleArn="$REPORT_ROLE_ARN" \
              ReportBucketName="$REPORT_BUCKET_NAME" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Application Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Show Application Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table

      # =====================================================
      # FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show Application Failure Events
        if: failure()
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true