name: Deploy CloudMart Infrastructure


# ==========================================================
# TRIGGERS
# ==========================================================

on:

  push:

    branches:
      - main

    paths:

      - "cloudformation/network-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - ".github/workflows/deploy.yaml"


  workflow_dispatch:


# ==========================================================
# GITHUB PERMISSIONS
# ==========================================================

permissions:

  contents: read


# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================

env:

  AWS_REGION: us-east-1

  ENVIRONMENT: dev


# ==========================================================
# NETWORK STACK
# ==========================================================

jobs:


  deploy-network:

    name: Deploy Network Stack

    runs-on: ubuntu-latest


    steps:


      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ====================================================
      # AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ====================================================
      # VERIFY AWS
      # ====================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ====================================================
      # VALIDATE NETWORK STACK
      # ====================================================

      - name: Validate Network Stack

        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # DEPLOY NETWORK STACK
      # ====================================================

      - name: Deploy Network Stack

        run: |

          echo "=================================================="
          echo "DEPLOYING NETWORK STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --no-fail-on-empty-changeset

          echo "Network stack deployment completed."


      # ====================================================
      # VERIFY NETWORK STACK
      # ====================================================

      - name: Verify Network Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack Status: $STATUS"

          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo "Network stack is ready."

              ;;

            *)

              echo "ERROR: Network stack is not ready."

              exit 1

              ;;

          esac


      # ====================================================
      # SHOW NETWORK OUTPUTS
      # ====================================================

      - name: Show Network Outputs

        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # ====================================================
      # NETWORK FAILURE DETAILS
      # ====================================================

      - name: Network Failure Diagnostics

        if: failure()

        run: |

          echo "=================================================="
          echo "NETWORK STACK FAILURE"
          echo "=================================================="

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true



  # ========================================================
  # IAM STACK
  # ========================================================

  deploy-iam:

    name: Deploy IAM Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network


    steps:


      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ====================================================
      # AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ====================================================
      # VERIFY AWS
      # ====================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ====================================================
      # VALIDATE IAM
      # ====================================================

      - name: Validate IAM Stack

        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # DEPLOY IAM
      # ====================================================

      - name: Deploy IAM Stack

        run: |

          echo "=================================================="
          echo "DEPLOYING IAM STACK"
          echo "=================================================="

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "IAM stack deployment completed."


      # ====================================================
      # VERIFY IAM
      # ====================================================

      - name: Verify IAM Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack Status: $STATUS"

          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo "IAM stack is ready."

              ;;

            *)

              echo "ERROR: IAM stack is not ready."

              exit 1

              ;;

          esac


      # ====================================================
      # SHOW IAM OUTPUTS
      # ====================================================

      - name: Show IAM Outputs

        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # ====================================================
      # IAM FAILURE DETAILS
      # ====================================================

      - name: IAM Failure Diagnostics

        if: failure()

        run: |

          echo "=================================================="
          echo "IAM STACK FAILURE"
          echo "=================================================="

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true



  # ========================================================
  # DATA STACK
  # ========================================================

  deploy-data:

    name: Deploy Data Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-iam


    steps:


      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ====================================================
      # AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ====================================================
      # VERIFY AWS
      # ====================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ====================================================
      # VALIDATE DATA STACK
      # ====================================================

      - name: Validate Data Stack

        run: |

          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # CHECK DB PASSWORD
      # ====================================================

      - name: Validate Database Password

        env:

          DB_PASSWORD:
            ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          if [ -z "$DB_PASSWORD" ]; then

            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."

            exit 1

          fi


          if [ "${#DB_PASSWORD}" -lt 12 ]; then

            echo "ERROR: DB password must contain at least 12 characters."

            exit 1

          fi


          if [ "${#DB_PASSWORD}" -gt 41 ]; then

            echo "ERROR: DB password must contain no more than 41 characters."

            exit 1

          fi


          if printf '%s' "$DB_PASSWORD" | LC_ALL=C grep -q '[^ -~]'; then

            echo "ERROR: DB password contains non-ASCII characters."

            exit 1

          fi


          if printf '%s' "$DB_PASSWORD" | grep -qE '[/@" ]'; then

            echo 'ERROR: DB password cannot contain / @ " or spaces.'

            exit 1

          fi


          echo "Database password validation successful."


      # ====================================================
      # DEPLOY DATA STACK
      # ====================================================

      - name: Deploy Data Stack

        env:

          DB_PASSWORD:
            ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          echo "=================================================="
          echo "DEPLOYING DATA STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName=cloudmart \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
              ExistingReportBucketName="" \
            --no-fail-on-empty-changeset


          echo "Data stack deployment completed."


      # ====================================================
      # VERIFY DATA STACK
      # ====================================================

      - name: Verify Data Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)


          echo "Data Stack Status: $STATUS"


          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo "Data stack is ready."

              ;;

            UPDATE_ROLLBACK_FAILED)

              echo "ERROR: Data stack is in UPDATE_ROLLBACK_FAILED."

              exit 1

              ;;

            ROLLBACK_COMPLETE)

              echo "ERROR: Data stack is in ROLLBACK_COMPLETE."

              exit 1

              ;;

            *)

              echo "ERROR: Data stack is not ready."

              exit 1

              ;;

          esac


      # ====================================================
      # SHOW DATA OUTPUTS
      # ====================================================

      - name: Show Data Outputs

        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # ====================================================
      # DATA FAILURE DETAILS
      # ====================================================

      - name: Data Failure Diagnostics

        if: failure()

        run: |

          echo "=================================================="
          echo "DATA STACK FAILURE"
          echo "=================================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true


          aws cloudformation describe-stack-events \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true



  # ========================================================
  # APPLICATION STACK
  # ========================================================

  deploy-application:

    name: Deploy Application Stack

    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-iam
      - deploy-data


    steps:


      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ====================================================
      # AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v5

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ====================================================
      # VERIFY AWS
      # ====================================================

      - name: Verify AWS identity

        run: |

          aws sts get-caller-identity


      # ====================================================
      # VALIDATE APPLICATION STACK
      # ====================================================

      - name: Validate Application Stack

        run: |

          echo "=================================================="
          echo "VALIDATING APPLICATION STACK"
          echo "=================================================="


          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"


          echo "Application stack validation successful."


      # ====================================================
      # GET IAM AUTHORIZER ROLE
      # ====================================================

      - name: Get Lambda Authorizer Role ARN

        run: |

          AUTHORIZER_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)


          if [ -z "$AUTHORIZER_ROLE_ARN" ] || [ "$AUTHORIZER_ROLE_ARN" = "None" ]; then

            echo "ERROR: LambdaAuthorizerRoleArn output is missing from IAM stack."

            exit 1

          fi


          echo "Lambda Authorizer Role ARN found."


          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE_ARN" >> "$GITHUB_ENV"


      # ====================================================
      # CREATE / UPDATE SSM AUTH TOKEN
      # ====================================================

      - name: Create Authentication Token

        env:

          AUTH_TOKEN:
            ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        run: |

          if [ -z "$AUTH_TOKEN" ]; then

            echo "ERROR: CLOUDMART_AUTH_TOKEN is missing."

            exit 1

          fi


          aws ssm put-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/token" \
            --type "SecureString" \
            --value "$AUTH_TOKEN" \
            --overwrite \
            --region "$AWS_REGION"


          echo "SSM authentication token is ready."


      # ====================================================
      # VERIFY SSM TOKEN
      # ====================================================

      - name: Verify SSM Authentication Token

        run: |

          PARAMETER_TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/${ENVIRONMENT}/auth/token" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)


          echo "SSM Parameter Type: $PARAMETER_TYPE"


          if [ "$PARAMETER_TYPE" != "SecureString" ]; then

            echo "ERROR: Authentication token is not SecureString."

            exit 1

          fi


          echo "SSM authentication token verified."


      # ====================================================
      # DEPLOY APPLICATION STACK
      # ====================================================

      - name: Deploy Application Stack

        run: |

          echo "=================================================="
          echo "DEPLOYING APPLICATION STACK"
          echo "=================================================="


          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              AuthorizerCacheTTL=300 \
              TokenParameterName="/cloudmart/${ENVIRONMENT}/auth/token" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset


          echo "Application stack deployment completed."


      # ====================================================
      # VERIFY APPLICATION STACK
      # ====================================================

      - name: Verify Application Stack

        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)


          echo "Application Stack Status: $STATUS"


          case "$STATUS" in

            CREATE_COMPLETE|UPDATE_COMPLETE)

              echo "Application stack is ready."

              ;;

            UPDATE_ROLLBACK_FAILED)

              echo "ERROR: Application stack is in UPDATE_ROLLBACK_FAILED."

              exit 1

              ;;

            ROLLBACK_COMPLETE)

              echo "ERROR: Application stack is in ROLLBACK_COMPLETE."

              exit 1

              ;;

            *)

              echo "ERROR: Application stack is not ready."

              exit 1

              ;;

          esac


      # ====================================================
      # VERIFY LAMBDA
      # ====================================================

      - name: Verify Authorizer Lambda

        run: |

          LAMBDA_ARN=$(aws lambda get-function \
            --function-name cloudmart-dev-authorizer \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)


          if [ -z "$LAMBDA_ARN" ] || [ "$LAMBDA_ARN" = "None" ]; then

            echo "ERROR: CloudMart authorizer Lambda was not found."

            exit 1

          fi


          echo "Authorizer Lambda:"
          echo "$LAMBDA_ARN"


      # ====================================================
      # SHOW APPLICATION OUTPUTS
      # ====================================================

      - name: Show Application Outputs

        run: |

          echo "=================================================="
          echo "CLOUDMART APPLICATION OUTPUTS"
          echo "=================================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # ====================================================
      # SHOW API URL
      # ====================================================

      - name: Show CloudMart API URL

        run: |

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='RestApiUrl'].OutputValue | [0]" \
            --output text)


          echo ""
          echo "=================================================="
          echo "CLOUDMART API URL"
          echo "=================================================="

          echo "$API_URL"

          echo "=================================================="


      # ====================================================
      # APPLICATION FAILURE DETAILS
      # ====================================================

      - name: Application Failure Diagnostics

        if: failure()

        run: |

          echo "=================================================="
          echo "APPLICATION STACK FAILURE"
          echo "=================================================="


          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true


          echo ""
          echo "=================================================="
          echo "APPLICATION FAILURE EVENTS"
          echo "=================================================="


          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true