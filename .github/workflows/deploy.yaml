name: Deploy CloudMart Infrastructure

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PROJECT_NAME: cloudmart

  NETWORK_STACK_NAME: cloudmart-network-dev
  DATA_STACK_NAME: cloudmart-data-dev
  IAM_STACK_NAME: cloudmart-iam-dev
  APPLICATION_STACK_NAME: cloudmart-application-dev

jobs:

  # ==========================================================
  # 1. DEPLOY NETWORK STACK
  # ==========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Network Stack
        run: |
          set -e

          echo "Validating Network Stack..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

          echo "Network Stack validation successful."

      - name: Deploy Network Stack
        run: |
          set -e

          echo "Deploying Network Stack..."

          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
            --no-fail-on-empty-changeset

          echo "Network Stack deployment successful."


  # ==========================================================
  # 2. DEPLOY DATA STACK
  # ==========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate Data Stack
        run: |
          set -e

          echo "Validating Data Stack..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

          echo "Data Stack validation successful."

      # --------------------------------------------------------
      # DATABASE CREDENTIALS
      # --------------------------------------------------------

      - name: Check database credentials
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -e

          echo "Checking database credentials..."

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          if [ ${#DB_PASSWORD} -lt 12 ]; then
            echo "ERROR: DB_PASSWORD must contain at least 12 characters."
            exit 1
          fi

          # RDS MySQL password restriction:
          # printable ASCII except /, @, ", and spaces
          if [[ "$DB_PASSWORD" =~ [/\@\"\ ] ]]; then
            echo "ERROR: DB_PASSWORD contains an invalid RDS character."
            echo 'Allowed: printable ASCII except /, @, ", and spaces.'
            exit 1
          fi

          echo "Database password is available and valid."

      # --------------------------------------------------------
      # DATABASE USERNAME
      # --------------------------------------------------------

      - name: Set database username
        run: |
          set -e

          DB_USERNAME="cloudmartadmin"

          if [[ ! "$DB_USERNAME" =~ ^[A-Za-z][A-Za-z0-9_]*$ ]]; then
            echo "ERROR: DB_USERNAME is invalid."
            exit 1
          fi

          if [ ${#DB_USERNAME} -gt 16 ]; then
            echo "ERROR: DB_USERNAME cannot exceed 16 characters."
            exit 1
          fi

          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"

          echo "Database username configured."

      - name: Deploy Data Stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -e

          echo "Deploying Data Stack..."

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
              ExistingReportBucketName="" \
            --no-fail-on-empty-changeset

          echo "Data Stack deployment successful."

      # --------------------------------------------------------
      # SHOW DATA OUTPUTS
      # --------------------------------------------------------

      - name: Get Data Stack Outputs
        run: |
          set -e

          echo "Getting Data Stack outputs..."

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          DB_USERNAME=$(aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBUsername'].OutputValue | [0]" \
            --output text)

          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"
          echo "DB Username: $DB_USERNAME"
          echo "Report Bucket: $REPORT_BUCKET"

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DBEndpoint output is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DBPort output is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DBName output is missing."
            exit 1
          fi

          if [ -z "$DB_USERNAME" ] || [ "$DB_USERNAME" = "None" ]; then
            echo "ERROR: DBUsername output is missing."
            exit 1
          fi

          if [ -z "$REPORT_BUCKET" ] || [ "$REPORT_BUCKET" = "None" ]; then
            echo "ERROR: ReportBucketName output is missing."
            exit 1
          fi

          echo "Data Stack outputs verified."


  # ==========================================================
  # 3. DEPLOY IAM STACK
  # ==========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-data

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate IAM Stack
        run: |
          set -e

          echo "Validating IAM Stack..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

          echo "IAM Stack validation successful."

      - name: Deploy IAM Stack
        run: |
          set -e

          echo "Deploying IAM Stack..."

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
            --no-fail-on-empty-changeset

          echo "IAM Stack deployment successful."

      # --------------------------------------------------------
      # GET LAMBDA AUTHORIZER ROLE
      # --------------------------------------------------------

      - name: Get Lambda Authorizer Role ARN
        run: |
          set -e

          echo "Getting Lambda Authorizer IAM Role ARN..."

          AUTHORIZE_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          echo "Lambda Authorizer Role: $AUTHORIZE_ROLE_ARN"

          if [ -z "$AUTHORIZE_ROLE_ARN" ] || [ "$AUTHORIZE_ROLE_ARN" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing."
            exit 1
          fi

          echo "LambdaAuthorizerRoleArn=$AUTHORIZE_ROLE_ARN" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # VERIFY OTHER IAM OUTPUTS
      # --------------------------------------------------------

      - name: Verify IAM Outputs
        run: |
          set -e

          echo "Verifying IAM Stack outputs..."

          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
            --output table

          echo "IAM Stack outputs verified."


  # ==========================================================
  # 4. DEPLOY APPLICATION STACK
  # ==========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-iam

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --------------------------------------------------------
      # CHECK API GATEWAY ID
      # --------------------------------------------------------

      - name: Check Existing REST API ID
        env:
          EXISTING_REST_API_ID: ${{ vars.EXISTING_REST_API_ID }}
        run: |
          set -e

          echo "Checking API Gateway REST API ID..."

          if [ -z "$EXISTING_REST_API_ID" ]; then
            echo "ERROR: EXISTING_REST_API_ID GitHub Repository Variable is missing."
            echo ""
            echo "Create:"
            echo "GitHub -> Settings -> Secrets and variables -> Actions -> Variables"
            echo ""
            echo "Name:"
            echo "EXISTING_REST_API_ID"
            echo ""
            echo "Value:"
            echo "Your API Gateway REST API ID"
            exit 1
          fi

          echo "REST API ID is available."

      # --------------------------------------------------------
      # VALIDATE APPLICATION TEMPLATE
      # --------------------------------------------------------

      - name: Validate Application Stack
        run: |
          set -e

          echo "Validating Application Stack..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

          echo "Application Stack validation successful."

      # --------------------------------------------------------
      # GET IAM ROLE ARN
      # --------------------------------------------------------

      - name: Get Lambda Authorizer Role ARN
        run: |
          set -e

          echo "Getting Lambda Authorizer IAM Role ARN..."

          AUTHORIZE_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          echo "Lambda Authorizer Role: $AUTHORIZE_ROLE_ARN"

          if [ -z "$AUTHORIZE_ROLE_ARN" ] || [ "$AUTHORIZE_ROLE_ARN" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing."
            exit 1
          fi

          echo "AUTHORIZE_ROLE_ARN=$AUTHORIZE_ROLE_ARN" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # DEPLOY APPLICATION STACK
      # --------------------------------------------------------

      - name: Deploy Application Stack
        env:
          EXISTING_REST_API_ID: ${{ vars.EXISTING_REST_API_ID }}
        run: |
          set -e

          echo "Deploying Application Stack..."

          echo ""
          echo "Application Stack parameters:"
          echo "Environment=$ENVIRONMENT"
          echo "ProjectName=$PROJECT_NAME"
          echo "ExistingRestApiId=$EXISTING_REST_API_ID"
          echo "LambdaAuthorizerRoleArn=$AUTHORIZE_ROLE_ARN"
          echo "AuthorizerCacheTTL=300"
          echo "TokenParameterName=/cloudmart/dev/auth/token"
          echo ""

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              ExistingRestApiId="$EXISTING_REST_API_ID" \
              LambdaAuthorizerRoleArn="$AUTHORIZE_ROLE_ARN" \
              AuthorizerCacheTTL="300" \
              TokenParameterName="/cloudmart/dev/auth/token" \
            --no-fail-on-empty-changeset

          echo "Application Stack deployment successful."

      # --------------------------------------------------------
      # VERIFY APPLICATION STACK
      # --------------------------------------------------------

      - name: Verify Application Stack
        run: |
          set -e

          echo "Checking Application Stack status..."

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Application Stack status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Application Stack is healthy."
              ;;
            *)
              echo "ERROR: Application Stack is not healthy."
              exit 1
              ;;
          esac

      # --------------------------------------------------------
      # SHOW APPLICATION OUTPUTS
      # --------------------------------------------------------

      - name: Show Application Outputs
        run: |
          echo "Application Stack Outputs:"

          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[*].[OutputKey,OutputValue]" \
            --output table


  # ==========================================================
  # 5. FINAL VERIFICATION
  # ==========================================================

  verify-infrastructure:
    name: Verify CloudMart Infrastructure
    runs-on: ubuntu-latest
    needs: deploy-application

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify All Stacks
        run: |
          set -e

          echo "=============================================="
          echo "CloudMart Infrastructure Verification"
          echo "=============================================="

          echo ""
          echo "Network Stack:"
          aws cloudformation describe-stacks \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "Data Stack:"
          aws cloudformation describe-stacks \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "IAM Stack:"
          aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "Application Stack:"
          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "=============================================="
          echo "CloudMart deployment completed."
          echo "=============================================="