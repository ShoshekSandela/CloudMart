name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "database/schema.sql"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT: ${{ vars.CLOUDMART_ENVIRONMENT || 'dev' }}

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-network-${ENVIRONMENT}"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "Network stack status: ${STATUS:-NOT_FOUND}"

          if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            echo "Network stack does not exist. Creating it with the existing GitHub Actions role."

            aws cloudformation deploy \
              --template-file cloudformation/network-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides Environment="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

            echo "Network stack created."
            exit 0
          fi

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is healthy."
              ;;
            UPDATE_ROLLBACK_COMPLETE)
              echo "Network stack is UPDATE_ROLLBACK_COMPLETE."
              echo "Preserving the existing Network stack to protect its exports."
              echo "No Network update will be attempted in this run."
              exit 0
              ;;
            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS|DELETE_IN_PROGRESS)
              echo "ERROR: Network stack is busy: $STATUS"
              exit 1
              ;;
            CREATE_FAILED|UPDATE_ROLLBACK_FAILED|DELETE_FAILED)
              echo "ERROR: Network stack is in failed state: $STATUS"
              exit 1
              ;;
            DELETE_COMPLETE)
              echo "Network stack is deleted. Recreating it."
              aws cloudformation deploy \
                --template-file cloudformation/network-stack.yaml \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --parameter-overrides Environment="$ENVIRONMENT" \
                --capabilities CAPABILITY_NAMED_IAM \
                --no-fail-on-empty-changeset
              ;;
            *)
              echo "ERROR: Unexpected Network stack state: $STATUS"
              exit 1
              ;;
          esac

          echo "Network stack deployment completed."

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Recover failed IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "IAM stack status: ${STACK_STATUS:-NOT_FOUND}"

          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || \
             [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Removing failed/incomplete IAM stack: $STACK_NAME"

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "IAM stack removed."
          fi

      - name: Deploy IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          # IMPORTANT:
          # Do not pass --role-arn here.
          # The existing GitHub Actions OIDC role is managed outside this project.
          # It must deploy the IAM stack that creates/manages the
          # CloudFormation execution role.
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          echo "IAM stack deployment completed."

          IAM_STATUS=$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --region "$AWS_REGION"             --query 'Stacks[0].StackStatus'             --output text)

          case "$IAM_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is healthy: $IAM_STATUS"
              ;;
            *)
              echo "ERROR: IAM stack ended in unexpected state: $IAM_STATUS"
              exit 1
              ;;
          esac

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy data stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_USERNAME" || { echo "CLOUDMART_DB_USERNAME is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "CLOUDMART_DB_PASSWORD is missing"; exit 1; }

          STACK_NAME="cloudmart-data-${ENVIRONMENT}"
          ROLE_NAME="cloudmart-${ENVIRONMENT}-cloudformation-execution-role"

          CFN_ROLE_ARN=$(aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.Arn' --output text)

          # A failed first deployment can leave an empty REVIEW_IN_PROGRESS
          # CloudFormation stack. Remove only that unfinished stack automatically.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Removing unfinished Data stack: $STACK_NAME"
            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Unfinished Data stack removed."
          fi

          # Only remove an orphan auth token parameter when the Data stack
          # does not exist. Never mutate a parameter owned by CloudFormation.
          AUTH_PARAMETER="/cloudmart/${ENVIRONMENT}/auth/token"

          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            if aws ssm get-parameter               --name "$AUTH_PARAMETER"               --region "$AWS_REGION"               >/dev/null 2>&1; then

              echo "Removing orphan auth token parameter: $AUTH_PARAMETER"

              aws ssm delete-parameter                 --name "$AUTH_PARAMETER"                 --region "$AWS_REGION"

              echo "Orphan auth token parameter removed."
            fi
          fi

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_ROLE_ARN" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName=cloudmart \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure SNS recovery permissions
        run: |
          set -euo pipefail

          cat > /tmp/cloudmart-sns-recovery-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CloudMartSNSRecoveryDiscovery",
                "Effect": "Allow",
                "Action": [
                  "sns:ListTopics",
                  "sns:ListSubscriptionsByTopic"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF

          aws iam put-role-policy             --role-name "CloudMart-GitHubActions-Role"             --policy-name "CloudMartSNSRecoveryDiscovery"             --policy-document file:///tmp/cloudmart-sns-recovery-policy.json

          echo "SNS recovery permissions are available."

      - name: Prepare schema
        run: cp database/schema.sql lambdas/product/schema.sql
      - name: Validate application template
        run: sam validate --template-file cloudformation/application-stack.yaml
      - name: Clean previous SAM build
        run: rm -rf .aws-sam

      - name: Build application
        run: |
          set -euo pipefail
          sam build --template-file cloudformation/application-stack.yaml
      - name: Deploy application
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }
          test -n "$CUSTOMER_EMAIL" || { echo "CLOUDMART_CUSTOMER_EMAIL is missing"; exit 1; }

          CFN_ROLE_ARN=$(aws iam get-role \
            --role-name "cloudmart-${ENVIRONMENT}-cloudformation-execution-role" \
            --query 'Role.Arn' --output text)

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          # CloudFormation cannot update a stack while it is being deleted.
          # Wait for an in-progress deletion instead of starting another
          # deployment against the same stack.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          # A previous failed CREATE can leave the stack in REVIEW_IN_PROGRESS.
          # Remove that unfinished stack before starting SNS recovery.
          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Application stack is REVIEW_IN_PROGRESS: $STACK_NAME"
            echo "Deleting the unfinished stack..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Unfinished Application stack removed."
            STACK_STATUS=""
          fi

          if [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "Application stack is currently being deleted: $STACK_NAME"
            echo "Waiting for CloudFormation deletion to complete..."

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Application stack deletion completed."
            STACK_STATUS=""
          fi

          # A ROLLBACK_COMPLETE stack cannot be updated.
          # Delete only the failed application stack so it can be recreated.
          # SNS topics/subscriptions use Retain, so they are preserved and
          # automatically re-adopted below before the full SAM deployment.
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Application stack is ROLLBACK_COMPLETE: $STACK_NAME"
            echo "Deleting the failed stack..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Failed Application stack removed."
            STACK_STATUS=""
          fi

          # Recover retained SNS resources through CloudFormation.
          # This prevents ResourceExistenceCheck failures after a failed
          # Application stack was deleted while SNS resources were retained.
          LOW_STOCK_TOPIC_NAME="cloudmart-${ENVIRONMENT}-low-stock"
          CUSTOMER_TOPIC_NAME="cloudmart-${ENVIRONMENT}-customer-order-notifications"

          LOW_STOCK_TOPIC_ARN=""
          CUSTOMER_TOPIC_ARN=""

          # Only recover retained SNS resources when the Application stack
          # does not exist. Healthy Application stacks already own these resources.
          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            LOW_STOCK_TOPIC_ARN=$(aws sns list-topics \
              --region "$AWS_REGION" \
              --query 'Topics[].TopicArn' \
              --output text | tr '\t' '\n' | grep -E ":${LOW_STOCK_TOPIC_NAME}$" | head -n 1 || true)

            CUSTOMER_TOPIC_ARN=$(aws sns list-topics \
              --region "$AWS_REGION" \
              --query 'Topics[].TopicArn' \
              --output text | tr '\t' '\n' | grep -E ":${CUSTOMER_TOPIC_NAME}$" | head -n 1 || true)
          fi

          rm -f /tmp/cloudmart-sns-recovery.yaml /tmp/cloudmart-sns-import.json

          if [ -n "$LOW_STOCK_TOPIC_ARN" ] || [ -n "$CUSTOMER_TOPIC_ARN" ]; then
            echo "Retained CloudMart SNS topic(s) detected."
            echo "Re-adopting retained SNS resources into CloudFormation."

            cat > /tmp/cloudmart-sns-recovery.yaml <<'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Resources:
          EOF

            if [ -n "$LOW_STOCK_TOPIC_ARN" ]; then
              cat >> /tmp/cloudmart-sns-recovery.yaml <<EOF
          CloudMartLowStockTopic:
            Type: AWS::SNS::Topic
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TopicName: "$LOW_STOCK_TOPIC_NAME"
          EOF
            fi

            if [ -n "$CUSTOMER_TOPIC_ARN" ]; then
              cat >> /tmp/cloudmart-sns-recovery.yaml <<EOF
          CloudMartCustomerOrderNotificationTopic:
            Type: AWS::SNS::Topic
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TopicName: "$CUSTOMER_TOPIC_NAME"
          EOF
            fi

            LOW_STOCK_SUBSCRIPTION_ARN=""
            CUSTOMER_SUBSCRIPTION_ARN=""

            if [ -n "$LOW_STOCK_TOPIC_ARN" ]; then
              LOW_STOCK_SUBSCRIPTION_ARN=$(aws sns list-subscriptions-by-topic \
                --topic-arn "$LOW_STOCK_TOPIC_ARN" \
                --region "$AWS_REGION" \
                --output json | jq -r --arg endpoint "$ADMIN_EMAIL" \
                  '.Subscriptions[]? | select(.Protocol=="email" and .Endpoint==$endpoint and .SubscriptionArn!="PendingConfirmation") | .SubscriptionArn' \
                  | head -n 1 || true)
            fi

            if [ -n "$CUSTOMER_TOPIC_ARN" ]; then
              CUSTOMER_SUBSCRIPTION_ARN=$(aws sns list-subscriptions-by-topic \
                --topic-arn "$CUSTOMER_TOPIC_ARN" \
                --region "$AWS_REGION" \
                --output json | jq -r --arg endpoint "$CUSTOMER_EMAIL" \
                  '.Subscriptions[]? | select(.Protocol=="email" and .Endpoint==$endpoint and .SubscriptionArn!="PendingConfirmation") | .SubscriptionArn' \
                  | head -n 1 || true)
            fi

            if [ -n "$LOW_STOCK_SUBSCRIPTION_ARN" ]; then
              cat >> /tmp/cloudmart-sns-recovery.yaml <<EOF
          CloudMartLowStockEmailSubscription:
            Type: AWS::SNS::Subscription
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TopicArn: "$LOW_STOCK_TOPIC_ARN"
              Protocol: email
              Endpoint: "$ADMIN_EMAIL"
          EOF
            fi

            if [ -n "$CUSTOMER_SUBSCRIPTION_ARN" ]; then
              cat >> /tmp/cloudmart-sns-recovery.yaml <<EOF
          CloudMartCustomerOrderNotificationSubscription:
            Type: AWS::SNS::Subscription
            DeletionPolicy: Retain
            UpdateReplacePolicy: Retain
            Properties:
              TopicArn: "$CUSTOMER_TOPIC_ARN"
              Protocol: email
              Endpoint: "$CUSTOMER_EMAIL"
          EOF
            fi

            jq -n \
              --arg lowTopic "$LOW_STOCK_TOPIC_NAME" \
              --arg lowSub "$LOW_STOCK_SUBSCRIPTION_ARN" \
              --arg customerTopic "$CUSTOMER_TOPIC_NAME" \
              --arg customerSub "$CUSTOMER_SUBSCRIPTION_ARN" \
              --arg lowTopicArn "$LOW_STOCK_TOPIC_ARN" \
              --arg customerTopicArn "$CUSTOMER_TOPIC_ARN" \
              '[
                (if $lowTopicArn != "" then {
                  ResourceType:"AWS::SNS::Topic",
                  LogicalResourceId:"CloudMartLowStockTopic",
                  ResourceIdentifier:{TopicName:$lowTopic}
                } else empty end),
                (if $lowSub != "" then {
                  ResourceType:"AWS::SNS::Subscription",
                  LogicalResourceId:"CloudMartLowStockEmailSubscription",
                  ResourceIdentifier:{SubscriptionArn:$lowSub}
                } else empty end),
                (if $customerTopicArn != "" then {
                  ResourceType:"AWS::SNS::Topic",
                  LogicalResourceId:"CloudMartCustomerOrderNotificationTopic",
                  ResourceIdentifier:{TopicName:$customerTopic}
                } else empty end),
                (if $customerSub != "" then {
                  ResourceType:"AWS::SNS::Subscription",
                  LogicalResourceId:"CloudMartCustomerOrderNotificationSubscription",
                  ResourceIdentifier:{SubscriptionArn:$customerSub}
                } else empty end)
              ]' > /tmp/cloudmart-sns-import.json

            IMPORT_COUNT=$(jq 'length' /tmp/cloudmart-sns-import.json)

            if [ "$IMPORT_COUNT" -gt 0 ]; then
              echo "Importing $IMPORT_COUNT retained SNS resource(s)."

              RECOVERY_CHANGESET="cloudmart-sns-recovery-${GITHUB_RUN_ID}"

              # IMPORT creates the new CloudFormation stack from the
              # already-existing SNS resources. No SNS resource is recreated.
              aws cloudformation create-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$RECOVERY_CHANGESET" \
                --change-set-type CREATE \
                --template-body file:///tmp/cloudmart-sns-recovery.yaml \
                --resources-to-import file:///tmp/cloudmart-sns-import.json \
                --role-arn "$CFN_ROLE_ARN" \
                --capabilities CAPABILITY_NAMED_IAM \
                --region "$AWS_REGION"

              aws cloudformation wait change-set-create-complete \
                --stack-name "$STACK_NAME" \
                --change-set-name "$RECOVERY_CHANGESET" \
                --region "$AWS_REGION"

              aws cloudformation execute-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$RECOVERY_CHANGESET" \
                --region "$AWS_REGION"

              aws cloudformation wait stack-import-complete \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"

              echo "Retained SNS resources successfully re-adopted."
            fi
          fi

          # SAM updates the recovered stack or creates a new stack when no
          # previous CloudFormation stack exists.
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_ROLE_ARN" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              AuthorizerCacheTTL=0 \
              NotificationEmail="$ADMIN_EMAIL" \
              CustomerEmail="$CUSTOMER_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}" \
              EC2InstanceType=t3.micro

           APP_STATUS=$(aws cloudformation describe-stacks \
             --stack-name "$STACK_NAME" \
             --region "$AWS_REGION" \
             --query 'Stacks[0].StackStatus' \
             --output text)

           case "$APP_STATUS" in
             CREATE_COMPLETE|UPDATE_COMPLETE)
               echo "Application stack is healthy: $APP_STATUS"
               ;;
             *)
               echo "ERROR: Application stack ended in unexpected state: $APP_STATUS"
               exit 1
               ;;
           esac

  initialize:
    name: Initialize CloudMart
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize database
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-product" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_database"}' \
            /tmp/db.json
          jq -e '.statusCode == 200' /tmp/db.json >/dev/null
          rm -f /tmp/db.json
          echo "Database initialization completed successfully."
      - name: Initialize authentication tokens
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-authorizer" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_tokens"}' \
            /tmp/auth.json
          jq -e '.statusCode == 200' /tmp/auth.json >/dev/null
          rm -f /tmp/auth.json
          echo "Authentication tokens initialized successfully."
