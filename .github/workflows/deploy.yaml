name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "database/schema.sql"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ vars.CLOUDMART_ENVIRONMENT || 'dev' }}

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate and deploy network
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://cloudformation/network-stack.yaml --region "$AWS_REGION"
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "cloudmart-network-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate and deploy IAM
        run: |
          set -euo pipefail
          aws cloudformation validate-template --template-body file://cloudformation/iam-stack.yaml --region "$AWS_REGION"
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "cloudmart-iam-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment="$ENVIRONMENT" GitHubRepository="ShoshekSandela/CloudMart" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          aws cloudformation describe-stacks --stack-name "cloudmart-iam-${ENVIRONMENT}" --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='GitHubActionsRoleArn'].OutputValue | [0]" --output text

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate and deploy data
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_USERNAME" || { echo "CLOUDMART_DB_USERNAME is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "CLOUDMART_DB_PASSWORD is missing"; exit 1; }
          aws cloudformation validate-template --template-body file://cloudformation/data-stack.yaml --region "$AWS_REGION"
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "cloudmart-data-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --parameter-overrides Environment="$ENVIRONMENT" DBName=cloudmart DBInstanceClass=db.t3.micro AllocatedStorage=20 DBUsername="$DB_USERNAME" DBPassword="$DB_PASSWORD" ExistingReportBucketName="cloudmart-${ENVIRONMENT}-reports" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs:
      - deploy-data
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Reset imported or failed Application Stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"
          LOW_TOPIC_NAME="cloudmart-${ENVIRONMENT}-low-stock"
          CUSTOMER_TOPIC_NAME="cloudmart-${ENVIRONMENT}-customer-order-notifications"

          echo "Checking Application stack status..."

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          echo "Application stack status: $STATUS"

          case "$STATUS" in
            IMPORT_COMPLETE|ROLLBACK_COMPLETE|UPDATE_ROLLBACK_COMPLETE|CREATE_FAILED|REVIEW_IN_PROGRESS)
              echo "Removing stale Application stack: $STATUS"
              aws cloudformation delete-stack \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"

              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"
              ;;
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Application stack is healthy. It will be updated normally."
              ;;
            NOT_FOUND|DELETE_COMPLETE)
              echo "Application stack is absent. Continuing with a clean create."
              ;;
            DELETE_IN_PROGRESS)
              echo "Application stack is already deleting. Waiting..."
              aws cloudformation wait stack-delete-complete \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION"
              ;;
            *)
              echo "ERROR: Application stack is in an unexpected state: $STATUS"
              exit 1
              ;;
          esac

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          AWS_PARTITION=$(aws sts get-caller-identity --query Arn --output text | cut -d: -f2)
          export ACCOUNT_ID AWS_PARTITION AWS_REGION

          delete_topic_and_subscriptions() {
            local topic_name="$1"
            local topic_arn

            topic_arn=$(aws sns list-topics \
              --region "$AWS_REGION" \
              --query "Topics[?TopicArn == 'arn:${AWS_PARTITION}:sns:${AWS_REGION}:${ACCOUNT_ID}:${topic_name}'].TopicArn | [0]" \
              --output text 2>/dev/null || echo "None")

            if [ -z "$topic_arn" ] || [ "$topic_arn" = "None" ]; then
              echo "No existing SNS topic found: $topic_name"
              return 0
            fi

            echo "Cleaning existing SNS topic: $topic_name"

            mapfile -t subscriptions < <(aws sns list-subscriptions-by-topic \
              --topic-arn "$topic_arn" \
              --region "$AWS_REGION" \
              --query "Subscriptions[].SubscriptionArn" \
              --output text | tr '\t' '\n' | sed '/^$/d')

            for subscription_arn in "${subscriptions[@]}"; do
              if [ -n "$subscription_arn" ] && [ "$subscription_arn" != "None" ]; then
                aws sns unsubscribe \
                  --subscription-arn "$subscription_arn" \
                  --region "$AWS_REGION" || true
              fi
            done

            aws sns delete-topic \
              --topic-arn "$topic_arn" \
              --region "$AWS_REGION"
          }

          delete_topic_and_subscriptions "$LOW_TOPIC_NAME"
          delete_topic_and_subscriptions "$CUSTOMER_TOPIC_NAME"

          echo "Application stack reset completed. Next SAM deployment can create the stack normally."

      - name: Prepare schema
        run: cp database/schema.sql lambdas/product/schema.sql
      - name: Validate application
        run: sam validate --template-file cloudformation/application-stack.yaml
      - name: Build application
        run: sam build --template-file cloudformation/application-stack.yaml
      - name: Deploy application
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
          CUSTOMER_EMAIL: ${{ vars.CLOUDMART_CUSTOMER_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }
          test -n "$CUSTOMER_EMAIL" || { echo "CLOUDMART_CUSTOMER_EMAIL is missing"; exit 1; }
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "cloudmart-application-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              AuthorizerCacheTTL=0 \
              NotificationEmail="$ADMIN_EMAIL" \
              CustomerEmail="$CUSTOMER_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}" \
              EC2InstanceType=t3.micro

  initialize:
    name: Initialize CloudMart
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize database
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "cloudmart-${ENVIRONMENT}-product" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"initialize_database"}' /tmp/db.json
          cat /tmp/db.json
          jq -e '.statusCode == 200' /tmp/db.json >/dev/null
      - name: Initialize authentication tokens
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "cloudmart-${ENVIRONMENT}-authorizer" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"initialize_tokens"}' /tmp/auth.json
          cat /tmp/auth.json
          jq -e '.statusCode == 200' /tmp/auth.json >/dev/null
      - name: Synchronize configured customer
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "cloudmart-${ENVIRONMENT}-order" --region "$AWS_REGION" --cli-binary-format raw-in-base64-out --payload '{"action":"sync_configured_customer"}' /tmp/customer.json
          cat /tmp/customer.json
          jq -e '.statusCode == 200' /tmp/customer.json >/dev/null
