name: CloudMart Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambda/**"
      - ".github/workflows/deploy.yaml"

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PROJECT_NAME: cloudmart

jobs:

  # ==========================================================
  # 1. NETWORK STACK
  # ==========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS OIDC LOGIN
      # ------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: CloudMartGitHubActions

      # ------------------------------------------------------
      # CHECK AWS
      # ------------------------------------------------------

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # VALIDATE NETWORK TEMPLATE
      # ------------------------------------------------------

      - name: Validate Network Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      # ------------------------------------------------------
      # DEPLOY NETWORK
      # ------------------------------------------------------

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ------------------------------------------------------
      # SHOW NETWORK OUTPUTS
      # ------------------------------------------------------

      - name: Show Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs"


  # ==========================================================
  # 2. DATA STACK
  # ==========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS OIDC LOGIN
      # ------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: CloudMartGitHubActions

      # ------------------------------------------------------
      # CHECK AWS
      # ------------------------------------------------------

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # CHECK DATABASE PASSWORD
      # ------------------------------------------------------

      - name: Check Database Password
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD secret is missing."
            echo "Create it under:"
            echo "Repository Settings -> Secrets and variables -> Actions -> Secrets"
            exit 1
          fi

          echo "Database password is available."

      # ------------------------------------------------------
      # VALIDATE DATA TEMPLATE
      # ------------------------------------------------------

      - name: Validate Data Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      # ------------------------------------------------------
      # CHECK EXISTING DATA STACK
      # ------------------------------------------------------

      - name: Check Data Stack
        id: data_stack
        run: |
          if aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" >/dev/null 2>&1; then

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Data stack already exists."

          else

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Data stack does not exist."

          fi

      # ------------------------------------------------------
      # DEPLOY DATA STACK
      #
      # IMPORTANT:
      # Do NOT change DBInstanceIdentifier in the template
      # during normal updates.
      # ------------------------------------------------------

      - name: Deploy Data Stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
              ExistingReportBucketName="cloudmart-dev-reports" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ------------------------------------------------------
      # GET DATABASE OUTPUTS
      # ------------------------------------------------------

      - name: Get Database Outputs
        run: |

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          DB_USERNAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBUsername'].OutputValue | [0]" \
            --output text)

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=$REPORT_BUCKET" >> "$GITHUB_ENV"

          echo "Database endpoint: $DB_HOST"
          echo "Database port: $DB_PORT"
          echo "Database name: $DB_NAME"
          echo "Database username: $DB_USERNAME"
          echo "Report bucket: $REPORT_BUCKET"


  # ==========================================================
  # 3. IAM STACK
  # ==========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS OIDC LOGIN
      # ------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: CloudMartGitHubActions

      # ------------------------------------------------------
      # CHECK AWS
      # ------------------------------------------------------

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # VALIDATE IAM TEMPLATE
      # ------------------------------------------------------

      - name: Validate IAM Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      # ------------------------------------------------------
      # DEPLOY IAM
      # ------------------------------------------------------

      - name: Deploy IAM Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ------------------------------------------------------
      # GET IAM OUTPUTS
      # ------------------------------------------------------

      - name: Get IAM Outputs
        run: |

          AUTHORIZER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaProductRoleArn'].OutputValue | [0]" \
            --output text)

          ORDER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaOrderRoleArn'].OutputValue | [0]" \
            --output text)

          REPORT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaReportRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$AUTHORIZER_ROLE" ] || [ "$AUTHORIZER_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing."
            exit 1
          fi

          echo "Authorizer role exists."

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE_ARN=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE_ARN=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE_ARN=$REPORT_ROLE" >> "$GITHUB_ENV"


  # ==========================================================
  # 4. APPLICATION STACK
  # ==========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs:
      - deploy-data
      - deploy-iam

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # AWS OIDC LOGIN
      # ------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: CloudMartGitHubActions

      # ------------------------------------------------------
      # CHECK AWS
      # ------------------------------------------------------

      - name: Check AWS Identity
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------
      # GET NETWORK OUTPUTS
      # ------------------------------------------------------

      - name: Get Network Outputs
        run: |

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='VPCId'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_1=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET_1=$PRIVATE_SUBNET_1" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET_2=$PRIVATE_SUBNET_2" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP=$LAMBDA_SECURITY_GROUP" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # GET DATABASE OUTPUTS
      # ------------------------------------------------------

      - name: Get Database Outputs
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          DB_USERNAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBUsername'].OutputValue | [0]" \
            --output text)

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=$REPORT_BUCKET" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # GET IAM OUTPUTS AGAIN
      #
      # Jobs do NOT share GITHUB_ENV.
      # Therefore retrieve them again here.
      # ------------------------------------------------------

      - name: Get IAM Outputs
        run: |

          AUTHORIZER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaProductRoleArn'].OutputValue | [0]" \
            --output text)

          ORDER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaOrderRoleArn'].OutputValue | [0]" \
            --output text)

          REPORT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaReportRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$AUTHORIZER_ROLE" ] || [ "$AUTHORIZER_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn is missing."
            exit 1
          fi

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE_ARN=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE_ARN=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE_ARN=$REPORT_ROLE" >> "$GITHUB_ENV"

      # ------------------------------------------------------
      # GET API GATEWAY REST API
      #
      # If your API Gateway stack already creates the API,
      # retrieve it here.
      # ------------------------------------------------------

      - name: Get Existing REST API
        run: |

          EXISTING_REST_API_ID=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-${ENVIRONMENT}-RestApiId'].Value | [0]" \
            --output text)

          if [ -z "$EXISTING_REST_API_ID" ] || [ "$EXISTING_REST_API_ID" = "None" ]; then

            echo "ERROR: CloudMart-${ENVIRONMENT}-RestApiId export was not found."
            echo ""
            echo "Your API Gateway stack must export the existing REST API ID."
            echo "Expected export name:"
            echo "CloudMart-${ENVIRONMENT}-RestApiId"

            exit 1
          fi

          echo "EXISTING_REST_API_ID=$EXISTING_REST_API_ID" >> "$GITHUB_ENV"

          echo "Existing REST API: $EXISTING_REST_API_ID"

      # ------------------------------------------------------
      # VALIDATE APPLICATION TEMPLATE
      # ------------------------------------------------------

      - name: Validate Application Template
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

      # ------------------------------------------------------
      # DEPLOY APPLICATION STACK
      # ------------------------------------------------------

      - name: Deploy Application Stack
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: NOTIFICATION_EMAIL secret is missing."
            exit 1
          fi

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              PrivateSubnetIds="$PRIVATE_SUBNET_1,$PRIVATE_SUBNET_2" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP" \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductRoleArn="$PRODUCT_ROLE_ARN" \
              OrderRoleArn="$ORDER_ROLE_ARN" \
              ReportRoleArn="$REPORT_ROLE_ARN" \
              ReportBucketName="$REPORT_BUCKET" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
              DBHost="$DB_HOST" \
              DBPort="$DB_PORT" \
              DBName="$DB_NAME" \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              ExistingRestApiId="$EXISTING_REST_API_ID" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      # ------------------------------------------------------
      # APPLICATION OUTPUTS
      # ------------------------------------------------------

      - name: Show Application Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs"


  # ==========================================================
  # 5. FINAL PIPELINE CHECK
  # ==========================================================

  deployment-complete:
    name: CloudMart Deployment Complete
    runs-on: ubuntu-latest

    needs:
      - deploy-network
      - deploy-data
      - deploy-iam
      - deploy-application

    steps:

      - name: Deployment Complete
        run: |
          echo "=============================================="
          echo "CloudMart deployment completed successfully."
          echo "=============================================="
          echo "Environment: dev"
          echo "Region: us-east-1"
          echo "Stacks:"
          echo "  - cloudmart-network-dev"
          echo "  - cloudmart-data-dev"
          echo "  - cloudmart-iam-dev"
          echo "  - cloudmart-application-dev"
          echo "=============================================="