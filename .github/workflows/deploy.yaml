name: Test AWS Access

 
on:

  workflow_dispatch:

 
permissions:

  id-token: write

  contents: read

 
jobs:

  test:

    runs-on: ubuntu-latest

 
    steps:

      - uses: actions/checkout@v4

 
      - uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ap-south-1

 
      - run: aws sts get-caller-identity
 
