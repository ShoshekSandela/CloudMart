name: CloudMart Deployment Pipeline

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambdas/**"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PROJECT_NAME: cloudmart


# ==========================================================
# JOB
# ==========================================================

jobs:

  deploy:

    name: Deploy CloudMart Infrastructure

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # AWS CREDENTIALS
      # ======================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: CloudMartGitHubActions


      # ======================================================
      # VERIFY AWS
      # ======================================================

      - name: Verify AWS connection
        run: |
          set -e

          echo "=========================================="
          echo "AWS ACCOUNT"
          echo "=========================================="

          aws sts get-caller-identity

          echo ""
          echo "Region: $AWS_REGION"
          echo "Environment: $ENVIRONMENT"


      # ======================================================
      # VALIDATE TEMPLATES
      # ======================================================

      - name: Validate CloudFormation templates
        run: |
          set -e

          echo "=========================================="
          echo "VALIDATING CLOUDFORMATION TEMPLATES"
          echo "=========================================="

          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

          echo "Network stack validation passed."

          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

          echo "Data stack validation passed."

          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

          echo "IAM stack validation passed."

          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"

          echo "Application stack validation passed."


      # ======================================================
      # CHECK DATABASE PASSWORD
      # ======================================================

      - name: Validate database credentials
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING DATABASE CREDENTIALS"
          echo "=========================================="

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: DB_PASSWORD GitHub Secret is missing."
            echo ""
            echo "Create:"
            echo "Repository Settings"
            echo "-> Secrets and variables"
            echo "-> Actions"
            echo "-> New repository secret"
            echo ""
            echo "Name: DB_PASSWORD"
            exit 1
          fi

          echo "Database password is available."

          PASSWORD_LENGTH=${#DB_PASSWORD}

          if [ "$PASSWORD_LENGTH" -lt 12 ]; then
            echo "ERROR: DB_PASSWORD must be at least 12 characters."
            exit 1
          fi

          if [ "$PASSWORD_LENGTH" -gt 41 ]; then
            echo "ERROR: DB_PASSWORD cannot exceed 41 characters."
            exit 1
          fi

          if [[ "$DB_PASSWORD" == *"/"* ]]; then
            echo 'ERROR: DB_PASSWORD contains "/" which RDS does not allow.'
            exit 1
          fi

          if [[ "$DB_PASSWORD" == *"@"* ]]; then
            echo 'ERROR: DB_PASSWORD contains "@" which RDS does not allow.'
            exit 1
          fi

          if [[ "$DB_PASSWORD" == *'"'* ]]; then
            echo 'ERROR: DB_PASSWORD contains a double quote which RDS does not allow.'
            exit 1
          fi

          if [[ "$DB_PASSWORD" == *" "* ]]; then
            echo "ERROR: DB_PASSWORD contains a space which RDS does not allow."
            exit 1
          fi

          echo "Database password validation passed."


      # ======================================================
      # DEPLOY NETWORK STACK
      # ======================================================

      - name: Deploy Network Stack
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DEPLOYING NETWORK STACK"
          echo "=========================================="

          set +e

          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "NETWORK STACK FAILED"
            echo "=========================================="

            aws cloudformation describe-stack-events \
              --stack-name cloudmart-network-dev \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            exit "$EXIT_CODE"
          fi

          echo "Network stack deployment completed."


      # ======================================================
      # GET NETWORK OUTPUTS
      # ======================================================

      - name: Get Network Stack outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GETTING NETWORK OUTPUTS"
          echo "=========================================="

          PRIVATE_SUBNET_1=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue | [0]" \
            --output text)

          RDS_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='RDSSecurityGroupId'].OutputValue | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='VPCId'].OutputValue | [0]" \
            --output text)

          if [ -z "$PRIVATE_SUBNET_1" ] || [ "$PRIVATE_SUBNET_1" = "None" ]; then
            echo "ERROR: PrivateSubnet1Id output is missing."
            exit 1
          fi

          if [ -z "$PRIVATE_SUBNET_2" ] || [ "$PRIVATE_SUBNET_2" = "None" ]; then
            echo "ERROR: PrivateSubnet2Id output is missing."
            exit 1
          fi

          if [ -z "$RDS_SECURITY_GROUP" ] || [ "$RDS_SECURITY_GROUP" = "None" ]; then
            echo "ERROR: RDSSecurityGroupId output is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP" ] || [ "$LAMBDA_SECURITY_GROUP" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId output is missing."
            exit 1
          fi

          echo "Private subnet 1: $PRIVATE_SUBNET_1"
          echo "Private subnet 2: $PRIVATE_SUBNET_2"
          echo "RDS security group: $RDS_SECURITY_GROUP"
          echo "Lambda security group: $LAMBDA_SECURITY_GROUP"
          echo "VPC: $VPC_ID"

          echo "PRIVATE_SUBNET_1=$PRIVATE_SUBNET_1" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET_2=$PRIVATE_SUBNET_2" >> "$GITHUB_ENV"
          echo "RDS_SECURITY_GROUP=$RDS_SECURITY_GROUP" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP=$LAMBDA_SECURITY_GROUP" >> "$GITHUB_ENV"
          echo "VPC_ID=$VPC_ID" >> "$GITHUB_ENV"


      # ======================================================
      # DEPLOY DATA STACK
      # ======================================================

      - name: Deploy Data Stack
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          set -e

          echo "=========================================="
          echo "DEPLOYING DATA STACK"
          echo "=========================================="

          set +e

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20" \
              ExistingReportBucketName="cloudmart-dev-reports" \
            --no-fail-on-empty-changeset

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "DATA STACK FAILED"
            echo "=========================================="

            aws cloudformation describe-stacks \
              --stack-name cloudmart-data-dev \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text || true

            echo ""
            echo "CloudFormation failure events:"

            aws cloudformation describe-stack-events \
              --stack-name cloudmart-data-dev \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            exit "$EXIT_CODE"
          fi

          echo "Data stack deployment completed."


      # ======================================================
      # GET DATA OUTPUTS
      # ======================================================

      - name: Get Data Stack outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GETTING DATA STACK OUTPUTS"
          echo "=========================================="

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          DB_USERNAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBUsername'].OutputValue | [0]" \
            --output text)

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          DB_INSTANCE_IDENTIFIER=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBInstanceIdentifier'].OutputValue | [0]" \
            --output text)

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DBEndpoint output is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DBPort output is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DBName output is missing."
            exit 1
          fi

          if [ -z "$DB_USERNAME" ] || [ "$DB_USERNAME" = "None" ]; then
            echo "ERROR: DBUsername output is missing."
            exit 1
          fi

          if [ -z "$REPORT_BUCKET" ] || [ "$REPORT_BUCKET" = "None" ]; then
            echo "ERROR: ReportBucketName output is missing."
            exit 1
          fi

          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"
          echo "DB Username: $DB_USERNAME"
          echo "Report Bucket: $REPORT_BUCKET"
          echo "DB Instance: $DB_INSTANCE_IDENTIFIER"

          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_USERNAME=$DB_USERNAME" >> "$GITHUB_ENV"
          echo "REPORT_BUCKET=$REPORT_BUCKET" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_IDENTIFIER=$DB_INSTANCE_IDENTIFIER" >> "$GITHUB_ENV"


      # ======================================================
      # DEPLOY IAM STACK
      # ======================================================

      - name: Deploy IAM Stack
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DEPLOYING IAM STACK"
          echo "=========================================="

          set +e

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              VPCId="$VPC_ID" \
              ReportBucketName="$REPORT_BUCKET" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "IAM STACK FAILED"
            echo "=========================================="

            aws cloudformation describe-stack-events \
              --stack-name cloudmart-iam-dev \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            exit "$EXIT_CODE"
          fi

          echo "IAM stack deployment completed."


      # ======================================================
      # GET IAM OUTPUTS
      # ======================================================

      - name: Get IAM Stack outputs
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GETTING IAM STACK OUTPUTS"
          echo "=========================================="

          AUTHORIZE_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaProductRoleArn'].OutputValue | [0]" \
            --output text)

          ORDER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaOrderRoleArn'].OutputValue | [0]" \
            --output text)

          REPORT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaReportRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$AUTHORIZE_ROLE" ] || [ "$AUTHORIZE_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing from IAM stack."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: LambdaProductRoleArn output is missing from IAM stack."
            exit 1
          fi

          if [ -z "$ORDER_ROLE" ] || [ "$ORDER_ROLE" = "None" ]; then
            echo "ERROR: LambdaOrderRoleArn output is missing from IAM stack."
            exit 1
          fi

          if [ -z "$REPORT_ROLE" ] || [ "$REPORT_ROLE" = "None" ]; then
            echo "ERROR: LambdaReportRoleArn output is missing from IAM stack."
            exit 1
          fi

          echo "Lambda Authorizer Role: $AUTHORIZE_ROLE"
          echo "Lambda Product Role: $PRODUCT_ROLE"
          echo "Lambda Order Role: $ORDER_ROLE"
          echo "Lambda Report Role: $REPORT_ROLE"

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZE_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE_ARN=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE_ARN=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE_ARN=$REPORT_ROLE" >> "$GITHUB_ENV"


      # ======================================================
      # GET API GATEWAY ID
      # ======================================================

      - name: Get existing API Gateway ID
        shell: bash
        env:
          EXISTING_REST_API_ID: ${{ vars.EXISTING_REST_API_ID }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECKING API GATEWAY"
          echo "=========================================="

          if [ -z "$EXISTING_REST_API_ID" ]; then

            echo "ERROR: EXISTING_REST_API_ID is not configured."
            echo ""
            echo "Create this GitHub Actions Repository Variable:"
            echo ""
            echo "Repository"
            echo "-> Settings"
            echo "-> Secrets and variables"
            echo "-> Actions"
            echo "-> Variables"
            echo "-> New repository variable"
            echo ""
            echo "Name:"
            echo "EXISTING_REST_API_ID"
            echo ""
            echo "Value:"
            echo "Your API Gateway REST API ID"
            echo ""
            echo "Example:"
            echo "abc123xyz"
            echo ""
            exit 1
          fi

          echo "API Gateway REST API ID: $EXISTING_REST_API_ID"

          echo "EXISTING_REST_API_ID=$EXISTING_REST_API_ID" >> "$GITHUB_ENV"


      # ======================================================
      # DEPLOY APPLICATION STACK
      # ======================================================

      - name: Deploy Application Stack
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ vars.NOTIFICATION_EMAIL }}
          REPORT_SCHEDULE_EXPRESSION: ${{ vars.REPORT_SCHEDULE_EXPRESSION }}
        run: |
          set -e

          echo "=========================================="
          echo "DEPLOYING APPLICATION STACK"
          echo "=========================================="

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: NOTIFICATION_EMAIL GitHub Variable is missing."
            exit 1
          fi

          if [ -z "$REPORT_SCHEDULE_EXPRESSION" ]; then
            REPORT_SCHEDULE_EXPRESSION="rate(1 day)"
          fi

          echo "Notification email configured."
          echo "Report schedule: $REPORT_SCHEDULE_EXPRESSION"

          set +e

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              ExistingRestApiId="$EXISTING_REST_API_ID" \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductRoleArn="$PRODUCT_ROLE_ARN" \
              OrderRoleArn="$ORDER_ROLE_ARN" \
              ReportRoleArn="$REPORT_ROLE_ARN" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP" \
              PrivateSubnetIds="$PRIVATE_SUBNET_1,$PRIVATE_SUBNET_2" \
              ReportBucketName="$REPORT_BUCKET" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
              ReportScheduleExpression="$REPORT_SCHEDULE_EXPRESSION" \
              DBHost="$DB_HOST" \
              DBPort="$DB_PORT" \
              DBName="$DB_NAME" \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

          EXIT_CODE=$?

          set -e

          if [ "$EXIT_CODE" -ne 0 ]; then

            echo ""
            echo "=========================================="
            echo "APPLICATION STACK FAILED"
            echo "=========================================="

            aws cloudformation describe-stacks \
              --stack-name cloudmart-application-dev \
              --region "$AWS_REGION" \
              --query "Stacks[0].StackStatus" \
              --output text || true

            echo ""
            echo "CloudFormation failure events:"

            aws cloudformation describe-stack-events \
              --stack-name cloudmart-application-dev \
              --region "$AWS_REGION" \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            exit "$EXIT_CODE"
          fi

          echo ""
          echo "=========================================="
          echo "APPLICATION STACK DEPLOYED"
          echo "=========================================="


      # ======================================================
      # FINAL OUTPUT
      # ======================================================

      - name: Show CloudMart stack status
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "CLOUDMART DEPLOYMENT SUMMARY"
          echo "=========================================="

          echo ""
          echo "Network Stack:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "Data Stack:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "IAM Stack:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "Application Stack:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

          echo ""
          echo "=========================================="
          echo "CLOUDMART PIPELINE COMPLETED"
          echo "=========================================="