name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambdas/**"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # =========================================================
  # NETWORK STACK
  # =========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


  # =========================================================
  # DATA STACK
  # =========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Data Stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          echo "Database credentials are available."

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              DBInstanceClass=db.t3.micro \
              DBName=cloudmart \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              ExistingReportBucketName=cloudmart-dev-reports \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


  # =========================================================
  # IAM STACK
  # =========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Existing IAM Stack
        id: iam_status
        continue-on-error: true
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "IAM Stack Status: $STATUS"

      - name: Delete IAM Stack in ROLLBACK_COMPLETE
        if: steps.iam_status.outputs.status == 'ROLLBACK_COMPLETE'
        run: |

          echo "IAM stack is in ROLLBACK_COMPLETE."
          echo "Deleting failed IAM stack..."

          aws cloudformation delete-stack \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          aws cloudformation wait stack-delete-complete \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          echo "IAM stack deleted."

      - name: Deploy IAM Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify IAM Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # SSM AUTH TOKEN
      # =====================================================

      - name: Verify Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        run: |

          if [ -z "$AUTH_TOKEN" ]; then
            echo "ERROR: CLOUDMART_AUTH_TOKEN is missing."
            exit 1
          fi

          echo "Auth token is available."

      - name: Create or Update SSM Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        run: |

          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --value "$AUTH_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"

          echo "SSM auth token created/updated."


  # =========================================================
  # APPLICATION STACK
  # =========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      # =====================================================
      # SETUP SAM
      # =====================================================

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2


      # =====================================================
      # AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # =====================================================
      # VERIFY PREVIOUS STACKS
      # =====================================================

      - name: Verify Network Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Verify Data Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Verify IAM Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # NOTIFICATION EMAIL
      # =====================================================

      - name: Verify Notification Email
        env:
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}

        run: |

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          echo "Notification email is available."


      # =====================================================
      # VALIDATE APPLICATION STACK
      # =====================================================

      - name: Validate Application Stack
        run: |

          sam validate \
            --template-file cloudformation/application-stack.yaml


      # =====================================================
      # GET NETWORK OUTPUTS
      # =====================================================

      - name: Get Network Outputs
        shell: bash
        run: |

          echo "Getting Network outputs..."

          PRIVATE_SUBNET_1=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-PrivateSubnet1Id'].Value | [0]" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-PrivateSubnet2Id'].Value | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-LambdaSecurityGroupId'].Value | [0]" \
            --output text)

          echo "Private Subnet 1: $PRIVATE_SUBNET_1"
          echo "Private Subnet 2: $PRIVATE_SUBNET_2"
          echo "Lambda Security Group: $LAMBDA_SECURITY_GROUP"

          if [ -z "$PRIVATE_SUBNET_1" ] || [ "$PRIVATE_SUBNET_1" = "None" ]; then
            echo "ERROR: Private subnet 1 export was not found."
            exit 1
          fi

          if [ -z "$PRIVATE_SUBNET_2" ] || [ "$PRIVATE_SUBNET_2" = "None" ]; then
            echo "ERROR: Private subnet 2 export was not found."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP" ] || [ "$LAMBDA_SECURITY_GROUP" = "None" ]; then
            echo "ERROR: Lambda security group export was not found."
            exit 1
          fi

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_1},${PRIVATE_SUBNET_2}" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP}" >> "$GITHUB_ENV"

          echo "Network outputs loaded successfully."


      # =========================================================
      # GET LAMBDA IAM ROLE ARNS
      # =========================================================

      - name: Get Lambda IAM role ARNs
        shell: bash
        run: |

          echo "Getting Lambda IAM role ARNs..."

          AUTHORIZE_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-LambdaAuthorizerRoleArn'].Value | [0]" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-ProductLambdaRoleArn'].Value | [0]" \
            --output text)

          ORDER_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-OrderLambdaRoleArn'].Value | [0]" \
            --output text)

          REPORT_ROLE=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-ReportLambdaRoleArn'].Value | [0]" \
            --output text)

          echo "Authorizer Role: $AUTHORIZE_ROLE"
          echo "Product Role: $PRODUCT_ROLE"
          echo "Order Role: $ORDER_ROLE"
          echo "Report Role: $REPORT_ROLE"

          if [ -z "$AUTHORIZE_ROLE" ] || [ "$AUTHORIZE_ROLE" = "None" ]; then
            echo "ERROR: Authorizer Lambda role export is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: Product Lambda role export is missing."
            exit 1
          fi

          if [ -z "$ORDER_ROLE" ] || [ "$ORDER_ROLE" = "None" ]; then
            echo "ERROR: Order Lambda role export is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE" ] || [ "$REPORT_ROLE" = "None" ]; then
            echo "ERROR: Report Lambda role export is missing."
            exit 1
          fi

          echo "AUTHORIZE_ROLE=$AUTHORIZE_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE=$REPORT_ROLE" >> "$GITHUB_ENV"

          echo "All Lambda IAM role ARNs found successfully."


      # =====================================================
      # GET REPORT BUCKET
      # =====================================================

      - name: Get Report Bucket
        shell: bash
        run: |

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          if [ -z "$REPORT_BUCKET" ] || [ "$REPORT_BUCKET" = "None" ]; then
            echo "ERROR: ReportBucketName output was not found."
            exit 1
          fi

          echo "Report Bucket: $REPORT_BUCKET"

          echo "REPORT_BUCKET_NAME=$REPORT_BUCKET" >> "$GITHUB_ENV"


      # =====================================================
      # GET DATABASE OUTPUTS
      # =====================================================

      - name: Get Database Outputs
        shell: bash
        run: |

          echo "Getting database outputs..."

          DB_HOST=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-DBEndpoint'].Value | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-DBPort'].Value | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation list-exports \
            --region "$AWS_REGION" \
            --query "Exports[?Name=='CloudMart-dev-DBName'].Value | [0]" \
            --output text)

          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DB endpoint export was not found."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DB port export was not found."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DB name export was not found."
            exit 1
          fi

          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"

          echo "Database outputs loaded successfully."


      # =====================================================
      # SAM BUILD
      # =====================================================

      - name: Build Lambda application
        run: |

          echo "Building Lambda application..."

          sam build \
            --template-file cloudformation/application-stack.yaml

          echo "SAM build completed."


      # =====================================================
      # SAM DEPLOY
      # =====================================================

      - name: Deploy Application Stack
        env:
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        shell: bash
        run: |

          echo "Preparing Application Stack deployment..."

          # ---------------------------------------------------
          # MAP ROLE VARIABLES
          # ---------------------------------------------------

          AUTHORIZER_ROLE_ARN="$AUTHORIZE_ROLE"
          PRODUCT_ROLE_ARN="$PRODUCT_ROLE"
          ORDER_ROLE_ARN="$ORDER_ROLE"
          REPORT_ROLE_ARN="$REPORT_ROLE"

          # ---------------------------------------------------
          # VALIDATE VALUES
          # ---------------------------------------------------

          if [ -z "$PRIVATE_SUBNET_IDS" ]; then
            echo "ERROR: PRIVATE_SUBNET_IDS is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP_ID" ]; then
            echo "ERROR: LAMBDA_SECURITY_GROUP_ID is missing."
            exit 1
          fi

          if [ -z "$AUTHORIZER_ROLE_ARN" ] || [ "$AUTHORIZER_ROLE_ARN" = "None" ]; then
            echo "ERROR: Authorizer Lambda role is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE_ARN" ] || [ "$PRODUCT_ROLE_ARN" = "None" ]; then
            echo "ERROR: Product Lambda role is missing."
            exit 1
          fi

          if [ -z "$ORDER_ROLE_ARN" ] || [ "$ORDER_ROLE_ARN" = "None" ]; then
            echo "ERROR: Order Lambda role is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE_ARN" ] || [ "$REPORT_ROLE_ARN" = "None" ]; then
            echo "ERROR: Report Lambda role is missing."
            exit 1
          fi

          if [ -z "$REPORT_BUCKET_NAME" ]; then
            echo "ERROR: REPORT_BUCKET_NAME is missing."
            exit 1
          fi

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ]; then
            echo "ERROR: DB_HOST is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ]; then
            echo "ERROR: DB_PORT is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ]; then
            echo "ERROR: DB_NAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          echo "All Application Stack values are available."

          # ---------------------------------------------------
          # DEPLOY APPLICATION STACK
          # ---------------------------------------------------

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=dev \
              PrivateSubnetIds="$PRIVATE_SUBNET_IDS" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              AuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductRoleArn="$PRODUCT_ROLE_ARN" \
              OrderRoleArn="$ORDER_ROLE_ARN" \
              ReportRoleArn="$REPORT_ROLE_ARN" \
              ReportBucketName="$REPORT_BUCKET_NAME" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
              ReportScheduleExpression="rate(1 day)" \
              DBHost="$DB_HOST" \
              DBPort="$DB_PORT" \
              DBName="$DB_NAME" \
              DBUsername="cloudmartadmin" \
              DBPassword="$DB_PASSWORD"

          echo "Application Stack deployment completed successfully."


      # =====================================================
      # VERIFY APPLICATION STACK
      # =====================================================

      - name: Verify Application Stack
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text


      # =====================================================
      # SHOW APPLICATION OUTPUTS
      # =====================================================

      - name: Show Application Outputs
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # =====================================================
      # FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show Application Failure Events
        if: failure()
        run: |

          echo "Checking Application Stack status..."

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "Application Stack failure events:"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true