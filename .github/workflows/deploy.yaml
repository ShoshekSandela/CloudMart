name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "database/schema.sql"
      - "dashboard/**"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Load CloudMart deployment parameters
        env:
          CLOUDMART_ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="cloudformation/parameters.json"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found."; exit 1; }

          ENVIRONMENT=$(jq -r '.Environment' "$CONFIG_FILE")
          PROJECT_NAME=$(jq -r '.ProjectName' "$CONFIG_FILE")
          NOTIFICATION_EMAIL="${CLOUDMART_ADMIN_EMAIL:-}"
          VPC_CIDR=$(jq -r '.VpcCidr' "$CONFIG_FILE")
          PUBLIC_SUBNET_CIDR=$(jq -r '.PublicSubnetCidr' "$CONFIG_FILE")
          MONITORING_PUBLIC_SUBNET_CIDR=$(jq -r '.MonitoringPublicSubnetCidr' "$CONFIG_FILE")
          PRIVATE_SUBNET1_CIDR=$(jq -r '.PrivateSubnet1Cidr' "$CONFIG_FILE")
          PRIVATE_SUBNET2_CIDR=$(jq -r '.PrivateSubnet2Cidr' "$CONFIG_FILE")
          DB_NAME=$(jq -r '.DBName' "$CONFIG_FILE")
          DB_INSTANCE_CLASS=$(jq -r '.DBInstanceClass' "$CONFIG_FILE")
          ALLOCATED_STORAGE=$(jq -r '.AllocatedStorage' "$CONFIG_FILE")
          AUTHORIZER_CACHE_TTL=$(jq -r '.AuthorizerCacheTTL' "$CONFIG_FILE")
          EC2_INSTANCE_TYPE=$(jq -r '.EC2InstanceType' "$CONFIG_FILE")
          DASHBOARD_SOURCE_PREFIX=$(jq -r '.DashboardSourcePrefix' "$CONFIG_FILE")

          for value in "$ENVIRONMENT" "$PROJECT_NAME" "$NOTIFICATION_EMAIL" "$VPC_CIDR"                        "$PUBLIC_SUBNET_CIDR" "$MONITORING_PUBLIC_SUBNET_CIDR"                        "$PRIVATE_SUBNET1_CIDR" "$PRIVATE_SUBNET2_CIDR" "$DB_NAME"                        "$DB_INSTANCE_CLASS" "$ALLOCATED_STORAGE" "$AUTHORIZER_CACHE_TTL"                        "$EC2_INSTANCE_TYPE" "$DASHBOARD_SOURCE_PREFIX"; do
            test -n "$value" || { echo "ERROR: parameters.json contains an empty required value."; exit 1; }
          done

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=$NOTIFICATION_EMAIL" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "PUBLIC_SUBNET_CIDR=$PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "MONITORING_PUBLIC_SUBNET_CIDR=$MONITORING_PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET1_CIDR=$PRIVATE_SUBNET1_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET2_CIDR=$PRIVATE_SUBNET2_CIDR" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_CLASS=$DB_INSTANCE_CLASS" >> "$GITHUB_ENV"
          echo "ALLOCATED_STORAGE=$ALLOCATED_STORAGE" >> "$GITHUB_ENV"
          echo "AUTHORIZER_CACHE_TTL=$AUTHORIZER_CACHE_TTL" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_TYPE=$EC2_INSTANCE_TYPE" >> "$GITHUB_ENV"
          echo "DASHBOARD_SOURCE_PREFIX=$DASHBOARD_SOURCE_PREFIX" >> "$GITHUB_ENV"

          echo "Loaded CloudMart configuration for environment: $ENVIRONMENT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-network-${ENVIRONMENT}"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "Network stack status: ${STATUS:-NOT_FOUND}"

          if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            echo "Network stack does not exist. Creating it with the existing GitHub Actions role."

            aws cloudformation deploy \
              --template-file cloudformation/network-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides \
                Environment="$ENVIRONMENT" \
                VpcCidr="$VPC_CIDR" \
                PublicSubnetCidr="$PUBLIC_SUBNET_CIDR" \
                MonitoringPublicSubnetCidr="$MONITORING_PUBLIC_SUBNET_CIDR" \
                PrivateSubnet1Cidr="$PRIVATE_SUBNET1_CIDR" \
                PrivateSubnet2Cidr="$PRIVATE_SUBNET2_CIDR" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

            echo "Network stack created."
            exit 0
          fi

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack exists. Deploying the current network template."

              aws cloudformation deploy \
                --template-file cloudformation/network-stack.yaml \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --parameter-overrides \
                Environment="$ENVIRONMENT" \
                VpcCidr="$VPC_CIDR" \
                PublicSubnetCidr="$PUBLIC_SUBNET_CIDR" \
                MonitoringPublicSubnetCidr="$MONITORING_PUBLIC_SUBNET_CIDR" \
                PrivateSubnet1Cidr="$PRIVATE_SUBNET1_CIDR" \
                PrivateSubnet2Cidr="$PRIVATE_SUBNET2_CIDR" \
                --capabilities CAPABILITY_NAMED_IAM \
                --no-fail-on-empty-changeset
              ;;

            UPDATE_ROLLBACK_COMPLETE)
              echo "Network stack previously rolled back successfully."
              echo "No automatic deletion will be performed."
              echo "Proceeding with the requested network update."
              aws cloudformation deploy \
                --template-file cloudformation/network-stack.yaml \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --parameter-overrides \
                  Environment="$ENVIRONMENT" \
                  VpcCidr="$VPC_CIDR" \
                  PublicSubnetCidr="$PUBLIC_SUBNET_CIDR" \
                  MonitoringPublicSubnetCidr="$MONITORING_PUBLIC_SUBNET_CIDR" \
                  PrivateSubnet1Cidr="$PRIVATE_SUBNET1_CIDR" \
                  PrivateSubnet2Cidr="$PRIVATE_SUBNET2_CIDR" \
                --capabilities CAPABILITY_NAMED_IAM \
                --no-fail-on-empty-changeset
              ;;

            ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS|ROLLBACK_FAILED|UPDATE_ROLLBACK_FAILED)
              echo "============================================================"
              echo "ERROR: Network stack is in an active/failed rollback state: $STATUS"
              echo "Stack: $STACK_NAME"
              echo "NO AUTOMATIC DELETION OR RECOVERY WILL BE PERFORMED."
              echo "Inspect CloudFormation and resolve the stack manually."
              echo "After resolving the stack, run the workflow again."
              echo "============================================================"
              exit 1
              ;;

            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|DELETE_IN_PROGRESS)
              echo "ERROR: Network stack is busy: $STATUS"
              echo "Wait for the current CloudFormation operation to finish."
              exit 1
              ;;

            CREATE_FAILED|DELETE_FAILED)
              echo "ERROR: Network stack is in failed state: $STATUS"
              echo "Please manually inspect the stack before retrying."
              exit 1
              ;;

            *)
              echo "ERROR: Unexpected Network stack state: $STATUS"
              exit 1
              ;;
          esac

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v5

      - name: Load CloudMart deployment parameters
        env:
          CLOUDMART_ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="cloudformation/parameters.json"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found."; exit 1; }

          ENVIRONMENT=$(jq -r '.Environment' "$CONFIG_FILE")
          PROJECT_NAME=$(jq -r '.ProjectName' "$CONFIG_FILE")
          NOTIFICATION_EMAIL="${CLOUDMART_ADMIN_EMAIL:-}"
          VPC_CIDR=$(jq -r '.VpcCidr' "$CONFIG_FILE")
          PUBLIC_SUBNET_CIDR=$(jq -r '.PublicSubnetCidr' "$CONFIG_FILE")
          MONITORING_PUBLIC_SUBNET_CIDR=$(jq -r '.MonitoringPublicSubnetCidr' "$CONFIG_FILE")
          PRIVATE_SUBNET1_CIDR=$(jq -r '.PrivateSubnet1Cidr' "$CONFIG_FILE")
          PRIVATE_SUBNET2_CIDR=$(jq -r '.PrivateSubnet2Cidr' "$CONFIG_FILE")
          DB_NAME=$(jq -r '.DBName' "$CONFIG_FILE")
          DB_INSTANCE_CLASS=$(jq -r '.DBInstanceClass' "$CONFIG_FILE")
          ALLOCATED_STORAGE=$(jq -r '.AllocatedStorage' "$CONFIG_FILE")
          AUTHORIZER_CACHE_TTL=$(jq -r '.AuthorizerCacheTTL' "$CONFIG_FILE")
          EC2_INSTANCE_TYPE=$(jq -r '.EC2InstanceType' "$CONFIG_FILE")
          DASHBOARD_SOURCE_PREFIX=$(jq -r '.DashboardSourcePrefix' "$CONFIG_FILE")

          for value in "$ENVIRONMENT" "$PROJECT_NAME" "$NOTIFICATION_EMAIL" "$VPC_CIDR"                        "$PUBLIC_SUBNET_CIDR" "$MONITORING_PUBLIC_SUBNET_CIDR"                        "$PRIVATE_SUBNET1_CIDR" "$PRIVATE_SUBNET2_CIDR" "$DB_NAME"                        "$DB_INSTANCE_CLASS" "$ALLOCATED_STORAGE" "$AUTHORIZER_CACHE_TTL"                        "$EC2_INSTANCE_TYPE" "$DASHBOARD_SOURCE_PREFIX"; do
            test -n "$value" || { echo "ERROR: parameters.json contains an empty required value."; exit 1; }
          done

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=$NOTIFICATION_EMAIL" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "PUBLIC_SUBNET_CIDR=$PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "MONITORING_PUBLIC_SUBNET_CIDR=$MONITORING_PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET1_CIDR=$PRIVATE_SUBNET1_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET2_CIDR=$PRIVATE_SUBNET2_CIDR" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_CLASS=$DB_INSTANCE_CLASS" >> "$GITHUB_ENV"
          echo "ALLOCATED_STORAGE=$ALLOCATED_STORAGE" >> "$GITHUB_ENV"
          echo "AUTHORIZER_CACHE_TTL=$AUTHORIZER_CACHE_TTL" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_TYPE=$EC2_INSTANCE_TYPE" >> "$GITHUB_ENV"
          echo "DASHBOARD_SOURCE_PREFIX=$DASHBOARD_SOURCE_PREFIX" >> "$GITHUB_ENV"

          echo "Loaded CloudMart configuration for environment: $ENVIRONMENT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

    
      - name: Deploy IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "IAM stack status: ${STACK_STATUS:-NOT_FOUND}"

          if [[ "$STACK_STATUS" == ROLLBACK_* || "$STACK_STATUS" == UPDATE_ROLLBACK_* ]]; then
            echo "============================================================"
            echo "ERROR: IAM stack is in rollback state: $STACK_STATUS"
            echo "Stack: $STACK_NAME"
            echo "No automatic deletion or recovery will be performed."
            echo "Please manually inspect and recover/delete the stack."
            echo "After resolving the stack, run the workflow again."
            echo "============================================================"
            exit 1
          fi

          # The GitHub Actions role is pre-existing and is only updated by
          # this stack. EC2 lifecycle permissions are defined without a
          # hard-coded instance ARN because CloudFormation may replace the
          # Operations EC2 instance during a later monitoring deployment.
          IAM_CREATE_PARAMETERS=(
            "ParameterKey=ProjectName,ParameterValue=$PROJECT_NAME"
            "ParameterKey=Environment,ParameterValue=$ENVIRONMENT"
            "ParameterKey=GitHubActionsRoleName,ParameterValue=${AWS_ROLE_ARN##*/}"
          )
          IAM_DEPLOY_PARAMETERS=(
            "ProjectName=$PROJECT_NAME"
            "Environment=$ENVIRONMENT"
            "GitHubActionsRoleName=${AWS_ROLE_ARN##*/}"
          )

          # No Bootstrap resources are created here.
          # The existing GitHub Actions OIDC role remains external to CloudMart.
          #
          # CREATE:
          #   Use a CREATE change set with --import-existing-resources so that
          #   pre-existing CloudMart IAM resources can be adopted.
          #
          # EXISTING STACK:
          #   Use "cloudformation deploy" for a normal update. This is important
          #   because create-change-set returns FAILED when there are no changes.
          #   --no-fail-on-empty-changeset makes an already-up-to-date IAM stack
          #   succeed instead of failing the GitHub Actions job.

          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            echo "IAM stack does not exist. Creating and adopting existing IAM resources."

            CHANGE_SET_NAME="cloudmart-iam-${ENVIRONMENT}-$(date +%s)"

            aws cloudformation create-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --change-set-type CREATE \
              --template-body file://cloudformation/iam-stack.yaml \
              --parameters "${IAM_CREATE_PARAMETERS[@]}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --import-existing-resources \
              --region "$AWS_REGION"

            aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation execute-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

          elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || \
               [ "$STACK_STATUS" = "UPDATE_COMPLETE" ]; then

            echo "IAM stack already exists. Performing normal CloudFormation update."

            aws cloudformation deploy \
              --template-file cloudformation/iam-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides "${IAM_DEPLOY_PARAMETERS[@]}" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

          else
            echo "ERROR: IAM stack is in unsupported/busy state: $STACK_STATUS"
            exit 1
          fi

          IAM_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          case "$IAM_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is healthy: $IAM_STATUS"
              ;;
            *)
              echo "ERROR: IAM stack ended in unexpected state: $IAM_STATUS"
              exit 1
              ;;
          esac


  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5

      - name: Load CloudMart deployment parameters
        env:
          CLOUDMART_ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="cloudformation/parameters.json"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found."; exit 1; }

          ENVIRONMENT=$(jq -r '.Environment' "$CONFIG_FILE")
          PROJECT_NAME=$(jq -r '.ProjectName' "$CONFIG_FILE")
          NOTIFICATION_EMAIL="${CLOUDMART_ADMIN_EMAIL:-}"
          VPC_CIDR=$(jq -r '.VpcCidr' "$CONFIG_FILE")
          PUBLIC_SUBNET_CIDR=$(jq -r '.PublicSubnetCidr' "$CONFIG_FILE")
          MONITORING_PUBLIC_SUBNET_CIDR=$(jq -r '.MonitoringPublicSubnetCidr' "$CONFIG_FILE")
          PRIVATE_SUBNET1_CIDR=$(jq -r '.PrivateSubnet1Cidr' "$CONFIG_FILE")
          PRIVATE_SUBNET2_CIDR=$(jq -r '.PrivateSubnet2Cidr' "$CONFIG_FILE")
          DB_NAME=$(jq -r '.DBName' "$CONFIG_FILE")
          DB_INSTANCE_CLASS=$(jq -r '.DBInstanceClass' "$CONFIG_FILE")
          ALLOCATED_STORAGE=$(jq -r '.AllocatedStorage' "$CONFIG_FILE")
          AUTHORIZER_CACHE_TTL=$(jq -r '.AuthorizerCacheTTL' "$CONFIG_FILE")
          EC2_INSTANCE_TYPE=$(jq -r '.EC2InstanceType' "$CONFIG_FILE")
          DASHBOARD_SOURCE_PREFIX=$(jq -r '.DashboardSourcePrefix' "$CONFIG_FILE")

          for value in "$ENVIRONMENT" "$PROJECT_NAME" "$NOTIFICATION_EMAIL" "$VPC_CIDR"                        "$PUBLIC_SUBNET_CIDR" "$MONITORING_PUBLIC_SUBNET_CIDR"                        "$PRIVATE_SUBNET1_CIDR" "$PRIVATE_SUBNET2_CIDR" "$DB_NAME"                        "$DB_INSTANCE_CLASS" "$ALLOCATED_STORAGE" "$AUTHORIZER_CACHE_TTL"                        "$EC2_INSTANCE_TYPE" "$DASHBOARD_SOURCE_PREFIX"; do
            test -n "$value" || { echo "ERROR: parameters.json contains an empty required value."; exit 1; }
          done

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=$NOTIFICATION_EMAIL" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "PUBLIC_SUBNET_CIDR=$PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "MONITORING_PUBLIC_SUBNET_CIDR=$MONITORING_PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET1_CIDR=$PRIVATE_SUBNET1_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET2_CIDR=$PRIVATE_SUBNET2_CIDR" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_CLASS=$DB_INSTANCE_CLASS" >> "$GITHUB_ENV"
          echo "ALLOCATED_STORAGE=$ALLOCATED_STORAGE" >> "$GITHUB_ENV"
          echo "AUTHORIZER_CACHE_TTL=$AUTHORIZER_CACHE_TTL" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_TYPE=$EC2_INSTANCE_TYPE" >> "$GITHUB_ENV"
          echo "DASHBOARD_SOURCE_PREFIX=$DASHBOARD_SOURCE_PREFIX" >> "$GITHUB_ENV"

          echo "Loaded CloudMart configuration for environment: $ENVIRONMENT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy data stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_USERNAME" || { echo "CLOUDMART_DB_USERNAME is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "CLOUDMART_DB_PASSWORD is missing"; exit 1; }

          STACK_NAME="cloudmart-data-${ENVIRONMENT}"

          # A failed first deployment can leave an empty REVIEW_IN_PROGRESS
          # CloudFormation stack. Remove only that unfinished stack automatically.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          if [[ "$STACK_STATUS" == ROLLBACK_* || "$STACK_STATUS" == UPDATE_ROLLBACK_* ]]; then
            echo "============================================================"
            echo "ERROR: Data stack is in rollback state: $STACK_STATUS"
            echo "Stack: $STACK_NAME"
            echo "NO AUTOMATIC DELETION WILL BE PERFORMED."
            echo "This stack contains CloudMart data resources."
            echo "Please manually inspect and recover/delete the stack."
            echo "After resolving the stack, run the workflow again."
            echo "============================================================"
            exit 1
          fi

          # REVIEW_IN_PROGRESS means the Data stack creation change set was
          # created but not successfully completed. No deployed data resources
          # are owned by this unfinished stack, so it is safe to remove this
          # CloudFormation shell and retry the real deployment.
          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Data stack is REVIEW_IN_PROGRESS."
            echo "Deleting the unfinished CloudFormation stack before retrying."
            aws cloudformation delete-stack               --stack-name "$STACK_NAME"               --region "$AWS_REGION"

            echo "Waiting for the unfinished Data stack deletion to complete..."
            aws cloudformation wait stack-delete-complete               --stack-name "$STACK_NAME"               --region "$AWS_REGION"

            echo "Unfinished Data stack deleted successfully."
            STACK_STATUS=""
          fi

          # If a previous workflow/manual action already started deletion,
          # wait for it to finish before creating the stack again.
          if [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "Data stack deletion is already in progress."
            echo "Waiting for CloudFormation deletion to complete..."

            aws cloudformation wait stack-delete-complete               --stack-name "$STACK_NAME"               --region "$AWS_REGION"

            echo "Data stack deletion completed."
            STACK_STATUS=""
          fi

          # Authentication token lifecycle is owned exclusively by Token Manager.
          # Never delete or reset /cloudmart/${ENVIRONMENT}/auth/token during a
          # Data stack deployment.
          echo "Authentication token is managed exclusively by Token Manager; preserving it."

          # One-time migration: if the Data stack still owns the legacy
          # AuthTokenParameter resource, first apply Retain to the EXISTING
          # CloudFormation resource without changing any of its properties.
          #
          # This is important because the live parameter is SecureString,
          # while AWS::SSM::Parameter in CloudFormation supports only String
          # and StringList. The migration must therefore not try to update
          # the parameter itself; it only changes the CloudFormation
          # DeletionPolicy to Retain.
          LEGACY_AUTH_RESOURCE=$(aws cloudformation describe-stack-resources \
            --stack-name "$STACK_NAME" \
            --logical-resource-id AuthTokenParameter \
            --region "$AWS_REGION" \
            --query 'StackResources[0].LogicalResourceId' \
            --output text 2>/dev/null || true)

          if [ "$LEGACY_AUTH_RESOURCE" = "AuthTokenParameter" ]; then
            echo "Legacy AuthTokenParameter is still owned by the Data stack."
            echo "Applying Retain to the existing resource without changing its properties."

            # CloudFormation may return the original template as either
            # JSON or YAML text. Handle both formats.
            aws cloudformation get-template \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --template-stage Original \
              --output json > /tmp/cloudmart-data-current.json

            python - <<'PY'
          import json
          import re
          from pathlib import Path

          outer = json.loads(Path("/tmp/cloudmart-data-current.json").read_text())
          template = outer["TemplateBody"]

          # If TemplateBody itself is JSON, modify it structurally.
          try:
              document = json.loads(template)
          except (TypeError, json.JSONDecodeError):
              document = None

          if isinstance(document, dict):
              resources = document.get("Resources", {})
              resource = resources.get("AuthTokenParameter")

              if not isinstance(resource, dict):
                  raise SystemExit(
                      "AuthTokenParameter was not found in the current Data stack template"
                  )

              # Change only CloudFormation deletion behavior. Do not change
              # the existing SSM parameter name, type, value, or properties.
              resource["DeletionPolicy"] = "Retain"
              resource["UpdateReplacePolicy"] = "Retain"

              Path("/tmp/cloudmart-data-retain.json").write_text(
                  json.dumps(document, separators=(",", ":"))
              )
          else:
              # Otherwise the original template is YAML. Add the policies
              # immediately below AuthTokenParameter, preserving the rest.
              source = str(template)

              match = re.search(
                  r"(?m)^(\s*)AuthTokenParameter:\s*$",
                  source,
              )
              if not match:
                  raise SystemExit(
                      "AuthTokenParameter was not found in the current Data stack template"
                  )

              indent = match.group(1)
              insert_at = match.end()

              # Avoid duplicate policy attributes on a retry.
              next_resource = re.search(
                  r"(?m)^\s*[A-Za-z0-9][A-Za-z0-9_-]*:\s*$",
                  source[insert_at:],
              )
              resource_end = (
                  insert_at + next_resource.start()
                  if next_resource
                  else len(source)
              )
              resource_block = source[match.start():resource_end]

              additions = []
              if not re.search(
                  r"(?m)^\s+DeletionPolicy:\s*Retain\s*$",
                  resource_block,
              ):
                  additions.append(f"{indent}  DeletionPolicy: Retain")
              if not re.search(
                  r"(?m)^\s+UpdateReplacePolicy:\s*Retain\s*$",
                  resource_block,
              ):
                  additions.append(f"{indent}  UpdateReplacePolicy: Retain")

              if additions:
                  source = (
                      source[:insert_at]
                      + "\n"
                      + "\n".join(additions)
                      + source[insert_at:]
                  )

              Path("/tmp/cloudmart-data-retain.yaml").write_text(source)
          PY

            if [ -f /tmp/cloudmart-data-retain.json ]; then
              RETAIN_TEMPLATE=/tmp/cloudmart-data-retain.json
            else
              RETAIN_TEMPLATE=/tmp/cloudmart-data-retain.yaml
            fi

            aws cloudformation deploy \
              --template-file "$RETAIN_TEMPLATE" \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides \
                Environment="$ENVIRONMENT" \
                ProjectName="$PROJECT_NAME" \
                DBName="$DB_NAME" \
                DBInstanceClass="$DB_INSTANCE_CLASS" \
                AllocatedStorage="$ALLOCATED_STORAGE" \
                DBUsername="$DB_USERNAME" \
                DBPassword="$DB_PASSWORD" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

            echo "Retain policy applied. The next Data stack update will remove AuthTokenParameter from CloudFormation while preserving the SSM parameter."
          fi

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              DBName="$DB_NAME" \
              DBInstanceClass="$DB_INSTANCE_CLASS" \
              AllocatedStorage="$ALLOCATED_STORAGE" \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v5

      - name: Load CloudMart deployment parameters
        env:
          CLOUDMART_ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="cloudformation/parameters.json"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found."; exit 1; }

          ENVIRONMENT=$(jq -r '.Environment' "$CONFIG_FILE")
          PROJECT_NAME=$(jq -r '.ProjectName' "$CONFIG_FILE")
          NOTIFICATION_EMAIL="${CLOUDMART_ADMIN_EMAIL:-}"
          VPC_CIDR=$(jq -r '.VpcCidr' "$CONFIG_FILE")
          PUBLIC_SUBNET_CIDR=$(jq -r '.PublicSubnetCidr' "$CONFIG_FILE")
          MONITORING_PUBLIC_SUBNET_CIDR=$(jq -r '.MonitoringPublicSubnetCidr' "$CONFIG_FILE")
          PRIVATE_SUBNET1_CIDR=$(jq -r '.PrivateSubnet1Cidr' "$CONFIG_FILE")
          PRIVATE_SUBNET2_CIDR=$(jq -r '.PrivateSubnet2Cidr' "$CONFIG_FILE")
          DB_NAME=$(jq -r '.DBName' "$CONFIG_FILE")
          DB_INSTANCE_CLASS=$(jq -r '.DBInstanceClass' "$CONFIG_FILE")
          ALLOCATED_STORAGE=$(jq -r '.AllocatedStorage' "$CONFIG_FILE")
          AUTHORIZER_CACHE_TTL=$(jq -r '.AuthorizerCacheTTL' "$CONFIG_FILE")
          EC2_INSTANCE_TYPE=$(jq -r '.EC2InstanceType' "$CONFIG_FILE")
          DASHBOARD_SOURCE_PREFIX=$(jq -r '.DashboardSourcePrefix' "$CONFIG_FILE")

          for value in "$ENVIRONMENT" "$PROJECT_NAME" "$NOTIFICATION_EMAIL" "$VPC_CIDR"                        "$PUBLIC_SUBNET_CIDR" "$MONITORING_PUBLIC_SUBNET_CIDR"                        "$PRIVATE_SUBNET1_CIDR" "$PRIVATE_SUBNET2_CIDR" "$DB_NAME"                        "$DB_INSTANCE_CLASS" "$ALLOCATED_STORAGE" "$AUTHORIZER_CACHE_TTL"                        "$EC2_INSTANCE_TYPE" "$DASHBOARD_SOURCE_PREFIX"; do
            test -n "$value" || { echo "ERROR: parameters.json contains an empty required value."; exit 1; }
          done

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=$NOTIFICATION_EMAIL" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "PUBLIC_SUBNET_CIDR=$PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "MONITORING_PUBLIC_SUBNET_CIDR=$MONITORING_PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET1_CIDR=$PRIVATE_SUBNET1_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET2_CIDR=$PRIVATE_SUBNET2_CIDR" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_CLASS=$DB_INSTANCE_CLASS" >> "$GITHUB_ENV"
          echo "ALLOCATED_STORAGE=$ALLOCATED_STORAGE" >> "$GITHUB_ENV"
          echo "AUTHORIZER_CACHE_TTL=$AUTHORIZER_CACHE_TTL" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_TYPE=$EC2_INSTANCE_TYPE" >> "$GITHUB_ENV"
          echo "DASHBOARD_SOURCE_PREFIX=$DASHBOARD_SOURCE_PREFIX" >> "$GITHUB_ENV"

          echo "Loaded CloudMart configuration for environment: $ENVIRONMENT"
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare schema
        run: cp database/schema.sql lambdas/product/schema.sql
      - name: Validate application template
        run: sam validate --template-file cloudformation/application-stack.yaml
      - name: Clean previous SAM build
        run: rm -rf .aws-sam

      - name: Build application
        run: |
          set -euo pipefail
          sam build --template-file cloudformation/application-stack.yaml
      - name: Deploy application
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }


          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          # CloudFormation cannot update a stack while it is being deleted.
          # Wait for an in-progress deletion instead of starting another
          # deployment against the same stack.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)


          if [[ "$STACK_STATUS" == ROLLBACK_* || "$STACK_STATUS" == UPDATE_ROLLBACK_* ]]; then
            echo "============================================================"
            echo "ERROR: Application stack is in rollback state: $STACK_STATUS"
            echo "Stack: $STACK_NAME"
            echo "No automatic recovery or deletion will be performed."
            echo "Please manually inspect and recover/delete the stack."
            echo "After resolving the stack, run the workflow again."
            echo "============================================================"
            exit 1
          fi

          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "============================================================"
            echo "ERROR: Application stack is in REVIEW_IN_PROGRESS."
            echo "Stack: $STACK_NAME"
            echo "No automatic deletion will be performed."
            echo "Please manually inspect/delete the unfinished stack."
            echo "After resolving the stack, run the workflow again."
            echo "============================================================"
            exit 1
          fi


          if [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "Application stack is currently being deleted: $STACK_NAME"
            echo "Waiting for CloudFormation deletion to complete..."

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Application stack deletion completed."
            STACK_STATUS=""
          fi

          # CloudFormation owns the application resources after the stack is created.
          # The EventBridge bus is intentionally external to this stack because it
          # already exists in AWS. CloudFormation manages the rules, but references
          # the existing bus through ExistingEventBusName.
          echo "Running ownership-aware CloudFormation preflight check..."

          EVENT_BUS_NAME="${PROJECT_NAME}-${ENVIRONMENT}-event-bus"
          CONFLICT_FOUND="false"
          EVENT_RULE_CONFLICT_FOUND="false"
          NON_EVENT_CONFLICT_FOUND="false"
          UNMANAGED_EVENT_RULES=()

          resource_is_owned() {
            local resource_id="$1"
            if [ -n "$resource_id" ] && [ "$resource_id" != "None" ] && \
               printf '%s\n' "${STACK_RESOURCE_IDS:-}" | tr '\t' '\n' | grep -Fxq "$resource_id"; then
              return 0
            fi
            return 1
          }

          # Compare the actual CloudFormation physical resource ID.
          # For AWS::Events::Rule, CloudFormation uses:
          #   <event-bus-name>|<rule-name>
          # while events:describe-rule returns only <rule-name>.
          check_existing_resource() {
            local label="$1"
            local resource_id="$2"
            local ownership_id="${3:-$2}"

            if [ -z "$resource_id" ] || [ "$resource_id" = "None" ]; then
              return 0
            fi

            if resource_is_owned "$ownership_id"; then
              echo "OK: $label is already owned by $STACK_NAME: $resource_id"
            else
              echo "ERROR: Existing unmanaged $label found: $resource_id"
              CONFLICT_FOUND="true"

              if [ "$label" = "EventBridge rule" ]; then
                EVENT_RULE_CONFLICT_FOUND="true"
                UNMANAGED_EVENT_RULES+=("$resource_id")
              else
                NON_EVENT_CONFLICT_FOUND="true"
              fi
            fi
          }

          check_orphan_resource() {
            local label="$1"
            local resource_id="$2"

            if [ -z "$resource_id" ] || [ "$resource_id" = "None" ]; then
              return 0
            fi

            if [ "$label" = "EventBridge rule" ]; then
              echo "Existing external EventBridge rule found: $resource_id"
              EVENT_RULE_CONFLICT_FOUND="true"
              UNMANAGED_EVENT_RULES+=("$resource_id")
            else
              echo "ERROR: Existing unmanaged $label found: $resource_id"
              CONFLICT_FOUND="true"
              NON_EVENT_CONFLICT_FOUND="true"
            fi
          }

          # The EventBridge bus itself is deliberately NOT treated as a conflict.
          # It is a pre-existing shared resource and is passed to CloudFormation
          # as ExistingEventBusName instead of being created by this stack.
          EXISTING_EVENT_BUS=$(aws events describe-event-bus \
            --name "$EVENT_BUS_NAME" \
            --region "$AWS_REGION" \
            --query 'Name' \
            --output text 2>/dev/null || true)

          if [ -z "$EXISTING_EVENT_BUS" ] || [ "$EXISTING_EVENT_BUS" = "None" ]; then
            echo "ERROR: Required EventBridge bus does not exist: $EVENT_BUS_NAME"
            exit 1
          fi
          echo "Using existing EventBridge bus: $EXISTING_EVENT_BUS"

          if [ -n "$STACK_STATUS" ] && [ "$STACK_STATUS" != "None" ]; then
            echo "Application stack already exists with status: $STACK_STATUS"
            STACK_RESOURCE_IDS=$(aws cloudformation list-stack-resources \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'StackResourceSummaries[].PhysicalResourceId' \
              --output text 2>/dev/null || true)

            EXISTING_REST_API=$(aws apigateway get-rest-apis \
              --region "$AWS_REGION" \
              --query "items[?name=='${PROJECT_NAME}-${ENVIRONMENT}-api'].id | [0]" \
              --output text 2>/dev/null || true)
            check_existing_resource "API Gateway REST API" "$EXISTING_REST_API"

            for FUNCTION_NAME in \
              "${PROJECT_NAME}-${ENVIRONMENT}-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-authorizer" \
              "${PROJECT_NAME}-${ENVIRONMENT}-token-manager" \
              "${PROJECT_NAME}-${ENVIRONMENT}-product" \
              "${PROJECT_NAME}-${ENVIRONMENT}-customer" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order"
            do
              EXISTING_FUNCTION=$(aws lambda get-function \
                --function-name "$FUNCTION_NAME" \
                --region "$AWS_REGION" \
                --query 'Configuration.FunctionName' \
                --output text 2>/dev/null || true)
              check_existing_resource "Lambda function" "$EXISTING_FUNCTION"
            done

            for RULE_NAME in \
              "${PROJECT_NAME}-${ENVIRONMENT}-low-stock" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-placed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-confirmed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-canceled-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-failed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-completed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-placed-processing"
            do
              EXISTING_RULE=$(aws events describe-rule \
                --name "$RULE_NAME" \
                --event-bus-name "$EVENT_BUS_NAME" \
                --region "$AWS_REGION" \
                --query 'Name' \
                --output text 2>/dev/null || true)
              if [ -n "$EXISTING_RULE" ] && [ "$EXISTING_RULE" != "None" ]; then
                EVENT_RULE_PHYSICAL_ID="${EVENT_BUS_NAME}|${EXISTING_RULE}"
              else
                EVENT_RULE_PHYSICAL_ID=""
              fi
              check_existing_resource "EventBridge rule" "$EXISTING_RULE" "$EVENT_RULE_PHYSICAL_ID"
            done

            for LOG_GROUP in \
              "/aws/lambda/${PROJECT_NAME}-${ENVIRONMENT}-notification" \
              "/aws/lambda/${PROJECT_NAME}-${ENVIRONMENT}-order"
            do
              EXISTING_LOG_GROUP=$(aws logs describe-log-groups \
                --log-group-name-prefix "$LOG_GROUP" \
                --region "$AWS_REGION" \
                --query "logGroups[?logGroupName=='${LOG_GROUP}'].logGroupName | [0]" \
                --output text 2>/dev/null || true)
              check_existing_resource "CloudWatch log group" "$EXISTING_LOG_GROUP"
            done
          else
            echo "Application stack does not exist. Checking for orphaned named resources..."

            EXISTING_REST_API=$(aws apigateway get-rest-apis \
              --region "$AWS_REGION" \
              --query "items[?name=='${PROJECT_NAME}-${ENVIRONMENT}-api'].id | [0]" \
              --output text 2>/dev/null || true)
            check_orphan_resource "API Gateway REST API" "$EXISTING_REST_API"

            for FUNCTION_NAME in \
              "${PROJECT_NAME}-${ENVIRONMENT}-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-authorizer" \
              "${PROJECT_NAME}-${ENVIRONMENT}-token-manager" \
              "${PROJECT_NAME}-${ENVIRONMENT}-product" \
              "${PROJECT_NAME}-${ENVIRONMENT}-customer" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order"
            do
              EXISTING_FUNCTION=$(aws lambda get-function \
                --function-name "$FUNCTION_NAME" \
                --region "$AWS_REGION" \
                --query 'Configuration.FunctionName' \
                --output text 2>/dev/null || true)
              check_orphan_resource "Lambda function" "$EXISTING_FUNCTION"
            done

            for RULE_NAME in \
              "${PROJECT_NAME}-${ENVIRONMENT}-low-stock" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-placed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-confirmed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-canceled-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-failed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-completed-notification" \
              "${PROJECT_NAME}-${ENVIRONMENT}-order-placed-processing"
            do
              EXISTING_RULE=$(aws events describe-rule \
                --name "$RULE_NAME" \
                --event-bus-name "$EVENT_BUS_NAME" \
                --region "$AWS_REGION" \
                --query 'Name' \
                --output text 2>/dev/null || true)
              check_orphan_resource "EventBridge rule" "$EXISTING_RULE"
            done

            for LOG_GROUP in \
              "/aws/lambda/${PROJECT_NAME}-${ENVIRONMENT}-notification" \
              "/aws/lambda/${PROJECT_NAME}-${ENVIRONMENT}-order"
            do
              EXISTING_LOG_GROUP=$(aws logs describe-log-groups \
                --log-group-name-prefix "$LOG_GROUP" \
                --region "$AWS_REGION" \
                --query "logGroups[?logGroupName=='${LOG_GROUP}'].logGroupName | [0]" \
                --output text 2>/dev/null || true)
              check_orphan_resource "CloudWatch log group" "$EXISTING_LOG_GROUP"
            done
          fi

          # Existing SNS topics are external resources and are expected.
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ORDER_TOPIC_ARN="arn:${AWS_PARTITION:-aws}:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:${PROJECT_NAME}-${ENVIRONMENT}-order-notifications"
          LOW_STOCK_TOPIC_ARN="arn:${AWS_PARTITION:-aws}:sns:${AWS_REGION}:${AWS_ACCOUNT_ID}:${PROJECT_NAME}-${ENVIRONMENT}-low-stock"

          if ! aws sns get-topic-attributes --topic-arn "$ORDER_TOPIC_ARN" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ERROR: Required existing SNS topic was not found: $ORDER_TOPIC_ARN"
            exit 1
          fi
          if ! aws sns get-topic-attributes --topic-arn "$LOW_STOCK_TOPIC_ARN" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "ERROR: Required existing SNS topic was not found: $LOW_STOCK_TOPIC_ARN"
            exit 1
          fi

          if [ "$NON_EVENT_CONFLICT_FOUND" = "true" ]; then
            echo "ERROR: One or more non-EventBridge application resources already exist outside CloudFormation ownership."
            echo "No automatic deletion will be performed."
            echo "Those resources must be imported or resolved manually."
            exit 1
          fi

          # EventBridge rules are application resources owned by the Application stack.
          # The current stack can legitimately encounter these seven rules after a
          # previous deployment that used Retain, because the rules survive stack
          # deletion while the new stack no longer owns them.
          #
          # Safety rule:
          #   - Only the seven exact CloudMart rule names checked above may be cleaned.
          #   - For an existing Application stack, the API and all six application
          #     Lambdas/log groups must already be owned by this stack. Any other
          #     unmanaged application resource causes a hard failure above.
          #   - We never delete the shared EventBridge bus or SNS topics.
          #
          # Under those conditions the unmanaged rules are stale copies of the same
          # CloudMart application rules. Remove their targets/rules, then let the
          # normal SAM deployment recreate them under CloudFormation ownership.
          if [ "$EVENT_RULE_CONFLICT_FOUND" = "true" ]; then
            echo "============================================================"
            echo "Found unmanaged CloudMart EventBridge rules."
            echo "Application stack: ${STACK_NAME}"
            echo "Status: ${STACK_STATUS:-NOT_FOUND}"
            echo "Only the known CloudMart application rules will be cleaned."
            echo "============================================================"

            for RULE_NAME in $(printf '%s\n' "${UNMANAGED_EVENT_RULES[@]}" | sort -u); do
              case "$RULE_NAME" in
                "${PROJECT_NAME}-${ENVIRONMENT}-low-stock"|\
                "${PROJECT_NAME}-${ENVIRONMENT}-order-placed-notification"|\
                "${PROJECT_NAME}-${ENVIRONMENT}-order-confirmed-notification"|\
                "${PROJECT_NAME}-${ENVIRONMENT}-order-canceled-notification"|\
                "${PROJECT_NAME}-${ENVIRONMENT}-order-failed-notification"|\
                "${PROJECT_NAME}-${ENVIRONMENT}-order-completed-notification"|\
                "${PROJECT_NAME}-${ENVIRONMENT}-order-placed-processing")
                  ;;
                *)
                  echo "ERROR: Refusing to clean unexpected EventBridge rule: $RULE_NAME"
                  exit 1
                  ;;
              esac

              echo "Cleaning stale CloudMart EventBridge rule: $RULE_NAME"

              TARGET_IDS=$(aws events list-targets-by-rule \
                --rule "$RULE_NAME" \
                --event-bus-name "$EVENT_BUS_NAME" \
                --region "$AWS_REGION" \
                --query 'Targets[].Id' \
                --output text 2>/dev/null || true)

              if [ -n "$TARGET_IDS" ] && [ "$TARGET_IDS" != "None" ]; then
                read -r -a TARGET_ARRAY <<< "$TARGET_IDS"
                echo "Removing targets from $RULE_NAME: ${TARGET_ARRAY[*]}"
                aws events remove-targets \
                  --rule "$RULE_NAME" \
                  --event-bus-name "$EVENT_BUS_NAME" \
                  --ids "${TARGET_ARRAY[@]}" \
                  --region "$AWS_REGION"
              fi

              aws events delete-rule \
                --name "$RULE_NAME" \
                --event-bus-name "$EVENT_BUS_NAME" \
                --region "$AWS_REGION"

              echo "Deleted stale CloudMart EventBridge rule: $RULE_NAME"
            done

            EVENT_RULE_CONFLICT_FOUND="false"
            UNMANAGED_EVENT_RULES=()
            CONFLICT_FOUND="false"
            echo "All stale CloudMart EventBridge rules were cleaned up."
          fi

          echo "Application resource ownership preflight passed."

          # With no orphaned resources, perform the normal SAM
          # update/create deployment.
          if ! sam deploy \
              --template-file .aws-sam/build/template.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --resolve-s3 \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-confirm-changeset \
              --no-fail-on-empty-changeset \
              --parameter-overrides \
                Environment="$ENVIRONMENT" \
                ProjectName="$PROJECT_NAME" \
                AuthorizerCacheTTL="$AUTHORIZER_CACHE_TTL" \
                NotificationEmail="$ADMIN_EMAIL" \
                ExistingOrderNotificationTopicArn="$ORDER_TOPIC_ARN" \
                ExistingLowStockTopicArn="$LOW_STOCK_TOPIC_ARN" \
                ExistingEventBusName="$EVENT_BUS_NAME" \
                ApiDeploymentVersion="${GITHUB_RUN_NUMBER}" \
              EC2InstanceType="$EC2_INSTANCE_TYPE"
          then
            echo "============================================================"
            echo "ERROR: SAM/CloudFormation deployment failed."
            echo "============================================================"

            echo "STACK STATUS:"
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].[StackStatus,StackStatusReason]' \
              --output table || true

            echo "FAILED CLOUDFORMATION RESOURCES:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --no-paginate \
              --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='ROLLBACK_FAILED' || ResourceStatus=='DELETE_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
              --output table || true

            echo "RECENT CLOUDFORMATION EVENTS:"
            aws cloudformation describe-stack-events \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --max-items 100 \
              --output table || true

            exit 1
          fi

           APP_STATUS=$(aws cloudformation describe-stacks \
             --stack-name "$STACK_NAME" \
             --region "$AWS_REGION" \
             --query 'Stacks[0].StackStatus' \
             --output text)

           case "$APP_STATUS" in
             CREATE_COMPLETE|UPDATE_COMPLETE|IMPORT_COMPLETE)
               echo "Application stack is healthy: $APP_STATUS"
               ;;
             *)
               echo "ERROR: Application stack ended in unexpected state: $APP_STATUS"
               exit 1
               ;;
           esac

           echo "Verifying deployed API Gateway customer-registration method..."

           REST_API_ID=$(aws cloudformation describe-stacks              --stack-name "$STACK_NAME"              --region "$AWS_REGION"              --query 'Stacks[0].Outputs[?OutputKey==`RestApiId`].OutputValue'              --output text)

           CUSTOMERS_RESOURCE_ID=$(aws apigateway get-resources              --rest-api-id "$REST_API_ID"              --region "$AWS_REGION"              --query 'items[?path==`/customers`].id | [0]'              --output text)

           test -n "$CUSTOMERS_RESOURCE_ID" && test "$CUSTOMERS_RESOURCE_ID" != "None" || {
             echo "ERROR: /customers API Gateway resource was not found."
             exit 1
           }

           CUSTOMER_POST_AUTH_TYPE=$(aws apigateway get-method              --rest-api-id "$REST_API_ID"              --resource-id "$CUSTOMERS_RESOURCE_ID"              --http-method POST              --region "$AWS_REGION"              --query 'authorizationType'              --output text)

           echo "POST /customers authorization type: $CUSTOMER_POST_AUTH_TYPE"

           test "$CUSTOMER_POST_AUTH_TYPE" = "NONE" || {
             echo "ERROR: POST /customers is still protected by API Gateway."
             echo "Expected authorizationType=NONE but received: $CUSTOMER_POST_AUTH_TYPE"
             exit 1
           }

           echo "POST /customers is publicly accessible at API Gateway."

           echo "Verifying deployed Customer Lambda registration version..."

           CUSTOMER_FUNCTION_NAME="cloudmart-${ENVIRONMENT}-customer"
           CUSTOMER_HANDLER=$(aws lambda get-function-configuration              --function-name "$CUSTOMER_FUNCTION_NAME"              --region "$AWS_REGION"              --query 'Handler'              --output text)

           CUSTOMER_REGISTRATION_VERSION=$(aws lambda get-function-configuration              --function-name "$CUSTOMER_FUNCTION_NAME"              --region "$AWS_REGION"              --query 'Environment.Variables.CUSTOMER_REGISTRATION_VERSION'              --output text)

           echo "Customer Lambda handler: $CUSTOMER_HANDLER"
           echo "Customer registration version: $CUSTOMER_REGISTRATION_VERSION"

           test "$CUSTOMER_HANDLER" = "index.lambda_handler_v2" || {
             echo "ERROR: Customer Lambda is still using the old handler."
             exit 1
           }

           test "$CUSTOMER_REGISTRATION_VERSION" = "2" || {
             echo "ERROR: Customer Lambda registration version is not 2."
             exit 1
           }

           echo "Customer Lambda registration version is deployed."

           echo "Verifying SNS notification infrastructure..."
           # Read the SNS topic ARNs directly from the Application stack outputs.
           # Do not reconstruct or grep topic names here because the stack uses
           # the ProjectName parameter when creating the topic names.
           ORDER_TOPIC_ARN=$(aws cloudformation describe-stacks \
             --stack-name "$STACK_NAME" \
             --region "$AWS_REGION" \
             --query 'Stacks[0].Outputs[?OutputKey==`OrderNotificationTopicArn`].OutputValue' \
             --output text)

           LOW_STOCK_TOPIC_ARN=$(aws cloudformation describe-stacks \
             --stack-name "$STACK_NAME" \
             --region "$AWS_REGION" \
             --query 'Stacks[0].Outputs[?OutputKey==`LowStockTopicArn`].OutputValue' \
             --output text)

           test -n "$ORDER_TOPIC_ARN" && test "$ORDER_TOPIC_ARN" != "None" || {
             echo "ERROR: Order-notification SNS topic ARN was not returned by the Application stack."
             exit 1
           }

           test -n "$LOW_STOCK_TOPIC_ARN" && test "$LOW_STOCK_TOPIC_ARN" != "None" || {
             echo "ERROR: Low-stock SNS topic ARN was not returned by the Application stack."
             exit 1
           }

           echo "Customer order SNS topic: $ORDER_TOPIC_ARN"
           echo "Low-stock SNS topic: $LOW_STOCK_TOPIC_ARN"

           echo "Checking admin low-stock email subscription..."
           LOW_STOCK_SUBSCRIPTIONS=$(aws sns list-subscriptions-by-topic \
             --topic-arn "$LOW_STOCK_TOPIC_ARN" \
             --region "$AWS_REGION" \
             --output json)

           # SNS can return lifecycle values such as PendingConfirmation or
           # Deleted in SubscriptionArn. Only a real ARN may be passed to
           # GetSubscriptionAttributes.
           LOW_STOCK_SUB_ARN=$(echo "$LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             .Subscriptions[]?
             | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
             | .SubscriptionArn
             | select(startswith("arn:"))' | head -n 1)

           LOW_STOCK_PENDING_PRESENT=$(echo "$LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             any(.Subscriptions[]?; ((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase)) and .SubscriptionArn == "PendingConfirmation")')

           LOW_STOCK_DELETED_PRESENT=$(echo "$LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             any(.Subscriptions[]?; ((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase)) and .SubscriptionArn == "Deleted")')

           if [ -n "$LOW_STOCK_SUB_ARN" ]; then
             echo "Admin low-stock SNS subscription ARN: $LOW_STOCK_SUB_ARN"

             if LOW_STOCK_SUB_ATTRIBUTES=$(aws sns get-subscription-attributes \
               --subscription-arn "$LOW_STOCK_SUB_ARN" \
               --region "$AWS_REGION" \
               --output json 2>/tmp/low-stock-sub-error.log); then
               LOW_STOCK_PENDING=$(echo "$LOW_STOCK_SUB_ATTRIBUTES" | jq -r '.Attributes.PendingConfirmation // "false"')
               if [ "$LOW_STOCK_PENDING" = "true" ]; then
                 echo "WARNING: Admin low-stock SNS subscription is PendingConfirmation."
                 echo "The admin must click the SNS confirmation link before low-stock emails can be delivered."
               else
                 echo "Admin low-stock SNS subscription is confirmed."
               fi
             else
               echo "WARNING: Existing admin low-stock subscription ARN is no longer available."
               cat /tmp/low-stock-sub-error.log
               LOW_STOCK_SUB_ARN=""
             fi
           fi

           # Read-only verification of the obsolete singular topic.
          # GitHub Actions does not create or delete this legacy resource.
          # If it still exists from an older deployment, remove it manually
          # after confirming that it is no longer used.
          STALE_ORDER_TOPIC_ARN=$(aws sns list-topics \
            --region "$AWS_REGION" \
            --query 'Topics[].TopicArn' \
            --output text | tr '\t' '\n' | grep -E ":cloudmart-${ENVIRONMENT}-order-notification$" | head -n 1 || true)

          if [ -n "$STALE_ORDER_TOPIC_ARN" ]; then
            echo "WARNING: obsolete singular order-notification topic still exists:"
            echo "$STALE_ORDER_TOPIC_ARN"
            echo "GitHub Actions will NOT delete or modify it."
          else
            echo "No obsolete singular order-notification topic found."
          fi

          # Read-only verification. The email subscription itself is created by
           # CloudFormation from NotificationEmail. GitHub Actions does not call
           # sns:Subscribe, ConfirmSubscription, or Unsubscribe.
           FINAL_LOW_STOCK_SUBSCRIPTIONS=$(aws sns list-subscriptions-by-topic \
             --topic-arn "$LOW_STOCK_TOPIC_ARN" \
             --region "$AWS_REGION" \
             --output json)

           FINAL_LOW_STOCK_SUB_STATUS=$(echo "$FINAL_LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
             .Subscriptions[]?
             | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
             | if .SubscriptionArn == "PendingConfirmation" then "PENDING"
               elif .SubscriptionArn == "Deleted" then "DELETED"
               elif (.SubscriptionArn // "" | startswith("arn:")) then "CONFIRMED"
               else "UNKNOWN" end' | head -n 1)

           case "$FINAL_LOW_STOCK_SUB_STATUS" in
             CONFIRMED)
               FINAL_LOW_STOCK_SUB_ARN=$(echo "$FINAL_LOW_STOCK_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
                 .Subscriptions[]?
                 | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
                 | .SubscriptionArn
                 | select(startswith("arn:"))' | head -n 1)
               echo "Confirmed low-stock SNS subscription: $FINAL_LOW_STOCK_SUB_ARN"
               ;;
             PENDING)
               echo "WARNING: CloudFormation created the low-stock email subscription and it is PendingConfirmation."
               echo "The recipient must confirm the SNS email before delivery can begin."
               ;;
             DELETED)
               echo "WARNING: The low-stock email subscription is Deleted."
               echo "CloudFormation owns this subscription; no manual subscription command is run by GitHub Actions."
               ;;
             *)
               echo "WARNING: No low-stock email subscription is currently visible."
               echo "CloudFormation is responsible for creating the subscription from NotificationEmail."
               ;;
           esac

           echo "SNS notification infrastructure check completed."

  initialize:
    name: Initialize CloudMart
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5

      - name: Load CloudMart deployment parameters
        env:
          CLOUDMART_ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="cloudformation/parameters.json"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found."; exit 1; }

          ENVIRONMENT=$(jq -r '.Environment' "$CONFIG_FILE")
          PROJECT_NAME=$(jq -r '.ProjectName' "$CONFIG_FILE")
          NOTIFICATION_EMAIL="${CLOUDMART_ADMIN_EMAIL:-}"
          VPC_CIDR=$(jq -r '.VpcCidr' "$CONFIG_FILE")
          PUBLIC_SUBNET_CIDR=$(jq -r '.PublicSubnetCidr' "$CONFIG_FILE")
          MONITORING_PUBLIC_SUBNET_CIDR=$(jq -r '.MonitoringPublicSubnetCidr' "$CONFIG_FILE")
          PRIVATE_SUBNET1_CIDR=$(jq -r '.PrivateSubnet1Cidr' "$CONFIG_FILE")
          PRIVATE_SUBNET2_CIDR=$(jq -r '.PrivateSubnet2Cidr' "$CONFIG_FILE")
          DB_NAME=$(jq -r '.DBName' "$CONFIG_FILE")
          DB_INSTANCE_CLASS=$(jq -r '.DBInstanceClass' "$CONFIG_FILE")
          ALLOCATED_STORAGE=$(jq -r '.AllocatedStorage' "$CONFIG_FILE")
          AUTHORIZER_CACHE_TTL=$(jq -r '.AuthorizerCacheTTL' "$CONFIG_FILE")
          EC2_INSTANCE_TYPE=$(jq -r '.EC2InstanceType' "$CONFIG_FILE")
          DASHBOARD_SOURCE_PREFIX=$(jq -r '.DashboardSourcePrefix' "$CONFIG_FILE")

          for value in "$ENVIRONMENT" "$PROJECT_NAME" "$NOTIFICATION_EMAIL" "$VPC_CIDR"                        "$PUBLIC_SUBNET_CIDR" "$MONITORING_PUBLIC_SUBNET_CIDR"                        "$PRIVATE_SUBNET1_CIDR" "$PRIVATE_SUBNET2_CIDR" "$DB_NAME"                        "$DB_INSTANCE_CLASS" "$ALLOCATED_STORAGE" "$AUTHORIZER_CACHE_TTL"                        "$EC2_INSTANCE_TYPE" "$DASHBOARD_SOURCE_PREFIX"; do
            test -n "$value" || { echo "ERROR: parameters.json contains an empty required value."; exit 1; }
          done

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=$NOTIFICATION_EMAIL" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "PUBLIC_SUBNET_CIDR=$PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "MONITORING_PUBLIC_SUBNET_CIDR=$MONITORING_PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET1_CIDR=$PRIVATE_SUBNET1_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET2_CIDR=$PRIVATE_SUBNET2_CIDR" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_CLASS=$DB_INSTANCE_CLASS" >> "$GITHUB_ENV"
          echo "ALLOCATED_STORAGE=$ALLOCATED_STORAGE" >> "$GITHUB_ENV"
          echo "AUTHORIZER_CACHE_TTL=$AUTHORIZER_CACHE_TTL" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_TYPE=$EC2_INSTANCE_TYPE" >> "$GITHUB_ENV"
          echo "DASHBOARD_SOURCE_PREFIX=$DASHBOARD_SOURCE_PREFIX" >> "$GITHUB_ENV"

          echo "Loaded CloudMart configuration for environment: $ENVIRONMENT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize database
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-product" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_database"}' \
            /tmp/db.json
          jq -e '.statusCode == 200' /tmp/db.json >/dev/null
          rm -f /tmp/db.json
          echo "Database initialization completed successfully."
      - name: Initialize authentication tokens
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-token-manager" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_tokens"}' \
            /tmp/auth.json
          jq -e '.statusCode == 200' /tmp/auth.json >/dev/null
          rm -f /tmp/auth.json
          echo "Authentication tokens initialized successfully."

      - name: Verify deployed API authentication
        run: |
          set -euo pipefail

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-application-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RestApiUrl`].OutputValue' \
            --output text)

          echo "Verifying POST /customers without an Authorization header..."

          CUSTOMER_PUBLIC_RESPONSE=/tmp/customer-public-response.json
          CUSTOMER_PUBLIC_HTTP_CODE=$(curl -sS -o "$CUSTOMER_PUBLIC_RESPONSE" -w '%{http_code}' \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$API_URL/customers")

          echo "POST /customers without Authorization returned HTTP $CUSTOMER_PUBLIC_HTTP_CODE"
          cat "$CUSTOMER_PUBLIC_RESPONSE"

          # {} is intentionally invalid, so no customer is created.
          # HTTP 400 proves the request reached Customer Lambda.
          # HTTP 403 means an old protected route is still deployed.
          if [ "$CUSTOMER_PUBLIC_HTTP_CODE" != "400" ]; then
            echo "ERROR: POST /customers public-registration check failed."
            echo "Expected HTTP 400 from Lambda validation, but received HTTP $CUSTOMER_PUBLIC_HTTP_CODE."
            exit 1
          fi

          echo "POST /customers public-registration smoke test passed."
          rm -f "$CUSTOMER_PUBLIC_RESPONSE"

          # Product browsing is intentionally public.
          # Do NOT send Authorization here.
          PRODUCTS_RESPONSE=/tmp/products-response.json
          PRODUCTS_HTTP_CODE=$(curl -sS -o "$PRODUCTS_RESPONSE" -w '%{http_code}' \
            -H "Content-Type: application/json" \
            "$API_URL/products")

          echo "GET /products without Authorization returned HTTP $PRODUCTS_HTTP_CODE"
          cat "$PRODUCTS_RESPONSE"

          if [ "$PRODUCTS_HTTP_CODE" != "200" ]; then
            echo "ERROR: GET /products public-access check failed."
            exit 1
          fi

          echo "Public product API smoke test passed: GET /products returned HTTP 200."
          rm -f "$PRODUCTS_RESPONSE"

          echo "Checking deployed API Gateway stage..."
          DEPLOYMENT_ID=$(aws apigateway get-stage \
            --rest-api-id "$(aws cloudformation describe-stacks \
              --stack-name "cloudmart-application-${ENVIRONMENT}" \
              --region "$AWS_REGION" \
              --query 'Stacks[0].Outputs[?OutputKey==`RestApiId`].OutputValue' \
              --output text)" \
            --stage-name "$ENVIRONMENT" \
            --region "$AWS_REGION" \
            --query 'deploymentId' \
            --output text)

          test -n "$DEPLOYMENT_ID" && test "$DEPLOYMENT_ID" != "None" || {
            echo "ERROR: API Gateway stage has no deployment."
            exit 1
          }

          echo "API Gateway ${ENVIRONMENT} stage is using deployment: $DEPLOYMENT_ID"


  deploy-monitoring:
    name: Deploy API Monitoring and EC2 Dashboard
    runs-on: ubuntu-latest
    needs: initialize
    steps:
      - uses: actions/checkout@v5

      - name: Load CloudMart deployment parameters
        env:
          CLOUDMART_ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG_FILE="cloudformation/parameters.json"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found."; exit 1; }

          ENVIRONMENT=$(jq -r '.Environment' "$CONFIG_FILE")
          PROJECT_NAME=$(jq -r '.ProjectName' "$CONFIG_FILE")
          NOTIFICATION_EMAIL="${CLOUDMART_ADMIN_EMAIL:-}"
          VPC_CIDR=$(jq -r '.VpcCidr' "$CONFIG_FILE")
          PUBLIC_SUBNET_CIDR=$(jq -r '.PublicSubnetCidr' "$CONFIG_FILE")
          MONITORING_PUBLIC_SUBNET_CIDR=$(jq -r '.MonitoringPublicSubnetCidr' "$CONFIG_FILE")
          PRIVATE_SUBNET1_CIDR=$(jq -r '.PrivateSubnet1Cidr' "$CONFIG_FILE")
          PRIVATE_SUBNET2_CIDR=$(jq -r '.PrivateSubnet2Cidr' "$CONFIG_FILE")
          DB_NAME=$(jq -r '.DBName' "$CONFIG_FILE")
          DB_INSTANCE_CLASS=$(jq -r '.DBInstanceClass' "$CONFIG_FILE")
          ALLOCATED_STORAGE=$(jq -r '.AllocatedStorage' "$CONFIG_FILE")
          AUTHORIZER_CACHE_TTL=$(jq -r '.AuthorizerCacheTTL' "$CONFIG_FILE")
          EC2_INSTANCE_TYPE=$(jq -r '.EC2InstanceType' "$CONFIG_FILE")
          DASHBOARD_SOURCE_PREFIX=$(jq -r '.DashboardSourcePrefix' "$CONFIG_FILE")

          for value in "$ENVIRONMENT" "$PROJECT_NAME" "$NOTIFICATION_EMAIL" "$VPC_CIDR"                        "$PUBLIC_SUBNET_CIDR" "$MONITORING_PUBLIC_SUBNET_CIDR"                        "$PRIVATE_SUBNET1_CIDR" "$PRIVATE_SUBNET2_CIDR" "$DB_NAME"                        "$DB_INSTANCE_CLASS" "$ALLOCATED_STORAGE" "$AUTHORIZER_CACHE_TTL"                        "$EC2_INSTANCE_TYPE" "$DASHBOARD_SOURCE_PREFIX"; do
            test -n "$value" || { echo "ERROR: parameters.json contains an empty required value."; exit 1; }
          done

          echo "ENVIRONMENT=$ENVIRONMENT" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "ADMIN_EMAIL=$NOTIFICATION_EMAIL" >> "$GITHUB_ENV"
          echo "VPC_CIDR=$VPC_CIDR" >> "$GITHUB_ENV"
          echo "PUBLIC_SUBNET_CIDR=$PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "MONITORING_PUBLIC_SUBNET_CIDR=$MONITORING_PUBLIC_SUBNET_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET1_CIDR=$PRIVATE_SUBNET1_CIDR" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET2_CIDR=$PRIVATE_SUBNET2_CIDR" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "DB_INSTANCE_CLASS=$DB_INSTANCE_CLASS" >> "$GITHUB_ENV"
          echo "ALLOCATED_STORAGE=$ALLOCATED_STORAGE" >> "$GITHUB_ENV"
          echo "AUTHORIZER_CACHE_TTL=$AUTHORIZER_CACHE_TTL" >> "$GITHUB_ENV"
          echo "EC2_INSTANCE_TYPE=$EC2_INSTANCE_TYPE" >> "$GITHUB_ENV"
          echo "DASHBOARD_SOURCE_PREFIX=$DASHBOARD_SOURCE_PREFIX" >> "$GITHUB_ENV"

          echo "Loaded CloudMart configuration for environment: $ENVIRONMENT"
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload dashboard source
        run: |
          set -euo pipefail

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-data-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`ReportBucketName`].OutputValue' \
            --output text)

          test -n "$REPORT_BUCKET" || { echo "Report bucket was not found."; exit 1; }

          aws s3 sync dashboard "s3://${REPORT_BUCKET}/${DASHBOARD_SOURCE_PREFIX}/${GITHUB_SHA}" --delete --exclude "venv/*" --exclude "venv"
          echo "Dashboard source uploaded to s3://${REPORT_BUCKET}/${DASHBOARD_SOURCE_PREFIX}/${GITHUB_SHA}"

      - name: Validate monitoring template
        run: sam validate --template-file cloudformation/API-Monitoring-EC2.yaml

      - name: Build monitoring stack
        run: sam build --template-file cloudformation/API-Monitoring-EC2.yaml

      - name: Deploy API-Monitoring-EC2 stack
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }

          STACK_NAME="API-Monitoring-EC2-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          # IMPORTANT:
          # Monitoring stack rollback/review/delete recovery is MANUAL.
          # GitHub Actions must NEVER automatically delete this stack.
          case "$STACK_STATUS" in
            ROLLBACK_*|UPDATE_ROLLBACK_*)
              echo "============================================================"
              echo "ERROR: Monitoring stack is in rollback state: $STACK_STATUS"
              echo "Stack: $STACK_NAME"
              echo "NO AUTOMATIC DELETION WILL BE PERFORMED."
              echo "Inspect CloudFormation Events and manually delete/recover"
              echo "the stack if required. Then run the workflow again."
              echo "============================================================"
              exit 1
              ;;

            REVIEW_IN_PROGRESS)
              echo "============================================================"
              echo "ERROR: Monitoring stack is in REVIEW_IN_PROGRESS."
              echo "Stack: $STACK_NAME"
              echo "NO AUTOMATIC DELETION WILL BE PERFORMED."
              echo "Manually delete the unfinished stack in CloudFormation,"
              echo "then run the workflow again."
              echo "============================================================"
              exit 1
              ;;

            DELETE_FAILED)
              echo "============================================================"
              echo "ERROR: Monitoring stack is in DELETE_FAILED."
              echo "Stack: $STACK_NAME"
              echo "NO AUTOMATIC DELETION OR RECOVERY WILL BE PERFORMED."
              echo "Manual CloudFormation recovery is required."
              echo "============================================================"
              exit 1
              ;;

            ROLLBACK_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS|DELETE_IN_PROGRESS)
              echo "============================================================"
              echo "ERROR: Monitoring stack is currently $STACK_STATUS."
              echo "NO AUTOMATIC DELETION WILL BE PERFORMED."
              echo "Wait for the current CloudFormation operation to finish."
              echo "Then manually inspect/delete the stack if required."
              echo "============================================================"
              exit 1
              ;;
          esac

          # ------------------------------------------------------------
          # Monitoring resource-name collision recovery
          # ------------------------------------------------------------
          # CloudFormation EarlyValidation::ResourceExistenceCheck rejects
          # a CREATE when named resources from an older/orphaned monitoring
          # deployment already exist. Do not delete those resources.
          #
          # If this stack already exists, keep the exact suffix currently
          # stored on the stack so normal updates remain stable.
          #
          # If the stack does not exist, probe the named resources. When
          # legacy names are occupied, use the first free suffix (-v2, -v3,
          # ...) so CloudFormation can create a clean, independently-owned
          # monitoring stack without deleting the old resources.
          MONITORING_RESOURCE_SUFFIX=""

          if [ -n "$STACK_STATUS" ] && [ "$STACK_STATUS" != "None" ]; then
            EXISTING_SUFFIX=$(aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Parameters[?ParameterKey=='MonitoringResourceSuffix'].ParameterValue | [0]" \
              --output text 2>/dev/null || true)

            if [ -n "$EXISTING_SUFFIX" ] && [ "$EXISTING_SUFFIX" != "None" ]; then
              MONITORING_RESOURCE_SUFFIX="$EXISTING_SUFFIX"
            fi

            echo "Existing monitoring stack detected."
            echo "Using existing MonitoringResourceSuffix: '${MONITORING_RESOURCE_SUFFIX}'"
          else
            echo "Monitoring stack does not exist. Checking for legacy named resources..."

            monitoring_suffix_is_free() {
              local suffix="$1"
              local candidate
              local found=""

              candidate="${PROJECT_NAME}-${ENVIRONMENT}-daily-report${suffix}"
              if aws lambda get-function --function-name "$candidate" --region "$AWS_REGION" >/dev/null 2>&1; then
                return 1
              fi

              for candidate in \
                "${PROJECT_NAME}-${ENVIRONMENT}-monitoring${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-monitoring-email${suffix}"
              do
                if aws sns get-topic-attributes \
                  --topic-arn "arn:${AWS_PARTITION:-aws}:sns:${AWS_REGION}:$(aws sts get-caller-identity --query Account --output text):${candidate}" \
                  --region "$AWS_REGION" >/dev/null 2>&1; then
                  return 1
                fi
              done

              for candidate in \
                "${PROJECT_NAME}-${ENVIRONMENT}-rds-cpu-80${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-orders-failed${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-low-stock${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-api-5xx${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-order-lambda-errors${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-product-lambda-errors${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-report-generation-failure${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-api-4xx${suffix}"
              do
                if aws cloudwatch describe-alarms \
                  --alarm-names "$candidate" \
                  --region "$AWS_REGION" \
                  --query 'MetricAlarms[0].AlarmName' \
                  --output text 2>/dev/null | grep -Fxq "$candidate"; then
                  return 1
                fi
              done

              candidate="${PROJECT_NAME}-${ENVIRONMENT}-monitoring-email${suffix}"
              if aws sns get-topic-attributes \
                --topic-arn "arn:${AWS_PARTITION:-aws}:sns:${AWS_REGION}:$(aws sts get-caller-identity --query Account --output text):${candidate}" \
                --region "$AWS_REGION" >/dev/null 2>&1; then
                return 1
              fi

              for candidate in \
                "${PROJECT_NAME}-${ENVIRONMENT}-rds-cpu-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-orders-failed-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-low-stock-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-api-5xx-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-order-lambda-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-product-lambda-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-report-failure-alert${suffix}" \
                "${PROJECT_NAME}-${ENVIRONMENT}-api-4xx-alert${suffix}"
              do
                if aws events describe-rule \
                  --name "$candidate" \
                  --event-bus-name default \
                  --region "$AWS_REGION" >/dev/null 2>&1; then
                  return 1
                fi
              done

              candidate="${PROJECT_NAME}-${ENVIRONMENT}-operations${suffix}"
              if aws cloudwatch get-dashboard \
                --dashboard-name "$candidate" \
                --region "$AWS_REGION" >/dev/null 2>&1; then
                return 1
              fi

              return 0
            }

            if monitoring_suffix_is_free ""; then
              MONITORING_RESOURCE_SUFFIX=""
              echo "Base monitoring resource names are available."
            else
              echo "Legacy monitoring resources already use the base names."
              suffix_number=2

              while true; do
                candidate_suffix="-v${suffix_number}"
                if monitoring_suffix_is_free "$candidate_suffix"; then
                  MONITORING_RESOURCE_SUFFIX="$candidate_suffix"
                  break
                fi
                suffix_number=$((suffix_number + 1))
                if [ "$suffix_number" -gt 20 ]; then
                  echo "ERROR: Could not find a free monitoring resource suffix."
                  exit 1
                fi
              done

              echo "Using collision-free MonitoringResourceSuffix: '${MONITORING_RESOURCE_SUFFIX}'"
            fi
          fi

          CFN_EXECUTION_ROLE_ARN=$(aws iam get-role \
            --role-name "cloudmart-${ENVIRONMENT}-cloudformation-execution-role" \
            --region "$AWS_REGION" \
            --query 'Role.Arn' \
            --output text)

          test -n "$CFN_EXECUTION_ROLE_ARN" && test "$CFN_EXECUTION_ROLE_ARN" != "None" || {
            echo "ERROR: CloudFormation execution role was not found."
            exit 1
          }

          echo "Using CloudFormation execution role: $CFN_EXECUTION_ROLE_ARN"
          echo "Dashboard bootstrap version: ${GITHUB_RUN_NUMBER}"
          echo "Dashboard source prefix: ${DASHBOARD_SOURCE_PREFIX}/${GITHUB_SHA}"

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --role-arn "$CFN_EXECUTION_ROLE_ARN" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              NotificationEmail="$ADMIN_EMAIL" \
              EC2InstanceType="$EC2_INSTANCE_TYPE" \
              DashboardSourcePrefix="${DASHBOARD_SOURCE_PREFIX}/${GITHUB_SHA}" \
              DashboardBootstrapVersion="${GITHUB_RUN_NUMBER}" \
              MonitoringResourceSuffix="$MONITORING_RESOURCE_SUFFIX"

          MONITORING_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          case "$MONITORING_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Monitoring stack is healthy: $MONITORING_STATUS"
              ;;
            *)
              echo "ERROR: Monitoring stack ended in unexpected state: $MONITORING_STATUS"
              exit 1
              ;;
          esac

          # Monitoring email path:
          #   CloudWatch Alarm state change -> EventBridge -> MonitoringEmailTopic -> Email.
          # EventBridge formats the alarm-specific message before SNS sends it.
          # There is intentionally NO direct CloudWatch Alarm -> SNS email action,
          # which prevents AWS's native "Threshold Crossed" email format.
          MONITORING_EMAIL_TOPIC_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`MonitoringEmailTopicArn`].OutputValue' \
            --output text)

          test -n "$MONITORING_EMAIL_TOPIC_ARN" && test "$MONITORING_EMAIL_TOPIC_ARN" != "None" || {
            echo "ERROR: Monitoring email topic ARN was not returned by CloudFormation."
            exit 1
          }

          echo "Formatted monitoring email SNS topic: $MONITORING_EMAIL_TOPIC_ARN"

          # Remove any legacy/orphaned CloudMart monitoring SNS topics that were
          # previously used as direct CloudWatch alarm actions. They are no longer
          # part of the stack and must not be able to deliver native alarm emails.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          LEGACY_MONITORING_TOPIC_ARN="arn:${AWS_PARTITION:-aws}:sns:${AWS_REGION}:${ACCOUNT_ID}:${PROJECT_NAME}-${ENVIRONMENT}-monitoring${MONITORING_RESOURCE_SUFFIX}"

          if aws sns get-topic-attributes \
            --topic-arn "$LEGACY_MONITORING_TOPIC_ARN" \
            --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Found legacy direct-alarm monitoring topic: $LEGACY_MONITORING_TOPIC_ARN"
            echo "Removing legacy topic so it cannot deliver native CloudWatch alarm emails."
            aws sns delete-topic \
              --topic-arn "$LEGACY_MONITORING_TOPIC_ARN" \
              --region "$AWS_REGION"
          else
            echo "No legacy direct-alarm monitoring topic found."
          fi

          MONITORING_ALARM_NAMES=( \
            "${PROJECT_NAME}-${ENVIRONMENT}-rds-cpu-80${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-orders-failed${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-low-stock${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-api-5xx${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-order-lambda-errors${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-product-lambda-errors${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-report-generation-failure${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-api-4xx${MONITORING_RESOURCE_SUFFIX}" \
          )

          echo "Verifying CloudWatch alarms do not have direct SNS alarm actions..."
          for ALARM_NAME in "${MONITORING_ALARM_NAMES[@]}"; do
            ALARM_ACTION_COUNT=$(aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" --region "$AWS_REGION" --query 'length(MetricAlarms[0].AlarmActions)' --output text 2>/dev/null || echo 0)
            if [ "$ALARM_ACTION_COUNT" != "0" ] && [ "$ALARM_ACTION_COUNT" != "None" ]; then
              echo "ERROR: Alarm '$ALARM_NAME' still has direct AlarmActions configured."
              aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" --region "$AWS_REGION" --query 'MetricAlarms[0].AlarmActions' --output json
              exit 1
            fi
            echo "OK: $ALARM_NAME -> no direct SNS alarm action"
          done

          echo "Verifying EventBridge -> Monitoring Notification Lambda -> SNS path..."
          MONITORING_LAMBDA_NAME="${PROJECT_NAME}-${ENVIRONMENT}-monitoring-notification${MONITORING_RESOURCE_SUFFIX}"
          MONITORING_LAMBDA_ARN=$(aws lambda get-function --function-name "$MONITORING_LAMBDA_NAME" --region "$AWS_REGION" --query 'Configuration.FunctionArn' --output text)
          test -n "$MONITORING_LAMBDA_ARN" && test "$MONITORING_LAMBDA_ARN" != "None" || { echo "ERROR: Monitoring notification Lambda ARN was not returned."; exit 1; }

          MONITORING_RULES=( \
            "${PROJECT_NAME}-${ENVIRONMENT}-rds-cpu-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-orders-failed-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-low-stock-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-api-5xx-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-order-lambda-errors-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-product-lambda-errors-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-report-generation-failure-notification${MONITORING_RESOURCE_SUFFIX}" \
            "${PROJECT_NAME}-${ENVIRONMENT}-api-4xx-notification${MONITORING_RESOURCE_SUFFIX}" \
          )

          for MONITORING_RULE_NAME in "${MONITORING_RULES[@]}"; do
            MONITORING_RULE_JSON=$(aws events describe-rule --name "$MONITORING_RULE_NAME" --event-bus-name default --region "$AWS_REGION" --output json)
            MONITORING_RULE_STATE=$(echo "$MONITORING_RULE_JSON" | jq -r '.State')
            if [ "$MONITORING_RULE_STATE" != "ENABLED" ]; then echo "ERROR: Monitoring EventBridge rule '$MONITORING_RULE_NAME' is not enabled."; exit 1; fi
            MONITORING_TARGET_JSON=$(aws events list-targets-by-rule --rule "$MONITORING_RULE_NAME" --event-bus-name default --region "$AWS_REGION" --output json)
            MONITORING_TARGET_ARN=$(echo "$MONITORING_TARGET_JSON" | jq -r '.Targets[]? | select(.Id == "MonitoringNotificationLambda") | .Arn' | head -n 1)
            if [ "$MONITORING_TARGET_ARN" != "$MONITORING_LAMBDA_ARN" ]; then
              echo "ERROR: Monitoring rule '$MONITORING_RULE_NAME' is not targeting the monitoring notification Lambda."
              echo "Expected: $MONITORING_LAMBDA_ARN"
              echo "Actual: ${MONITORING_TARGET_ARN:-<none>}"
              exit 1
            fi
            echo "OK: $MONITORING_RULE_NAME -> MonitoringNotificationLambda"
          done

          echo "Checking monitoring SNS email subscription..."
          MONITORING_SUBSCRIPTIONS=$(aws sns list-subscriptions-by-topic \
            --topic-arn "$MONITORING_EMAIL_TOPIC_ARN" \
            --region "$AWS_REGION" \
            --output json)

          MONITORING_SUB_STATUS=$(echo "$MONITORING_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
            .Subscriptions[]?
            | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
            | if .SubscriptionArn == "PendingConfirmation" then "PENDING"
              elif .SubscriptionArn == "Deleted" then "DELETED"
              elif (.SubscriptionArn // "" | startswith("arn:")) then "CONFIRMED"
              else "UNKNOWN" end' | head -n 1)

          case "$MONITORING_SUB_STATUS" in
            CONFIRMED)
              MONITORING_SUB_ARN=$(echo "$MONITORING_SUBSCRIPTIONS" | jq -r --arg endpoint "$ADMIN_EMAIL" '
                .Subscriptions[]?
                | select((.Endpoint // "" | ascii_downcase) == ($endpoint | ascii_downcase))
                | .SubscriptionArn
                | select(startswith("arn:"))' | head -n 1)
              echo "Confirmed monitoring SNS email subscription: $MONITORING_SUB_ARN"
              ;;
            PENDING)
              echo "WARNING: Monitoring SNS email subscription is PendingConfirmation."
              echo "The recipient must click the SNS confirmation link before alarm emails can be delivered."
              ;;
            DELETED|UNKNOWN|"")
              echo "WARNING: Monitoring SNS email subscription is missing or deleted."
              echo "Creating a fresh subscription so SNS sends a new confirmation email."

              aws sns subscribe \
                --topic-arn "$MONITORING_EMAIL_TOPIC_ARN" \
                --protocol email \
                --notification-endpoint "$ADMIN_EMAIL" \
                --region "$AWS_REGION" \
                >/tmp/monitoring-subscribe.json

              NEW_SUBSCRIPTION_ARN=$(jq -r '.SubscriptionArn // empty' /tmp/monitoring-subscribe.json)

              if [ -z "$NEW_SUBSCRIPTION_ARN" ] || [ "$NEW_SUBSCRIPTION_ARN" = "null" ]; then
                echo "ERROR: Failed to create the monitoring SNS email subscription."
                cat /tmp/monitoring-subscribe.json
                exit 1
              fi

              echo "New monitoring SNS email subscription created."
              echo "SubscriptionArn: $NEW_SUBSCRIPTION_ARN"
              echo "A fresh SNS confirmation email has been sent to: $ADMIN_EMAIL"
              echo "The recipient must click the confirmation link before monitoring emails are delivered."
              rm -f /tmp/monitoring-subscribe.json
              ;;
          esac

          echo "Monitoring email path: CloudWatch Alarm state change -> EventBridge -> Monitoring Email SNS -> Email -> $ADMIN_EMAIL"
          echo "CloudWatch console action path: CloudWatch Alarm -> Monitoring SNS Notification action."
          echo "No alarm-notification Lambda or SES path is used."

          echo "Verifying deployed daily report EventBridge rule..."

          DAILY_REPORT_SCHEDULE_NAME=$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --region "$AWS_REGION"             --query 'Stacks[0].Outputs[?OutputKey==`DailyReportScheduleName`].OutputValue'             --output text)

          DAILY_REPORT_SCHEDULE_ARN=$(aws cloudformation describe-stacks             --stack-name "$STACK_NAME"             --region "$AWS_REGION"             --query 'Stacks[0].Outputs[?OutputKey==`DailyReportScheduleArn`].OutputValue'             --output text)

          test -n "$DAILY_REPORT_SCHEDULE_NAME" && test "$DAILY_REPORT_SCHEDULE_NAME" != "None" || {
            echo "ERROR: Daily report EventBridge schedule name was not returned by CloudFormation."
            exit 1
          }

          test -n "$DAILY_REPORT_SCHEDULE_ARN" && test "$DAILY_REPORT_SCHEDULE_ARN" != "None" || {
            echo "ERROR: Daily report EventBridge schedule ARN was not returned by CloudFormation."
            exit 1
          }

          DAILY_REPORT_RESOURCE_STATUS=$(aws cloudformation describe-stack-resources             --stack-name "$STACK_NAME"             --logical-resource-id DailyReportScheduleV2             --region "$AWS_REGION"             --query 'StackResources[0].ResourceStatus'             --output text)

          test "$DAILY_REPORT_RESOURCE_STATUS" = "CREATE_COMPLETE" || {
            echo "ERROR: Daily report EventBridge rule resource is not CREATE_COMPLETE."
            echo "Resource status: $DAILY_REPORT_RESOURCE_STATUS"
            exit 1
          }

          echo "Daily report EventBridge rule: $DAILY_REPORT_SCHEDULE_NAME"
          echo "Daily report EventBridge ARN: $DAILY_REPORT_SCHEDULE_ARN"
          echo "Daily report schedule: rate(1 day)"
          echo "Daily report schedule resource status: $DAILY_REPORT_RESOURCE_STATUS"
          echo "Daily report schedule verification passed."

          DASHBOARD_INSTANCE_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`OperationsEC2InstanceId`].OutputValue' \
            --output text)

          test -n "$DASHBOARD_INSTANCE_ID" && test "$DASHBOARD_INSTANCE_ID" != "None" || {
            echo "ERROR: Operations dashboard EC2 instance ID was not returned."
            exit 1
          }

          echo "Operations dashboard EC2 instance: $DASHBOARD_INSTANCE_ID"

          echo "Waiting for the Operations EC2 instance to become available in SSM..."
          for attempt in $(seq 1 30); do
            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${DASHBOARD_INSTANCE_ID}" \
              --region "$AWS_REGION" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)

            echo "SSM status attempt ${attempt}/30: ${SSM_STATUS:-NOT_FOUND}"

            if [ "$SSM_STATUS" = "Online" ]; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "ERROR: Operations EC2 instance did not become Online in SSM."
              exit 1
            fi

            sleep 10
          done

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "cloudmart-data-${ENVIRONMENT}" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`ReportBucketName`].OutputValue' \
            --output text)

          test -n "$REPORT_BUCKET" && test "$REPORT_BUCKET" != "None" || {
            echo "ERROR: Report bucket was not found for the dashboard refresh."
            exit 1
          }

          DAILY_REPORT_FUNCTION_NAME="${PROJECT_NAME}-${ENVIRONMENT}-daily-report${MONITORING_RESOURCE_SUFFIX}"
          echo "Dashboard Daily Report Lambda: $DAILY_REPORT_FUNCTION_NAME"

          echo "Refreshing the dashboard source and service on the existing EC2 instance..."
          REMOTE_COMMANDS=$(cat <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          
          REPORT_BUCKET='__REPORT_BUCKET__'
          SOURCE_PREFIX='dashboard-source/__GITHUB_SHA__'
          ENVIRONMENT='__ENVIRONMENT__'
          AWS_REGION_VALUE='__AWS_REGION__'
          DAILY_REPORT_FUNCTION_NAME='__DAILY_REPORT_FUNCTION_NAME__'
          
          export AWS_DEFAULT_REGION="$AWS_REGION_VALUE"
          export AWS_REGION="$AWS_REGION_VALUE"
          
          install -d -m 700 /etc/cloudmart
          if [ ! -s /etc/cloudmart/dashboard.env ]; then
          umask 077
          printf 'FLASK_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" > /etc/cloudmart/dashboard.env
          chmod 600 /etc/cloudmart/dashboard.env
          fi
          
          # Keep the existing session secret stable across dashboard deployments.
          test -s /etc/cloudmart/dashboard.env
          
          mkdir -p /opt/cloudmart/dashboard

          # The virtual environment is local to EC2 and must never be managed by
          # the dashboard source sync. Remove it BEFORE --delete so AWS CLI does
          # not inspect stale/broken venv symlinks such as venv/bin/python3.9.
          rm -rf /opt/cloudmart/dashboard/venv

          aws s3 sync "s3://$REPORT_BUCKET/$SOURCE_PREFIX" /opt/cloudmart/dashboard --delete --exclude "venv/*" --exclude "venv"

          test -f /opt/cloudmart/dashboard/app.py
          test -f /opt/cloudmart/dashboard/requirements.txt

          # Use a copied Python interpreter instead of a symlink.

          # This prevents broken venv/bin/python3.x links on the EC2 host.

          rm -rf /opt/cloudmart/dashboard/venv

          python3 -m venv --copies /opt/cloudmart/dashboard/venv


          test -x /opt/cloudmart/dashboard/venv/bin/python || {

            echo "ERROR: Dashboard virtual environment Python was not created."

            ls -la /opt/cloudmart/dashboard/venv/bin || true

            exit 1

          }


          /opt/cloudmart/dashboard/venv/bin/python --version
          if ! grep -vE '^[[:space:]]*(pip|pip3)([[:space:]]|[<>=!~]|$)' \
          /opt/cloudmart/dashboard/requirements.txt \
          > /opt/cloudmart/dashboard/requirements-runtime.txt; then
            echo "ERROR: Failed to prepare requirements-runtime.txt"
            cat /opt/cloudmart/dashboard/requirements.txt || true
            exit 1
          fi
          
          /opt/cloudmart/dashboard/venv/bin/python -m pip install \
          --no-cache-dir \
          --disable-pip-version-check \
          -r /opt/cloudmart/dashboard/requirements-runtime.txt
          
          /opt/cloudmart/dashboard/venv/bin/python -m pip install \
          --no-cache-dir \
          --disable-pip-version-check \
          "gunicorn==22.0.0"
          
          # Verify the new application can import with the stable session key.
          set -a
          . /etc/cloudmart/dashboard.env
          set +a
          cd /opt/cloudmart/dashboard
          /opt/cloudmart/dashboard/venv/bin/python -c \
          "from app import app; print('CloudMart Flask application imported successfully')"
          
          cat > /etc/systemd/system/cloudmart-dashboard.service <<SERVICE
          [Unit]
          Description=CloudMart Operations Dashboard
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/opt/cloudmart/dashboard
          EnvironmentFile=/etc/cloudmart/dashboard.env
          Environment=PYTHONUNBUFFERED=1
          Environment=PYTHONPATH=/opt/cloudmart/dashboard
          Environment=AWS_DEFAULT_REGION=$AWS_REGION_VALUE
          Environment=AWS_REGION=$AWS_REGION_VALUE
          Environment=DB_HOST_PARAMETER_NAME=/cloudmart/$ENVIRONMENT/database/host
          Environment=DB_PORT_PARAMETER_NAME=/cloudmart/$ENVIRONMENT/database/port
          Environment=DB_NAME_PARAMETER_NAME=/cloudmart/$ENVIRONMENT/database/name
          Environment=DB_USERNAME_PARAMETER_NAME=/cloudmart/$ENVIRONMENT/database/username
          Environment=DB_PASSWORD_PARAMETER_NAME=/cloudmart/$ENVIRONMENT/database/password
          Environment=AUTH_TOKEN_PARAMETER_NAME=/cloudmart/$ENVIRONMENT/auth/token
          Environment=REPORT_BUCKET_NAME=$REPORT_BUCKET
          Environment=REPORT_PREFIX=reports
          Environment=DAILY_REPORT_FUNCTION_NAME=$DAILY_REPORT_FUNCTION_NAME
          Environment=PORT=80
          
          ExecStart=/opt/cloudmart/dashboard/venv/bin/gunicorn \\
          --bind 0.0.0.0:80 \\
          --workers 2 \\
          --timeout 120 \\
          --access-logfile - \\
          --error-logfile - \\
          app:app
          
          Restart=always
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          systemctl daemon-reload
          systemctl enable cloudmart-dashboard
          systemctl restart cloudmart-dashboard
          
          for attempt in $(seq 1 30); do
          if ss -lnt | grep -q ':80 '; then
          break
          fi
          if [ "$attempt" -eq 30 ]; then
          systemctl status cloudmart-dashboard --no-pager || true
          journalctl -u cloudmart-dashboard -n 100 --no-pager || true
          exit 1
          fi
          sleep 2
          done
          
          # /dashboard redirects to /login when unauthenticated; any normal 2xx/3xx response proves the service is responding.
          HTTP_CODE="$(curl -sS -o /tmp/cloudmart-dashboard-response.txt -w '%{http_code}' --connect-timeout 3 --max-time 10 http://127.0.0.1/dashboard || true)"
          case "$HTTP_CODE" in
          200|301|302|303|307|308) echo "Dashboard HTTP health check passed: $HTTP_CODE" ;;
          *)
          echo "ERROR: Dashboard HTTP health check failed: $HTTP_CODE"
          cat /tmp/cloudmart-dashboard-response.txt || true
          journalctl -u cloudmart-dashboard -n 100 --no-pager || true
          exit 1
          ;;
          esac
          
          echo "CloudMart dashboard refresh completed successfully."
          REMOTE_SCRIPT
          )
          
          REMOTE_COMMANDS="${REMOTE_COMMANDS//__REPORT_BUCKET__/$REPORT_BUCKET}"
          REMOTE_COMMANDS="${REMOTE_COMMANDS//__GITHUB_SHA__/$GITHUB_SHA}"
          REMOTE_COMMANDS="${REMOTE_COMMANDS//__ENVIRONMENT__/$ENVIRONMENT}"
          REMOTE_COMMANDS="${REMOTE_COMMANDS//__AWS_REGION__/$AWS_REGION}"
          REMOTE_COMMANDS="${REMOTE_COMMANDS//__DAILY_REPORT_FUNCTION_NAME__/$DAILY_REPORT_FUNCTION_NAME}"
          
          # Build the SSM request as JSON instead of passing the multiline
          # shell script directly through --parameters. This prevents AWS CLI
          # from parsing quotes, commas, and newlines inside the script as
          # separate SSM parameters.
          export REMOTE_COMMANDS
          export DASHBOARD_INSTANCE_ID
          export GITHUB_SHA

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          script = os.environ["REMOTE_COMMANDS"]
          payload = {
              "DocumentName": "AWS-RunShellScript",
              "InstanceIds": [os.environ["DASHBOARD_INSTANCE_ID"]],
              "Comment": f"CloudMart dashboard deployment {os.environ['GITHUB_SHA']}",
              "Parameters": {
                  "commands": script.splitlines()
              }
          }

          Path("/tmp/cloudmart-ssm-command.json").write_text(
              json.dumps(payload),
              encoding="utf-8"
          )
          PY

          SSM_COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/cloudmart-ssm-command.json \
            --region "$AWS_REGION" \
            --query 'Command.CommandId' \
            --output text)

          rm -f /tmp/cloudmart-ssm-command.json
          
          test -n "$SSM_COMMAND_ID" && test "$SSM_COMMAND_ID" != "None" || {
          echo "ERROR: SSM dashboard refresh command was not created."
          exit 1
          }
          
          echo "SSM dashboard refresh command: $SSM_COMMAND_ID"
          
          if ! aws ssm wait command-executed \
          --command-id "$SSM_COMMAND_ID" \
          --instance-id "$DASHBOARD_INSTANCE_ID" \
          --region "$AWS_REGION"; then
          echo "============================================================"
          echo "ERROR: Dashboard refresh command failed."
          echo "SSM command ID: $SSM_COMMAND_ID"
          echo "EC2 instance ID: $DASHBOARD_INSTANCE_ID"
          echo "============================================================"

          INVOCATION_JSON=$(aws ssm get-command-invocation \
            --command-id "$SSM_COMMAND_ID" \
            --instance-id "$DASHBOARD_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --output json)

          echo "SSM invocation status:"
          echo "$INVOCATION_JSON" | jq -r '
            "Status: " + (.Status // "UNKNOWN"),
            "ResponseCode: " + ((.ResponseCode // "UNKNOWN") | tostring),
            "StatusDetails: " + (.StatusDetails // "UNKNOWN")
          '

          echo "-------------------- REMOTE STDOUT --------------------"
          echo "$INVOCATION_JSON" | jq -r '.StandardOutputContent // ""'
          echo "-------------------- REMOTE STDERR --------------------"
          echo "$INVOCATION_JSON" | jq -r '.StandardErrorContent // ""'
          echo "--------------------------------------------------------"

          exit 1
          fi
          
          aws ssm get-command-invocation \
          --command-id "$SSM_COMMAND_ID" \
          --instance-id "$DASHBOARD_INSTANCE_ID" \
          --region "$AWS_REGION" \
          --query '{Status:Status,ResponseCode:ResponseCode,StatusDetails:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' \
          --output json
          
          # CloudFormation has already confirmed the EC2 resource was created.
          # Do not call ec2:DescribeInstanceStatus here because the GitHub
          # Actions role does not require that read permission just to publish
          # the dashboard URL.
          DASHBOARD_IP=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`OperationsEC2PublicIp`].OutputValue' \
            --output text)

          echo "Operations dashboard public IP: $DASHBOARD_IP"

          DASHBOARD_URL="http://${DASHBOARD_IP}/dashboard"

          echo "Dashboard URL:"
          echo "$DASHBOARD_URL"

          {
            echo "## CloudMart Operations Dashboard"
            echo ""
            echo "Dashboard URL: $DASHBOARD_URL"
            echo ""
            echo "EC2 instance: $DASHBOARD_INSTANCE_ID"
            echo "Dashboard source: ${DASHBOARD_SOURCE_PREFIX}/${GITHUB_SHA}"
            echo ""
            echo "The dashboard source was uploaded to S3 and refreshed on the running EC2 instance through SSM."
            echo "The Flask session secret is preserved on the EC2 instance and shared by both Gunicorn workers."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Dashboard deployment and automatic source refresh completed successfully."
