name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/order-flow
      - fix/database-ssm
    paths:
      - "cloudformation/**"
      - "lambdas/**"
      - "database/schema.sql"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ENVIRONMENT: ${{ vars.CLOUDMART_ENVIRONMENT || 'dev' }}

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy network stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-network-${ENVIRONMENT}"

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "Network stack status: ${STATUS:-NOT_FOUND}"

          if [ -z "$STATUS" ] || [ "$STATUS" = "None" ]; then
            echo "Network stack does not exist. Creating it with the existing GitHub Actions role."

            aws cloudformation deploy \
              --template-file cloudformation/network-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides Environment="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

            echo "Network stack created."
            exit 0
          fi

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is healthy."
              ;;
            UPDATE_ROLLBACK_COMPLETE)
              echo "Network stack is UPDATE_ROLLBACK_COMPLETE."
              echo "Preserving the existing Network stack to protect its exports."
              echo "No Network update will be attempted in this run."
              exit 0
              ;;
            CREATE_IN_PROGRESS|UPDATE_IN_PROGRESS|UPDATE_ROLLBACK_IN_PROGRESS|DELETE_IN_PROGRESS)
              echo "ERROR: Network stack is busy: $STATUS"
              exit 1
              ;;
            CREATE_FAILED|UPDATE_ROLLBACK_FAILED|DELETE_FAILED)
              echo "ERROR: Network stack is in failed state: $STATUS"
              exit 1
              ;;
            DELETE_COMPLETE)
              echo "Network stack is deleted. Recreating it."
              aws cloudformation deploy \
                --template-file cloudformation/network-stack.yaml \
                --stack-name "$STACK_NAME" \
                --region "$AWS_REGION" \
                --parameter-overrides Environment="$ENVIRONMENT" \
                --capabilities CAPABILITY_NAMED_IAM \
                --no-fail-on-empty-changeset
              ;;
            *)
              echo "ERROR: Unexpected Network stack state: $STATUS"
              exit 1
              ;;
          esac

          echo "Network stack deployment completed."

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest
    needs: deploy-network
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Recover failed IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "IAM stack status: ${STACK_STATUS:-NOT_FOUND}"

          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || \
             [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Removing failed/incomplete IAM stack: $STACK_NAME"

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "IAM stack removed."
            STACK_STATUS=""
          fi

      - name: Deploy IAM stack
        shell: bash
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-iam-${ENVIRONMENT}"

          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          echo "IAM stack status: ${STACK_STATUS:-NOT_FOUND}"

          # No Bootstrap resources are created here.
          # The existing GitHub Actions OIDC role remains external to CloudMart.
          #
          # CREATE:
          #   Use a CREATE change set with --import-existing-resources so that
          #   pre-existing CloudMart IAM resources can be adopted.
          #
          # EXISTING STACK:
          #   Use "cloudformation deploy" for a normal update. This is important
          #   because create-change-set returns FAILED when there are no changes.
          #   --no-fail-on-empty-changeset makes an already-up-to-date IAM stack
          #   succeed instead of failing the GitHub Actions job.

          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            echo "IAM stack does not exist. Creating and adopting existing IAM resources."

            CHANGE_SET_NAME="cloudmart-iam-${ENVIRONMENT}-$(date +%s)"

            aws cloudformation create-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --change-set-type CREATE \
              --template-body file://cloudformation/iam-stack.yaml \
              --parameters ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --import-existing-resources \
              --region "$AWS_REGION"

            aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation execute-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

          elif [ "$STACK_STATUS" = "CREATE_COMPLETE" ] || \
               [ "$STACK_STATUS" = "UPDATE_COMPLETE" ]; then

            echo "IAM stack already exists. Performing normal CloudFormation update."

            aws cloudformation deploy \
              --template-file cloudformation/iam-stack.yaml \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION" \
              --parameter-overrides Environment="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --no-fail-on-empty-changeset

          elif [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ] || \
               [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then

            echo "IAM stack is $STACK_STATUS. Removing the unfinished stack."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Recreating IAM stack with resource adoption."

            CHANGE_SET_NAME="cloudmart-iam-${ENVIRONMENT}-$(date +%s)"

            aws cloudformation create-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --change-set-type CREATE \
              --template-body file://cloudformation/iam-stack.yaml \
              --parameters ParameterKey=Environment,ParameterValue="$ENVIRONMENT" \
              --capabilities CAPABILITY_NAMED_IAM \
              --import-existing-resources \
              --region "$AWS_REGION"

            aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation execute-change-set \
              --stack-name "$STACK_NAME" \
              --change-set-name "$CHANGE_SET_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-create-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

          else
            echo "ERROR: IAM stack is in unsupported/busy state: $STACK_STATUS"
            exit 1
          fi

          IAM_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text)

          case "$IAM_STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is healthy: $IAM_STATUS"
              ;;
            *)
              echo "ERROR: IAM stack ended in unexpected state: $IAM_STATUS"
              exit 1
              ;;
          esac


  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest
    needs: deploy-iam
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy data stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_USERNAME" || { echo "CLOUDMART_DB_USERNAME is missing"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "CLOUDMART_DB_PASSWORD is missing"; exit 1; }

          STACK_NAME="cloudmart-data-${ENVIRONMENT}"

          # A failed first deployment can leave an empty REVIEW_IN_PROGRESS
          # CloudFormation stack. Remove only that unfinished stack automatically.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Removing unfinished Data stack: $STACK_NAME"
            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Unfinished Data stack removed."
          fi

          # Only remove an orphan auth token parameter when the Data stack
          # does not exist. Never mutate a parameter owned by CloudFormation.
          AUTH_PARAMETER="/cloudmart/${ENVIRONMENT}/auth/token"

          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            if aws ssm get-parameter               --name "$AUTH_PARAMETER"               --region "$AWS_REGION"               >/dev/null 2>&1; then

              echo "Removing orphan auth token parameter: $AUTH_PARAMETER"

              aws ssm delete-parameter                 --name "$AUTH_PARAMETER"                 --region "$AWS_REGION"

              echo "Orphan auth token parameter removed."
            fi
          fi

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName=cloudmart \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest
    needs: deploy-data
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/setup-sam@v2
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure SNS recovery permissions
        run: |
          set -euo pipefail

          cat > /tmp/cloudmart-sns-recovery-policy.json <<'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "CloudMartSNSRecoveryDiscovery",
                "Effect": "Allow",
                "Action": [
                  "sns:ListTopics",
                  "sns:ListSubscriptionsByTopic"
                ],
                "Resource": "*"
              },
              {
                "Sid": "ReadAmazonLinuxAmiParameter",
                "Effect": "Allow",
                "Action": [
                  "ssm:GetParameters"
                ],
                "Resource": "arn:aws:ssm:*::parameter/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"
              }
            ]
          }
          EOF

          aws iam put-role-policy             --role-name "CloudMart-GitHubActions-Role"             --policy-name "CloudMartSNSRecoveryDiscovery"             --policy-document file:///tmp/cloudmart-sns-recovery-policy.json

          echo "SNS recovery permissions are available."

      - name: Prepare schema
        run: cp database/schema.sql lambdas/product/schema.sql
      - name: Validate application template
        run: sam validate --template-file cloudformation/application-stack.yaml
      - name: Clean previous SAM build
        run: rm -rf .aws-sam

      - name: Build application
        run: |
          set -euo pipefail
          sam build --template-file cloudformation/application-stack.yaml
      - name: Deploy application
        env:
          ADMIN_EMAIL: ${{ vars.CLOUDMART_ADMIN_EMAIL }}
        run: |
          set -euo pipefail
          test -n "$ADMIN_EMAIL" || { echo "CLOUDMART_ADMIN_EMAIL is missing"; exit 1; }


          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          # CloudFormation cannot update a stack while it is being deleted.
          # Wait for an in-progress deletion instead of starting another
          # deployment against the same stack.
          STACK_STATUS=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)

          # A previous failed CREATE can leave the stack in REVIEW_IN_PROGRESS.
          # Remove that unfinished stack before starting SNS recovery.
          if [ "$STACK_STATUS" = "REVIEW_IN_PROGRESS" ]; then
            echo "Application stack is REVIEW_IN_PROGRESS: $STACK_NAME"
            echo "Deleting the unfinished stack..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Unfinished Application stack removed."
            STACK_STATUS=""
          fi

          if [ "$STACK_STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "Application stack is currently being deleted: $STACK_NAME"
            echo "Waiting for CloudFormation deletion to complete..."

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Application stack deletion completed."
            STACK_STATUS=""
          fi

          # A ROLLBACK_COMPLETE stack cannot be updated.
          # Delete only the failed application stack so it can be recreated.
          # SNS topics/subscriptions use Retain, so they are preserved and
          # automatically re-adopted below before the full SAM deployment.
          if [ "$STACK_STATUS" = "ROLLBACK_COMPLETE" ]; then
            echo "Application stack is ROLLBACK_COMPLETE: $STACK_NAME"
            echo "Deleting the failed stack..."

            aws cloudformation delete-stack \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            aws cloudformation wait stack-delete-complete \
              --stack-name "$STACK_NAME" \
              --region "$AWS_REGION"

            echo "Failed Application stack removed."
            STACK_STATUS=""
          fi

          # Recover the retained low-stock SNS resources if the application
          # stack had to be recreated. Order notifications no longer use SNS;
          # they are delivered by the Notification Lambda through SES.
          LOW_STOCK_TOPIC_NAME="cloudmart-${ENVIRONMENT}-low-stock"
          LOW_STOCK_TOPIC_ARN=""
          if [ -z "$STACK_STATUS" ] || [ "$STACK_STATUS" = "None" ]; then
            LOW_STOCK_TOPIC_ARN=$(aws sns list-topics               --region "$AWS_REGION"               --query 'Topics[].TopicArn'               --output text | tr '\t' '\n' | grep -E ":${LOW_STOCK_TOPIC_NAME}$" | head -n 1 || true)
          fi

          rm -f /tmp/cloudmart-sns-recovery.yaml /tmp/cloudmart-sns-import.json

          if [ -n "$LOW_STOCK_TOPIC_ARN" ]; then
            echo "Retained low-stock SNS topic detected; re-adopting it."
            cat > /tmp/cloudmart-sns-recovery.yaml <<'EOF'
          AWSTemplateFormatVersion: "2010-09-09"
          Resources:
            CloudMartLowStockTopic:
              Type: AWS::SNS::Topic
              DeletionPolicy: Retain
              UpdateReplacePolicy: Retain
              Properties:
                TopicName: "$LOW_STOCK_TOPIC_NAME"
          EOF

            LOW_STOCK_SUBSCRIPTION_ARN=$(aws sns list-subscriptions-by-topic               --topic-arn "$LOW_STOCK_TOPIC_ARN"               --region "$AWS_REGION"               --output json | jq -r --arg endpoint "$ADMIN_EMAIL"                 '.Subscriptions[]? | select(.Protocol=="email" and .Endpoint==$endpoint and .SubscriptionArn!="PendingConfirmation") | .SubscriptionArn'                 | head -n 1 || true)

            if [ -n "$LOW_STOCK_SUBSCRIPTION_ARN" ]; then
              cat >> /tmp/cloudmart-sns-recovery.yaml <<EOF
            CloudMartLowStockEmailSubscription:
              Type: AWS::SNS::Subscription
              DeletionPolicy: Retain
              UpdateReplacePolicy: Retain
              Properties:
                TopicArn: "$LOW_STOCK_TOPIC_ARN"
                Protocol: email
                Endpoint: "$ADMIN_EMAIL"
          EOF
            fi

            jq -n               --arg lowTopic "$LOW_STOCK_TOPIC_NAME"               --arg lowSub "$LOW_STOCK_SUBSCRIPTION_ARN"               '[
                {
                  ResourceType:"AWS::SNS::Topic",
                  LogicalResourceId:"CloudMartLowStockTopic",
                  ResourceIdentifier:{TopicName:$lowTopic}
                },
                (if $lowSub != "" then {
                  ResourceType:"AWS::SNS::Subscription",
                  LogicalResourceId:"CloudMartLowStockEmailSubscription",
                  ResourceIdentifier:{SubscriptionArn:$lowSub}
                } else empty end)
              ]' > /tmp/cloudmart-sns-import.json

            IMPORT_COUNT=$(jq 'length' /tmp/cloudmart-sns-import.json)
            RECOVERY_CHANGESET="cloudmart-sns-recovery-${GITHUB_RUN_ID}"

            aws cloudformation create-change-set               --stack-name "$STACK_NAME"               --change-set-name "$RECOVERY_CHANGESET"               --change-set-type CREATE               --template-body file:///tmp/cloudmart-sns-recovery.yaml               --resources-to-import file:///tmp/cloudmart-sns-import.json               --capabilities CAPABILITY_NAMED_IAM               --region "$AWS_REGION"

            aws cloudformation wait change-set-create-complete               --stack-name "$STACK_NAME"               --change-set-name "$RECOVERY_CHANGESET"               --region "$AWS_REGION"

            aws cloudformation execute-change-set               --stack-name "$STACK_NAME"               --change-set-name "$RECOVERY_CHANGESET"               --region "$AWS_REGION"

            aws cloudformation wait stack-import-complete               --stack-name "$STACK_NAME"               --region "$AWS_REGION"
            echo "Retained low-stock SNS resources successfully re-adopted."
          fi

          # SAM updates the recovered stack or creates a new stack when no
          # previous CloudFormation stack exists.
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName=cloudmart \
              AuthorizerCacheTTL=0 \
              NotificationEmail="$ADMIN_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}" \
              EC2InstanceType=t3.micro

           APP_STATUS=$(aws cloudformation describe-stacks \
             --stack-name "$STACK_NAME" \
             --region "$AWS_REGION" \
             --query 'Stacks[0].StackStatus' \
             --output text)

           case "$APP_STATUS" in
             CREATE_COMPLETE|UPDATE_COMPLETE)
               echo "Application stack is healthy: $APP_STATUS"
               ;;
             *)
               echo "ERROR: Application stack ended in unexpected state: $APP_STATUS"
               exit 1
               ;;
           esac

      - name: Verify deployed Authorizer with current SSM admin token
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          API_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RestApiId`].OutputValue' \
            --output text)

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query 'Account' \
            --output text)

          AUTH_PARAMETER="/cloudmart/${ENVIRONMENT}/auth/token"

          RAW_AUTH_CONFIG=$(aws ssm get-parameter \
            --name "$AUTH_PARAMETER" \
            --with-decryption \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text)

          ADMIN_TOKEN=$(printf '%s' "$RAW_AUTH_CONFIG" | jq -er '.admin_token // .token')

          test -n "$ADMIN_TOKEN" || {
            echo "ERROR: Admin token is empty in $AUTH_PARAMETER"
            exit 1
          }

          METHOD_ARN="arn:aws:execute-api:${AWS_REGION}:${ACCOUNT_ID}:${API_ID}/${ENVIRONMENT}/GET/products"

          export ADMIN_TOKEN

          python - "$METHOD_ARN" <<'PY' > /tmp/authorizer-test.json
          import json
          import os
          import sys

          method_arn = sys.argv[1]
          token = os.environ["ADMIN_TOKEN"]

          print(json.dumps({
              "type": "TOKEN",
              "authorizationToken": "Bearer " + token,
              "methodArn": method_arn,
          }))
          PY

          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-authorizer" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/authorizer-test.json \
            /tmp/authorizer-response.json \
            >/tmp/authorizer-invoke-meta.json

          jq -e '
            .policyDocument.Statement[0].Effect == "Allow"
            and .principalId == "cloudmart-admin"
          ' /tmp/authorizer-response.json >/dev/null || {
            echo "ERROR: Deployed Authorizer rejected the current SSM admin token."
            echo "Authorizer response:"
            jq 'del(.context)' /tmp/authorizer-response.json
            exit 1
          }

          echo "Direct Authorizer validation passed."

          rm -f \
            /tmp/authorizer-test.json \
            /tmp/authorizer-response.json \
            /tmp/authorizer-invoke-meta.json

  initialize:
    name: Initialize CloudMart
    runs-on: ubuntu-latest
    needs: deploy-application
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Initialize database
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-product" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_database"}' \
            /tmp/db.json
          jq -e '.statusCode == 200' /tmp/db.json >/dev/null
          rm -f /tmp/db.json
          echo "Database initialization completed successfully."
      - name: Initialize authentication tokens
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name "cloudmart-${ENVIRONMENT}-token-manager" \
            --region "$AWS_REGION" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"initialize_tokens"}' \
            /tmp/auth.json
          jq -e '.statusCode == 200' /tmp/auth.json >/dev/null
          rm -f /tmp/auth.json
          echo "Authentication tokens initialized successfully."

      - name: Verify GET /products through API Gateway
        run: |
          set -euo pipefail

          STACK_NAME="cloudmart-application-${ENVIRONMENT}"

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs[?OutputKey==`RestApiUrl`].OutputValue' \
            --output text)

          AUTH_PARAMETER="/cloudmart/${ENVIRONMENT}/auth/token"

          RAW_AUTH_CONFIG=$(aws ssm get-parameter \
            --name "$AUTH_PARAMETER" \
            --with-decryption \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text)

          ADMIN_TOKEN=$(printf '%s' "$RAW_AUTH_CONFIG" | jq -er '.admin_token // .token')

          HTTP_STATUS=$(curl -sS \
            -o /tmp/products-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API_URL}/products")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: End-to-end GET /products returned HTTP ${HTTP_STATUS}."
            echo "Response:"
            cat /tmp/products-response.json
            exit 1
          fi

