name: Deploy CloudMart


on:

  push:
    branches:
      - main

    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - ".github/workflows/deploy.yaml"

  workflow_dispatch:


# ==========================================================
# PERMISSIONS
# ==========================================================

permissions:
  id-token: write
  contents: read


# ==========================================================
# ENVIRONMENT
# ==========================================================

env:

  AWS_REGION: us-east-1

  PROJECT_NAME: cloudmart

  ENVIRONMENT: dev

  NETWORK_STACK_NAME: cloudmart-network-dev

  DATA_STACK_NAME: cloudmart-data-dev

  IAM_STACK_NAME: cloudmart-iam-dev

  APPLICATION_STACK_NAME: cloudmart-application-dev


# ==========================================================
# DEPLOY
# ==========================================================

jobs:

  deploy:

    name: Deploy CloudMart

    runs-on: ubuntu-latest


    steps:

      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ====================================================
      # AWS CREDENTIALS
      # ====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

          aws-region: ${{ env.AWS_REGION }}

          role-session-name: CloudMartGitHubActions


      # ====================================================
      # VERIFY AWS
      # ====================================================

      - name: Verify AWS identity
        shell: bash
        run: |

          set -e

          echo "Checking AWS identity..."

          aws sts get-caller-identity


      # ====================================================
      # VALIDATE NETWORK STACK
      # ====================================================

      - name: Validate Network Stack
        shell: bash
        run: |

          set -e

          echo "Validating network-stack.yaml..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # DEPLOY NETWORK STACK
      # ====================================================

      - name: Deploy Network Stack
        shell: bash
        run: |

          set -e

          echo "Deploying Network Stack..."

          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name "$NETWORK_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME"

          echo "Network Stack deployed."


      # ====================================================
      # VALIDATE DATA STACK
      # ====================================================

      - name: Validate Data Stack
        shell: bash
        run: |

          set -e

          echo "Validating data-stack.yaml..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # DATABASE PASSWORD
      # ====================================================

      - name: Check database password
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          set -e

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          echo "Database password is available."


      # ====================================================
      # DEPLOY DATA STACK
      # ====================================================

      - name: Deploy Data Stack
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        run: |

          set -e

          echo "Deploying Data Stack..."

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name "$DATA_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              DBName="cloudmart" \
              DBUsername="cloudmartadmin" \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass="db.t3.micro" \
              AllocatedStorage="20"

          echo "Data Stack deployed."


      # ====================================================
      # VALIDATE IAM STACK
      # ====================================================

      - name: Validate IAM Stack
        shell: bash
        run: |

          set -e

          echo "Validating iam-stack.yaml..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # DEPLOY IAM STACK
      # ====================================================

      - name: Deploy IAM Stack
        shell: bash
        run: |

          set -e

          echo "Deploying IAM Stack..."

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME"

          echo "IAM Stack deployed."


      # ====================================================
      # GET AUTHORIZE ROLE
      # ====================================================

      - name: Get Lambda Authorizer Role ARN
        shell: bash
        run: |

          set -e

          echo "Getting Lambda Authorizer IAM role..."

          AUTHORIZER_ROLE_ARN=$(aws cloudformation describe-stacks \
            --stack-name "$IAM_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          if [ -z "$AUTHORIZER_ROLE_ARN" ] || [ "$AUTHORIZER_ROLE_ARN" = "None" ]; then

            echo "ERROR: LambdaAuthorizerRoleArn output is missing from IAM stack."

            echo "Available IAM stack outputs:"

            aws cloudformation describe-stacks \
              --stack-name "$IAM_STACK_NAME" \
              --region "$AWS_REGION" \
              --query "Stacks[0].Outputs"

            exit 1

          fi

          echo "Lambda Authorizer Role:"
          echo "$AUTHORIZER_ROLE_ARN"

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE_ARN" >> "$GITHUB_ENV"


      # ====================================================
      # VALIDATE APPLICATION STACK
      # ====================================================

      - name: Validate Application Stack
        shell: bash
        run: |

          set -e

          echo "Validating application-stack.yaml..."

          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml \
            --region "$AWS_REGION"


      # ====================================================
      # DEPLOY APPLICATION STACK
      # ====================================================

      - name: Deploy Application Stack
        shell: bash
        run: |

          set -e

          echo "Deploying Application Stack..."

          echo "IAM Authorizer Role:"
          echo "$AUTHORIZER_ROLE_ARN"

          aws cloudformation deploy \
            --template-file cloudformation/application-stack.yaml \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="$ENVIRONMENT" \
              ProjectName="$PROJECT_NAME" \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              AuthorizerCacheTTL="300" \
              TokenParameterName="/cloudmart/dev/auth/token"

          echo "Application Stack deployed."


      # ====================================================
      # SHOW APPLICATION OUTPUTS
      # ====================================================

      - name: Show Application Stack Outputs
        shell: bash
        run: |

          set -e

          echo ""
          echo "=================================================="
          echo "CloudMart Application Stack Outputs"
          echo "=================================================="

          aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs"


      # ====================================================
      # GET API ID
      # ====================================================

      - name: Get API Gateway ID
        shell: bash
        run: |

          set -e

          REST_API_ID=$(aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='RestApiId'].OutputValue | [0]" \
            --output text)

          if [ -z "$REST_API_ID" ] || [ "$REST_API_ID" = "None" ]; then
            echo "ERROR: RestApiId output is missing."
            exit 1
          fi

          echo ""
          echo "CloudMart API Gateway REST API ID:"
          echo "$REST_API_ID"

          echo "REST_API_ID=$REST_API_ID" >> "$GITHUB_ENV"


      # ====================================================
      # GET API URL
      # ====================================================

      - name: Get API Gateway URL
        shell: bash
        run: |

          set -e

          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "$APPLICATION_STACK_NAME" \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='RestApiUrl'].OutputValue | [0]" \
            --output text)

          echo ""
          echo "CloudMart API Gateway URL:"
          echo "$API_URL"


      # ====================================================
      # FINAL SUCCESS
      # ====================================================

      - name: Deployment Complete
        shell: bash
        run: |

          echo ""
          echo "=================================================="
          echo "CLOUDMART DEPLOYMENT COMPLETED"
          echo "=================================================="
          echo ""
          echo "Environment : $ENVIRONMENT"
          echo "Region      : $AWS_REGION"
          echo "Network     : $NETWORK_STACK_NAME"
          echo "Data        : $DATA_STACK_NAME"
          echo "IAM         : $IAM_STACK_NAME"
          echo "Application : $APPLICATION_STACK_NAME"
          echo "API ID      : $REST_API_ID"
          echo ""