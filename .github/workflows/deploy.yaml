name: Deploy Network Stack

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK_NAME: cloudmart-network-dev
  TEMPLATE_FILE: cloudformation/network-stack.yaml

jobs:
  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS identity and region
        run: |
          echo "AWS_REGION=$AWS_REGION"
          aws sts get-caller-identity
          aws configure get region || true

      - name: Validate Network CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://$TEMPLATE_FILE \
            --region us-east-1

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file $TEMPLATE_FILE \
            --stack-name $STACK_NAME \
            --region us-east-1 \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Show Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --region us-east-1

      - name: Show Network Outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --region us-east-1 \
            --query "Stacks[0].Outputs"