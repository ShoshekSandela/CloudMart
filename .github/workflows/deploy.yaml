name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambdas/**"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # =========================================================
  # NETWORK STACK
  # =========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is ready."
              ;;
            *)
              echo "ERROR: Network stack is not ready."
              exit 1
              ;;
          esac


  # =========================================================
  # DATA STACK
  # =========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Data Stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        shell: bash
        run: |

          echo "Checking database credentials..."

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          echo "Database credentials are available."

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              DBInstanceClass=db.t3.micro \
              DBName=cloudmart \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              ExistingReportBucketName=cloudmart-dev-reports \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Data Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Data stack is ready."
              ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac


  # =========================================================
  # IAM STACK
  # =========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Existing IAM Stack
        id: iam_status
        continue-on-error: true
        shell: bash
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "IAM Stack Status: $STATUS"

      - name: Delete IAM Stack in ROLLBACK_COMPLETE
        if: steps.iam_status.outputs.status == 'ROLLBACK_COMPLETE'
        shell: bash
        run: |

          echo "IAM stack is in ROLLBACK_COMPLETE."
          echo "Deleting failed IAM stack..."

          aws cloudformation delete-stack \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          aws cloudformation wait stack-delete-complete \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          echo "IAM stack deleted."

      - name: Deploy IAM Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is ready."
              ;;
            *)
              echo "ERROR: IAM stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # SSM AUTH TOKEN
      # =====================================================

      - name: Verify Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        shell: bash
        run: |

          if [ -z "$AUTH_TOKEN" ]; then
            echo "ERROR: CLOUDMART_AUTH_TOKEN is missing."
            exit 1
          fi

          echo "Auth token is available."

      - name: Create or Update SSM Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        shell: bash
        run: |

          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --value "$AUTH_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"

          echo "SSM auth token created/updated."


  # =========================================================
  # APPLICATION STACK
  # =========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      # =====================================================
      # SETUP SAM
      # =====================================================

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      # =====================================================
      # AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # =====================================================
      # VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # =====================================================
      # VERIFY PREVIOUS STACKS
      # =====================================================

      - name: Verify Network Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack: $STATUS"

      - name: Verify Data Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack: $STATUS"

      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack: $STATUS"


      # =====================================================
      # NOTIFICATION EMAIL
      # =====================================================

      - name: Verify Notification Email
        env:
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}

        shell: bash
        run: |

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          echo "Notification email is available."


      # =====================================================
      # VALIDATE APPLICATION TEMPLATE
      # =====================================================

      - name: Validate Application Stack
        run: |

          sam validate \
            --template-file cloudformation/application-stack.yaml

          echo "Application template validation completed."


      # =====================================================
      # GET NETWORK STACK OUTPUTS
      #
      # No cloudformation:list-exports required.
      # =====================================================

      - name: Get Network Outputs
        shell: bash
        run: |

          echo "Getting Network stack outputs..."

          PRIVATE_SUBNET_1=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          echo "Private Subnet 1: $PRIVATE_SUBNET_1"
          echo "Private Subnet 2: $PRIVATE_SUBNET_2"
          echo "Lambda Security Group: $LAMBDA_SECURITY_GROUP"

          if [ -z "$PRIVATE_SUBNET_1" ] || [ "$PRIVATE_SUBNET_1" = "None" ]; then
            echo "ERROR: PrivateSubnet1Id output is missing."
            exit 1
          fi

          if [ -z "$PRIVATE_SUBNET_2" ] || [ "$PRIVATE_SUBNET_2" = "None" ]; then
            echo "ERROR: PrivateSubnet2Id output is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP" ] || [ "$LAMBDA_SECURITY_GROUP" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId output is missing."
            exit 1
          fi

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_1},${PRIVATE_SUBNET_2}" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP_ID=${LAMBDA_SECURITY_GROUP}" >> "$GITHUB_ENV"

          echo "Network outputs loaded successfully."


      # =====================================================
      # GET IAM STACK OUTPUTS
      #
      # IMPORTANT:
      # LambdaAuthorizerRoleArn is the correct output key
      # from your IAM template.
      # =====================================================

      - name: Get Lambda IAM Role ARNs
        shell: bash
        run: |

          echo "Getting Lambda IAM role ARNs..."

          AUTHORIZER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          ORDER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='OrderLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          REPORT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          echo "Authorizer Role: $AUTHORIZER_ROLE"
          echo "Product Role: $PRODUCT_ROLE"
          echo "Order Role: $ORDER_ROLE"
          echo "Report Role: $REPORT_ROLE"

          if [ -z "$AUTHORIZER_ROLE" ] || [ "$AUTHORIZER_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn output is missing."
            exit 1
          fi

          if [ -z "$ORDER_ROLE" ] || [ "$ORDER_ROLE" = "None" ]; then
            echo "ERROR: OrderLambdaRoleArn output is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE" ] || [ "$REPORT_ROLE" = "None" ]; then
            echo "ERROR: ReportLambdaRoleArn output is missing."
            exit 1
          fi

          echo "AUTHORIZE_ROLE=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE=$REPORT_ROLE" >> "$GITHUB_ENV"

          echo "All Lambda IAM role ARNs found successfully."


      # =====================================================
      # GET DATA STACK OUTPUTS
      # =====================================================

      - name: Get Data Stack Outputs
        shell: bash
        run: |

          echo "Getting Data stack outputs..."

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          echo "Report Bucket: $REPORT_BUCKET"
          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"

          if [ -z "$REPORT_BUCKET" ] || [ "$REPORT_BUCKET" = "None" ]; then
            echo "ERROR: ReportBucketName output is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DBEndpoint output is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DBPort output is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DBName output is missing."
            exit 1
          fi

          echo "REPORT_BUCKET_NAME=$REPORT_BUCKET" >> "$GITHUB_ENV"
          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"

          echo "Data outputs loaded successfully."


      # =====================================================
      # SAM BUILD
      # =====================================================

      - name: Build Lambda application
        run: |

          echo "Building Lambda application..."

          sam build \
            --template-file cloudformation/application-stack.yaml

          echo "SAM build completed successfully."


      # =====================================================
      # SAM DEPLOY
      #
      # SAM automatically manages Lambda packaging.
      # No CLOUDMART_LAMBDA_ARTIFACT_BUCKET variable required.
      # =====================================================

      - name: Deploy Application Stack
        env:
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        shell: bash
        run: |

          echo "Preparing Application Stack deployment..."

          # ---------------------------------------------------
          # MAP IAM ROLE VALUES
          # ---------------------------------------------------

          AUTHORIZER_ROLE_ARN="$AUTHORIZE_ROLE"
          PRODUCT_ROLE_ARN="$PRODUCT_ROLE"
          ORDER_ROLE_ARN="$ORDER_ROLE"
          REPORT_ROLE_ARN="$REPORT_ROLE"

          # ---------------------------------------------------
          # VALIDATE ALL VALUES
          # ---------------------------------------------------

          if [ -z "$PRIVATE_SUBNET_IDS" ]; then
            echo "ERROR: PRIVATE_SUBNET_IDS is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP_ID" ]; then
            echo "ERROR: LAMBDA_SECURITY_GROUP_ID is missing."
            exit 1
          fi

          if [ -z "$AUTHORIZER_ROLE_ARN" ] || [ "$AUTHORIZER_ROLE_ARN" = "None" ]; then
            echo "ERROR: AUTHORIZER_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE_ARN" ] || [ "$PRODUCT_ROLE_ARN" = "None" ]; then
            echo "ERROR: PRODUCT_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$ORDER_ROLE_ARN" ] || [ "$ORDER_ROLE_ARN" = "None" ]; then
            echo "ERROR: ORDER_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE_ARN" ] || [ "$REPORT_ROLE_ARN" = "None" ]; then
            echo "ERROR: REPORT_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$REPORT_BUCKET_NAME" ] || [ "$REPORT_BUCKET_NAME" = "None" ]; then
            echo "ERROR: REPORT_BUCKET_NAME is missing."
            exit 1
          fi

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DB_HOST is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DB_PORT is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DB_NAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          echo "All Application Stack values are available."

          # ---------------------------------------------------
          # DISPLAY NON-SECRET VALUES
          # ---------------------------------------------------

          echo "Private Subnets: $PRIVATE_SUBNET_IDS"
          echo "Lambda Security Group: $LAMBDA_SECURITY_GROUP_ID"
          echo "Authorizer Role: $AUTHORIZER_ROLE_ARN"
          echo "Product Role: $PRODUCT_ROLE_ARN"
          echo "Order Role: $ORDER_ROLE_ARN"
          echo "Report Role: $REPORT_ROLE_ARN"
          echo "Report Bucket: $REPORT_BUCKET_NAME"
          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"

          # ---------------------------------------------------
          # DEPLOY APPLICATION
          # ---------------------------------------------------

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              Environment=dev \
              PrivateSubnetIds="$PRIVATE_SUBNET_IDS" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              AuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductRoleArn="$PRODUCT_ROLE_ARN" \
              OrderRoleArn="$ORDER_ROLE_ARN" \
              ReportRoleArn="$REPORT_ROLE_ARN" \
              ReportBucketName="$REPORT_BUCKET_NAME" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
              ReportScheduleExpression="rate(1 day)" \
              DBHost="$DB_HOST" \
              DBPort="$DB_PORT" \
              DBName="$DB_NAME" \
              DBUsername="cloudmartadmin" \
              DBPassword="$DB_PASSWORD"

          echo "Application Stack deployment completed."


      # =====================================================
      # VERIFY APPLICATION STACK
      # =====================================================

      - name: Verify Application Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Application Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Application stack deployed successfully."
              ;;
            *)
              echo "ERROR: Application stack deployment did not complete successfully."
              exit 1
              ;;
          esac


      # =====================================================
      # SHOW APPLICATION OUTPUTS
      # =====================================================

      - name: Show Application Outputs
        run: |

          echo "=================================================="
          echo "CLOUDMART APPLICATION OUTPUTS"
          echo "=================================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # =====================================================
      # FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show Application Failure Events
        if: failure()
        shell: bash
        run: |

          echo "=================================================="
          echo "APPLICATION STACK FAILURE DIAGNOSTICS"
          echo "=================================================="

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo ""
          echo "CloudFormation failure events:"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_FAILED'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true