name: Deploy CloudMart Infrastructure

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "cloudformation/network-stack.yaml"
      - "cloudformation/data-stack.yaml"
      - "cloudformation/iam-stack.yaml"
      - "cloudformation/application-stack.yaml"
      - "lambdas/**"
      - "lambdas/product/requirements.txt"
      - "database/schema.sql"
      - ".github/workflows/deploy.yaml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # =========================================================
  # NETWORK STACK
  # =========================================================

  deploy-network:
    name: Deploy Network Stack
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Validate Network Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Network Stack
        run: |
          aws cloudformation deploy \
            --template-file cloudformation/network-stack.yaml \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Network Stack
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Network stack is ready."
              ;;
            *)
              echo "ERROR: Network stack is not ready."
              exit 1
              ;;
          esac


  # =========================================================
  # DATA STACK
  # =========================================================

  deploy-data:
    name: Deploy Data Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-network

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Network Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate Data Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml \
            --region "$AWS_REGION"

      - name: Deploy Data Stack
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        shell: bash
        run: |

          echo "Checking database credentials..."

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          echo "Database credentials are available."

          aws cloudformation deploy \
            --template-file cloudformation/data-stack.yaml \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
              DBInstanceClass=db.t3.micro \
              DBName=cloudmart \
              AllocatedStorage=20 \
              DBUsername="$DB_USERNAME" \
              DBPassword="$DB_PASSWORD" \
              ExistingReportBucketName=cloudmart-dev-reports \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify Data Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Data stack is ready."
              ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # CREATE DATABASE SSM PARAMETERS
      # =====================================================

      - name: Create or Update Database SSM Parameters
        env:
          DB_USERNAME: ${{ secrets.CLOUDMART_DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Reading RDS outputs from Data Stack..."

          DB_HOST=$(aws cloudformation describe-stacks             --stack-name cloudmart-data-dev             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]"             --output text)

          DB_PORT=$(aws cloudformation describe-stacks             --stack-name cloudmart-data-dev             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]"             --output text)

          DB_NAME=$(aws cloudformation describe-stacks             --stack-name cloudmart-data-dev             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]"             --output text)

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DBEndpoint output is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DBPort output is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DBName output is missing."
            exit 1
          fi

          if [ -z "$DB_USERNAME" ]; then
            echo "ERROR: CLOUDMART_DB_USERNAME secret is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD secret is missing."
            exit 1
          fi

          echo "RDS endpoint: $DB_HOST"
          echo "RDS port: $DB_PORT"
          echo "Database: $DB_NAME"

          aws ssm put-parameter             --name "/cloudmart/dev/database/host"             --type "String"             --value "$DB_HOST"             --overwrite             --region "$AWS_REGION"

          aws ssm put-parameter             --name "/cloudmart/dev/database/port"             --type "String"             --value "$DB_PORT"             --overwrite             --region "$AWS_REGION"

          aws ssm put-parameter             --name "/cloudmart/dev/database/name"             --type "String"             --value "$DB_NAME"             --overwrite             --region "$AWS_REGION"

          aws ssm put-parameter             --name "/cloudmart/dev/database/username"             --type "SecureString"             --value "$DB_USERNAME"             --overwrite             --region "$AWS_REGION"

          aws ssm put-parameter             --name "/cloudmart/dev/database/password"             --type "SecureString"             --value "$DB_PASSWORD"             --overwrite             --region "$AWS_REGION"

          echo "Database SSM parameters created/updated."


      # =====================================================
      # VERIFY DATABASE SSM PARAMETERS
      # =====================================================

      - name: Verify Database SSM Parameters
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying database SSM parameters..."

          aws ssm get-parameter             --name "/cloudmart/dev/database/host"             --region "$AWS_REGION"             --query "Parameter.Name"             --output text

          aws ssm get-parameter             --name "/cloudmart/dev/database/port"             --region "$AWS_REGION"             --query "Parameter.Name"             --output text

          aws ssm get-parameter             --name "/cloudmart/dev/database/name"             --region "$AWS_REGION"             --query "Parameter.Name"             --output text

          USERNAME_TYPE=$(aws ssm get-parameter             --name "/cloudmart/dev/database/username"             --region "$AWS_REGION"             --query "Parameter.Type"             --output text)

          if [ "$USERNAME_TYPE" != "SecureString" ]; then
            echo "ERROR: Database username is not SecureString."
            exit 1
          fi

          PASSWORD_TYPE=$(aws ssm get-parameter             --name "/cloudmart/dev/database/password"             --region "$AWS_REGION"             --query "Parameter.Type"             --output text)

          if [ "$PASSWORD_TYPE" != "SecureString" ]; then
            echo "ERROR: Database password is not SecureString."
            exit 1
          fi

          echo "Database SSM parameter verification passed."


  # =========================================================
  # IAM STACK
  # =========================================================

  deploy-iam:
    name: Deploy IAM Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-data

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Verify Data Stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text

      - name: Validate IAM Stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml \
            --region "$AWS_REGION"

      - name: Check Existing IAM Stack
        id: iam_status
        continue-on-error: true
        shell: bash
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text 2>/dev/null || echo "DOES_NOT_EXIST")

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          echo "IAM Stack Status: $STATUS"

      - name: Delete IAM Stack in ROLLBACK_COMPLETE
        if: steps.iam_status.outputs.status == 'ROLLBACK_COMPLETE'
        shell: bash
        run: |

          echo "IAM stack is in ROLLBACK_COMPLETE."
          echo "Deleting failed IAM stack..."

          aws cloudformation delete-stack \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          aws cloudformation wait stack-delete-complete \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION"

          echo "IAM stack deleted."

      - name: Deploy IAM Stack
        run: |

          aws cloudformation deploy \
            --template-file cloudformation/iam-stack.yaml \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset

      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "IAM stack is ready."
              ;;
            *)
              echo "ERROR: IAM stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # SSM SECURESTRING AUTH TOKEN
      # =====================================================

      - name: Verify Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        shell: bash
        run: |

          if [ -z "$AUTH_TOKEN" ]; then
            echo "ERROR: CLOUDMART_AUTH_TOKEN is missing."
            exit 1
          fi

          echo "Auth token is available."


      - name: Create or Update SSM Auth Token
        env:
          AUTH_TOKEN: ${{ secrets.CLOUDMART_AUTH_TOKEN }}

        shell: bash
        run: |

          aws ssm put-parameter \
            --name "/cloudmart/dev/auth/token" \
            --value "$AUTH_TOKEN" \
            --type SecureString \
            --overwrite \
            --region "$AWS_REGION"

          echo "SSM SecureString auth token created/updated."


      - name: Verify SSM Auth Token Parameter
        run: |

          PARAM_TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/dev/auth/token" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)

          echo "SSM Auth Token Parameter Type: $PARAM_TYPE"

          if [ "$PARAM_TYPE" != "SecureString" ]; then
            echo "ERROR: Auth token is not stored as SecureString."
            exit 1
          fi

          echo "SSM SecureString verification passed."


      # =====================================================
      # IAM FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show IAM Stack Failure Events
        if: failure()
        run: |

          echo "IAM STACK STATUS"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "IAM STACK FAILURE EVENTS"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true


  # =========================================================
  # APPLICATION STACK
  # =========================================================

  deploy-application:
    name: Deploy Application Stack
    runs-on: ubuntu-latest

    needs:
      - deploy-iam

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5


      # =====================================================
      # SETUP SAM
      # =====================================================

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2


      # =====================================================
      # AWS CREDENTIALS
      # =====================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # =====================================================
      # VERIFY AWS
      # =====================================================

      - name: Verify AWS identity
        run: |

          echo "AWS Region: $AWS_REGION"

          aws sts get-caller-identity


      # =====================================================
      # VERIFY PREVIOUS STACKS
      # =====================================================

      - name: Verify Network Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Network Stack: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: Network stack is not ready."
              exit 1
              ;;
          esac


      - name: Verify Data Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Data Stack: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: Data stack is not ready."
              exit 1
              ;;
          esac


      - name: Verify IAM Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "IAM Stack: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              ;;
            *)
              echo "ERROR: IAM stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # VERIFY SSM AUTH TOKEN
      # =====================================================

      - name: Verify SSM Auth Token
        run: |

          PARAM_TYPE=$(aws ssm get-parameter \
            --name "/cloudmart/dev/auth/token" \
            --region "$AWS_REGION" \
            --query "Parameter.Type" \
            --output text)

          echo "Auth Token Parameter Type: $PARAM_TYPE"

          if [ "$PARAM_TYPE" != "SecureString" ]; then
            echo "ERROR: SSM auth token parameter is not SecureString."
            exit 1
          fi

          echo "SSM auth token is ready."


      # =====================================================
      # NOTIFICATION EMAIL
      # =====================================================

      - name: Verify Notification Email
        env:
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}

        shell: bash
        run: |

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          echo "Notification email is available."


      # =====================================================
      # GET NETWORK OUTPUTS
      # =====================================================

      - name: Get Network Outputs
        shell: bash
        run: |

          echo "Getting Network stack outputs..."

          PRIVATE_SUBNET_1=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet1Id'].OutputValue | [0]" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='PrivateSubnet2Id'].OutputValue | [0]" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaSecurityGroupId'].OutputValue | [0]" \
            --output text)

          echo "Private Subnet 1: $PRIVATE_SUBNET_1"
          echo "Private Subnet 2: $PRIVATE_SUBNET_2"
          echo "Lambda Security Group: $LAMBDA_SECURITY_GROUP"

          if [ -z "$PRIVATE_SUBNET_1" ] || [ "$PRIVATE_SUBNET_1" = "None" ]; then
            echo "ERROR: PrivateSubnet1Id output is missing."
            exit 1
          fi

          if [ -z "$PRIVATE_SUBNET_2" ] || [ "$PRIVATE_SUBNET_2" = "None" ]; then
            echo "ERROR: PrivateSubnet2Id output is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP" ] || [ "$LAMBDA_SECURITY_GROUP" = "None" ]; then
            echo "ERROR: LambdaSecurityGroupId output is missing."
            exit 1
          fi

          echo "PRIVATE_SUBNET_IDS=${PRIVATE_SUBNET_1},${PRIVATE_SUBNET_2}" >> "$GITHUB_ENV"

          echo "LAMBDA_SECURITY_GROUP_ID=$LAMBDA_SECURITY_GROUP" >> "$GITHUB_ENV"

          echo "Network outputs loaded successfully."


      # =====================================================
      # GET IAM LAMBDA ROLE ARNS
      # =====================================================

      - name: Get Lambda IAM Role ARNs
        shell: bash
        run: |

          echo "Getting Lambda IAM role ARNs..."

          AUTHORIZER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaAuthorizerRoleArn'].OutputValue | [0]" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ProductLambdaRoleArn'].OutputValue | [0]" \
            --output text)
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='InventoryEventLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          ORDER_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='OrderLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          REPORT_ROLE=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportLambdaRoleArn'].OutputValue | [0]" \
            --output text)

          echo "Authorizer Role: $AUTHORIZER_ROLE"
          echo "Product Role: $PRODUCT_ROLE"
          echo "Order Role: $ORDER_ROLE"
          echo "Report Role: $REPORT_ROLE"

          if [ -z "$AUTHORIZER_ROLE" ] || [ "$AUTHORIZER_ROLE" = "None" ]; then
            echo "ERROR: LambdaAuthorizerRoleArn output is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE" ] || [ "$PRODUCT_ROLE" = "None" ]; then
            echo "ERROR: ProductLambdaRoleArn output is missing."
            exit 1
          fi

          if [ -z "$ORDER_ROLE" ] || [ "$ORDER_ROLE" = "None" ]; then
            echo "ERROR: OrderLambdaRoleArn output is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE" ] || [ "$REPORT_ROLE" = "None" ]; then
            echo "ERROR: ReportLambdaRoleArn output is missing."
            exit 1
          fi

          echo "AUTHORIZER_ROLE_ARN=$AUTHORIZER_ROLE" >> "$GITHUB_ENV"

          echo "PRODUCT_ROLE_ARN=$PRODUCT_ROLE" >> "$GITHUB_ENV"

          echo "INVENTORY_EVENT_ROLE_ARN=$INVENTORY_EVENT_ROLE" >> "$GITHUB_ENV"

          echo "ORDER_ROLE_ARN=$ORDER_ROLE" >> "$GITHUB_ENV"

          echo "REPORT_ROLE_ARN=$REPORT_ROLE" >> "$GITHUB_ENV"

          echo "All Lambda IAM role ARNs loaded successfully."


      # =====================================================
      # GET DATA STACK OUTPUTS
      # =====================================================

      - name: Get Data Stack Outputs
        shell: bash
        run: |

          echo "Getting Data stack outputs..."

          REPORT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='ReportBucketName'].OutputValue | [0]" \
            --output text)

          DB_HOST=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBEndpoint'].OutputValue | [0]" \
            --output text)

          DB_PORT=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBPort'].OutputValue | [0]" \
            --output text)

          DB_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='DBName'].OutputValue | [0]" \
            --output text)

          echo "Report Bucket: $REPORT_BUCKET"
          echo "DB Host: $DB_HOST"
          echo "DB Port: $DB_PORT"
          echo "DB Name: $DB_NAME"

          if [ -z "$REPORT_BUCKET" ] || [ "$REPORT_BUCKET" = "None" ]; then
            echo "ERROR: ReportBucketName output is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ] || [ "$DB_HOST" = "None" ]; then
            echo "ERROR: DBEndpoint output is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ] || [ "$DB_PORT" = "None" ]; then
            echo "ERROR: DBPort output is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ] || [ "$DB_NAME" = "None" ]; then
            echo "ERROR: DBName output is missing."
            exit 1
          fi

          echo "REPORT_BUCKET_NAME=$REPORT_BUCKET" >> "$GITHUB_ENV"

          echo "DB_HOST=$DB_HOST" >> "$GITHUB_ENV"

          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"

          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"

          echo "Data outputs loaded successfully."


      # =====================================================
      # VERIFY REQUIRED APPLICATION VALUES
      # =====================================================

      - name: Verify Application Configuration
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}

        shell: bash
        run: |

          if [ -z "$PRIVATE_SUBNET_IDS" ]; then
            echo "ERROR: PRIVATE_SUBNET_IDS is missing."
            exit 1
          fi

          if [ -z "$LAMBDA_SECURITY_GROUP_ID" ]; then
            echo "ERROR: LAMBDA_SECURITY_GROUP_ID is missing."
            exit 1
          fi

          if [ -z "$AUTHORIZER_ROLE_ARN" ]; then
            echo "ERROR: AUTHORIZER_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$PRODUCT_ROLE_ARN" ]; then
            echo "ERROR: PRODUCT_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$INVENTORY_EVENT_ROLE_ARN" ]; then
            echo "ERROR: INVENTORY_EVENT_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$ORDER_ROLE_ARN" ]; then
            echo "ERROR: ORDER_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$REPORT_ROLE_ARN" ]; then
            echo "ERROR: REPORT_ROLE_ARN is missing."
            exit 1
          fi

          if [ -z "$REPORT_BUCKET_NAME" ]; then
            echo "ERROR: REPORT_BUCKET_NAME is missing."
            exit 1
          fi

          if [ -z "$DB_HOST" ]; then
            echo "ERROR: DB_HOST is missing."
            exit 1
          fi

          if [ -z "$DB_PORT" ]; then
            echo "ERROR: DB_PORT is missing."
            exit 1
          fi

          if [ -z "$DB_NAME" ]; then
            echo "ERROR: DB_NAME is missing."
            exit 1
          fi

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          if [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          echo "All Application Stack values are available."


      # =====================================================
      # VALIDATE APPLICATION STACK
      # =====================================================

      - name: Validate Application Stack
        run: |

          sam validate \
            --template-file cloudformation/application-stack.yaml

          echo "Application template validation completed."


      # =====================================================
      # SAM BUILD
      # =====================================================

      - name: Verify Lambda source code
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Lambda source files..."

          if [ ! -f "lambdas/authorizer/index.py" ]; then
            echo "ERROR: lambdas/authorizer/index.py is missing."
            exit 1
          fi

          if [ ! -f "lambdas/product/index.py" ]; then
            echo "ERROR: lambdas/product/index.py is missing."
            exit 1
          fi

          if [ ! -f "lambdas/product/requirements.txt" ]; then
            echo "ERROR: lambdas/product/requirements.txt is missing."
            exit 1
          fi

          if [ ! -f "lambdas/inventory-event/index.py" ]; then
            echo "ERROR: lambdas/inventory-event/index.py is missing."
            exit 1
          fi

          echo "Product Lambda requirements.txt:"
          cat lambdas/product/requirements.txt

          if ! grep -qi '^PyMySQL==' lambdas/product/requirements.txt; then
            echo "ERROR: PyMySQL is not pinned in lambdas/product/requirements.txt."
            exit 1
          fi

          echo "All required Lambda source files are present."

      - name: Prepare Product Lambda schema
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "database/schema.sql" ]; then
            echo "ERROR: database/schema.sql is missing."
            exit 1
          fi

          cp database/schema.sql lambdas/product/schema.sql

          echo "schema.sql copied into Product Lambda build context."

      - name: Build Lambda application
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting SAM build..."

          sam build \
            --template-file cloudformation/application-stack.yaml \
            --build-dir .aws-sam/build

          echo "SAM build completed successfully."

          echo "Checking Product Lambda build output..."

          if [ ! -d ".aws-sam/build/ProductFunction" ]; then
            echo "ERROR: ProductFunction was not created by SAM build."
            exit 1
          fi

          if [ ! -d ".aws-sam/build/ProductFunction/pymysql" ]; then
            echo "ERROR: PyMySQL was not included in ProductFunction."
            echo "The Lambda cannot be deployed safely."
            exit 1
          fi

          echo "PyMySQL is included in the Product Lambda build."

          if [ ! -f ".aws-sam/build/ProductFunction/schema.sql" ]; then
            echo "ERROR: schema.sql was not included in ProductFunction."
            exit 1
          fi

          echo "schema.sql is included in the Product Lambda build."

          if [ ! -d ".aws-sam/build/InventoryEventFunction" ]; then
            echo "ERROR: InventoryEventFunction was not created by SAM build."
            exit 1
          fi

          if [ ! -f ".aws-sam/build/InventoryEventFunction/index.py" ]; then
            echo "ERROR: InventoryEventFunction index.py is missing from SAM build."
            exit 1
          fi

      - name: Verify SAM build output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ".aws-sam/build/template.yaml" ]; then
            echo "ERROR: SAM build template was not generated."
            exit 1
          fi

          echo "SAM build output is ready for deployment."

      # =====================================================
      # SAM DEPLOY APPLICATION STACK
      # =====================================================

      - name: Deploy Application Stack
        env:
          NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}

        shell: bash
        run: |

          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              Environment=dev \
              ProjectName=cloudmart \
              PrivateSubnetIds="$PRIVATE_SUBNET_IDS" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP_ID" \
              LambdaAuthorizerRoleArn="$AUTHORIZER_ROLE_ARN" \
              ProductLambdaRoleArn="$PRODUCT_ROLE_ARN" \
              AuthorizerCacheTTL=300 \
              TokenParameterName="/cloudmart/dev/auth/token" \
              DBHostParameterName="/cloudmart/dev/database/host" \
              DBPortParameterName="/cloudmart/dev/database/port" \
              DBNameParameterName="/cloudmart/dev/database/name" \
              DBUsernameParameterName="/cloudmart/dev/database/username" \
              DBPasswordParameterName="/cloudmart/dev/database/password" \
              NotificationEmail="$NOTIFICATION_EMAIL" \
              ApiDeploymentVersion="${GITHUB_RUN_NUMBER}"

          echo "Application Stack deployment completed successfully."


      # =====================================================
      # VERIFY APPLICATION STACK
      # =====================================================

      - name: Verify Application Stack
        run: |

          STATUS=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Application Stack Status: $STATUS"

          case "$STATUS" in
            CREATE_COMPLETE|UPDATE_COMPLETE)
              echo "Application stack is ready."
              ;;
            *)
              echo "ERROR: Application stack is not ready."
              exit 1
              ;;
          esac


      # =====================================================
      # CREATE EVENTBRIDGE / SNS SSM PARAMETERS
      # =====================================================

      - name: Create Event and Notification SSM Parameters
        shell: bash
        run: |
          set -euo pipefail

          EVENT_BUS_ARN=$(aws cloudformation describe-stacks             --stack-name cloudmart-application-dev             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='EventBusArn'].OutputValue | [0]"             --output text)

          SNS_TOPIC_ARN=$(aws cloudformation describe-stacks             --stack-name cloudmart-application-dev             --region "$AWS_REGION"             --query "Stacks[0].Outputs[?OutputKey=='LowStockTopicArn'].OutputValue | [0]"             --output text)

          if [ -z "$EVENT_BUS_ARN" ] || [ "$EVENT_BUS_ARN" = "None" ]; then
            echo "ERROR: EventBusArn output is missing."
            exit 1
          fi

          if [ -z "$SNS_TOPIC_ARN" ] || [ "$SNS_TOPIC_ARN" = "None" ]; then
            echo "ERROR: LowStockTopicArn output is missing."
            exit 1
          fi

          aws ssm put-parameter             --name "/cloudmart/dev/events/event-bus-arn"             --type "String"             --value "$EVENT_BUS_ARN"             --overwrite             --region "$AWS_REGION"

          aws ssm put-parameter             --name "/cloudmart/dev/notifications/sns-topic-arn"             --type "String"             --value "$SNS_TOPIC_ARN"             --overwrite             --region "$AWS_REGION"

          echo "EventBridge and SNS SSM parameters created/updated."

      # =====================================================
      # VERIFY AUTHORIZER LAMBDA
      # =====================================================

      - name: Verify Authorizer Lambda
        run: |

          AUTHORIZE_LAMBDA=$(aws lambda get-function \
            --function-name cloudmart-dev-authorizer \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)

          echo "Authorizer Lambda: $AUTHORIZE_LAMBDA"

          if [ -z "$AUTHORIZE_LAMBDA" ] || [ "$AUTHORIZE_LAMBDA" = "None" ]; then
            echo "ERROR: Authorizer Lambda was not found."
            exit 1
          fi

          echo "Authorizer Lambda verified successfully."


      # =====================================================
      # VERIFY PRODUCT LAMBDA
      # =====================================================

      - name: Verify Product Lambda
        run: |

          PRODUCT_LAMBDA=$(aws lambda get-function \
            --function-name cloudmart-dev-product \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)

          echo "Product Lambda: $PRODUCT_LAMBDA"

          if [ -z "$PRODUCT_LAMBDA" ] || [ "$PRODUCT_LAMBDA" = "None" ]; then
            echo "ERROR: Product Lambda was not found."
            exit 1
          fi

          echo "Product Lambda verified successfully."


      # =====================================================
      # VERIFY INVENTORY EVENT LAMBDA
      # =====================================================

      - name: Verify Inventory Event Lambda
        shell: bash
        run: |
          set -euo pipefail

          INVENTORY_LAMBDA=$(aws lambda get-function \
            --function-name cloudmart-dev-inventory-event \
            --region "$AWS_REGION" \
            --query "Configuration.FunctionArn" \
            --output text)


      - name: Verify EventBridge Inventory Target
        shell: bash
        run: |
          set -euo pipefail

          EVENT_BUS_NAME=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='EventBusName'].OutputValue | [0]" \
            --output text)

          EVENT_LAMBDA_ARN=$(aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs[?OutputKey=='InventoryEventLambdaArn'].OutputValue | [0]" \
            --output text)

          TARGET_ARN=$(aws events list-targets-by-rule \
            --rule "cloudmart-dev-inventory-changed" \
            --event-bus-name "$EVENT_BUS_NAME" \
            --region "$AWS_REGION" \
            --query "Targets[0].Arn" \
            --output text)

          echo "Expected target: $EVENT_LAMBDA_ARN"
          echo "Actual target:   $TARGET_ARN"

          if [ -z "$TARGET_ARN" ] || [ "$TARGET_ARN" = "None" ]; then
            echo "ERROR: Inventory Changed rule has no target."
            exit 1
          fi

          if [ "$TARGET_ARN" != "$EVENT_LAMBDA_ARN" ]; then

          echo "EventBridge inventory target verified successfully."


      # =====================================================
      # SHOW APPLICATION OUTPUTS
      # =====================================================

      - name: Show Application Outputs
        run: |

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].Outputs" \
            --output table


      # =====================================================
      # APPLICATION FAILURE DIAGNOSTICS
      # =====================================================

      - name: Show Application Stack Failure Events
        if: failure()
        run: |

          echo "APPLICATION STACK STATUS"

          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "Stacks[0].[StackStatus,StackStatusReason]" \
            --output table || true

          echo "APPLICATION STACK FAILURE EVENTS"

          aws cloudformation describe-stack-events \
            --stack-name cloudmart-application-dev \
            --region "$AWS_REGION" \
            --query "StackEvents[?ResourceStatus=='CREATE_FAILED' || ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='DELETE_FAILED' || ResourceStatus=='ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_IN_PROGRESS' || ResourceStatus=='UPDATE_ROLLBACK_COMPLETE_CLEANUP_IN_PROGRESS'].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus,ResourceStatusReason]" \
            --output table || true

  verify-eventbridge-sns:
    name: Verify EventBridge SNS Target
    needs: deploy-application
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EventBridge low-stock SNS target
        shell: bash
        run: |
          set -euo pipefail

          RULE_NAME="cloudmart-dev-low-stock"
          EVENT_BUS="cloudmart-dev-event-bus"

          echo "Checking low-stock EventBridge SNS target..."

          TARGETS=$(aws events list-targets-by-rule             --rule "$RULE_NAME"             --event-bus-name "$EVENT_BUS"             --region "$AWS_REGION"             --query 'Targets[*].Arn'             --output text)

          echo "Targets: $TARGETS"

          if [ -z "$TARGETS" ] || [ "$TARGETS" = "None" ]; then
            echo "ERROR: Low-stock EventBridge rule has no target."
            exit 1
          fi

          case "$TARGETS" in
            *:sns:cloudmart-dev-low-stock*)
              echo "EventBridge low-stock SNS target verified."
              ;;
            *)
              echo "ERROR: Low-stock rule target is not the CloudMart low-stock SNS topic."
              exit 1
              ;;
          esac
