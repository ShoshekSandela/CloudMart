AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  API Gateway with Lambda TOKEN Authorizer, Product Lambda,
  Order Lambda, authenticated order API, EventBridge inventory events and SNS low-stock notifications.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String
    Default: cloudmart

  LambdaAuthorizerRoleArn:
    Type: String

  ProductLambdaRoleArn:
    Type: String

  OrderLambdaRoleArn:
    Type: String

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600

  TokenParameterName:
    Type: String

  DBHostParameterName:
    Type: String

  DBPortParameterName:
    Type: String

  DBNameParameterName:
    Type: String

  DBUsernameParameterName:
    Type: String

  DBPasswordParameterName:
    Type: String

  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: ADMIN email used for low-stock and admin order notifications.

  CustomerEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: CUSTOMER email used for customer identity and order notifications.

  ApiDeploymentVersion:
    Type: String
    Default: "225"
    Description: Change this value to force a new API Gateway deployment.

Resources:

  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-event-bus"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartLowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-low-stock"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Create a fresh SNS email subscription.
  # The previous CloudMartLowStockSubscription is in the Deleted state,
  # so a new logical resource is required.
  CloudMartLowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartLowStockTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudMartLowStockTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartLowStockTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-low-stock"

  LowStockEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartLowStockTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-low-stock"
      Description: Routes low-stock inventory events to SNS notifications.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.product
        detail-type:
          - "Inventory Changed"
        detail:
          low_stock:
            - true
      Targets:
        - Id: LowStockSNSTarget
          Arn: !Ref CloudMartLowStockTopic
          InputTransformer:
            InputPathsMap:
              productId: "$.detail.product_id"
              productName: "$.detail.product_name"
              oldStock: "$.detail.old_stock"
              newStock: "$.detail.new_stock"
              threshold: "$.detail.low_stock_threshold"
            InputTemplate: "\"CLOUDMART LOW STOCK ALERT\\n\\nProduct: <productName>\\nProduct ID: <productId>\\n\\nSTOCK STATUS\\nPrevious Stock: <oldStock>\\nCurrent Stock: <newStock>\\nLow Stock Limit: <threshold>\\n\\nACTION REQUIRED\\nPlease replenish this product soon.\\n\\n— CloudMart\""
  # ============================================================
  # ORDER LIFECYCLE EVENTS -> SNS
  # ============================================================

  CloudMartOrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-admin-order-notifications"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartOrderNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartOrderNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CloudMartOrderNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudMartOrderNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublishOrderEvents
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartOrderNotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-placed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-confirmed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-canceled"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-failed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-completed"

  # ============================================================
  # CUSTOMER ORDER NOTIFICATIONS
  # ============================================================

  CloudMartCustomerOrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-customer-order-notifications"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartCustomerOrderNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartCustomerOrderNotificationTopic
      Protocol: email
      Endpoint: !Ref CustomerEmail

  CloudMartCustomerOrderNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudMartCustomerOrderNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublishCustomerOrderEvents
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartCustomerOrderNotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-placed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-confirmed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-canceled"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-failed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-completed"

  OrderPlacedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartOrderNotificationTopicPolicy
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed"
      Description: Routes CloudMart OrderPlaced events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderPlaced
      Targets:
        - Id: OrderPlacedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART ADMIN ORDER PLACED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been placed.\\n\\nPlease review the order details in CloudMart.\\n\\n— CloudMart\""

        - Id: CustomerOrderSNSTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART CUSTOMER ORDER PLACED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been placed.\\n\\nThank you for shopping with CloudMart.\\n\\n— CloudMart\""
  OrderConfirmedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartOrderNotificationTopicPolicy
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-confirmed"
      Description: Routes CloudMart OrderConfirmed events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderConfirmed
      Targets:
        - Id: OrderConfirmedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART ADMIN ORDER CONFIRMED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been confirmed.\\n\\nPlease review the order details in CloudMart.\\n\\n— CloudMart\""

        - Id: CustomerOrderSNSTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART CUSTOMER ORDER CONFIRMED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been confirmed.\\n\\nThank you for shopping with CloudMart.\\n\\n— CloudMart\""
  OrderCanceledEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartOrderNotificationTopicPolicy
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-canceled"
      Description: Routes CloudMart OrderCanceled events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderCanceled
      Targets:
        - Id: OrderCanceledSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART ADMIN ORDER CANCELED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been canceled.\\n\\nPlease review the order details in CloudMart.\\n\\n— CloudMart\""

        - Id: CustomerOrderSNSTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART CUSTOMER ORDER CANCELED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been canceled.\\n\\nThank you for shopping with CloudMart.\\n\\n— CloudMart\""
  OrderFailedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartOrderNotificationTopicPolicy
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-failed"
      Description: Routes CloudMart OrderFailed events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderFailed
      Targets:
        - Id: OrderFailedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART ADMIN ORDER FAILED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has failed to process.\\n\\nPlease review the order details in CloudMart.\\n\\n— CloudMart\""

        - Id: CustomerOrderSNSTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART CUSTOMER ORDER FAILED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has failed to process.\\n\\nThank you for shopping with CloudMart.\\n\\n— CloudMart\""
  OrderCompletedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartOrderNotificationTopicPolicy
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-completed"
      Description: Routes CloudMart OrderCompleted events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderCompleted
      Targets:
        - Id: OrderCompletedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART ADMIN ORDER COMPLETED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been completed.\\n\\nPlease review the order details in CloudMart.\\n\\n— CloudMart\""

        - Id: CustomerOrderSNSTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              customerEmail: "$.detail.customer_email"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: "\"CLOUDMART CUSTOMER ORDER COMPLETED\\n\\nOrder #<orderId>\\n\\nSTATUS: <status>\\n\\nCUSTOMER\\nName: <customerName>\\nEmail: <customerEmail>\\n\\nITEMS PURCHASED\\n--------------------------------\\n<itemsSummary>\\n\\n--------------------------------\\nTOTAL AMOUNT: <total>\\n\\nYour order has been completed.\\n\\nThank you for shopping with CloudMart.\\n\\n— CloudMart\""
  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-authorizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/authorizer/
      Role: !Ref LambdaAuthorizerRoleArn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Ref TokenParameterName
          ADMIN_EMAIL: !Ref NotificationEmail
          CUSTOMER_EMAIL: !Ref CustomerEmail
          CUSTOMER_ID: "1"
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaAuthorizer
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*"

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn: LambdaAuthorizerPermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-token-authorizer"
      RestApiId: !Ref CloudMartRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

  ProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/product/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-ProductLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  OrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-order"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/order/
      Role: !Ref OrderLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
          CUSTOMER_EMAIL: !Ref CustomerEmail
          CUSTOMER_ID: "1"
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  OrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-order"
      RetentionInDays: 30

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: orders

  OrdersByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 4: GET /orders?customerId=X
  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.querystring.customerId: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 3: GET /orders/{id}
  GetOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK: PUT /orders/{id}
  # Updates an existing order, including item quantities.
  PutOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
