AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  API Gateway REST API with Lambda TOKEN Authorizer and Product Lambda
  integrated with the private RDS MySQL database.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  ProjectName:
    Type: String
    Default: cloudmart

  LambdaAuthorizerRoleArn:
    Type: String
    Description: IAM role ARN for the Lambda Authorizer.

  ProductLambdaRoleArn:
    Type: String
    Description: IAM role ARN for the Product Lambda.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs used by Product Lambda.

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda security group used by Product Lambda.

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600

  TokenParameterName:
    Type: String
    Default: /cloudmart/dev/auth/token

  DBHostParameterName:
    Type: String
    Default: /cloudmart/dev/database/host

  DBPortParameterName:
    Type: String
    Default: /cloudmart/dev/database/port

  DBNameParameterName:
    Type: String
    Default: /cloudmart/dev/database/name

  DBUsernameParameterName:
    Type: String
    Default: /cloudmart/dev/database/username

  DBPasswordParameterName:
    Type: String
    Default: /cloudmart/dev/database/password

Resources:

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types:
          - REGIONAL
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # AUTHORIZER LAMBDA
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-authorizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/authorizer/
      Role: !Ref LambdaAuthorizerRoleArn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Ref TokenParameterName
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaAuthorizer
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn:
      - LambdaAuthorizerPermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-token-authorizer"
      RestApiId: !Ref CloudMartRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: python3.12

    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/product/
      Role: !Ref ProductLambdaRoleArn
      Timeout: 15
      MemorySize: 256

      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds

      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName

      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ==========================================================
  # /products
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: products

  # ==========================================================
  # /products/{id}
  # ==========================================================

  ProductByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  # ==========================================================
  # GET /products
  # ==========================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ==========================================================
  # POST /products
  # ==========================================================

  PostProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ==========================================================
  # GET /products/{id}
  # ==========================================================

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ==========================================================
  # PUT /products/{id}
  # ==========================================================

  PutProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ==========================================================
  # DELETE /products/{id}
  # ==========================================================

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ==========================================================
  # API GATEWAY DEPLOYMENT
  # ==========================================================

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAuthorizer
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod
    Properties:
      RestApiId: !Ref CloudMartRestApi
      Description: !Sub "CloudMart ${Environment} API deployment"

  # ==========================================================
  # DEV STAGE
  # ==========================================================

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: !Ref Environment
      Description: !Sub "CloudMart ${Environment} API Gateway stage"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  RestApiId:
    Description: API Gateway REST API ID
    Value: !Ref CloudMartRestApi

  RestApiUrl:
    Description: API Gateway URL
    Value: !Sub "https://${CloudMartRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductFunction.Arn

  ProductLambdaName:
    Description: Product Lambda name
    Value: !Ref ProductFunction

  AuthorizerLambdaArn:
    Description: Lambda Authorizer ARN
    Value: !GetAtt LambdaAuthorizer.Arn

  ApiGatewayAuthorizerId:
    Description: API Gateway Authorizer ID
    Value: !Ref ApiGatewayAuthorizer

  AuthorizerCacheTTL:
    Description: Authorizer cache TTL
    Value: !Ref AuthorizerCacheTTL