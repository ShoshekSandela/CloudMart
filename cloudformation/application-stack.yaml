AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  Creates API Gateway, Lambda functions, EventBridge rules, SNS notifications,
  and event-driven application resources. IAM roles are imported from the IAM stack.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment loaded from cloudformation/parameters.json.
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String

  AuthorizerCacheTTL:
    Type: Number
    MinValue: 0
    MaxValue: 3600

  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ExistingOrderNotificationTopicArn:
    Type: String
    Description: ARN of the pre-existing CloudMart order-notification SNS topic.

  ExistingLowStockTopicArn:
    Type: String
    Description: ARN of the pre-existing CloudMart low-stock SNS topic.

  ExistingEventBusName:
    Type: String
    Description: Name of the pre-existing CloudMart EventBridge event bus.

  ApiDeploymentVersion:
    Type: String

Resources:

  # REST API entry point for CloudMart clients.
  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # SNS topics are pre-existing resources in AWS.
  # This stack references them by ARN instead of trying to create them again.
  #
  # The GitHub Actions workflow verifies that both topics exist before
  # deploying this stack and passes their ARNs as parameters.
  #
  # The low-stock email subscription remains CloudFormation-managed.
  LowStockTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ExistingLowStockTopicArn
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # SNS resource policy allows the notification Lambda to publish
  # formatted low-stock notifications to the existing admin topic.
  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ExistingLowStockTopicArn
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowNotificationLambdaPublish
            Effect: Allow
            Principal:
              AWS:
                Fn::ImportValue: !Sub "CloudMart-${Environment}-NotificationLambdaRoleArn"
            Action: sns:Publish
            Resource: !Ref ExistingLowStockTopicArn

  # Routes low-stock inventory events to the same Notification Lambda
  # used by customer order notifications.
  # EventBridge rules are owned by this Application stack.
  # Do not retain them on stack deletion; the shared EventBridge bus remains external.
  LowStockEventRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    DependsOn:
      - CloudMartLowStockTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-low-stock"
      Description: Routes low-stock Inventory Changed events to the Notification Lambda.
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source: [cloudmart.product]
        detail-type: ["Inventory Changed"]
        detail:
          low_stock: [true]
      Targets:
        - Id: LowStockNotificationLambda
          Arn: !GetAtt NotificationFunction.Arn

  LowStockNotificationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotificationFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt LowStockEventRule.Arn
  # Routes customer order events to SNS. The SNS email subscription is
  # filtered by the authenticated customer's customer_id.
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-notification"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/notification/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-NotificationLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          ORDER_NOTIFICATION_TOPIC_ARN: !Ref ExistingOrderNotificationTopicArn
          LOW_STOCK_TOPIC_ARN: !Ref ExistingLowStockTopicArn
          CUSTOMER_REGISTRATION_VERSION: "2"
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-notification"
      RetentionInDays: 30

  NotificationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotificationFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      # Restrict invocation to CloudMart EventBridge notification rules.
      # The five rules below all publish to this Lambda.
      SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ExistingEventBusName}/${ProjectName}-${Environment}-order-*-notification"

  OrderPlacedNotificationRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed-notification"
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderPlaced]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderConfirmedNotificationRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-confirmed-notification"
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderConfirmed]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderCanceledNotificationRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-canceled-notification"
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderCanceled]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderFailedNotificationRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-failed-notification"
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderFailed]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderCompletedNotificationRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-completed-notification"
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderCompleted]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  # Validates the Authorization token used by protected API routes.
  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-authorizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/authorizer/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaAuthorizerRoleArn"
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/token
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          DEPLOYMENT_VERSION: !Ref ApiDeploymentVersion
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaAuthorizer
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*"

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn: LambdaAuthorizerPermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-token-authorizer"
      RestApiId: !Ref CloudMartRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      # Exact methodArn policies are request-specific, so disable authorizer caching.
      # TOKEN authorizer caching is keyed by the token and can reuse a policy
      # generated for a different API method/path.
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

  # Token lifecycle is isolated from request authorization.
  TokenManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-token-manager"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/token-manager/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-TokenManagerLambdaRoleArn"
      Timeout: 15
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/token
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  # Handles product and inventory operations against RDS MySQL.
  ProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/product/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-ProductLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          EVENT_BUS_NAME: !Ref ExistingEventBusName
          ENVIRONMENT: !Ref Environment
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # Dedicated customer lifecycle and notification-subscription API.
  CustomerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-customer"
      Runtime: python3.12
      Handler: index.lambda_handler_v2
      CodeUri: ../lambdas/customer/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-CustomerLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          ORDER_NOTIFICATION_TOPIC_ARN: !Ref ExistingOrderNotificationTopicArn
          CUSTOMER_REGISTRATION_VERSION: "2"
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  CustomerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CustomerFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # Handles customer order creation and order lifecycle events.
  OrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-order"
      Timeout: 60
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/order/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-OrderLambdaRoleArn"
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          EVENT_BUS_NAME: !Ref ExistingEventBusName
          ENVIRONMENT: !Ref Environment
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  OrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-order"
      RetentionInDays: 30

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # ============================================================
  # ASYNCHRONOUS ORDER STOCK PROCESSING
  # OrderPlaced -> check RDS stock -> CONFIRMED or FAILED
  # ============================================================

  OrderPlacedProcessingEventRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Delete
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed-processing"
      Description: Processes newly placed PENDING orders asynchronously.
      EventBusName: !Ref ExistingEventBusName
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderPlaced
      Targets:
        - Id: OrderPlacedProcessingLambda
          Arn: !GetAtt OrderFunction.Arn

  OrderPlacedProcessingLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt OrderPlacedProcessingEventRule.Arn

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: orders

  PatchOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  OrdersByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  OrderStatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersByIdResource
      PathPart: status

  PatchOrderStatusMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrderStatusResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 4: GET /orders?customerId=X
  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.querystring.customerId: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 3: GET /orders/{id}
  GetOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK: PUT /orders/{id}
  # Updates an existing order, including item quantities.
  PutOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: products

  ProductByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      # Product browsing is public. No customer/admin token is required.
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PostProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: GET
      # Product browsing is public. No customer/admin token is required.
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PutProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ============================================================
  # CUSTOMERS
  #
  # Customer CRUD and explicit unsubscribe are handled by the
  # dedicated Customer Lambda.
  # ============================================================

  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: customers

  CustomerByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref CustomersResource
      PathPart: "{id}"

  CustomerUnsubscribeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref CustomerByIdResource
      PathPart: unsubscribe

  GetAllCustomersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ApiGatewayAuthorizer
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  GetCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  PostCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomersResource
      HttpMethod: POST
      # Customer registration is intentionally public.
      # The Customer Lambda generates and returns the customer's token.
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  PutCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  DeleteCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  PostCustomerUnsubscribeMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerUnsubscribeResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  ApiGatewayDeploymentV8:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAuthorizer
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod
      - PostOrdersMethod
      - GetOrdersMethod
      - GetOrderByIdMethod
      - PutOrderByIdMethod
      - PatchOrderStatusMethod
      - PatchOrdersMethod
      - GetAllCustomersMethod
      - GetCustomerMethod
      - PostCustomerMethod
      - PutCustomerMethod
      - DeleteCustomerMethod
      - PostCustomerUnsubscribeMethod
    Properties:
      RestApiId: !Ref CloudMartRestApi
      Description: !Sub "CloudMart ${Environment} API deployment ${ApiDeploymentVersion} - V8"

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartRestApi
      DeploymentId: !Ref ApiGatewayDeploymentV8
      StageName: !Ref Environment
      Description: !Sub "CloudMart ${Environment} API Gateway stage"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  RestApiId:
    Value: !Ref CloudMartRestApi

  RestApiUrl:
    Value: !Sub "https://${CloudMartRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  ProductLambdaArn:
    Value: !GetAtt ProductFunction.Arn

  ProductLambdaName:
    Value: !Ref ProductFunction

  CustomerLambdaArn:
    Value: !GetAtt CustomerFunction.Arn

  TokenManagerLambdaArn:
    Value: !GetAtt TokenManagerFunction.Arn

  NotificationLambdaArn:
    Value: !GetAtt NotificationFunction.Arn

  OrderLambdaArn:
    Value: !GetAtt OrderFunction.Arn

  OrderLambdaName:
    Value: !Ref OrderFunction

  AuthorizerLambdaArn:
    Value: !GetAtt LambdaAuthorizer.Arn

  ApiGatewayAuthorizerId:
    Value: !Ref ApiGatewayAuthorizer

  AuthorizerCacheTTL:
    Value: !Ref AuthorizerCacheTTL

  EventBusName:
    Value: !Ref ExistingEventBusName

  EventBusArn:
    Value: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ExistingEventBusName}"

  # Expose the ARNs of the pre-existing SNS topics used by this stack.
  OrderNotificationTopicArn:
    Value: !Ref ExistingOrderNotificationTopicArn

  LowStockTopicArn:
    Value: !Ref ExistingLowStockTopicArn

  LowStockRuleArn:
    Value: !GetAtt LowStockEventRule.Arn