AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Application Authorization Stack.
  Creates Lambda TOKEN Authorizer, SSM SecureString integration,
  API Gateway authorizer, authorizer caching, and API Gateway
  Lambda invoke permission.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  ProjectName:
    Type: String
    Default: cloudmart

  ExistingRestApiId:
    Type: String
    Description: >
      Existing API Gateway REST API ID used by CloudMart.

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600
    Description: >
      Lambda Authorizer result cache TTL in seconds.
      300 seconds = 5 minutes.

  TokenParameterName:
    Type: String
    Default: /cloudmart/dev/api/auth-token
    Description: >
      SSM Parameter Store SecureString parameter containing
      the CloudMart API authorization token.

Resources:

  # ==========================================================
  # IAM ROLE FOR LAMBDA AUTHORIZER
  # ==========================================================

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-authorizer-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:

          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: AuthorizerCloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*

        # ----------------------------------------------------
        # READ TOKEN FROM SSM PARAMETER STORE
        # ----------------------------------------------------

        - PolicyName: AuthorizerReadSSMToken
          PolicyDocument:
            Version: "2012-10-17"
            Statement:

              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub >
                    arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${TokenParameterName}

              # ------------------------------------------------
              # Required when the SecureString uses a KMS key.
              # If AWS managed SSM key is used, this permission
              # can normally be omitted.
              # ------------------------------------------------

              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: "*"

  # ==========================================================
  # LAMBDA AUTHORIZER
  # ==========================================================

  AuthorizerLambda:
    Type: AWS::Lambda::Function
    Properties:

      FunctionName:
        !Sub "${ProjectName}-${Environment}-authorizer"

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        !GetAtt AuthorizerLambdaRole.Arn

      Timeout: 5

      MemorySize: 128

      Environment:
        Variables:

          TOKEN_PARAMETER_NAME:
            !Ref TokenParameterName

      Code:
        S3Bucket:
          Fn::ImportValue:
            !Sub "${ProjectName}-${Environment}-LambdaArtifactBucket"

        S3Key:
          Fn::ImportValue:
            !Sub "${ProjectName}-${Environment}-AuthorizerArtifactKey"

  # ==========================================================
  # API GATEWAY TOKEN AUTHORIZER
  # ==========================================================

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub "${ProjectName}-${Environment}-token-authorizer"

      RestApiId:
        !Ref ExistingRestApiId

      Type: TOKEN

      IdentitySource:
        - method.request.header.Authorization

      AuthorizerUri:
        Fn::Sub:
          - >
            arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerLambdaArn}/invocations
          - AuthorizerLambdaArn:
              !GetAtt AuthorizerLambda.Arn

      AuthorizerResultTtlInSeconds:
        !Ref AuthorizerCacheTTL

  # ==========================================================
  # ALLOW API GATEWAY TO INVOKE AUTHORIZER LAMBDA
  # ==========================================================

  AuthorizerLambdaPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action:
        lambda:InvokeFunction

      FunctionName:
        !Ref AuthorizerLambda

      Principal:
        apigateway.amazonaws.com

      SourceArn:
        !Sub >
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingRestApiId}/authorizers/${ApiGatewayAuthorizer}

Outputs:

  # ==========================================================
  # AUTHORIZE LAMBDA
  # ==========================================================

  AuthorizerLambdaArn:
    Description: Lambda Authorizer ARN
    Value:
      !GetAtt AuthorizerLambda.Arn

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-AuthorizerLambdaArn"

  # ==========================================================
  # API GATEWAY AUTHORZIER ID
  # ==========================================================

  ApiGatewayAuthorizerId:
    Description: API Gateway Lambda Authorizer ID
    Value:
      !Ref ApiGatewayAuthorizer

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-ApiGatewayAuthorizerId"

  # ==========================================================
  # SSM PARAMETER NAME
  # ==========================================================

  TokenParameterName:
    Description: SSM SecureString parameter name
    Value:
      !Ref TokenParameterName

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-TokenParameterName"

  # ==========================================================
  # CACHE TTL
  # ==========================================================

  AuthorizerCacheTTL:
    Description: Authorizer cache TTL in seconds
    Value:
      !Ref AuthorizerCacheTTL

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-AuthorizerCacheTTL"