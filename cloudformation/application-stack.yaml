AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Application Authorization Stack.
  Creates the Lambda TOKEN Authorizer, integrates with SSM SecureString,
  creates the API Gateway authorizer, authorizer caching, and
  API Gateway Lambda invoke permission.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  ProjectName:
    Type: String
    Default: cloudmart
    Description: CloudMart project name

  ExistingRestApiId:
    Type: String
    MinLength: 1
    Description: >
      Existing API Gateway REST API ID used by CloudMart.

  LambdaAuthorizerRoleArn:
    Type: String
    MinLength: 1
    Description: >
      ARN of the Lambda Authorizer IAM role created
      by the CloudMart IAM stack.

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600
    Description: >
      Lambda Authorizer result cache TTL in seconds.
      300 seconds equals 5 minutes.

  TokenParameterName:
    Type: String
    Default: /cloudmart/dev/auth/token
    MinLength: 1
    Description: >
      SSM Parameter Store SecureString parameter containing
      the CloudMart API authorization token.

Resources:

  LambdaAuthorizer:
    Type: AWS::Lambda::Function

    Properties:

      FunctionName:
        !Sub "${ProjectName}-${Environment}-authorizer"

      Runtime: python3.12

      Handler: index.lambda_handler

      Role:
        !Ref LambdaAuthorizerRoleArn

      Timeout: 5

      MemorySize: 128

      Environment:
        Variables:
          TOKEN_PARAMETER_NAME:
            !Ref TokenParameterName

      Code:
        S3Bucket:
          Fn::ImportValue:
            !Sub "${ProjectName}-${Environment}-LambdaArtifactBucket"

        S3Key:
          Fn::ImportValue:
            !Sub "${ProjectName}-${Environment}-AuthorizerArtifactKey"


  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer

    Properties:

      Name:
        !Sub "${ProjectName}-${Environment}-token-authorizer"

      RestApiId:
        !Ref ExistingRestApiId

      Type: TOKEN

      IdentitySource:
        - method.request.header.Authorization

      AuthorizerUri:
        Fn::Sub:
          - >
            arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn:
              !GetAtt LambdaAuthorizer.Arn

      AuthorizerResultTtlInSeconds:
        !Ref AuthorizerCacheTTL


  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission

    Properties:

      Action: lambda:InvokeFunction

      FunctionName:
        !Ref LambdaAuthorizer

      Principal: apigateway.amazonaws.com

      SourceArn:
        !Sub >
          arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ExistingRestApiId}/authorizers/${ApiGatewayAuthorizer}


Outputs:

  LambdaAuthorizerArn:
    Description: Lambda Authorizer ARN

    Value:
      !GetAtt LambdaAuthorizer.Arn

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-LambdaAuthorizerArn"


  LambdaAuthorizerRoleArn:
    Description: >
      Lambda Authorizer IAM Role ARN created by
      the CloudMart IAM stack.

    Value:
      !Ref LambdaAuthorizerRoleArn

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-LambdaAuthorizerRoleArn"


  ApiGatewayAuthorizerId:
    Description: API Gateway Lambda Authorizer ID

    Value:
      !Ref ApiGatewayAuthorizer

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-ApiGatewayAuthorizerId"


  TokenParameterName:
    Description: SSM SecureString parameter name

    Value:
      !Ref TokenParameterName

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-TokenParameterName"


  AuthorizerCacheTTL:
    Description: Authorizer cache TTL in seconds

    Value:
      !Ref AuthorizerCacheTTL

    Export:
      Name:
        !Sub "${ProjectName}-${Environment}-AuthorizerCacheTTL"
