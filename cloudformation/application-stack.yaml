AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  Creates API Gateway, Lambda functions, EventBridge rules, SNS notifications,
  and event-driven application resources. IAM roles are imported from the IAM stack.

Parameters:
  Environment:
    Type: String
    Description: Deployment environment loaded from cloudformation/parameters.json.
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String

  AuthorizerCacheTTL:
    Type: Number
    MinValue: 0
    MaxValue: 3600

  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ExistingOrderNotificationTopicArn:
    Type: String
    Description: ARN of the pre-existing CloudMart order-notification SNS topic.

  ExistingLowStockTopicArn:
    Type: String
    Description: ARN of the pre-existing CloudMart low-stock SNS topic.

  ExistingEventBusName:
    Type: String
    Description: Name of the pre-existing CloudMart EventBridge event bus.

  ApiDeploymentVersion:
    Type: String

Resources:

  # REST API entry point for CloudMart clients.
  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # SNS topics are pre-existing resources in AWS.
  # This stack references them by ARN instead of trying to create them again.
  #
  # The GitHub Actions workflow verifies that both topics exist before
  # deploying this stack and passes their ARNs as parameters.
  #
  # The low-stock email subscription remains CloudFormation-managed.
  LowStockTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ExistingLowStockTopicArn
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # SNS resource policy allows the notification Lambda to publish
  # formatted low-stock notifications to the existing admin topic.
  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ExistingLowStockTopicArn
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowNotificationLambdaPublish
            Effect: Allow
            Principal:
              AWS:
                Fn::ImportValue: !Sub "CloudMart-${Environment}-NotificationLambdaRoleArn"
            Action: sns:Publish
            Resource: !Ref ExistingLowStockTopicArn

  # Routes low-stock inventory events to the same Notification Lambda
  # used by customer order notifications.
  LowStockEventRule:
    Type: AWS::Events::Rule
    DeletionPolicy: Retain
    DependsOn:
      - CloudMartLowStockTopicPolicy