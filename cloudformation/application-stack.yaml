AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  Creates API Gateway, Lambda functions, EventBridge rules, SNS notifications,
  and the Operations EC2 environment. IAM roles are imported from the IAM stack.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String
    Default: cloudmart

  AuthorizerCacheTTL:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 3600

  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  CustomerEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ApiDeploymentVersion:
    Type: String
    Default: "1"

  EC2InstanceType:
    Type: String
    Default: t3.micro

Resources:

  # REST API entry point for CloudMart clients.
  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Central event bus for order and inventory lifecycle events.
  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-event-bus"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Sends low-stock notifications to the configured admin email.
  CloudMartLowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-low-stock"

  CloudMartLowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartLowStockTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CloudMartLowStockTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartLowStockTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-low-stock"

  LowStockEventRule:
    Type: AWS::Events::Rule
    DependsOn: CloudMartLowStockTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-low-stock"
      Description: Routes low-stock Inventory Changed events directly to the admin SNS topic.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.product]
        detail-type: ["Inventory Changed"]
        detail:
          low_stock: [true]
      Targets:
        - Id: LowStockSnsTarget
          Arn: !Ref CloudMartLowStockTopic
          InputTransformer:
            InputPathsMap:
              productId: "$.detail.product_id"
              productName: "$.detail.product_name"
              oldStock: "$.detail.old_stock"
              newStock: "$.detail.new_stock"
              threshold: "$.detail.low_stock_threshold"
            InputTemplate: '"CLOUDMART LOW STOCK ALERT

Product: <productName>
Product ID: <productId>

STOCK STATUS
Previous Stock: <oldStock>
Current Stock: <newStock>
Low Stock Limit: <threshold>

ACTION REQUIRED
Please replenish this product soon.

— CloudMart"'

  CloudMartCustomerOrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-customer-order-notifications"

  CloudMartCustomerOrderNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartCustomerOrderNotificationTopic
      Protocol: email
      Endpoint: !Ref CustomerEmail

  CloudMartCustomerOrderNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CloudMartCustomerOrderNotificationTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartCustomerOrderNotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-placed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-confirmed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-canceled"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-failed"

  OrderPlacedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed"
      Description: !Sub "Routes OrderPlaced events to the customer SNS topic."
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderPlaced]
      Targets:
        - Id: CustomerSnsTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: '"CLOUDMART ORDER PENDING\n\nOrder #<orderId>\n\nSTATUS: <status>\n\nCUSTOMER\nName: <customerName>\n\nITEMS PURCHASED\n--------------------------------\n<itemsSummary>\n\n--------------------------------\nTOTAL AMOUNT: <total>\n\nYour order is pending.\n\nThank you for shopping with CloudMart.\n\n— CloudMart"'

  OrderConfirmedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-confirmed"
      Description: !Sub "Routes OrderConfirmed events to the customer SNS topic."
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderConfirmed]
      Targets:
        - Id: CustomerSnsTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: '"CLOUDMART ORDER CONFIRMED\n\nOrder #<orderId>\n\nSTATUS: <status>\n\nCUSTOMER\nName: <customerName>\n\nITEMS PURCHASED\n--------------------------------\n<itemsSummary>\n\n--------------------------------\nTOTAL AMOUNT: <total>\n\nYour order has been confirmed.\n\nThank you for shopping with CloudMart.\n\n— CloudMart"'

  OrderCanceledEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-canceled"
      Description: !Sub "Routes OrderCanceled events to the customer SNS topic."
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderCanceled]
      Targets:
        - Id: CustomerSnsTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: '"CLOUDMART ORDER CANCELED\n\nOrder #<orderId>\n\nSTATUS: <status>\n\nCUSTOMER\nName: <customerName>\n\nITEMS PURCHASED\n--------------------------------\n<itemsSummary>\n\n--------------------------------\nTOTAL AMOUNT: <total>\n\nYour order has been canceled.\n\nThank you for shopping with CloudMart.\n\n— CloudMart"'

  OrderFailedEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartCustomerOrderNotificationTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-failed"
      Description: !Sub "Routes OrderFailed events to the customer SNS topic."
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderFailed]
      Targets:
        - Id: CustomerSnsTarget
          Arn: !Ref CloudMartCustomerOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              customerName: "$.detail.customer_name"
              status: "$.detail.status"
              total: "$.detail.total_amount"
              itemsSummary: "$.detail.items_summary"
            InputTemplate: '"CLOUDMART ORDER FAILED\n\nOrder #<orderId>\n\nSTATUS: <status>\n\nCUSTOMER\nName: <customerName>\n\nITEMS PURCHASED\n--------------------------------\n<itemsSummary>\n\n--------------------------------\nTOTAL AMOUNT: <total>\n\nYour order has failed to process.\n\nThank you for shopping with CloudMart.\n\n— CloudMart"'


  # ============================================================
  # ASYNCHRONOUS ORDER STOCK PROCESSING
  # OrderPlaced -> check RDS stock -> CONFIRMED or FAILED
  # ============================================================

  OrderPlacedProcessingEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed-processing"
      Description: Processes newly placed PENDING orders asynchronously.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderPlaced
      Targets:
        - Id: OrderPlacedProcessingLambda
          Arn: !GetAtt OrderFunction.Arn

  OrderPlacedProcessingLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt OrderPlacedProcessingEventRule.Arn

  # Creates the managed EC2 operations environment automatically.
  OperationsEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2InstanceType
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      SubnetId:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-PublicSubnetId"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "CloudMart-${Environment}-EC2SecurityGroupId"
      IamInstanceProfile:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-EC2InstanceProfileName"
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-operations-ec2
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y mariadb105 || dnf install -y mariadb
          mkdir -p /opt/cloudmart
          cat > /opt/cloudmart/README.txt <<'EOF'
          CloudMart Operations Environment
          MySQL client is installed for RDS access.
          Use AWS Systems Manager Session Manager to connect to this instance.
          EOF

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: orders

  PatchOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  OrdersByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  OrderStatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersByIdResource
      PathPart: status

  PatchOrderStatusMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrderStatusResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 4: GET /orders?customerId=X
  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.querystring.customerId: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 3: GET /orders/{id}
  GetOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK: PUT /orders/{id}
  # Updates an existing order, including item quantities.
  PutOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: products

  ProductByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PostProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ApiGatewayAuthorizer
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PutProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ============================================================
  # CUSTOMERS
  #
  # Customer CRUD uses the existing Product Lambda so no new
  # Lambda/source file is introduced.
  # ============================================================

  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: customers

  CustomerByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref CustomersResource
      PathPart: "{id}"

  GetAllCustomersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ApiGatewayAuthorizer
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  GetCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PostCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomersResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PutCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  DeleteCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  ApiGatewayDeploymentV6:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAuthorizer
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod
      - PostOrdersMethod
      - GetOrdersMethod
      - GetOrderByIdMethod
      - PutOrderByIdMethod
      - PatchOrderStatusMethod
      - PatchOrdersMethod
      - GetAllCustomersMethod
      - GetCustomerMethod
      - PostCustomerMethod
      - PutCustomerMethod
      - DeleteCustomerMethod
    Properties:
      RestApiId: !Ref CloudMartRestApi
      Description: !Sub "CloudMart ${Environment} API deployment ${ApiDeploymentVersion}"

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartRestApi
      DeploymentId: !Ref ApiGatewayDeploymentV6
      StageName: !Ref Environment
      Description: !Sub "CloudMart ${Environment} API Gateway stage"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  RestApiId:
    Value: !Ref CloudMartRestApi

  RestApiUrl:
    Value: !Sub "https://${CloudMartRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  ProductLambdaArn:
    Value: !GetAtt ProductFunction.Arn

  ProductLambdaName:
    Value: !Ref ProductFunction

  OrderLambdaArn:
    Value: !GetAtt OrderFunction.Arn

  OrderLambdaName:
    Value: !Ref OrderFunction

  AuthorizerLambdaArn:
    Value: !GetAtt LambdaAuthorizer.Arn

  OperationsEC2InstanceId:
    Value: !Ref OperationsEC2Instance

  ApiGatewayAuthorizerId:
    Value: !Ref ApiGatewayAuthorizer

  AuthorizerCacheTTL:
    Value: !Ref AuthorizerCacheTTL

  EventBusName:
    Value: !Ref CloudMartEventBus

  EventBusArn:
    Value: !GetAtt CloudMartEventBus.Arn

  LowStockTopicArn:
    Value: !Ref CloudMartLowStockTopic

  LowStockRuleArn:
    Value: !GetAtt LowStockEventRule.Arn



  CustomerOrderNotificationTopicArn:
    Value: !Ref CloudMartCustomerOrderNotificationTopic

  CustomerOrderNotificationTopicName:
    Value: !GetAtt CloudMartCustomerOrderNotificationTopic.TopicName

  OrderPlacedRuleArn:
    Value: !GetAtt OrderPlacedEventRule.Arn

  OrderConfirmedRuleArn:
    Value: !GetAtt OrderConfirmedEventRule.Arn

  OrderCanceledRuleArn:
    Value: !GetAtt OrderCanceledEventRule.Arn

  OrderFailedRuleArn:
    Value: !GetAtt OrderFailedEventRule.Arn

  OrderCompletedRuleArn:
    Value: !GetAtt OrderCompletedEventRule.Arn