AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  API Gateway with Lambda TOKEN Authorizer, Product Lambda,
  Order Lambda, authenticated order API, EventBridge inventory events and SNS low-stock notifications.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String
    Default: cloudmart

  LambdaAuthorizerRoleArn:
    Type: String
    Description: IAM role ARN for the Lambda Authorizer.

  ProductLambdaRoleArn:
    Type: String
    Description: IAM role ARN for the Product Lambda.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs used by Product and Order Lambdas.

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Lambda security group used by Product and Order Lambdas.

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600

  TokenParameterName:
    Type: String

  DBHostParameterName:
    Type: String

  DBPortParameterName:
    Type: String

  DBNameParameterName:
    Type: String

  DBUsernameParameterName:
    Type: String

  DBPasswordParameterName:
    Type: String

  NotificationEmail:
    Type: String
    Description: Email address that receives low-stock notifications.
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ApiDeploymentVersion:
    Type: String
    Default: "1"
    Description: Change this value to force a new API Gateway deployment.

Resources:

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # EVENTBRIDGE EVENT BUS
  # ==========================================================

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-event-bus"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # ==========================================================
  # SNS LOW-STOCK TOPIC
  # ==========================================================

  CloudMartLowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-low-stock"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartLowStockSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartLowStockTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # EventBridge must be allowed to publish to the SNS topic.
  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudMartLowStockTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartLowStockTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-low-stock"

  # ==========================================================
  # LOW-STOCK EVENTBRIDGE RULE
  # ==========================================================

  LowStockEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartLowStockTopicPolicy

    Properties:
      Name: !Sub "${ProjectName}-${Environment}-low-stock"
      Description: Routes low-stock inventory events to SNS notifications.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED

      EventPattern:
        source:
          - cloudmart.product
        detail-type:
          - "Inventory Changed"
        detail:
          low_stock:
            - true

      Targets:
        - Id: LowStockSNSTarget
          Arn: !Ref CloudMartLowStockTopic

          InputTransformer:
            InputPathsMap:
              productId: "$.detail.product_id"
              productName: "$.detail.product_name"
              oldStock: "$.detail.old_stock"
              newStock: "$.detail.new_stock"
              threshold: "$.detail.low_stock_threshold"

            # EventBridge InputTemplate must be a valid JSON string.
            # The escaped newlines keep the SNS email readable.
            InputTemplate: '"CLOUDMART LOW STOCK ALERT\n\nA product has reached its low-stock threshold.\n\nPRODUCT DETAILS\n--------------------------------\nProduct ID       : <productId>\nProduct Name     : <productName>\nPrevious Stock   : <oldStock>\nCurrent Stock    : <newStock>\nLow-Stock Limit  : <threshold>\n\nACTION REQUIRED\n--------------------\nPlease review the inventory and replenish stock.\n\nThis notification was generated automatically by CloudMart."'

  # ==========================================================
  # AUTHORIZER LAMBDA
  # ==========================================================

  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-authorizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/authorizer/
      Role: !Ref LambdaAuthorizerRoleArn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Ref TokenParameterName
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaAuthorizer
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*"

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn: LambdaAuthorizerPermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-token-authorizer"
      RestApiId: !Ref CloudMartRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/product/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-OrderLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================
  # Task 1: Create the Order Lambda.
  # The same ProductLambdaRoleArn is reused for now so the
  # existing deployment parameters/workflow do not need a new
  # required parameter. We can introduce a dedicated Order
  # Lambda role later when its required permissions are finalized.

  OrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-order"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/order/
      Role: !Ref ProductLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"


  # ==========================================================
  # /orders
  # ==========================================================

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: orders

  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # ==========================================================
  # /products
  # ==========================================================

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: products

  # ==========================================================
  # /products/{id}
  # ==========================================================

  ProductByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  # ==========================================================
  # API METHODS
  # ==========================================================

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PostProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PutProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ==========================================================
  # API DEPLOYMENT
  # ==========================================================

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAuthorizer
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod
      - PostOrdersMethod
    Properties:
      RestApiId: !Ref CloudMartRestApi
      Description: !Sub "CloudMart ${Environment} API deployment ${ApiDeploymentVersion}"

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: !Ref Environment
      Description: !Sub "CloudMart ${Environment} API Gateway stage"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  RestApiId:
    Description: API Gateway REST API ID
    Value: !Ref CloudMartRestApi

  RestApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${CloudMartRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  ProductLambdaArn:
    Description: Product Lambda ARN
    Value: !GetAtt ProductFunction.Arn

  ProductLambdaName:
    Description: Product Lambda name
    Value: !Ref ProductFunction

  OrderLambdaArn:
    Description: Order Lambda ARN
    Value: !GetAtt OrderFunction.Arn

  OrderLambdaName:
    Description: Order Lambda name
    Value: !Ref OrderFunction

  AuthorizerLambdaArn:
    Description: Lambda Authorizer ARN
    Value: !GetAtt LambdaAuthorizer.Arn

  ApiGatewayAuthorizerId:
    Description: API Gateway Authorizer ID
    Value: !Ref ApiGatewayAuthorizer

  AuthorizerCacheTTL:
    Description: Authorizer cache TTL
    Value: !Ref AuthorizerCacheTTL

  EventBusName:
    Description: CloudMart EventBridge event bus name
    Value: !Ref CloudMartEventBus

  EventBusArn:
    Description: CloudMart EventBridge event bus ARN
    Value: !GetAtt CloudMartEventBus.Arn

  LowStockTopicArn:
    Description: CloudMart low-stock SNS topic ARN
    Value: !Ref CloudMartLowStockTopic

  LowStockRuleArn:
    Description: Low-stock EventBridge rule ARN
    Value: !GetAtt LowStockEventRule.Arn
