AWSTemplateFormatVersion: '2010-09-09'

Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  Deploys Product, Order, Authorizer and Report Lambda functions,
  API Gateway, EventBridge schedule and SNS notifications.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  AuthorizerRoleArn:
    Type: String

  ProductRoleArn:
    Type: String

  OrderRoleArn:
    Type: String

  ReportRoleArn:
    Type: String

  ReportBucketName:
    Type: String

  NotificationEmail:
    Type: String

  ReportScheduleExpression:
    Type: String
    Default: rate(1 day)

  DBHost:
    Type: String

  DBPort:
    Type: String
    Default: "3306"

  DBName:
    Type: String
    Default: cloudmart

  DBUsername:
    Type: String
    Default: cloudmartadmin

  DBPassword:
    Type: String
    NoEcho: true


Globals:

  Function:

    Runtime: python3.12

    Timeout: 30

    MemorySize: 256

    VpcConfig:
      SecurityGroupIds:
        - !Ref LambdaSecurityGroupId
      SubnetIds: !Ref PrivateSubnetIds

    Environment:
      Variables:

        ENVIRONMENT: !Ref Environment

        DB_HOST: !Ref DBHost

        DB_PORT: !Ref DBPort

        DB_NAME: !Ref DBName

        DB_USERNAME: !Ref DBUsername

        DB_PASSWORD: !Ref DBPassword

        REPORT_BUCKET: !Ref ReportBucketName


Resources:

  # ==========================================================
  # API GATEWAY
  # ==========================================================

  CloudMartApi:
    Type: AWS::Serverless::Api

    Properties:

      Name: !Sub cloudmart-${Environment}-api

      StageName: !Ref Environment

      EndpointConfiguration:
        Type: REGIONAL

      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"


  # ==========================================================
  # AUTHORIZER LAMBDA
  # ==========================================================

  AuthorizerLambda:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-authorizer

      CodeUri: ../lambdas/authorizer/

      Handler: index.lambda_handler

      Role: !Ref AuthorizerRoleArn

      Timeout: 10

      MemorySize: 128


  # ==========================================================
  # PRODUCT LAMBDA
  # ==========================================================

  ProductLambda:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-product

      CodeUri: ../lambdas/product/

      Handler: index.lambda_handler

      Role: !Ref ProductRoleArn

      Events:

        GetProducts:
          Type: Api
          Properties:
            RestApiId: !Ref CloudMartApi
            Path: /products
            Method: GET

        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudMartApi
            Path: /products/{product_id}
            Method: GET

        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref CloudMartApi
            Path: /products
            Method: POST


  # ==========================================================
  # ORDER LAMBDA
  # ==========================================================

  OrderLambda:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-order

      CodeUri: ../lambdas/order/

      Handler: index.lambda_handler

      Role: !Ref OrderRoleArn

      Events:

        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref CloudMartApi
            Path: /orders
            Method: POST

        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref CloudMartApi
            Path: /orders/{order_id}
            Method: GET


  # ==========================================================
  # REPORT LAMBDA
  # ==========================================================

  ReportLambda:
    Type: AWS::Serverless::Function

    Properties:

      FunctionName: !Sub cloudmart-${Environment}-report

      CodeUri: ../lambdas/report/

      Handler: index.lambda_handler

      Role: !Ref ReportRoleArn

      Timeout: 60

      MemorySize: 512


  # ==========================================================
  # SNS TOPIC
  # ==========================================================

  CloudMartNotificationTopic:
    Type: AWS::SNS::Topic

    Properties:

      TopicName: !Sub cloudmart-${Environment}-notifications

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # SNS EMAIL SUBSCRIPTION
  # ==========================================================

  CloudMartNotificationSubscription:
    Type: AWS::SNS::Subscription

    Properties:

      TopicArn: !Ref CloudMartNotificationTopic

      Protocol: email

      Endpoint: !Ref NotificationEmail


  # ==========================================================
  # EVENTBRIDGE REPORT SCHEDULE
  # ==========================================================

  CloudMartReportSchedule:
    Type: AWS::Events::Rule

    Properties:

      Name: !Sub cloudmart-${Environment}-report-schedule

      ScheduleExpression: !Ref ReportScheduleExpression

      State: ENABLED

      Targets:

        - Arn: !GetAtt ReportLambda.Arn
          Id: ReportLambdaTarget


  # ==========================================================
  # EVENTBRIDGE -> REPORT LAMBDA PERMISSION
  # ==========================================================

  ReportLambdaEventPermission:
    Type: AWS::Lambda::Permission

    Properties:

      FunctionName: !Ref ReportLambda

      Action: lambda:InvokeFunction

      Principal: events.amazonaws.com

      SourceArn: !GetAtt CloudMartReportSchedule.Arn


# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  ApiUrl:
    Description: CloudMart API Gateway URL

    Value: !Sub
      https://${CloudMartApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}


  ApiId:
    Description: CloudMart API Gateway ID

    Value: !Ref CloudMartApi


  AuthorizerLambdaArn:
    Description: Authorizer Lambda ARN

    Value: !GetAtt AuthorizerLambda.Arn


  ProductLambdaArn:
    Description: Product Lambda ARN

    Value: !GetAtt ProductLambda.Arn


  OrderLambdaArn:
    Description: Order Lambda ARN

    Value: !GetAtt OrderLambda.Arn


  ReportLambdaArn:
    Description: Report Lambda ARN

    Value: !GetAtt ReportLambda.Arn


  NotificationTopicArn:
    Description: CloudMart SNS notification topic ARN

    Value: !Ref CloudMartNotificationTopic


  ReportBucketName:
    Description: CloudMart report bucket

    Value: !Ref ReportBucketName