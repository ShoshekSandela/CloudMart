AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  Creates API Gateway, Lambda functions, EventBridge rules, SNS notifications,
  and the Operations EC2 environment. IAM roles are imported from the IAM stack.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String
    Default: cloudmart

  AuthorizerCacheTTL:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 3600

  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ApiDeploymentVersion:
    Type: String
    Default: "1"

  EC2InstanceType:
    Type: String
    Default: t3.micro

Resources:

  # REST API entry point for CloudMart clients.
  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Central event bus for order and inventory lifecycle events.
  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-event-bus"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Shared SNS topic for customer order notifications.
  # Each customer email subscription is filtered by customer_id.
  CloudMartCustomerOrderNotificationTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-order-notifications"

  # Sends low-stock notifications to the configured admin email.
  CloudMartLowStockTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-low-stock"

  CloudMartLowStockEmailSubscription:
    Type: AWS::SNS::Subscription
    # CloudFormation creates the admin email subscription automatically.
    # Retain it if the application stack is removed/recreated so a stack
    # recovery cannot delete the SNS subscription itself.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TopicArn: !Ref CloudMartLowStockTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref CloudMartLowStockTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartLowStockTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-low-stock"

  LowStockEventRule:
    Type: AWS::Events::Rule
    DependsOn: CloudMartLowStockTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-low-stock"
      Description: Routes low-stock Inventory Changed events directly to the admin SNS topic.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.product]
        detail-type: ["Inventory Changed"]
        detail:
          low_stock: [true]
      Targets:
        - Id: LowStockSnsTarget
          Arn: !Ref CloudMartLowStockTopic
          InputTransformer:
            InputPathsMap:
              productId: "$.detail.product_id"
              productName: "$.detail.product_name"
              oldStock: "$.detail.old_stock"
              newStock: "$.detail.new_stock"
              threshold: "$.detail.low_stock_threshold"
            InputTemplate: >-
              "CLOUDMART ADMIN LOW STOCK ALERT\n\nProduct: <productName>\nProduct ID: <productId>\n\nSTOCK STATUS\nPrevious Stock: <oldStock>\nCurrent Stock: <newStock>\nLow Stock Limit: <threshold>\n\nACTION REQUIRED\nPlease replenish this product soon.\n\n— CloudMart"
  # Routes customer order events to SNS. The SNS email subscription is
  # filtered by the authenticated customer's customer_id.
  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-notification"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/notification/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-NotificationLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          ORDER_NOTIFICATION_TOPIC_ARN: !Ref CloudMartCustomerOrderNotificationTopic
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  NotificationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-notification"
      RetentionInDays: 30

  NotificationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref NotificationFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      # Restrict invocation to CloudMart EventBridge notification rules.
      # The five rules below all publish to this Lambda.
      SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-*-notification"

  OrderPlacedNotificationRule:
    Type: AWS::Events::Rule
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed-notification"
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderPlaced]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderConfirmedNotificationRule:
    Type: AWS::Events::Rule
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-confirmed-notification"
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderConfirmed]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderCanceledNotificationRule:
    Type: AWS::Events::Rule
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-canceled-notification"
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderCanceled]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderFailedNotificationRule:
    Type: AWS::Events::Rule
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-failed-notification"
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderFailed]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  OrderCompletedNotificationRule:
    Type: AWS::Events::Rule
    DependsOn: NotificationInvokePermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-completed-notification"
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source: [cloudmart.order]
        detail-type: [OrderCompleted]
      Targets:
        - Id: CustomerOrderNotification
          Arn: !GetAtt NotificationFunction.Arn

  # Validates the Authorization token used by protected API routes.
  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-authorizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/authorizer/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaAuthorizerRoleArn"
      Timeout: 10
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/token
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          DEPLOYMENT_VERSION: !Ref ApiDeploymentVersion
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaAuthorizer
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*"

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn: LambdaAuthorizerPermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-token-authorizer"
      RestApiId: !Ref CloudMartRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      # Exact methodArn policies are request-specific, so disable authorizer caching.
      # TOKEN authorizer caching is keyed by the token and can reuse a policy
      # generated for a different API method/path.
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

  # Token lifecycle is isolated from request authorization.
  TokenManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-token-manager"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/token-manager/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-TokenManagerLambdaRoleArn"
      Timeout: 15
      MemorySize: 128
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Sub /cloudmart/${Environment}/auth/token
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  # Handles product and inventory operations against RDS MySQL.
  ProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/product/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-ProductLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # Dedicated customer lifecycle and notification-subscription API.
  CustomerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-customer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/customer/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-CustomerLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          ORDER_NOTIFICATION_TOPIC_ARN: !Ref CloudMartCustomerOrderNotificationTopic
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  CustomerLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CustomerFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # Handles customer order creation and order lifecycle events.
  OrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-order"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/order/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-OrderLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-LambdaSecurityGroupId"
        SubnetIds:
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "CloudMart-${Environment}-PrivateSubnet2Id"
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/host
          DB_PORT_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/port
          DB_NAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/name
          DB_USERNAME_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/username
          DB_PASSWORD_PARAMETER_NAME: !Sub /cloudmart/${Environment}/database/password
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  OrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${Environment}-order"
      RetentionInDays: 30

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  # ============================================================
  # ASYNCHRONOUS ORDER STOCK PROCESSING
  # OrderPlaced -> check RDS stock -> CONFIRMED or FAILED
  # ============================================================

  OrderPlacedProcessingEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed-processing"
      Description: Processes newly placed PENDING orders asynchronously.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderPlaced
      Targets:
        - Id: OrderPlacedProcessingLambda
          Arn: !GetAtt OrderFunction.Arn

  OrderPlacedProcessingLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: events.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !GetAtt OrderPlacedProcessingEventRule.Arn

  # Creates the managed EC2 operations environment automatically.
  OperationsEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref EC2InstanceType
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      SubnetId:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-PublicSubnetId"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "CloudMart-${Environment}-EC2SecurityGroupId"
      IamInstanceProfile:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-EC2InstanceProfileName"
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-operations-ec2
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf install -y mariadb105 || dnf install -y mariadb
          mkdir -p /opt/cloudmart
          cat > /opt/cloudmart/README.txt <<'EOF'
          CloudMart Operations Environment
          MySQL client is installed for RDS access.
          Use AWS Systems Manager Session Manager to connect to this instance.
          EOF

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: orders

  PatchOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  OrdersByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  OrderStatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersByIdResource
      PathPart: status

  PatchOrderStatusMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrderStatusResource
      HttpMethod: PATCH
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 4: GET /orders?customerId=X
  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.querystring.customerId: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 3: GET /orders/{id}
  GetOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK: PUT /orders/{id}
  # Updates an existing order, including item quantities.
  PutOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: products

  ProductByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PostProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ApiGatewayAuthorizer
      - ProductLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PutProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  # ============================================================
  # CUSTOMERS
  #
  # Customer CRUD and explicit unsubscribe are handled by the
  # dedicated Customer Lambda.
  # ============================================================

  CustomersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: customers

  CustomerByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref CustomersResource
      PathPart: "{id}"

  CustomerUnsubscribeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref CustomerByIdResource
      PathPart: unsubscribe

  GetAllCustomersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - ApiGatewayAuthorizer
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  GetCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  PostCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  PutCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  DeleteCustomerMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  PostCustomerUnsubscribeMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - CustomerLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref CustomerUnsubscribeResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerLambdaArn}/invocations
            - CustomerLambdaArn: !GetAtt CustomerFunction.Arn

  ApiGatewayDeploymentV6:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAuthorizer
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod
      - PostOrdersMethod
      - GetOrdersMethod
      - GetOrderByIdMethod
      - PutOrderByIdMethod
      - PatchOrderStatusMethod
      - PatchOrdersMethod
      - GetAllCustomersMethod
      - GetCustomerMethod
      - PostCustomerMethod
      - PutCustomerMethod
      - DeleteCustomerMethod
    Properties:
      RestApiId: !Ref CloudMartRestApi
      Description: !Sub "CloudMart ${Environment} API deployment ${ApiDeploymentVersion}"

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartRestApi
      DeploymentId: !Ref ApiGatewayDeploymentV6
      StageName: !Ref Environment
      Description: !Sub "CloudMart ${Environment} API Gateway stage"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  LowStockEmailSubscriptionArn:
    Description: ARN of the CloudMart admin low-stock email subscription.
    Value: !Ref CloudMartLowStockEmailSubscription
    Export:
      Name: !Sub CloudMart-${Environment}-LowStockEmailSubscriptionArn


  RestApiId:
    Value: !Ref CloudMartRestApi

  RestApiUrl:
    Value: !Sub "https://${CloudMartRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  ProductLambdaArn:
    Value: !GetAtt ProductFunction.Arn

  ProductLambdaName:
    Value: !Ref ProductFunction

  CustomerLambdaArn:
    Value: !GetAtt CustomerFunction.Arn

  TokenManagerLambdaArn:
    Value: !GetAtt TokenManagerFunction.Arn

  NotificationLambdaArn:
    Value: !GetAtt NotificationFunction.Arn

  OrderLambdaArn:
    Value: !GetAtt OrderFunction.Arn

  OrderLambdaName:
    Value: !Ref OrderFunction

  AuthorizerLambdaArn:
