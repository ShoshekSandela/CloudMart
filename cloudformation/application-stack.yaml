```yaml
name: CloudMart Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

  # GitHub Repository Variables
  CLOUDMART_NOTIFICATION_EMAIL: ${{ vars.CLOUDMART_NOTIFICATION_EMAIL }}
  CLOUDMART_LAMBDA_ARTIFACT_BUCKET: ${{ vars.CLOUDMART_LAMBDA_ARTIFACT_BUCKET }}

jobs:

  deploy:
    name: Deploy CloudMart
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # AWS CREDENTIALS
      # ==========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # VERIFY AWS
      # ==========================================================

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity


      # ==========================================================
      # CHECK REQUIRED VARIABLES
      # ==========================================================

      - name: Check required variables
        shell: bash
        run: |

          if [ -z "$CLOUDMART_NOTIFICATION_EMAIL" ]; then
            echo "ERROR: CLOUDMART_NOTIFICATION_EMAIL is missing."
            exit 1
          fi

          if [ -z "$CLOUDMART_LAMBDA_ARTIFACT_BUCKET" ]; then
            echo "ERROR: CLOUDMART_LAMBDA_ARTIFACT_BUCKET is missing."
            exit 1
          fi

          echo "Required GitHub variables are available."


      # ==========================================================
      # VALIDATE NETWORK STACK
      # ==========================================================

      - name: Validate network stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/network-stack.yaml


      # ==========================================================
      # DEPLOY NETWORK STACK
      # ==========================================================

      - name: Deploy network stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-network-dev \
            --template-file cloudformation/network-stack.yaml \
            --parameter-overrides \
              Environment=dev


      # ==========================================================
      # VALIDATE IAM STACK
      # ==========================================================

      - name: Validate IAM stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/iam-stack.yaml


      # ==========================================================
      # DEPLOY IAM STACK
      # ==========================================================

      - name: Deploy IAM stack
        run: |
          aws cloudformation deploy \
            --stack-name cloudmart-iam-dev \
            --template-file cloudformation/iam-stack.yaml \
            --parameter-overrides \
              Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM


      # ==========================================================
      # VALIDATE DATA STACK
      # ==========================================================

      - name: Validate data stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/data-stack.yaml


      # ==========================================================
      # DEPLOY DATA STACK
      # ==========================================================

      - name: Deploy data stack
        env:
          DB_PASSWORD: ${{ secrets.CLOUDMART_DB_PASSWORD }}
        run: |

          if [ -z "$DB_PASSWORD" ]; then
            echo "ERROR: CLOUDMART_DB_PASSWORD is missing."
            exit 1
          fi

          aws cloudformation deploy \
            --stack-name cloudmart-data-dev \
            --template-file cloudformation/data-stack.yaml \
            --parameter-overrides \
              Environment=dev \
              DBName=cloudmart \
              DBUsername=cloudmartadmin \
              DBPassword="$DB_PASSWORD" \
              DBInstanceClass=db.t3.micro \
              AllocatedStorage=20 \
              ExistingReportBucketName=cloudmart-dev-reports


      # ==========================================================
      # GET NETWORK VALUES
      # ==========================================================

      - name: Get network values
        id: network
        shell: bash
        run: |

          PRIVATE_SUBNET_1=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-PrivateSubnet1Id'].Value" \
            --output text)

          PRIVATE_SUBNET_2=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-PrivateSubnet2Id'].Value" \
            --output text)

          LAMBDA_SECURITY_GROUP=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-LambdaSecurityGroupId'].Value" \
            --output text)

          echo "PRIVATE_SUBNET_1=$PRIVATE_SUBNET_1" >> "$GITHUB_ENV"
          echo "PRIVATE_SUBNET_2=$PRIVATE_SUBNET_2" >> "$GITHUB_ENV"
          echo "LAMBDA_SECURITY_GROUP=$LAMBDA_SECURITY_GROUP" >> "$GITHUB_ENV"


      # ==========================================================
      # GET IAM ROLE ARNS
      # ==========================================================

      - name: Get Lambda IAM role ARNs
        shell: bash
        run: |

          AUTHORIZE_ROLE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-AuthorizerLambdaRoleArn'].Value" \
            --output text)

          PRODUCT_ROLE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-ProductLambdaRoleArn'].Value" \
            --output text)

          ORDER_ROLE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-OrderLambdaRoleArn'].Value" \
            --output text)

          REPORT_ROLE=$(aws cloudformation list-exports \
            --query "Exports[?Name=='CloudMart-dev-ReportLambdaRoleArn'].Value" \
            --output text)

          echo "AUTHORIZE_ROLE=$AUTHORIZE_ROLE" >> "$GITHUB_ENV"
          echo "PRODUCT_ROLE=$PRODUCT_ROLE" >> "$GITHUB_ENV"
          echo "ORDER_ROLE=$ORDER_ROLE" >> "$GITHUB_ENV"
          echo "REPORT_ROLE=$REPORT_ROLE" >> "$GITHUB_ENV"


      # ==========================================================
      # VALIDATE APPLICATION STACK
      # ==========================================================

      - name: Validate application stack
        run: |
          aws cloudformation validate-template \
            --template-body file://cloudformation/application-stack.yaml


      # ==========================================================
      # DEPLOY APPLICATION STACK
      # ==========================================================

      - name: Deploy application stack
        run: |

          aws cloudformation deploy \
            --stack-name cloudmart-application-dev \
            --template-file cloudformation/application-stack.yaml \
            --parameter-overrides \
              Environment=dev \
              LambdaArtifactBucket="$CLOUDMART_LAMBDA_ARTIFACT_BUCKET" \
              AuthorizerCodeKey=dev/lambda/authorizer.zip \
              ProductCodeKey=dev/lambda/product.zip \
              OrderCodeKey=dev/lambda/order-api.zip \
              ReportCodeKey=dev/lambda/report.zip \
              PrivateSubnetIds="$PRIVATE_SUBNET_1,$PRIVATE_SUBNET_2" \
              LambdaSecurityGroupId="$LAMBDA_SECURITY_GROUP" \
              AuthorizerRoleArn="$AUTHORIZE_ROLE" \
              ProductRoleArn="$PRODUCT_ROLE" \
              OrderRoleArn="$ORDER_ROLE" \
              ReportRoleArn="$REPORT_ROLE" \
              ReportBucketName=cloudmart-dev-reports \
              NotificationEmail="$CLOUDMART_NOTIFICATION_EMAIL" \
              ReportScheduleExpression="rate(1 day)" \
            --capabilities CAPABILITY_NAMED_IAM


      # ==========================================================
      # DEPLOYMENT STATUS
      # ==========================================================

      - name: Show CloudFormation status
        run: |

          echo "Network:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-network-dev \
            --query 'Stacks[0].StackStatus' \
            --output text

          echo "IAM:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-iam-dev \
            --query 'Stacks[0].StackStatus' \
            --output text

          echo "Data:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-data-dev \
            --query 'Stacks[0].StackStatus' \
            --output text

          echo "Application:"
          aws cloudformation describe-stacks \
            --stack-name cloudmart-application-dev \
            --query 'Stacks[0].StackStatus' \
            --output text
```
