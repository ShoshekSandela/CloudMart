AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  CloudMart Application Stack.
  API Gateway with Lambda TOKEN Authorizer, Product Lambda,
  Order Lambda, authenticated order API, EventBridge inventory events and SNS low-stock notifications.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  ProjectName:
    Type: String
    Default: cloudmart

  LambdaAuthorizerRoleArn:
    Type: String

  ProductLambdaRoleArn:
    Type: String

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  AuthorizerCacheTTL:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600

  TokenParameterName:
    Type: String

  DBHostParameterName:
    Type: String

  DBPortParameterName:
    Type: String

  DBNameParameterName:
    Type: String

  DBUsernameParameterName:
    Type: String

  DBPasswordParameterName:
    Type: String

  NotificationEmail:
    Type: String
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'

  ApiDeploymentVersion:
    Type: String
    Default: "1"
    Description: Change this value to force a new API Gateway deployment.

Resources:

  CloudMartRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-api"
      Description: !Sub "CloudMart ${Environment} REST API"
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-event-bus"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartLowStockTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-low-stock"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartLowStockSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartLowStockTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CloudMartLowStockTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudMartLowStockTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartLowStockTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-low-stock"

  LowStockEventRule:
    Type: AWS::Events::Rule
    DependsOn:
      - CloudMartLowStockTopicPolicy
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-low-stock"
      Description: Routes low-stock inventory events to SNS notifications.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.product
        detail-type:
          - "Inventory Changed"
        detail:
          low_stock:
            - true
      Targets:
        - Id: LowStockSNSTarget
          Arn: !Ref CloudMartLowStockTopic
          InputTransformer:
            InputPathsMap:
              productId: "$.detail.product_id"
              productName: "$.detail.product_name"
              oldStock: "$.detail.old_stock"
              newStock: "$.detail.new_stock"
              threshold: "$.detail.low_stock_threshold"
            InputTemplate: '"CLOUDMART LOW STOCK ALERT\n\nA product has reached its low-stock threshold.\n\nPRODUCT DETAILS\n--------------------------------\nProduct ID       : <productId>\nProduct Name     : <productName>\nPrevious Stock   : <oldStock>\nCurrent Stock    : <newStock>\nLow-Stock Limit  : <threshold>\n\nACTION REQUIRED\n--------------------\nPlease review the inventory and replenish stock.\n\nThis notification was generated automatically by CloudMart."'

  # ============================================================
  # ORDER LIFECYCLE EVENTS -> SNS
  # ============================================================

  CloudMartOrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-order-notifications"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartOrderNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CloudMartOrderNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  CloudMartOrderNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref CloudMartOrderNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublishOrderEvents
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref CloudMartOrderNotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn:
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-placed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-confirmed"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-canceled"
                  - !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${CloudMartEventBus}/${ProjectName}-${Environment}-order-failed"

  OrderPlacedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-placed"
      Description: Routes CloudMart OrderPlaced events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderPlaced
      Targets:
        - Id: OrderPlacedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              status: "$.detail.status"
              total: "$.detail.total_amount"
            InputTemplate: '"CLOUDMART ORDER PLACED\n\nOrder ID       : <orderId>\nCustomer ID    : <customerId>\nStatus         : <status>\nTotal Amount   : <total>\n\nThis notification was generated automatically by CloudMart."'

  OrderConfirmedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-confirmed"
      Description: Routes CloudMart OrderConfirmed events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderConfirmed
      Targets:
        - Id: OrderConfirmedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              status: "$.detail.status"
              total: "$.detail.total_amount"
            InputTemplate: '"CLOUDMART ORDER CONFIRMED\n\nOrder ID       : <orderId>\nCustomer ID    : <customerId>\nStatus         : <status>\nTotal Amount   : <total>\n\nThis notification was generated automatically by CloudMart."'

  OrderCanceledEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-canceled"
      Description: Routes CloudMart OrderCanceled events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderCanceled
      Targets:
        - Id: OrderCanceledSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              status: "$.detail.status"
              total: "$.detail.total_amount"
            InputTemplate: '"CLOUDMART ORDER CANCELED\n\nOrder ID       : <orderId>\nCustomer ID    : <customerId>\nStatus         : <status>\nTotal Amount   : <total>\n\nThis notification was generated automatically by CloudMart."'

  OrderFailedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-order-failed"
      Description: Routes CloudMart OrderFailed events to SNS.
      EventBusName: !Ref CloudMartEventBus
      State: ENABLED
      EventPattern:
        source:
          - cloudmart.order
        detail-type:
          - OrderFailed
      Targets:
        - Id: OrderFailedSNSTarget
          Arn: !Ref CloudMartOrderNotificationTopic
          InputTransformer:
            InputPathsMap:
              orderId: "$.detail.order_id"
              customerId: "$.detail.customer_id"
              status: "$.detail.status"
              total: "$.detail.total_amount"
            InputTemplate: '"CLOUDMART ORDER FAILED\n\nOrder ID       : <orderId>\nCustomer ID    : <customerId>\nStatus         : <status>\nTotal Amount   : <total>\n\nThis notification was generated automatically by CloudMart."'


  LambdaAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-authorizer"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/authorizer/
      Role: !Ref LambdaAuthorizerRoleArn
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          TOKEN_PARAMETER_NAME: !Ref TokenParameterName
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  LambdaAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaAuthorizer
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*"

  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn: LambdaAuthorizerPermission
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-token-authorizer"
      RestApiId: !Ref CloudMartRestApi
      Type: TOKEN
      IdentitySource: method.request.header.Authorization
      AuthorizerUri:
        Fn::Sub:
          - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaAuthorizerArn}/invocations
          - LambdaAuthorizerArn: !GetAtt LambdaAuthorizer.Arn
      AuthorizerResultTtlInSeconds: !Ref AuthorizerCacheTTL

  ProductFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-product"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/product/
      Role:
        Fn::ImportValue: !Sub "CloudMart-${Environment}-OrderLambdaRoleArn"
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  ProductLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProductFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  OrderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-order"
      Runtime: python3.12
      Handler: index.lambda_handler
      CodeUri: ../lambdas/order/
      Role: !Ref ProductLambdaRoleArn
      Timeout: 15
      MemorySize: 256
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
        SubnetIds: !Ref PrivateSubnetIds
      Environment:
        Variables:
          DB_HOST_PARAMETER_NAME: !Ref DBHostParameterName
          DB_PORT_PARAMETER_NAME: !Ref DBPortParameterName
          DB_NAME_PARAMETER_NAME: !Ref DBNameParameterName
          DB_USERNAME_PARAMETER_NAME: !Ref DBUsernameParameterName
          DB_PASSWORD_PARAMETER_NAME: !Ref DBPasswordParameterName
          EVENT_BUS_NAME: !Ref CloudMartEventBus
      Tags:
        Project: CloudMart
        Environment: !Ref Environment

  OrderLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref OrderFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${CloudMartRestApi}/*/*"

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: orders

  OrdersByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref OrdersResource
      PathPart: "{id}"

  PostOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 4: GET /orders?customerId=X
  GetOrdersMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.querystring.customerId: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  # TASK 3: GET /orders/{id}
  GetOrderByIdMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - OrderLambdaPermission
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref OrdersByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OrderLambdaArn}/invocations
            - OrderLambdaArn: !GetAtt OrderFunction.Arn

  ProductsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !GetAtt CloudMartRestApi.RootResourceId
      PathPart: products

  ProductByIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ParentId: !Ref ProductsResource
      PathPart: "{id}"

  GetProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PostProductsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductsResource
      HttpMethod: POST
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  GetProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: GET
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  PutProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: PUT
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  DeleteProductMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CloudMartRestApi
      ResourceId: !Ref ProductByIdResource
      HttpMethod: DELETE
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref ApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ProductLambdaArn}/invocations
            - ProductLambdaArn: !GetAtt ProductFunction.Arn

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAuthorizer
      - GetProductsMethod
      - PostProductsMethod
      - GetProductMethod
      - PutProductMethod
      - DeleteProductMethod
      - PostOrdersMethod
      - GetOrdersMethod
      - GetOrderByIdMethod
    Properties:
      RestApiId: !Ref CloudMartRestApi
      Description: !Sub "CloudMart ${Environment} API deployment ${ApiDeploymentVersion}"

  ApiGatewayStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CloudMartRestApi
      DeploymentId: !Ref ApiGatewayDeployment
      StageName: !Ref Environment
      Description: !Sub "CloudMart ${Environment} API Gateway stage"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  RestApiId:
    Value: !Ref CloudMartRestApi

  RestApiUrl:
    Value: !Sub "https://${CloudMartRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"

  ProductLambdaArn:
    Value: !GetAtt ProductFunction.Arn

  ProductLambdaName:
    Value: !Ref ProductFunction

  OrderLambdaArn:
    Value: !GetAtt OrderFunction.Arn

  OrderLambdaName:
    Value: !Ref OrderFunction

  AuthorizerLambdaArn:
    Value: !GetAtt LambdaAuthorizer.Arn

  ApiGatewayAuthorizerId:
    Value: !Ref ApiGatewayAuthorizer

  AuthorizerCacheTTL:
    Value: !Ref AuthorizerCacheTTL

  EventBusName:
    Value: !Ref CloudMartEventBus

  EventBusArn:
    Value: !GetAtt CloudMartEventBus.Arn

  LowStockTopicArn:
    Value: !Ref CloudMartLowStockTopic

  LowStockRuleArn:
    Value: !GetAtt LowStockEventRule.Arn


  OrderNotificationTopicArn:
    Value: !Ref CloudMartOrderNotificationTopic

  OrderPlacedRuleArn:
    Value: !GetAtt OrderPlacedEventRule.Arn

  OrderConfirmedRuleArn:
    Value: !GetAtt OrderConfirmedEventRule.Arn

  OrderCanceledRuleArn:
    Value: !GetAtt OrderCanceledEventRule.Arn

  OrderFailedRuleArn:
    Value: !GetAtt OrderFailedEventRule.Arn
