AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data-Storage Stack.
  Creates the private RDS MySQL database and
  S3 bucket used for generated reports.

Parameters:



  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  DBName:
    Type: String
    Default: cloudmart
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
    ConstraintDescription: DBName must start with a letter and contain only letters, numbers, and underscores.
    Description: CloudMart database name

  DBUsername:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
    ConstraintDescription: DBUsername must start with a letter and contain only letters, numbers, and underscores.
    Description: RDS master username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41
    ConstraintDescription: DBPassword must be between 12 and 41 characters.
    Description: RDS master password

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: Initial RDS storage in GB

  ExistingReportBucketName:
    Type: String
    Default: ""
    Description: Existing S3 report bucket name. If provided, CloudMart uses this existing bucket. If empty, CloudFormation creates cloudmart-${Environment}-reports.

Conditions:

  CreateReportBucket:
    !Equals
      - !Ref ExistingReportBucketName
      - ""

Resources:

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "CloudMart ${Environment} RDS private subnet group"
      SubnetIds:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet1Id
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartRDS:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: "8.0"
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      Port: 3306
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-RDSSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartDatabaseSSMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CloudMartDatabaseSSMManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password"
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartDatabaseSSMFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt CloudMartDatabaseSSMRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import urllib.request
          import boto3

          ssm = boto3.client("ssm")

          def send_response(event, context, status, data, physical_id):
              response = {
                  "Status": status,
                  "Reason": data.get("Reason", "See CloudWatch Logs for details"),
                  "PhysicalResourceId": physical_id,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }

              body = json.dumps(response).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  headers={
                      "content-type": "",
                      "content-length": str(len(body)),
                  },
                  method="PUT",
              )
              urllib.request.urlopen(request)

          def handler(event, context):
              environment = event["ResourceProperties"]["Environment"]
              prefix = f"/cloudmart/{environment}/database"
              physical_id = f"CloudMartDatabaseSSM-{environment}"

              try:
                  request_type = event["RequestType"]

                  if request_type in ("Create", "Update"):
                      parameters = [
                          (
                              f"{prefix}/host",
                              "String",
                              event["ResourceProperties"]["DBHost"],
                          ),
                          (
                              f"{prefix}/port",
                              "String",
                              str(event["ResourceProperties"]["DBPort"]),
                          ),
                          (
                              f"{prefix}/name",
                              "String",
                              event["ResourceProperties"]["DBName"],
                          ),
                          (
                              f"{prefix}/username",
                              "SecureString",
                              event["ResourceProperties"]["DBUsername"],
                          ),
                          (
                              f"{prefix}/password",
                              "SecureString",
                              event["ResourceProperties"]["DBPassword"],
                          ),
                      ]

                      for name, parameter_type, value in parameters:
                          ssm.put_parameter(
                              Name=name,
                              Type=parameter_type,
                              Value=value,
                              Overwrite=True,
                              Description=f"CloudMart database {name.rsplit('/', 1)[-1]} parameter",
                          )

                  elif request_type == "Delete":
                      for suffix in ("host", "port", "name", "username", "password"):
                          try:
                              ssm.delete_parameter(Name=f"{prefix}/{suffix}")
                          except ssm.exceptions.ParameterNotFound:
                              pass

                  send_response(
                      event,
                      context,
                      "SUCCESS",
                      {"Message": "CloudMart database SSM parameters synchronized."},
                      physical_id,
                  )

              except Exception as exc:
                  send_response(
                      event,
                      context,
                      "FAILED",
                      {"Reason": str(exc)},
                      physical_id,
                  )

      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  CloudMartDatabaseSSM:
    Type: Custom::CloudMartDatabaseSSM
    DependsOn:
      - CloudMartRDS
      - CloudMartDatabaseSSMFunction
    Properties:
      ServiceToken: !GetAtt CloudMartDatabaseSSMFunction.Arn
      Environment: !Ref Environment
      DBHost: !GetAtt CloudMartRDS.Endpoint.Address
      DBPort: !GetAtt CloudMartRDS.Endpoint.Port
      DBName: !Ref DBName
      DBUsername: !Ref DBUsername
      DBPassword: !Ref DBPassword

  CloudMartReportBucket:
    Type: AWS::S3::Bucket
    Condition: CreateReportBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub cloudmart-${Environment}-reports
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:

  DBEndpoint:
    Description: RDS MySQL endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address
    Export:
      Name: !Sub CloudMart-${Environment}-DBEndpoint

  DBPort:
    Description: RDS MySQL port
    Value: !GetAtt CloudMartRDS.Endpoint.Port
    Export:
      Name: !Sub CloudMart-${Environment}-DBPort

  DBName:
    Description: CloudMart database name
    Value: !Ref DBName
    Export:
      Name: !Sub CloudMart-${Environment}-DBName

  DBInstanceIdentifier:
    Description: CloudMart RDS instance identifier
    Value: !Ref CloudMartRDS
    Export:
      Name: !Sub CloudMart-${Environment}-DBInstanceIdentifier

  ReportBucketName:
    Description: CloudMart generated reports S3 bucket
    Value: !If
      - CreateReportBucket
      - !Ref CloudMartReportBucket
      - !Ref ExistingReportBucketName
    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketName

  ReportBucketArn:
    Description: CloudMart generated reports S3 bucket ARN
    Value: !If
      - CreateReportBucket
      - !GetAtt CloudMartReportBucket.Arn
      - !Sub arn:${AWS::Partition}:s3:::${ExistingReportBucketName}
    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketArn