AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Data Stack.
  Creates RDS MySQL, database SSM parameters, authentication token parameter,
  and the S3 report bucket.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]

  DBName:
    Type: String
    Default: cloudmart
    MinLength: 1
    MaxLength: 64
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'

  DBUsername:
    Type: String
    NoEcho: true
    MinLength: 1
    MaxLength: 16
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

Resources:
  # Places RDS in the private database subnets.
  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub CloudMart ${Environment} RDS subnet group
      SubnetIds:
        - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet1Id
        - Fn::ImportValue: !Sub CloudMart-${Environment}-PrivateSubnet2Id
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Private MySQL database used by CloudMart.
  CloudMartRDS:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: "8.0"
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp3
      Port: 3306
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      CopyTagsToSnapshot: true
      DBSubnetGroupName: !Ref CloudMartDBSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub CloudMart-${Environment}-RDSSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Stores the RDS endpoint for Lambda and EC2.
  DBHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/database/host
      Type: String
      Value: !GetAtt CloudMartRDS.Endpoint.Address
      Description: CloudMart RDS endpoint

  DBPortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/database/port
      Type: String
      Value: !GetAtt CloudMartRDS.Endpoint.Port
      Description: CloudMart RDS port

  DBNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/database/name
      Type: String
      Value: !Ref DBName
      Description: CloudMart database name

  # Stores the RDS username in the code-managed parameter.
  DBUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/database/username
      # CloudFormation supports String/StringList here; keep the value simple for a code-managed stack.
      Type: String
      Value: !Ref DBUsername
      Description: CloudMart RDS username

  # Stores the RDS password in the code-managed parameter.
  DBPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudmart/${Environment}/database/password
      # CloudFormation does not support SecureString for AWS::SSM::Parameter.
      Type: String
      Value: !Ref DBPassword
      Description: CloudMart RDS password

  # Allows only the CloudMart Daily Report role to write generated reports.
  CloudMartReportBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudMartReportBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDailyReportLambdaWrite
            Effect: Allow
            Principal:
              AWS:
                Fn::ImportValue: !Sub "CloudMart-${Environment}-ReportLambdaRoleArn"
            Action: s3:PutObject
            Resource: !Sub "${CloudMartReportBucket.Arn}/reports/*"
          - Sid: AllowOperationsEC2ListBucket
            Effect: Allow
            Principal:
              AWS:
                Fn::ImportValue: !Sub "CloudMart-${Environment}-EC2RoleArn"
            Action: s3:ListBucket
            Resource: !GetAtt CloudMartReportBucket.Arn
          - Sid: AllowOperationsEC2ReadObjects
            Effect: Allow
            Principal:
              AWS:
                Fn::ImportValue: !Sub "CloudMart-${Environment}-EC2RoleArn"
            Action: s3:GetObject
            Resource:
              - !Sub "${CloudMartReportBucket.Arn}/dashboard-source/*"
              - !Sub "${CloudMartReportBucket.Arn}/reports/*"

  # Authentication token is managed exclusively by Token Manager.
  # It is intentionally not an AWS::SSM::Parameter resource in this stack.
  # This prevents Data stack updates from resetting the admin token.

  # Stores generated CloudMart reports and is private by default.
  CloudMartReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DBEndpoint:
    Value: !GetAtt CloudMartRDS.Endpoint.Address
    Export:
      Name: !Sub CloudMart-${Environment}-DBEndpoint
  DBPort:
    Value: !GetAtt CloudMartRDS.Endpoint.Port
    Export:
      Name: !Sub CloudMart-${Environment}-DBPort
  DBName:
    Value: !Ref DBName
    Export:
      Name: !Sub CloudMart-${Environment}-DBName
  DBInstanceIdentifier:
    Value: !Ref CloudMartRDS
    Export:
      Name: !Sub CloudMart-${Environment}-DBInstanceIdentifier
  DBHostParameterName:
    Value: !Ref DBHostParameter
    Export:
      Name: !Sub CloudMart-${Environment}-DBHostParameterName
  DBPortParameterName:
    Value: !Ref DBPortParameter
    Export:
      Name: !Sub CloudMart-${Environment}-DBPortParameterName
  DBNameParameterName:
    Value: !Ref DBNameParameter
    Export:
      Name: !Sub CloudMart-${Environment}-DBNameParameterName
  DBUsernameParameterName:
    Value: !Ref DBUsernameParameter
    Export:
      Name: !Sub CloudMart-${Environment}-DBUsernameParameterName
  DBPasswordParameterName:
    Value: !Ref DBPasswordParameter
    Export:
      Name: !Sub CloudMart-${Environment}-DBPasswordParameterName
  ReportBucketName:
    Value: !Ref CloudMartReportBucket
    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketName

  ReportBucketArn:
    Value: !GetAtt CloudMartReportBucket.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketArn
