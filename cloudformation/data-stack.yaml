AWSTemplateFormatVersion: "2010-09-09"

Description: CloudMart Data Storage Stack

Parameters:

  # =========================================================
  # ENVIRONMENT
  # =========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod


  # =========================================================
  # RDS CONFIGURATION
  # =========================================================

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  DBName:
    Type: String
    Default: cloudmart

  DBPort:
    Type: Number
    Default: 3306

  AllocatedStorage:
    Type: Number
    Default: 20

  MaxAllocatedStorage:
    Type: Number
    Default: 100

  StorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp2
      - gp3

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"

  BackupRetentionPeriod:
    Type: Number
    Default: 0


  # =========================================================
  # RDS USERNAME
  # =========================================================

  MasterUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"


  # =========================================================
  # RDS PASSWORD
  # =========================================================

  MasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41


Resources:

  # =========================================================
  # RDS DB SUBNET GROUP
  # =========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        CloudMart RDS MySQL private subnet group

      SubnetIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet1Id

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet2Id

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-db-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # RDS MYSQL
  # =========================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql

      EngineVersion: "8.0"

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      MaxAllocatedStorage:
        !Ref MaxAllocatedStorage

      StorageType:
        !Ref StorageType

      StorageEncrypted: true

      MultiAZ:
        !Ref MultiAZ

      DBName:
        !Ref DBName

      Port:
        !Ref DBPort

      MasterUsername:
        !Ref MasterUsername

      MasterUserPassword:
        !Ref MasterPassword

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RDSSecurityGroupId

      BackupRetentionPeriod:
        !Ref BackupRetentionPeriod

      CopyTagsToSnapshot: true

      PubliclyAccessible: false

      AutoMinorVersionUpgrade: true

      DeletionProtection: false

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # S3 REPORT BUCKET
  # =========================================================

  CloudMartReportBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  RDSInstanceId:
    Description: CloudMart RDS MySQL instance identifier
    Value: !Ref CloudMartRDS

    Export:
      Name: !Sub CloudMart-${Environment}-RDSInstanceId


  RDSEndpoint:
    Description: CloudMart RDS MySQL endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address

    Export:
      Name: !Sub CloudMart-${Environment}-RDSEndpoint


  RDSPort:
    Description: CloudMart RDS MySQL port
    Value: !GetAtt CloudMartRDS.Endpoint.Port

    Export:
      Name: !Sub CloudMart-${Environment}-RDSPort


  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group
    Value: !Ref CloudMartDBSubnetGroup

    Export:
      Name: !Sub CloudMart-${Environment}-DBSubnetGroupName


  ReportBucketName:
    Description: CloudMart generated reports bucket
    Value: !Ref CloudMartReportBucket

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketName


  ReportBucketArn:
    Description: CloudMart generated reports bucket ARN
    Value: !GetAtt CloudMartReportBucket.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketArn