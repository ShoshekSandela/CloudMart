AWSTemplateFormatVersion: '2010-09-09'

Description: >
  CloudMart Data-Storage Stack.
  Creates the private RDS MySQL database and
  S3 bucket used for generated reports.

Parameters:

  # ==========================================================
  # ENVIRONMENT
  # ==========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment


  # ==========================================================
  # DATABASE CONFIGURATION
  # ==========================================================

  DBName:
    Type: String
    Default: cloudmart
    Description: CloudMart database name

  DBUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    Description: RDS master username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 41
    Description: RDS master password

  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS instance class

  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: Initial RDS storage in GB


# ============================================================
# RESOURCES
# ============================================================

Resources:

  # ==========================================================
  # RDS SUBNET GROUP
  # ==========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription: !Sub
        "CloudMart ${Environment} RDS private subnet group"

      SubnetIds:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet1Id

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-PrivateSubnet2Id

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # RDS MYSQL DATABASE
  # ==========================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier: !Sub
        cloudmart-${Environment}-mysql

      Engine: mysql

      EngineVersion: "8.0"

      DBName: !Ref DBName

      MasterUsername: !Ref DBUsername

      MasterUserPassword: !Ref DBPassword

      DBInstanceClass: !Ref DBInstanceClass

      AllocatedStorage: !Ref AllocatedStorage

      StorageType: gp3

      Port: 3306

      StorageEncrypted: true

      PubliclyAccessible: false

      MultiAZ: false

      BackupRetentionPeriod: 0

      CopyTagsToSnapshot: true

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            Fn::Sub: CloudMart-${Environment}-RDSSecurityGroupId

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # ==========================================================
  # S3 REPORT BUCKET
  # ==========================================================

  CloudMartReportBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


# ============================================================
# OUTPUTS
# ============================================================

Outputs:

  DBEndpoint:
    Description: RDS MySQL endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address

    Export:
      Name: !Sub CloudMart-${Environment}-DBEndpoint


  DBPort:
    Description: RDS MySQL port
    Value: !GetAtt CloudMartRDS.Endpoint.Port

    Export:
      Name: !Sub CloudMart-${Environment}-DBPort


  DBName:
    Description: CloudMart database name
    Value: !Ref DBName

    Export:
      Name: !Sub CloudMart-${Environment}-DBName


  DBInstanceIdentifier:
    Description: RDS MySQL instance identifier
    Value: !Ref CloudMartRDS

    Export:
      Name: !Sub CloudMart-${Environment}-DBInstanceIdentifier


  ReportBucketName:
    Description: CloudMart generated reports S3 bucket
    Value: !Ref CloudMartReportBucket

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketName


  ReportBucketArn:
    Description: CloudMart generated reports S3 bucket ARN
    Value: !GetAtt CloudMartReportBucket.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketArn