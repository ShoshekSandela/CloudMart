AWSTemplateFormatVersion: "2010-09-09"

Description: CloudMart Data Storage Stack

Parameters:

  # =========================================================
  # ENVIRONMENT
  # =========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod


  # =========================================================
  # RDS CONFIGURATION
  # =========================================================

  DBInstanceClass:
    Type: String
    Default: db.t3.micro

  DBName:
    Type: String
    Default: cloudmart

  DBPort:
    Type: Number
    Default: 3306

  AllocatedStorage:
    Type: Number
    Default: 20

  MaxAllocatedStorage:
    Type: Number
    Default: 100

  StorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp2
      - gp3

  MultiAZ:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  BackupRetentionPeriod:
    Type: Number
    Default: 7


  # =========================================================
  # RDS USERNAME
  # =========================================================

  MasterUsername:
    Type: String
    Default: cloudmartadmin
    NoEcho: true
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"


  # =========================================================
  # RDS PASSWORD
  # =========================================================

  MasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41


Resources:

  # =========================================================
  # RDS DB SUBNET GROUP
  # =========================================================

  CloudMartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup

    Properties:

      DBSubnetGroupDescription:
        CloudMart RDS MySQL private subnet group

      SubnetIds:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet1Id

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-PrivateSubnet2Id

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-db-subnet-group

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # RDS MYSQL
  # =========================================================

  CloudMartRDS:
    Type: AWS::RDS::DBInstance

    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot

    Properties:

      DBInstanceIdentifier:
        !Sub cloudmart-${Environment}-mysql

      Engine: mysql

      EngineVersion: "8.0"

      DBInstanceClass:
        !Ref DBInstanceClass

      AllocatedStorage:
        !Ref AllocatedStorage

      MaxAllocatedStorage:
        !Ref MaxAllocatedStorage

      StorageType:
        !Ref StorageType

      StorageEncrypted: true

      MultiAZ:
        !Ref MultiAZ

      DBName:
        !Ref DBName

      Port:
        !Ref DBPort

      MasterUsername:
        !Ref MasterUsername

      MasterUserPassword:
        !Ref MasterPassword

      DBSubnetGroupName:
        !Ref CloudMartDBSubnetGroup

      VPCSecurityGroups:

        - Fn::ImportValue:
            !Sub CloudMart-${Environment}-RDSSecurityGroupId

      BackupRetentionPeriod:
        !Ref BackupRetentionPeriod

      CopyTagsToSnapshot: true

      PubliclyAccessible: false

      AutoMinorVersionUpgrade: true

      DeletionProtection: false

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-mysql

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # S3 REPORT BUCKET
  # =========================================================

  CloudMartReportBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:

      BucketEncryption:

        ServerSideEncryptionConfiguration:

          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:

        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled

      Tags:

        - Key: Name
          Value: !Sub cloudmart-${Environment}-reports

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # SSM - DATABASE ENDPOINT
  # =========================================================

  DatabaseEndpointParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /CloudMart/${Environment}/database/endpoint

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Address

      Description:
        CloudMart RDS MySQL endpoint

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # SSM - DATABASE PORT
  # =========================================================

  DatabasePortParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /CloudMart/${Environment}/database/port

      Type: String

      Value:
        !GetAtt CloudMartRDS.Endpoint.Port

      Description:
        CloudMart RDS MySQL port

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # SSM - DATABASE NAME
  # =========================================================

  DatabaseNameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /CloudMart/${Environment}/database/name

      Type: String

      Value:
        !Ref DBName

      Description:
        CloudMart database name

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # SSM - DATABASE USERNAME
  # =========================================================

  DatabaseUsernameParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /CloudMart/${Environment}/database/username

      Type: String

      Value:
        !Ref MasterUsername

      Description:
        CloudMart RDS MySQL username

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # SSM - RDS INSTANCE ID
  # =========================================================

  RDSInstanceParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /CloudMart/${Environment}/database/instance-id

      Type: String

      Value:
        !Ref CloudMartRDS

      Description:
        CloudMart RDS instance identifier

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # SSM - S3 REPORT BUCKET
  # =========================================================

  ReportBucketParameter:
    Type: AWS::SSM::Parameter

    Properties:

      Name:
        !Sub /CloudMart/${Environment}/s3/report-bucket

      Type: String

      Value:
        !Ref CloudMartReportBucket

      Description:
        CloudMart generated reports S3 bucket

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  RDSInstanceId:
    Description: CloudMart RDS MySQL instance identifier
    Value: !Ref CloudMartRDS

    Export:
      Name: !Sub CloudMart-${Environment}-RDSInstanceId


  RDSEndpoint:
    Description: CloudMart RDS MySQL endpoint
    Value: !GetAtt CloudMartRDS.Endpoint.Address

    Export:
      Name: !Sub CloudMart-${Environment}-RDSEndpoint


  RDSPort:
    Description: CloudMart RDS MySQL port
    Value: !GetAtt CloudMartRDS.Endpoint.Port

    Export:
      Name: !Sub CloudMart-${Environment}-RDSPort


  DBSubnetGroupName:
    Description: CloudMart RDS DB subnet group
    Value: !Ref CloudMartDBSubnetGroup

    Export:
      Name: !Sub CloudMart-${Environment}-DBSubnetGroupName


  ReportBucketName:
    Description: CloudMart generated reports S3 bucket
    Value: !Ref CloudMartReportBucket

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketName


  ReportBucketArn:
    Description: CloudMart generated reports S3 bucket ARN
    Value: !GetAtt CloudMartReportBucket.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketArn


  DatabaseEndpointParameterName:
    Description: SSM parameter containing RDS endpoint
    Value: !Ref DatabaseEndpointParameter

    Export:
      Name: !Sub CloudMart-${Environment}-DatabaseEndpointParameter


  DatabasePortParameterName:
    Description: SSM parameter containing RDS port
    Value: !Ref DatabasePortParameter

    Export:
      Name: !Sub CloudMart-${Environment}-DatabasePortParameter


  DatabaseNameParameterName:
    Description: SSM parameter containing database name
    Value: !Ref DatabaseNameParameter

    Export:
      Name: !Sub CloudMart-${Environment}-DatabaseNameParameter


  DatabaseUsernameParameterName:
    Description: SSM parameter containing database username
    Value: !Ref DatabaseUsernameParameter

    Export:
      Name: !Sub CloudMart-${Environment}-DatabaseUsernameParameter


  RDSInstanceParameterName:
    Description: SSM parameter containing RDS instance identifier
    Value: !Ref RDSInstanceParameter

    Export:
      Name: !Sub CloudMart-${Environment}-RDSInstanceParameter


  ReportBucketParameterName:
    Description: SSM parameter containing report bucket name
    Value: !Ref ReportBucketParameter

    Export:
      Name: !Sub CloudMart-${Environment}-ReportBucketParameter