AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart IAM Configuration Stack.
  Creates IAM roles for Lambda and EC2 and stores
  the CloudMart authentication token in SSM Parameter Store.

Parameters:

  # =========================================================
  # ENVIRONMENT
  # =========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment


  # =========================================================
  # AUTH TOKEN
  # =========================================================

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: CloudMart API authentication token


Resources:

  # =========================================================
  # SSM AUTH TOKEN
  # =========================================================
  #
  # NOTE:
  # CloudFormation AWS::SSM::Parameter does NOT support
  # Type: SecureString.
  #
  # Therefore this parameter is created as String.
  # The GitHub Actions secret remains protected and NoEcho
  # prevents the CloudFormation parameter from being displayed.
  #
  # The application can later read this parameter through IAM.
  # =========================================================

  CloudMartAuthToken:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub /cloudmart/${Environment}/auth/token

      Type: String

      Value: !Ref AuthToken

      Description: CloudMart API authentication token

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # PRODUCT LAMBDA ROLE
  # =========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-product-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartProductLambdaPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CloudWatch Logs
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

              # -------------------------------------------------
              # SSM Parameter
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # ORDER LAMBDA ROLE
  # =========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-order-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartOrderLambdaPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CloudWatch Logs
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

              # -------------------------------------------------
              # SSM Parameter
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # REPORT LAMBDA ROLE
  # =========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-report-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartReportLambdaPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CloudWatch Logs
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

              # -------------------------------------------------
              # SSM Parameter
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # LAMBDA AUTHORIZE ROLE
  # =========================================================
  #
  # This role is prepared for the Lambda Authorizer that
  # will be deployed as part of the Application-Events stack.
  # =========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartAuthorizerPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CloudWatch Logs
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

              # -------------------------------------------------
              # Read authentication token
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # EC2 ROLE
  # =========================================================

  CloudMartEC2Role:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-ec2-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartEC2Policy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CloudWatch Logs
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*

              # -------------------------------------------------
              # SSM Parameter Read
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # EC2 INSTANCE PROFILE
  # =========================================================

  CloudMartEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-ec2-instance-profile

      Roles:
        - !Ref CloudMartEC2Role


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  # =========================================================
  # PRODUCT ROLE
  # =========================================================

  ProductLambdaRoleArn:

    Description: Product Lambda IAM Role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  # =========================================================
  # ORDER ROLE
  # =========================================================

  OrderLambdaRoleArn:

    Description: Order Lambda IAM Role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderLambdaRoleArn


  # =========================================================
  # REPORT ROLE
  # =========================================================

  ReportLambdaRoleArn:

    Description: Report Lambda IAM Role ARN

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportLambdaRoleArn


  # =========================================================
  # AUTHORIZE ROLE
  # =========================================================

  AuthorizerRoleArn:

    Description: Lambda Authorizer IAM Role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerRoleArn


  # =========================================================
  # EC2 ROLE
  # =========================================================

  EC2RoleArn:

    Description: EC2 IAM Role ARN

    Value:
      !GetAtt CloudMartEC2Role.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-EC2RoleArn


  # =========================================================
  # EC2 INSTANCE PROFILE
  # =========================================================

  EC2InstanceProfileName:

    Description: EC2 Instance Profile Name

    Value:
      !Ref CloudMartEC2InstanceProfile

    Export:
      Name:
        !Sub CloudMart-${Environment}-EC2InstanceProfileName


  # =========================================================
  # SSM AUTH TOKEN PARAMETER
  # =========================================================

  AuthTokenParameterName:

    Description: SSM Parameter containing the CloudMart authentication token

    Value:
      !Ref CloudMartAuthToken

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthTokenParameterName