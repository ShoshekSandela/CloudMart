AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart IAM Configuration Stack.
  Creates IAM roles required by CloudMart Lambda functions and EC2.
  The API authentication token is managed separately by GitHub Actions
  in AWS Systems Manager Parameter Store as a SecureString.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment


# =========================================================
# RESOURCES
# =========================================================

Resources:

  # =========================================================
  # PRODUCT LAMBDA ROLE
  # =========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-product-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartProductLambdaPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "arn:aws:logs:*:*:*"


              # SSM Parameter Store
              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*
              

              # Publish inventory change events to the CloudMart EventBridge bus
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus

              # VPC access for Product Lambda
              - Effect: Allow

                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DeleteNetworkInterface

                Resource: "*"

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # INVENTORY EVENT LAMBDA ROLE
  # =========================================================

  InventoryEventLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-inventory-event-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartInventoryEventLambdaPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

              # Publish low-stock notifications to SNS
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-low-stock

              # Read CloudMart application configuration from SSM
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # ORDER LAMBDA ROLE
  # =========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-order-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartOrderLambdaPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "arn:aws:logs:*:*:*"


              # SSM Parameter Store
              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # REPORT LAMBDA ROLE
  # =========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-report-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartReportLambdaPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "arn:aws:logs:*:*:*"


              # S3 report bucket access
              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket

                Resource: "*"


              # SSM Parameter Store
              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # LAMBDA AUTHORIZER ROLE
  # =========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartAuthorizerPolicy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "arn:aws:logs:*:*:*"


              # Read authentication token from SSM
              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # EC2 ROLE
  # =========================================================

  EC2Role:
    Type: AWS::IAM::Role

    Properties:
      RoleName: !Sub cloudmart-${Environment}-ec2-role

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartEC2Policy

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              # CloudWatch Logs
              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource: "arn:aws:logs:*:*:*"


              # Read application configuration from SSM
              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*

      Tags:

        - Key: Project
          Value: CloudMart

        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # EC2 INSTANCE PROFILE
  # =========================================================

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:
      InstanceProfileName: !Sub cloudmart-${Environment}-ec2-instance-profile

      Roles:
        - !Ref EC2Role


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  # =========================================================
  # PRODUCT LAMBDA
  # =========================================================

  ProductLambdaRoleArn:
    Description: Product Lambda IAM Role ARN

    Value: !GetAtt ProductLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  ProductLambdaRoleName:
    Description: Product Lambda IAM Role Name

    Value: !Ref ProductLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleName


  # =========================================================
  # INVENTORY EVENT LAMBDA
  # =========================================================

  InventoryEventLambdaRoleArn:
    Description: Inventory Event Lambda IAM Role ARN

    Value: !GetAtt InventoryEventLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-InventoryEventLambdaRoleArn


  InventoryEventLambdaRoleName:
    Description: Inventory Event Lambda IAM Role Name

    Value: !Ref InventoryEventLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-InventoryEventLambdaRoleName


  # =========================================================
  # ORDER LAMBDA
  # =========================================================

  OrderLambdaRoleArn:
    Description: Order Lambda IAM Role ARN

    Value: !GetAtt OrderLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaRoleArn


  OrderLambdaRoleName:
    Description: Order Lambda IAM Role Name

    Value: !Ref OrderLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaRoleName


  # =========================================================
  # REPORT LAMBDA
  # =========================================================

  ReportLambdaRoleArn:
    Description: Report Lambda IAM Role ARN

    Value: !GetAtt ReportLambdaRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-ReportLambdaRoleArn


  ReportLambdaRoleName:
    Description: Report Lambda IAM Role Name

    Value: !Ref ReportLambdaRole

    Export:
      Name: !Sub CloudMart-${Environment}-ReportLambdaRoleName


  # =========================================================
  # AUTHORIZE LAMBDA
  # =========================================================

  # THIS IS THE IMPORTANT FIX.
  #
  # deploy.yaml expects:
  #
  # LambdaAuthorizerRoleArn
  #
  # Previously the template had:
  #
  # AuthorizerLambdaRoleArn
  #
  # which caused:
  #
  # Authorizer Role: None

  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer IAM Role ARN

    Value: !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerRoleArn


  # Keep the old output for compatibility
  AuthorizerLambdaRoleArn:
    Description: Lambda Authorizer IAM Role ARN - Legacy Output

    Value: !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-AuthorizerLambdaRoleArn


  LambdaAuthorizerRoleName:
    Description: Lambda Authorizer IAM Role Name

    Value: !Ref LambdaAuthorizerRole

    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerRoleName


  # =========================================================
  # EC2
  # =========================================================

  EC2RoleArn:
    Description: EC2 IAM Role ARN

    Value: !GetAtt EC2Role.Arn

    Export:
      Name: !Sub CloudMart-${Environment}-EC2RoleArn


  EC2InstanceProfileName:
    Description: EC2 Instance Profile Name

    Value: !Ref EC2InstanceProfile

    Export:
      Name: !Sub CloudMart-${Environment}-EC2InstanceProfileName


  # =========================================================
  # SSM AUTH TOKEN
  # =========================================================

  AuthTokenParameterName:
    Description: SSM SecureString parameter name managed by GitHub Actions

    Value: !Sub /cloudmart/${Environment}/auth/token

    Export:
      Name: !Sub CloudMart-${Environment}-AuthTokenParameterName