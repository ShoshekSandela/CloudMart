AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart IAM Stack. Creates all CloudMart IAM roles and their permissions
  in code, including the GitHub deployment role, Lambda roles, EC2 role,
  and the CloudFormation execution role.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment name.

  GitHubRepository:
    Type: String
    Default: ShoshekSandela/CloudMart
    Description: GitHub repository allowed to assume the deployment role.

Resources:

  # Allows GitHub Actions to authenticate with AWS using OIDC.
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-github-actions-role
      Description: CloudMart GitHub Actions deployment role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/feature/order-flow
                  - !Sub repo:${GitHubRepository}:ref:refs/heads/fix/database-ssm
      # CloudFormation permissions are supplied by the AWS-managed policy; the workflow only operates on CloudMart stacks.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
      Policies:
        - PolicyName: CloudMartGitHubActionsDeploymentHelpers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allows the workflow to read only the CloudMart CloudFormation execution role ARN.
              - Sid: ReadCloudFormationExecutionRole
                Effect: Allow
                Action: iam:GetRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn

              # Allows the workflow to pass only the CloudMart CloudFormation execution role.
              - Sid: PassCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com


              # Allows the workflow to initialize the Authorizer after deployment.
              - Sid: InitializeAuthorizer
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-authorizer

              # Allows the workflow to initialize the Product Lambda database schema.
              - Sid: InitializeProductLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-product

              # Allows the workflow to synchronize the configured customer after deployment.
              - Sid: SynchronizeCustomer
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:cloudmart-${Environment}-order

              # Allows the workflow to verify configured SNS email subscriptions.
              - Sid: VerifyNotificationSubscriptions
                Effect: Allow
                Action:
                  - sns:ListSubscriptionsByTopic
                  - sns:GetSubscriptionAttributes
                  - sns:Subscribe
                Resource:
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-low-stock
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-low-stock:*
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-order-notifications
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-order-notifications:*
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-customer-order-notifications
                  - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:cloudmart-${Environment}-customer-order-notifications:*
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # CloudFormation uses this role to create the infrastructure on behalf of GitHub Actions.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-cloudformation-execution-role
      Description: CloudMart CloudFormation service role used by GitHub Actions.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      # AWS-managed provisioning policies keep CloudFormation permissions centralized in the IAM stack.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonVPCFullAccess
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/AmazonRDSFullAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AWSLambda_FullAccess
        - arn:aws:iam::aws:policy/AmazonAPIGatewayAdministrator
        - arn:aws:iam::aws:policy/AmazonEventBridgeFullAccess
        - arn:aws:iam::aws:policy/AmazonSNSFullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Gives Product Lambda access to its database parameters and EventBridge bus.
  ProductLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-product-role
      Description: CloudMart Product Lambda execution role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CloudMartProductPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Reads only the database parameters required by Product Lambda.
              - Sid: ReadDatabaseParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password
              # Publishes Product inventory events to the CloudMart event bus only.
              - Sid: PublishProductEvents
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Gives Order Lambda access to database parameters and the CloudMart event bus.
  OrderLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-order-role
      Description: CloudMart Order Lambda execution role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CloudMartOrderPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Reads only the database parameters required by Order Lambda.
              - Sid: ReadDatabaseParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password
              # Publishes Order lifecycle events to the CloudMart event bus only.
              - Sid: PublishOrderEvents
                Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/cloudmart-${Environment}-event-bus
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Gives the Authorizer access to its token and database parameters.
  LambdaAuthorizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-lambda-authorizer-role
      Description: CloudMart API Authorizer Lambda execution role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: CloudMartAuthorizerPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Reads and initializes the CloudMart authentication token.
              - Sid: ManageAuthToken
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token
              # Reads database connection parameters used during token validation.
              - Sid: ReadDatabaseParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Gives the Operations EC2 instance Session Manager and database parameter access.
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cloudmart-${Environment}-ec2-role
      Description: CloudMart Operations EC2 instance role.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CloudMartEC2DatabaseRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Reads only the database connection parameters needed by the EC2 environment.
              - Sid: ReadDatabaseParameters
                Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/host
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/port
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/name
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/username
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/database/password
      Tags:
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment

  # Connects the EC2 role to the EC2 instance created by the Application stack.
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub cloudmart-${Environment}-ec2-instance-profile
      Roles:
        - !Ref EC2Role

Outputs:
  # ARN used by GitHub Actions to authenticate with AWS.
  GitHubActionsRoleArn:
    Description: GitHub Actions IAM role ARN.
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-GitHubActionsRoleArn

  # ARN used by CloudFormation to create and update CloudMart resources.
  CloudFormationExecutionRoleArn:
    Description: CloudFormation execution role ARN.
    Value: !GetAtt CloudFormationExecutionRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-CloudFormationExecutionRoleArn

  # ARN used by the Product Lambda function.
  ProductLambdaRoleArn:
    Description: Product Lambda IAM role ARN.
    Value: !GetAtt ProductLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-ProductLambdaRoleArn

  # ARN used by the Order Lambda function.
  OrderLambdaRoleArn:
    Description: Order Lambda IAM role ARN.
    Value: !GetAtt OrderLambdaRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-OrderLambdaRoleArn

  # ARN used by the API Authorizer Lambda function.
  LambdaAuthorizerRoleArn:
    Description: Lambda Authorizer IAM role ARN.
    Value: !GetAtt LambdaAuthorizerRole.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaAuthorizerRoleArn

  # ARN used by the Operations EC2 instance.
  EC2RoleArn:
    Description: EC2 IAM role ARN.
    Value: !GetAtt EC2Role.Arn
    Export:
      Name: !Sub CloudMart-${Environment}-EC2RoleArn

  # Instance profile attached to the Operations EC2 instance.
  EC2InstanceProfileName:
    Description: EC2 instance profile name.
    Value: !Ref EC2InstanceProfile
    Export:
      Name: !Sub CloudMart-${Environment}-EC2InstanceProfileName
