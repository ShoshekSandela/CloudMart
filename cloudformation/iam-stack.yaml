AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart IAM Configuration Stack.
  Creates IAM roles for Lambda functions and EC2,
  and stores the CloudMart authentication token
  in AWS Systems Manager Parameter Store.

Parameters:

  # =========================================================
  # ENVIRONMENT
  # =========================================================

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment


  # =========================================================
  # AUTHENTICATION TOKEN
  # =========================================================

  AuthToken:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: CloudMart API authentication token


Resources:

  # =========================================================
  # SSM AUTH TOKEN
  # =========================================================

  CloudMartAuthToken:
    Type: AWS::SSM::Parameter

    Properties:
      Name: !Sub /cloudmart/${Environment}/auth/token

      Type: SecureString

      Value: !Ref AuthToken

      Description: CloudMart API authentication token

      Tags:
        Project: CloudMart
        Environment: !Ref Environment


  # =========================================================
  # PRODUCT LAMBDA IAM ROLE
  # =========================================================

  ProductLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-product-role

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartProductLambdaPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CLOUDWATCH LOGGING
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


              # -------------------------------------------------
              # SSM PARAMETER STORE
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*


  # =========================================================
  # ORDER LAMBDA IAM ROLE
  # =========================================================

  OrderLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-order-role

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartOrderLambdaPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CLOUDWATCH LOGGING
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


              # -------------------------------------------------
              # SSM PARAMETER STORE
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*


  # =========================================================
  # REPORT LAMBDA IAM ROLE
  # =========================================================

  ReportLambdaRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-report-role

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartReportLambdaPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CLOUDWATCH LOGGING
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


              # -------------------------------------------------
              # SSM PARAMETER STORE
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*


              # -------------------------------------------------
              # S3 REPORT BUCKET
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:
                  - !Sub arn:aws:s3:::cloudmart-${Environment}-reports/*


  # =========================================================
  # LAMBDA AUTHORIZER IAM ROLE
  # =========================================================

  LambdaAuthorizerRole:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-lambda-authorizer-role

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - lambda.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartAuthorizerPolicy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CLOUDWATCH LOGGING
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


              # -------------------------------------------------
              # READ AUTH TOKEN FROM SSM
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/auth/token


  # =========================================================
  # EC2 IAM ROLE
  # =========================================================

  CloudMartEC2Role:
    Type: AWS::IAM::Role

    Properties:

      RoleName:
        !Sub cloudmart-${Environment}-ec2-role

      AssumeRolePolicyDocument:

        Version: "2012-10-17"

        Statement:

          - Effect: Allow

            Principal:
              Service:
                - ec2.amazonaws.com

            Action:
              - sts:AssumeRole

      Policies:

        - PolicyName: CloudMartEC2Policy

          PolicyDocument:

            Version: "2012-10-17"

            Statement:

              # -------------------------------------------------
              # CLOUDWATCH LOGGING
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents

                Resource:
                  - arn:aws:logs:*:*:*


              # -------------------------------------------------
              # SSM PARAMETER STORE
              # -------------------------------------------------

              - Effect: Allow

                Action:
                  - ssm:GetParameter

                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudmart/${Environment}/*


  # =========================================================
  # EC2 INSTANCE PROFILE
  # =========================================================

  CloudMartEC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile

    Properties:

      InstanceProfileName:
        !Sub cloudmart-${Environment}-ec2-instance-profile

      Roles:
        - !Ref CloudMartEC2Role


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  # =========================================================
  # PRODUCT LAMBDA ROLE
  # =========================================================

  ProductLambdaRoleArn:

    Description: Product Lambda IAM role ARN

    Value:
      !GetAtt ProductLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ProductLambdaRoleArn


  # =========================================================
  # ORDER LAMBDA ROLE
  # =========================================================

  OrderLambdaRoleArn:

    Description: Order Lambda IAM role ARN

    Value:
      !GetAtt OrderLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-OrderLambdaRoleArn


  # =========================================================
  # REPORT LAMBDA ROLE
  # =========================================================

  ReportLambdaRoleArn:

    Description: Report Lambda IAM role ARN

    Value:
      !GetAtt ReportLambdaRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-ReportLambdaRoleArn


  # =========================================================
  # AUTHORIZER ROLE
  # =========================================================

  AuthorizerRoleArn:

    Description: Lambda Authorizer IAM role ARN

    Value:
      !GetAtt LambdaAuthorizerRole.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthorizerRoleArn


  # =========================================================
  # EC2 ROLE
  # =========================================================

  EC2RoleArn:

    Description: EC2 IAM role ARN

    Value:
      !GetAtt CloudMartEC2Role.Arn

    Export:
      Name:
        !Sub CloudMart-${Environment}-EC2RoleArn


  # =========================================================
  # EC2 INSTANCE PROFILE
  # =========================================================

  EC2InstanceProfileName:

    Description: EC2 instance profile name

    Value:
      !Ref CloudMartEC2InstanceProfile

    Export:
      Name:
        !Sub CloudMart-${Environment}-EC2InstanceProfileName


  # =========================================================
  # SSM AUTH TOKEN PARAMETER
  # =========================================================

  AuthTokenParameterName:

    Description: SSM SecureString parameter containing API authentication token

    Value:
      !Ref CloudMartAuthToken

    Export:
      Name:
        !Sub CloudMart-${Environment}-AuthTokenParameterName