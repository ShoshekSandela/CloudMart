AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudMart Network-Security Stack.
  Creates the VPC, public and private subnets, route tables,
  Internet Gateway, Security Groups, and VPC Endpoints required
  by the CloudMart application.

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.11.0/24

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.12.0/24


Resources:

  # =========================================================
  # VPC
  # =========================================================

  CloudMartVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc
        - Key: Project
          Value: CloudMart
        - Key: Environment
          Value: !Ref Environment


  # =========================================================
  # INTERNET GATEWAY
  # =========================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-igw
        - Key: Project
          Value: CloudMart


  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref CloudMartVPC
      InternetGatewayId: !Ref InternetGateway


  # =========================================================
  # PUBLIC SUBNET 1
  # =========================================================

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet-1
        - Key: Tier
          Value: Public
        - Key: Project
          Value: CloudMart


  # =========================================================
  # PUBLIC SUBNET 2
  # =========================================================

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-subnet-2
        - Key: Tier
          Value: Public
        - Key: Project
          Value: CloudMart


  # =========================================================
  # PRIVATE SUBNET 1
  # =========================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-1
        - Key: Tier
          Value: Private
        - Key: Project
          Value: CloudMart


  # =========================================================
  # PRIVATE SUBNET 2
  # =========================================================

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref CloudMartVPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-subnet-2
        - Key: Tier
          Value: Private
        - Key: Project
          Value: CloudMart


  # =========================================================
  # PUBLIC ROUTE TABLE
  # =========================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudMartVPC
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-public-rt
        - Key: Project
          Value: CloudMart


  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway


  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable


  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable


  # =========================================================
  # PRIVATE ROUTE TABLE
  # =========================================================

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CloudMartVPC
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-private-rt
        - Key: Project
          Value: CloudMart


  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable


  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable


  # =========================================================
  # LAMBDA SECURITY GROUP
  # =========================================================

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart Lambda functions
      VpcId: !Ref CloudMartVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-lambda-sg
        - Key: Project
          Value: CloudMart


  # =========================================================
  # RDS SECURITY GROUP
  # =========================================================

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart RDS MySQL
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-rds-sg
        - Key: Project
          Value: CloudMart


  # =========================================================
  # EC2 SECURITY GROUP
  # =========================================================

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart EC2
      VpcId: !Ref CloudMartVPC

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ec2-sg
        - Key: Project
          Value: CloudMart


  # =========================================================
  # VPC ENDPOINT SECURITY GROUP
  # =========================================================

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for CloudMart VPC interface endpoints
      VpcId: !Ref CloudMartVPC

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-vpc-endpoint-sg
        - Key: Project
          Value: CloudMart


  # =========================================================
  # S3 GATEWAY VPC ENDPOINT
  # =========================================================

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway

      RouteTableIds:
        - !Ref PrivateRouteTable

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-s3-endpoint
        - Key: Project
          Value: CloudMart


  # =========================================================
  # SSM INTERFACE VPC ENDPOINT
  # =========================================================

  SSMVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-ssm-endpoint
        - Key: Project
          Value: CloudMart


  # =========================================================
  # EVENTBRIDGE INTERFACE VPC ENDPOINT
  # =========================================================

  EventBridgeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.events
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-eventbridge-endpoint
        - Key: Project
          Value: CloudMart


  # =========================================================
  # SNS INTERFACE VPC ENDPOINT
  # =========================================================

  SNSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref CloudMartVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sns
      VpcEndpointType: Interface
      PrivateDnsEnabled: true

      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

      Tags:
        - Key: Name
          Value: !Sub cloudmart-${Environment}-sns-endpoint
        - Key: Project
          Value: CloudMart


# =========================================================
# OUTPUTS
# =========================================================

Outputs:

  VpcId:
    Description: CloudMart VPC ID
    Value: !Ref CloudMartVPC
    Export:
      Name: !Sub CloudMart-${Environment}-VpcId


  PublicSubnet1Id:
    Description: CloudMart Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub CloudMart-${Environment}-PublicSubnet1Id


  PublicSubnet2Id:
    Description: CloudMart Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub CloudMart-${Environment}-PublicSubnet2Id


  PrivateSubnet1Id:
    Description: CloudMart Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnet1Id


  PrivateSubnet2Id:
    Description: CloudMart Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub CloudMart-${Environment}-PrivateSubnet2Id


  LambdaSecurityGroupId:
    Description: CloudMart Lambda Security Group ID
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-LambdaSecurityGroupId


  RDSSecurityGroupId:
    Description: CloudMart RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-RDSSecurityGroupId


  EC2SecurityGroupId:
    Description: CloudMart EC2 Security Group ID
    Value: !Ref EC2SecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-EC2SecurityGroupId


  VPCEndpointSecurityGroupId:
    Description: CloudMart VPC Endpoint Security Group ID
    Value: !Ref VPCEndpointSecurityGroup
    Export:
      Name: !Sub CloudMart-${Environment}-VPCEndpointSecurityGroupId


  InternetGatewayId:
    Description: CloudMart Internet Gateway ID
    Value: !Ref InternetGateway
    Export:
      Name: !Sub CloudMart-${Environment}-InternetGatewayId